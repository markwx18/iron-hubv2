name = "ironhub-discord"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Push alerts: read the gist every 5 minutes and post anything new. 288 runs/day, well inside
# the free tier; KV is only written when something new was actually posted.
[triggers]
crons = ["*/5 * * * *"]

# Remembers which PRs / flags / proposals / briefs have already been posted.
# Create it once with:  npx wrangler kv namespace create ALERTS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "ALERTS"
id = "8c46e378150a44daba9f00e603ab8b80"

# Secrets are NOT in this file (the repo is public). Set each with `npx wrangler secret put NAME`:
#   GIST_ID  GIST_TOKEN  DISCORD_APP_ID  DISCORD_PUBLIC_KEY  DISCORD_OWNER_ID
#   WEBHOOK_PRS  WEBHOOK_ALERTS  WEBHOOK_BRIEF   (one per channel; see README)
