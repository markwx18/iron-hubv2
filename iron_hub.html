async function maybeRunAudit(){
  const wk = weekStartKey();
  S.audit = S.audit || {weekStart:'', proposals:null, status:''};
  if(S.audit.weekStart === wk) return;          // already handled this week
  if(!S.settings.apiKey && !window._inClaude) return; // needs AI
  const {start, end} = lastCompletedWeekRange();
  const prevLogs = S.logs.filter(l=>l.date>=start && l.date<=end);
  const vol = weeklyVolumeByGroup(start, end);
  const weak = MUSCLE_GROUPS.filter(g=>g!=='Abs' && vol[g] < 10).sort((a,b)=>vol[a]-vol[b]);
  const stale = staleExercises();
  // nothing to do if no recent training AND nothing stale
  if(prevLogs.length < 2 && !stale.length){ S.audit = {weekStart:wk, proposals:[], status:'done'}; save(false); return; }
  const needVolume = prevLogs.length >= 2 && weak.length > 0;
  if(!needVolume && !stale.length){ S.audit = {weekStart:wk, proposals:[], status:'done'}; save(false); return; }
  try{
    const splitTxt = Object.keys(S.split).map(dk=>dk+' ('+S.split[dk].name+'): '+dayExNames(dk).join(', ')).join('\n');
    const volTxt = MUSCLE_GROUPS.map(g=>g+': '+Math.round(vol[g]*10)/10).join(', ');
    const staleTxt = stale.length ? stale.map(s=>s.name+' (on '+(s.day||'?')+', flat ~'+s.weeks+' wks at e1RM '+s.bestRecent+')').join('; ') : '(none)';
    const sys = 'You are a hypertrophy coach reviewing an 18-year-old lifter\u2019s 6-day split. Two jobs:\n'+
      '1) VOLUME: sets-per-muscle-per-week target ~10-20. For under-trained groups, propose adding one set to an existing exercise (type "add_set") or one new accessory (type "add_exercise").\n'+
      '2) STALENESS: for each STALE accessory listed, propose ONE swap (type "swap") to a different exercise hitting the SAME muscle/head from a new angle (e.g. cable lateral raise -> dumbbell lateral raise; pec deck -> cable fly). The swap should be a real, common gym exercise.\n'+
      'NEVER touch main barbell lifts or big compounds (bench, squat, rows, presses, leg press, hip thrust). Keep it minimal: at most 2 volume proposals and one swap per stale item (max 4 total). '+
      'For swaps, include "fromExercise" (the stale one) and "exercise" (the replacement). '+
      'Respond ONLY with valid JSON, no markdown: {"proposals":[{"type":"add_set|add_exercise|swap","group":"Side Delts","day":"D4","exercise":"...","fromExercise":"...","sets":1,"inc":5,"action":"short imperative","reason":"one short sentence"}]}';
    const prompt = 'WEEKLY VOLUME (sets, secondary=half): '+volTxt+'\n\nUNDER-TRAINED: '+(weak.length?weak.join(', '):'(none)')+
      '\n\nSTALE ACCESSORIES (no e1RM progress 4+ wks \u2014 propose a swap for each): '+staleTxt+
      '\n\nCURRENT SPLIT:\n'+splitTxt;
    const reply = await callClaude([{role:'user', content:prompt}], sys, 1100);
    const parsed = parseLooseJSON(reply);
    const props = (parsed.proposals||[]).slice(0,4).map(pr=>{
      const base = {
        type:pr.type||'add_set', group:pr.group||'', day:pr.day, exercise:pr.exercise,
        fromExercise:pr.fromExercise||null,
        sets:+pr.sets||1, inc:pr.inc!=null?+pr.inc:null,
        action:pr.action||'', reason:pr.reason||''
      };
      if(pr.type!=='swap'){
        base.lastSets = Math.round((vol[(MUSCLE_GROUPS.find(g=>g.toLowerCase()===String(pr.group).toLowerCase()))||pr.group]||0)*10)/10;
      }
      return base;
    }).filter(pr=>{
      // guard: never allow a swap or add that targets a protected compound
      if(pr.type==='swap' && pr.fromExercise && !isSwapEligible(pr.fromExercise)) return false;
      return true;
    });
    S.audit = {weekStart:wk, proposals:props, status: props.length?'':'done'};
    save(false);
  }catch(e){
    S.audit = {weekStart:wk, proposals:[], status:'done'}; save(false);
  }
}
function acceptProposal(i){
  const pr = S.audit.proposals[i]; if(!pr) return;
  if(pr.type==='swap' && pr.fromExercise && pr.exercise){
    // Replace the stale exercise in whichever day holds it, preserving its increment + form-focus flag.
    let done = false;
    for(const dk in S.split){
      const list = S.split[dk].exercises || [];
      for(let j=0;j<list.length;j++){
        if(exName(list[j])===pr.fromExercise){
          const prev = list[j];
          const carryInc = (typeof prev==='object' && prev.inc!=null) ? prev.inc : (pr.inc!=null?pr.inc:incFor(pr.exercise));
          const carryFF  = (typeof prev==='object' && prev.formFocus) ? true : false;
          list[j] = {name:pr.exercise, inc:carryInc, formFocus:carryFF};
          done = true; break;
        }
      }
      if(done) break;
    }
    // logged history stays under the old name — e1RM history for the prior exercise is preserved as its own series.
  } else {
    const dk = pr.day && S.split[pr.day] ? pr.day : Object.keys(S.split)[0];
    if(pr.exercise && !dayExNames(dk).includes(pr.exercise)){
      S.split[dk].exercises.push({name:pr.exercise, inc: pr.inc!=null?pr.inc:incFor(pr.exercise)});
    }
  }
  S.audit.proposals.splice(i,1);
  if(!S.audit.proposals.length) S.audit.status='done';
  save(); renderToday(); setAccent(); renderHeader();
}
function dismissProposal(i){
  S.audit.proposals.splice(i,1);
  if(!S.audit.proposals.length) S.audit.status='done';
  save(false); renderToday();
}

        '<div class="inc-presets" title="Weight increment">'+
          INC_PRESETS.map(v=>'<button class="'+(Math.abs(inc-v)<0.01?'sel':'')+'" onclick="setInc(\''+dk+'\','+i+','+v+')">+'+v+'</button>').join('')+
        '</div>'+
        '<button class="ord ff-toggle" title="Form Focus: hold weight, target '+FORM_LO+'\u2013'+FORM_HI+' reps, only bump after 3 straight easy sessions" style="'+(ff?'color:var(--good);border-color:var(--good);font-weight:800':'')+'" onclick="toggleFormFocus(\''+dk+'\','+i+')">FORM</button>'+
        '<button class="ord ff-toggle" title="Strength mode: 3\u20136 rep range, weight-first progression. Toggle to switch between STR (3\u20136) and HYP (your global setting)." style="'+(str?'color:#7b6ef6;border-color:#7b6ef6;font-weight:800':'')+'" onclick="toggleRepMode(\''+dk+'\','+i+')">'+(str?'STR':'HYP')+'</button>'+
        '<button class="ord" title="Move up" onclick="moveEx(\''+dk+'\','+i+',-1)">\u2191</button>'+
        '<button class="ord" title="Move down" onclick="moveEx(\''+dk+'\','+i+',1)">\u2193</button>'+
        '<button class="xx" title="Delete" onclick="delEx(\''+dk+'\','+i+')">\u00d7</button>'+
      '</div>';
    });
    h += '<div style="padding:8px 0 2px"><button class="btn ghost sm" onclick="addEx(\''+dk+'\')">+ add exercise</button></div>';
    h += '</div></div>';
  });
  return h;
}
function refreshSplitEditor(){ const w=$('#sdWrap'); if(w) w.innerHTML = splitEditorHTML(); }
function toggleSdDay(dk){
  const b = $('#sdbody-'+dk), c = $('#chev-'+dk);
  if(!b) return;
  const open = b.classList.toggle('open');
  if(c) c.textContent = open ? '\u25b4' : '\u25be';
}
function ensureObj(dk,i){
  const x = S.split[dk].exercises[i];
  if(typeof x === 'string') S.split[dk].exercises[i] = {name:x, inc:incFor(x)};
  return S.split[dk].exercises[i];
}
function renameDay(dk,v){ S.split[dk].name = v.trim()||S.split[dk].name; save(); setAccent(); renderHeader(); }
function renameEx(dk,i,v){
  const o = ensureObj(dk,i); const nv = v.trim();
  if(nv) o.name = nv;
  save();
}
function setInc(dk,i,v){ ensureObj(dk,i).inc = v; save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open'); }
function toggleFormFocus(dk,i){
  const o = ensureObj(dk,i);
  o.formFocus = !o.formFocus;
  save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open'); renderToday();
}
function moveEx(dk,i,dir){
  const list = S.split[dk].exercises; const j = i+dir;
  if(j<0||j>=list.length) return;
  [list[i],list[j]]=[list[j],list[i]]; save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open');
}
function delEx(dk,i){
  const nm = exName(S.split[dk].exercises[i]);
  if(!confirm('Remove "'+nm+'" from '+dk+'? (Your logged history for it is kept.)')) return;
  S.split[dk].exercises.splice(i,1); save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open');
}
function addEx(dk){
  const nm = prompt('New exercise name for '+dk+':');
  if(!nm||!nm.trim()) return;
  S.split[dk].exercises.push({name:nm.trim(), inc:incFor(nm.trim())});
  save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open');
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ironhub_backup_'+todayKey()+'.json';
  a.click();
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const p = JSON.parse(r.result);
      if(!p.logs || !p.split) throw new Error('Not an Iron Hub backup');
      if(!confirm('Replace ALL current data with this backup ('+p.logs.length+' sessions)?')) return;
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), p);
      save(); location.reload();
    }catch(e){ alert('Import failed: '+e.message); }
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('This wipes every log, weight entry, and setting. Export first if you want a backup. Continue?')) return;
  if(!confirm('Last check — really delete everything?')) return;
  localStorage.removeItem(LS_KEY); location.reload();
}

/* ================= SHELL ================= */

  const dk = currentDayKey();

  $('#hdrDay').textContent = dk==='REST' ? 'Rest Day' : dk+' · '+S.split[dk].name;
  $('#hdrDay').style.background = dk==='REST' ? '#8d909a' : dayColor(dk);
}

<script>
/* ============================================================
   IRON HUB V2 — tactical shell, LIVE/REVIEW modes, live engine
   Built on the V1 engine above (reused verbatim).
   ============================================================ */

/* ---- overrides of V1 header/accent (V2 has its own chrome) ---- */
function setAccent(){ document.documentElement.style.setProperty('--accent', 'var(--amber)'); }

/* ===================== MODE SWITCHING ===================== */
let MODE = 'live';

/* ===================== REVIEW NAV ===================== */

/* ===================== WELCOME ===================== */
function greetWord(){
  const h = new Date().getHours();
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  return 'Good evening';
}
function streakDays(){
  // count consecutive prior calendar days (incl today) that have at least one log
  const have = new Set(S.logs.map(l=>l.date));
  let n=0; const d=new Date();
  for(let i=0;i<60;i++){
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dow = d.getDay();
    if(S.schedule[dow]==='REST'){ d.setDate(d.getDate()-1); continue; } // rest days don't break streak
    if(have.has(k)) n++; else if(i>0) break; // allow today to be not-yet-done
    d.setDate(d.getDate()-1);
  }
  return n;
}
function welcomeHTML(){
  const dk = currentDayKey();
  const name = 'Mark';
  let sub, cta;
  const sCount = streakDays();
  const streakTxt = sCount>=2 ? ' You\u2019re '+sCount+' sessions into a clean stretch — keep it rolling.' : '';
  if(dk==='REST'){
    sub = 'Rest day on the schedule. Recovery is where the size gets built — eat your surplus and sleep.'+streakTxt;
    cta = '<button class="btn ghost sm" onclick="liveStartPicker()">Train anyway</button>'+
          '<button class="btn ghost sm" onclick="setMode(\'review\')">Review stats</button>';
  } else {
    const already = S.logs.some(l=>l.date===todayKey());
    sub = already
      ? 'You already logged '+dk+' today. Open the session to add more, or review your trends.'+streakTxt
      : dk+' is on deck — '+S.split[dk].name+'.'+streakTxt+' Tap below when you\u2019re at the rack.';
    cta = '<button class="btn primary sm" onclick="liveStartSession()">'+(already?'Log again':'Start session')+'</button>'+
          '<button class="btn ghost sm" onclick="setMode(\'review\')">Review stats</button>';
  }
  return '<div class="welcome"><div class="greet">'+greetWord()+', <span class="accent">'+esc(name)+'</span></div>'+
    '<div class="submsg">'+sub+'</div><div class="wcta">'+cta+'</div></div>';
}

/* ===================== LIVE SESSION ENGINE ===================== */
const LIVE_KEY = 'ironhub:live';
let live = null;      // active session runtime
let liveActiveIdx = 0;

function loadLiveDraft(){
  try{ const raw=localStorage.getItem(LIVE_KEY); if(!raw) return null; const d=JSON.parse(raw);
    return (d && d.date===todayKey()) ? d : null; }catch(e){ return null; }
}
function saveLiveDraft(){ if(live) localStorage.setItem(LIVE_KEY, JSON.stringify(live)); }
function clearLiveDraft(){ localStorage.removeItem(LIVE_KEY); }

function buildLiveExercises(dk){
  const tier = currentReadinessTier();
  return dayExNames(dk).map((nm,i)=>{
    const rec = recommend(nm, tier);
    const firstW = (rec.sets && rec.sets[0] && rec.sets[0].w!=='') ? +rec.sets[0].w : '';
    const {lo,hi} = exRepMode(nm);
    return {
      name:nm, repMode:isStrMode(nm)?'str':'hyp', formFocus:isFormFocus(nm),
      targetW:firstW, lo:lo, hi:hi,
      recTarget:rec.target, recDetail:rec.detail,
      planned:(rec.sets||[]).length||3,
      sets:[], done:false,
      advW:firstW, advLo:lo, advHi:hi, advTag:'', advCls:'', advMsg:rec.detail
    };
  });
}
function liveStartSession(){
  const dk = currentDayKey()==='REST' ? null : currentDayKey();
  if(!dk){ liveStartPicker(); return; }
  startLiveForDay(dk);
}
function startLiveForDay(dk){
  live = { date:todayKey(), day:dk, startedAt:Date.now(), exercises:buildLiveExercises(dk), curIdx:0 };
  liveActiveIdx = 0;
  saveLiveDraft();
  renderLive();
}
function liveStartPicker(){
  const days = Object.keys(S.split);
  const pick = prompt('Train which day? '+days.join(' / ')+' (type e.g. D1)', currentDayKey()==='REST'?'D1':currentDayKey());
  if(!pick) return;
  const dk = pick.trim().toUpperCase();
  if(!S.split[dk]){ alert('Unknown day: '+dk); return; }
  startLiveForDay(dk);
}
function endLiveSessionConfirm(){
  const logged = live.exercises.filter(e=>e.sets.length).length;
  if(!logged){ if(confirm('No sets logged yet — discard this session?')){ live=null; clearLiveDraft(); stopRest(); renderLive(); } return; }
  if(confirm('End and save this session? '+logged+' exercise'+(logged>1?'s':'')+' logged.')) endLiveSession();
}

/* intra-session autoregulation: tune the NEXT set from the last one */
function intraAdvice(ex){
  const sets = ex.sets;
  if(!sets.length) return {w:ex.targetW, lo:ex.lo, hi:ex.hi, tag:'', cls:'', msg:ex.recDetail};
  const last = sets[sets.length-1];
  const r=+last.r||0, e=last.e, w=+last.w||0;
  const lo=ex.lo, hi=ex.hi, inc=incForExercise(ex.name);
  if(e==='fail' || (r>0 && r<lo)){
    const dw=Math.max(w-inc,inc);
    return {w:dw, lo:lo, hi:hi, tag:'Back off', cls:'back', msg:'That set fell short — drop to '+dw+' lb and keep the reps clean.'};
  }
  if(r>=hi && (e==='easy'||!e)){
    return {w:w, lo:lo, hi:hi, tag:'Strong', cls:'up', msg:'Top of the range — hold '+w+'. Keep this up and you earn a jump next session.'};
  }
  if(e==='grind'){
    return {w:w, lo:lo, hi:hi, tag:'Hold', cls:'hold', msg:'That was a grind — stay at '+w+', match the reps, stop one short of failure.'};
  }
  return {w:w, lo:lo, hi:hi, tag:'On target', cls:'hold', msg:'Solid — repeat '+w+' lb and chase one more rep than last set.'};
}

let liveDockEff = '';  // selected effort for the in-progress set

/* ---- render LIVE mode ---- */
function renderLive(){
  const body = document.getElementById('liveBody');
  if(!live){
    body.innerHTML = welcomeHTML() + liveIdleHTML();
    initBodyMap('live');
    return;
  }
  let h = '';
  h += '<div class="sessionbar"><span class="sb-day">'+esc(live.day)+' · '+esc(S.split[live.day].name)+'</span>'+
       '<span class="sb-prog" id="sbProg"></span><span class="sb-clock" id="sbClock">00:00</span></div>';
  live.exercises.forEach((ex,i)=>{ h += liveExHTML(ex,i); });
  h += '<div style="display:flex; gap:10px; margin:16px 0 8px">'+
       '<button class="btn cyan block" onclick="endLiveSessionConfirm()">End &amp; save session</button></div>';
  body.innerHTML = h;
  updateSessionBar();
  // mount rest timer under the active exercise if running
  if(rest.running) mountRestTimer();
}
function liveIdleHTML(){
  const dk = currentDayKey();
  if(dk==='REST') return '';
  // body map preview for today + quick start
  return '<div class="bodymap-card" style="margin:16px 0">'+
      '<h2 style="margin-top:0">Today targets — '+esc(dk)+'</h2>'+ bodyMapInner('today') +
    '</div>';
}
function liveExHTML(ex,i){
  const active = i===liveActiveIdx && !ex.done;
  const adv = intraAdvice(ex);
  ex.advW=adv.w; ex.advLo=adv.lo; ex.advHi=adv.hi; ex.advTag=adv.tag; ex.advCls=adv.cls; ex.advMsg=adv.msg;
  let h = '<div class="liveex '+(active?'active':'')+' '+(ex.done?'done':'')+'" id="liveex-'+i+'">';
  h += '<div class="liveex-head" onclick="focusLiveEx('+i+')">';
  h += '<div class="liveex-name">'+esc(ex.name)+'<button class="ex-info-btn" onclick="event.stopPropagation();showExInfo(\''+esc(ex.name).replace(/'/g,"\\'")+'\')" title="Form cues">\u24d8</button></div>';
  h += '<div class="liveex-chips">';
  h += '<span class="pill" style="border-color:'+(ex.repMode==='str'?'var(--violet-dim);color:var(--violet)':'var(--line2)')+'">'+(ex.repMode==='str'?'STR · 3–6':'HYP · '+ex.lo+'–'+ex.hi)+'</span>';
  if(ex.formFocus) h += '<span class="pill" style="border-color:var(--cyan-dim);color:var(--cyan)">FORM</span>';
  if(ex.done) h += '<span class="pill" style="border-color:var(--cyan-dim);color:var(--cyan)">✓ Done</span>';
  else if(active) h += '<span class="pill" style="border-color:var(--amber);color:var(--amber)">▸ Active</span>';
  h += '</div></div>';
  // logged sets
  h += '<div class="liveex-sets">';
  ex.sets.forEach((s,j)=>{
    h += '<div class="lset logged"><span class="lsn">Set '+(j+1)+'</span><span class="lchk">✓</span>'+
         '<span class="lval">'+s.w+'<span class="x">×</span>'+s.r+'</span>'+
         setDeltaChip(ex.name, j, +s.w, +s.r)+
         (s.e?'<span class="leff e-'+s.e+'">'+s.e.toUpperCase()+'</span>':'<span class="leff">—</span>')+'</div>';
  });
  if(!ex.done){
    const nextN = ex.sets.length+1;
    h += '<div class="lset"><span class="lsn">Set '+nextN+'</span><span class="lchk">○</span>'+
         '<span class="lval" style="color:var(--dim)">'+(adv.w||'—')+'<span class="x">×</span>'+adv.lo+'–'+adv.hi+'</span>'+
         (active?'<span class="leff" style="color:var(--amber)">▸ now</span>':'<span class="leff">next</span>')+'</div>';
  }
  h += '</div>';
  // dock (only on active exercise)
  if(active){
    h += '<div class="livedock">';
    h += lastSessionStrip(ex.name);
    h += '<div class="dock-presc">'+(adv.tag?'<b style="color:'+(adv.cls==='up'?'var(--cyan)':adv.cls==='back'?'var(--red)':'var(--amber)')+'">'+esc(adv.tag)+'</b> · ':'')+esc(adv.msg)+'</div>';
    if(isPlateLift(ex.name) && adv.w){
      const pc = plateCalc(+adv.w); if(pc) h += '<div class="dock-presc" style="color:var(--muted)">Per side: '+esc(pc.txt)+' (45 lb bar)</div>';
    }
    h += '<div class="dockrow">'+
         '<div class="field"><label>Weight (lb)</label><input id="dockW" inputmode="decimal" value="'+(adv.w||'')+'"></div>'+
         '<div class="field"><label>Reps</label><input id="dockR" inputmode="numeric" placeholder="'+adv.lo+'–'+adv.hi+'"></div>'+
         '</div>';
    h += '<div class="efftog">'+
         ['easy','solid','grind','fail'].map(e=>'<button class="'+(liveDockEff===e?'sel e-'+e:'')+'" onclick="pickEff(\''+e+'\')">'+e+'</button>').join('')+
         '</div>';
    h += '<div class="dockbtns">'+
         '<button class="btn primary" onclick="logLiveSet('+i+')">Log set</button>'+
         '<button class="btn" onclick="finishExercise('+i+')">Next exercise</button>'+
         '</div>';
    h += '</div>';
    // rest timer slot
    h += '<div id="restSlot"></div>';
  }
  h += '</div>';
  return h;
}
function focusLiveEx(i){
  if(live.exercises[i].done) return;
  liveActiveIdx = i; renderLive();
  document.getElementById('liveex-'+i).scrollIntoView({behavior:'smooth', block:'center'});
}
function pickEff(e){ liveDockEff = (liveDockEff===e?'':e); renderLive(); }

function logLiveSet(i){
  const ex = live.exercises[i];
  const w = parseFloat(document.getElementById('dockW').value);
  const r = parseInt(document.getElementById('dockR').value);
  if(!(w>0) || !(r>0)){ alert('Enter weight and reps for this set.'); return; }
  ex.sets.push({w:w, r:r, e:liveDockEff||undefined});
  liveDockEff = '';
  saveLiveDraft();
  // auto-start rest with mode-appropriate duration
  startRest(ex.repMode==='str' && !ex.formFocus ? 180 : 110, i);
  renderLive();
  document.getElementById('liveex-'+i).scrollIntoView({behavior:'smooth', block:'center'});
}
function finishExercise(i){
  live.exercises[i].done = true;
  // advance to next undone exercise
  const next = live.exercises.findIndex((e,idx)=>idx>i && !e.done);
  liveActiveIdx = next>=0 ? next : live.exercises.findIndex(e=>!e.done);
  if(liveActiveIdx<0) liveActiveIdx = i;
  liveDockEff=''; stopRest(); saveLiveDraft(); renderLive();
}

function updateSessionBar(){
  if(!live) return;
  const clk = document.getElementById('sbClock');
  if(clk){ const s=Math.floor((Date.now()-live.startedAt)/1000); clk.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  const prog = document.getElementById('sbProg');
  if(prog){ const done=live.exercises.filter(e=>e.done).length; prog.textContent=done+' / '+live.exercises.length+' done'; }
}

/* ---- end session: consolidate -> log -> PRs -> summary ---- */
function endLiveSession(){
  const entries = live.exercises.filter(e=>e.sets.length).map(e=>({exercise:e.name, sets:e.sets.map(s=>({w:s.w,r:s.r,e:s.e}))}));
  if(!entries.length){ live=null; clearLiveDraft(); renderLive(); return; }
  const before = snapshotPRs();
  const prsBefore = {};
  entries.forEach(en=>{ prsBefore[en.exercise]=actualPR(en.exercise); });
  S.logs.push({id:Date.now(), date:todayKey(), day:live.day, entries});
  save();
  // compute summary
  const totalSets = entries.reduce((a,e)=>a+e.sets.length,0);
  const totalVol = entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const newPRs = [];
  entries.forEach(en=>{
    const prevPR = prsBefore[en.exercise];
    const heaviest = en.sets.reduce((m,s)=>(+s.w>(m?+m.w:0)?s:m), null);
    if(heaviest && (!prevPR || +heaviest.w>prevPR.w)) newPRs.push(en.exercise+' · '+heaviest.w+' lb × '+heaviest.r);
  });
  const note = sessionNote(entries, live.day);
  showSummary({exercises:entries.length, sets:totalSets, vol:totalVol, prs:newPRs, note});
  checkPRs(before);  // fires the e1RM-based PR overlay if applicable (after summary close it remains)
  live=null; clearLiveDraft(); stopRest();
}
function sessionNote(entries, dk){
  // compare to previous same-day session
  const prior = S.logs.filter(l=>l.day===dk && l.date!==todayKey()).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!prior) return 'First '+dk+' session on record — this is your baseline. Every one from here builds on it.';
  const volOf = l=>l.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const todayVol = entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const pv = volOf(prior);
  if(pv<=0) return 'Solid work logged. Keep the effort tags honest and the targets sharpen.';
  const delta = Math.round((todayVol-pv)/pv*100);
  if(delta>=3) return 'Total tonnage up '+delta+'% vs your last '+dk+'. That\u2019s real progressive overload — exactly the goal.';
  if(delta<=-8) return 'Tonnage down '+Math.abs(delta)+'% vs last '+dk+'. Could be a lighter day or fewer sets — no problem if it was deliberate, worth a look if not.';
  return 'Right on pace with your last '+dk+' (tonnage '+(delta>=0?'+':'')+delta+'%). Consistent is what compounds.';
}
function showSummary(d){
  document.getElementById('sumGrid').innerHTML =
    '<div class="s-cell"><div class="n">'+d.exercises+'</div><div class="l">Exercises</div></div>'+
    '<div class="s-cell"><div class="n">'+d.sets+'</div><div class="l">Sets</div></div>'+
    '<div class="s-cell"><div class="n">'+d.vol.toLocaleString()+'</div><div class="l">Lb volume</div></div>';
  document.getElementById('sumPRs').innerHTML = d.prs.map(p=>'<div class="s-pr">★ '+esc(p)+'</div>').join('');
  document.getElementById('sumNote').textContent = d.note;
  document.getElementById('summaryOverlay').classList.add('show');
}
function closeSummary(){ document.getElementById('summaryOverlay').classList.remove('show'); renderLive(); }

/* ===================== REST TIMER ===================== */
const RT_C = 2*Math.PI*70;
/* Wall-clock rest timer: stores endTime so background pauses don't lose time.
   On visibilitychange (returning to app), paintRest() recalculates from real clock. */
let rest = {running:false, endTime:0, total:0, exIdx:-1, timer:null};
function restSecsRemaining(){ return Math.max(0, Math.round((rest.endTime - Date.now()) / 1000)); }
function startRest(seconds, exIdx){
  stopRest();
  rest = {running:true, endTime:Date.now()+seconds*1000, total:seconds, exIdx:exIdx, timer:setInterval(restTick,500)};
  mountRestTimer();
}
function stopRest(){ if(rest.timer) clearInterval(rest.timer); rest.running=false; rest.timer=null; const slot=document.getElementById('restSlot'); if(slot) slot.innerHTML=''; }
function restTick(){ paintRest(); if(restSecsRemaining()<=0){ clearInterval(rest.timer); rest.timer=null; } }
function adjustRest(d){ rest.endTime = Math.max(Date.now(), rest.endTime + d*1000); rest.total = Math.max(rest.total, restSecsRemaining()); paintRest(); }
function skipRest(){ stopRest(); }
document.addEventListener('visibilitychange', function(){ if(!document.hidden && rest.running) paintRest(); });
function mountRestTimer(){
  const slot = document.getElementById('restSlot');
  if(!slot){ return; }
  slot.innerHTML =
    '<div class="resttimer"><div class="rt-arcwrap"><svg width="158" height="158" viewBox="0 0 158 158">'+
    '<circle class="rt-bg" cx="79" cy="79" r="70"></circle>'+
    '<circle class="rt-fg" id="rtArc" cx="79" cy="79" r="70" stroke-dasharray="'+RT_C.toFixed(1)+'" stroke-dashoffset="0"></circle>'+
    '</svg><div class="rt-center"><div class="rt-time" id="rtTime">0:00</div><div class="rt-label" id="rtLabel">Rest</div></div></div>'+
    '<div class="rt-btns"><button onclick="adjustRest(-15)">−15s</button><button onclick="adjustRest(15)">+15s</button><button onclick="skipRest()">Skip</button></div></div>';
  paintRest();
}
function paintRest(){
  const arc=document.getElementById('rtArc'), t=document.getElementById('rtTime'), l=document.getElementById('rtLabel');
  if(!arc||!t) return;
  const secs = restSecsRemaining();
  const frac = rest.total>0 ? Math.max(0,secs/rest.total) : 0;
  arc.style.strokeDashoffset = (RT_C*(1-frac)).toFixed(1);
  t.textContent = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  if(secs<=0){ arc.style.stroke='var(--cyan)'; t.style.color='var(--cyan)'; if(l) l.textContent='Ready — go'; }
  else { arc.style.stroke='var(--amber)'; t.style.color='var(--text)'; if(l) l.textContent='Rest'; }
}

/* ===================== BODY HEATMAP ===================== */
const BM_GROUPS = ['chest','traps','frontDelts','sideDelts','rearDelts','biceps','triceps','forearms','abs','obliques','lats','lowerBack','glutes','quads','hamstrings','calves'];
const BM_LABELS = {chest:'Chest',traps:'Trapezius',frontDelts:'Front delts',sideDelts:'Side delts',rearDelts:'Rear delts',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',abs:'Abs',obliques:'Obliques',lats:'Lats',lowerBack:'Lower back',glutes:'Glutes',quads:'Quads',hamstrings:'Hamstrings',calves:'Calves'};
/* map fine heatmap groups -> V1 broad groups */
const BM_TO_BROAD = {chest:'Chest',traps:'Back',frontDelts:'Shoulders',sideDelts:'Shoulders',rearDelts:'Shoulders',biceps:'Biceps',triceps:'Triceps',forearms:null,abs:'Abs',obliques:'Abs',lats:'Back',lowerBack:null,glutes:'Glutes',quads:'Quads',hamstrings:'Hamstrings',calves:null};
const BM_C = {green:'#3a9e6e',yellow:'#c9952a',red:'#c04040',off:'#39424e'};
const BM_OP = {green:.92,yellow:.86,red:.86,off:.34};
let bmState = {}; // container -> {mode, selected}

function bmTrainedDays(broad){
  // most recent date a broad group was trained, days ago (Infinity if never)
  let best=Infinity;
  S.logs.forEach(l=>{ const hit=l.entries.some(e=>{const m=musclesFor(e.exercise); return m.p.includes(broad)||m.s.includes(broad);});
    if(hit){ const d=daysBetween(l.date, todayKey()); if(d>=0 && d<best) best=d; } });
  return best;
}
function bmWeeklyVol(broad){
  const wk = weekStartKey();
  let v=0;
  S.logs.filter(l=>l.date>=wk).forEach(l=>l.entries.forEach(e=>{const m=musclesFor(e.exercise); const n=e.sets.length;
    if(m.p.includes(broad)) v+=n; if(m.s.includes(broad)) v+=n*0.5;}));
  return v;
}
function bmProgress(broad){
  // green if any exercise hitting this group improved e1RM in last ~4wks, yellow if flat, red if declining, off if no data
  let any=false, improved=false, declined=false;
  for(const ex in EX_MUSCLES){
    const m=EX_MUSCLES[ex]; if(!(m.p.includes(broad))) continue;
    const pts=e1rmSeries(ex); if(pts.length<2) continue; any=true;
    const recent=pts.slice(-4); const a=recent[0].v, b=recent[recent.length-1].v;
    if(b>a*1.01) improved=true; else if(b<a*0.99) declined=true;
  }
  if(!any) return 'off';
  if(improved) return 'green'; if(declined) return 'red'; return 'yellow';
}
function bmStatus(container, key){
  const mode = bmState[container].mode;
  const broad = BM_TO_BROAD[key];
  if(!broad) return 'off';
  if(mode==='today'){
    const dk=currentDayKey(); if(dk==='REST') return 'off';
    let st='off';
    dayExNames(dk).forEach(nm=>{const m=musclesFor(nm); if(m.p.includes(broad)) st='green'; else if(m.s.includes(broad)&&st==='off') st='yellow';});
    return st;
  }
  if(mode==='weekly'){
    const v=bmWeeklyVol(broad); if(v<=0) return 'off'; if(v<6) return 'red'; if(v<10) return 'yellow'; return 'green';
  }
  if(mode==='recovery'){
    const d=bmTrainedDays(broad); if(d===Infinity) return 'off'; if(d<2) return 'red'; if(d<4) return 'yellow'; return 'green';
  }
  if(mode==='progress'){ return bmProgress(broad); }
  return 'off';
}
function bmExercisesFor(key){
  const broad = BM_TO_BROAD[key];
  if(!broad) return [];
  // exercises in the user's own split that hit this group (primary first), then fall back to library
  const inSplit=[];
  for(const dk in S.split) for(const x of (S.split[dk].exercises||[])){
    const nm=exName(x); const m=musclesFor(nm);
    if(m.p.includes(broad)) inSplit.push({nm, pri:true}); else if(m.s.includes(broad)) inSplit.push({nm, pri:false});
  }
  const seen=new Set(); const uniq=[];
  inSplit.sort((a,b)=>(b.pri-a.pri)).forEach(o=>{ if(!seen.has(o.nm)){seen.add(o.nm); uniq.push(o.nm);} });
  return uniq.slice(0,4);
}

/* ===================== PWA (single-file) ===================== */
function setupPWA(){
  try{
    // generate a forge-diamond home-screen icon at runtime (no second file needed)
    function iconURL(size){
      const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
      x.fillStyle='#0E1217'; x.fillRect(0,0,size,size);
      const cx=size/2, r=size*0.27;
      x.save(); x.translate(cx,cx); x.rotate(Math.PI/4);
      x.strokeStyle='#F6862F'; x.lineWidth=size*0.05; x.strokeRect(-r,-r,2*r,2*r);
      x.fillStyle='#F6862F'; const ir=r*0.5; x.fillRect(-ir,-ir,2*ir,2*ir);
      x.restore();
      return c.toDataURL('image/png');
    }
    const i180=iconURL(180), i512=iconURL(512);
    const al=document.createElement('link'); al.rel='apple-touch-icon'; al.href=i180; document.head.appendChild(al);
    const fav=document.createElement('link'); fav.rel='icon'; fav.href=i180; document.head.appendChild(fav);
    const manifest={ name:'Iron Hub', short_name:'Iron Hub', start_url:'.', scope:'.', display:'standalone',
      background_color:'#0A0D11', theme_color:'#0E1217', orientation:'portrait',
      icons:[ {src:i512, sizes:'512x512', type:'image/png', purpose:'any maskable'}, {src:i180, sizes:'180x180', type:'image/png'} ] };
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const ml=document.createElement('link'); ml.rel='manifest'; ml.href=URL.createObjectURL(blob); document.head.appendChild(ml);
  }catch(e){ /* canvas unavailable (e.g. test env) — home-screen meta tags still apply */ }
}

/* ===================== MARKDOWN RENDERER ===================== */
function renderMarkdown(raw){
  let s = esc(raw);
  s = s.replace(/^## (.+)$/gm, '<span style="display:block;margin:10px 0 3px;font-weight:600;font-size:13.5px;color:var(--amber)">$1</span>');
  s = s.replace(/^### (.+)$/gm, '<span style="display:block;margin:8px 0 2px;font-weight:600;color:var(--text)">$1</span>');
  s = s.replace(/^# (.+)$/gm, '<span style="display:block;margin:10px 0 4px;font-weight:700;font-size:14px;color:var(--amber)">$1</span>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/^[-\u2022*] (.+)$/gm, '<div style="padding:2px 0 2px 14px;position:relative"><span style="position:absolute;left:4px;color:var(--amber)">\u00b7</span>$1</div>');
  s = s.replace(/\n\n+/g, '<div style="height:7px"></div>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

function lastSessionFor(name){ const h=historyFor(name); return h.length?h[0]:null; }
function lastSessionStrip(name){
  const ls=lastSessionFor(name);
  if(!ls) return '<div class="dock-last"><span class="dl-tag">First time</span> no prior data for this lift</div>';
  const sets=ls.sets.map(s=>s.w+'×'+s.r+(s.e?({easy:'\u1d49',solid:'',grind:'\u1d4d',fail:'\u1da0'}[s.e]||''):'')).join('  ');
  return '<div class="dock-last"><span class="dl-tag">Last \u00b7 '+fmtDate(ls.date)+'</span>'+esc(sets)+'</div>';
}
function setDeltaChip(name, setIdx, w, r){
  const ls=lastSessionFor(name); if(!ls||!ls.sets[setIdx]) return '';
  const pw=+ls.sets[setIdx].w||0, pr=+ls.sets[setIdx].r||0;
  const dw=w-pw, dr=r-pr;
  if(dw===0 && dr===0) return '<span class="delta same">=</span>';
  let parts=[];
  if(dw!==0) parts.push((dw>0?'+':'')+dw+'lb');
  if(dr!==0) parts.push((dr>0?'+':'')+dr+'r');
  const better = dw>0 || (dw===0&&dr>0);
  return '<span class="delta '+(better?'up':(dw<0&&dr<=0?'down':'same'))+'">'+parts.join(' ')+'</span>';
}

/* ===================== 5. DELOAD DETECTION ===================== */
function deloadCheck(){
  const reasons=[]; let score=0;
  const mains=['Barbell Bench Press','Barbell Back Squat'];
  // 1) main lift e1RM flat/declining over last 4 sessions
  mains.forEach(ex=>{
    const pts=e1rmSeries(ex); if(pts.length>=4){
      const recent=pts.slice(-4); const first=recent[0].v, last=recent[recent.length-1].v;
      if(last < first*0.985){ reasons.push(ex.replace('Barbell ','')+' e1RM has slipped over the last 4 sessions'); score+=2; }
      else if(last < first*1.005){ reasons.push(ex.replace('Barbell ','')+' has stalled (no e1RM gain in 4 sessions)'); score+=1; }
    }
  });
  // 2) recent grind/fail density across last ~10 logged sessions
  const recentLogs=[...S.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  let grind=0, total=0;
  recentLogs.forEach(l=>l.entries.forEach(e=>e.sets.forEach(s=>{ total++; if(s.e==='grind'||s.e==='fail') grind++; })));
  if(total>=10){ const pct=grind/total; if(pct>=0.4){ reasons.push(Math.round(pct*100)+'% of recent sets tagged grind/fail \u2014 effort is creeping up'); score+=2; } else if(pct>=0.25){ reasons.push('A quarter of recent sets are grinders'); score+=1; } }
  // 3) consecutive training weeks (sessions logged) without a light week
  const weeks=new Set(S.logs.map(l=>weekKeyOf(l.date)));
  if(weeks.size>=6){ reasons.push(weeks.size+' weeks of accumulated training on record'); score+=1; }
  let severity = score>=4 ? 'recommend' : score>=2 ? 'watch' : 'clear';
  return {severity, score, reasons};
}
function deloadCardHTML(){
  const d=deloadCheck();
  if(d.severity==='clear'){
    return '<div class="card" style="border-left:3px solid var(--cyan)"><div class="chart-h" style="margin-bottom:4px">Fatigue check <span class="pill" style="border-color:var(--cyan-dim);color:var(--cyan)">Clear</span></div><p class="small">No deload signals right now \u2014 recovery is keeping up with the work. Keep pushing.</p></div>';
  }
  const col = d.severity==='recommend' ? 'var(--red)' : 'var(--amber)';
  const head = d.severity==='recommend' ? 'Deload recommended' : 'Watch for fatigue';
  let how = d.severity==='recommend'
    ? 'Take a deload week: keep the same exercises but drop to ~60% of your working weights, cut each lift to 2 sets, and stay 3\u20134 reps shy of failure. You\u2019ll come back stronger \u2014 fatigue is masking fitness right now.'
    : 'Not urgent, but the signals are building. Make sure you\u2019re hitting 3000+ cal and 8h sleep this week. If the grinders keep stacking up, deload next week.';
  return '<div class="card" style="border-left:3px solid '+col+'"><div class="chart-h" style="margin-bottom:6px">Fatigue check <span class="pill" style="border-color:'+col+';color:'+col+'">'+head+'</span></div>'+
    '<div class="small" style="margin-bottom:8px">'+d.reasons.map(r=>'<div class="exinfo-cue"><span style="color:'+col+'">\u25b8</span>'+esc(r)+'</div>').join('')+'</div>'+
    '<p class="small" style="color:var(--text)">'+how+'</p></div>';
}

/* ===================== 7. 1RM TEST PROTOCOL ===================== */
function oneRMRamp(target){
  target=Math.round(target);
  const round5=w=>Math.round(w/5)*5;
  const steps=[
    {pct:0,   reps:'8\u201310', rest:'\u2014',    label:'Empty bar', note:'Grease the groove'},
    {pct:.40, reps:5,          rest:'60s',  label:'Warm-up'},
    {pct:.60, reps:3,          rest:'90s',  label:'Warm-up'},
    {pct:.75, reps:2,          rest:'2 min', label:'Warm-up'},
    {pct:.85, reps:1,          rest:'2\u20133 min', label:'Primer'},
    {pct:.93, reps:1,          rest:'3\u20134 min', label:'Last primer', note:'Should move fast'},
    {pct:1.00,reps:1,          rest:'3\u20135 min', label:'1RM ATTEMPT', attempt:true},
    {pct:1.03,reps:1,          rest:'3\u20135 min', label:'If it flew \u2014 small jump', attempt:true}
  ];
  return steps.map(s=>({...s, w: s.pct===0 ? 'Bar' : round5(target*s.pct)}));
}
function render1RMLab(){
  const el=document.getElementById('onerm'); if(!el) return;
  const mains=[...new Set([...Object.keys(PR_LIFTS), ...Object.values(S.split).flatMap(d=>(d.exercises||[]).map(exName))])];
  const sel = window._rmLift || 'Barbell Bench Press';
  const e1=Math.round(bestE1RM(sel)||0);
  const pr=actualPR(sel);
  const est = window._rmTarget || (e1||(pr?pr.w:135));
  let h='<p class="small">A structured warm-up ramp to a true 1-rep max. Test a main lift every 8\u201312 weeks \u2014 not more. Make sure you\u2019re fresh (ideally after a rest day) and have a spotter for bench.</p>';
  h+='<div class="card"><div class="row">'+
     '<div><label>Lift</label><select id="rmLift" onchange="setRmLift(this.value)">'+mains.map(m=>'<option'+(m===sel?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select></div>'+
     '<div><label>Target 1RM (lb)</label><input id="rmTarget" inputmode="numeric" value="'+est+'" onchange="setRmTarget(this.value)"></div>'+
     '</div>'+
     '<p class="small" style="margin-top:8px">'+(e1?('Your current estimated 1RM is ~<b style="color:var(--amber)">'+e1+' lb</b> (from logged sets). '):'')+'Adjust the target if you\u2019re feeling strong or conservative.</p></div>';
  const ramp=oneRMRamp(+est||135);
  h+='<div class="card" style="padding:0;overflow:hidden">';
  ramp.forEach((s,i)=>{
    h+='<div class="rm-step'+(s.attempt?' attempt':'')+'">'+

       '<div class="rm-mid"><div class="rm-label">'+esc(s.label)+(s.pct>0?' \u00b7 '+Math.round(s.pct*100)+'%':'')+'</div>'+(s.note?'<div class="rm-note">'+esc(s.note)+'</div>':'')+'</div>'+
       '<div class="rm-reps">\u00d7'+s.reps+'</div>'+

/* ===================== 8. SLEEP / PERFORMANCE ===================== */
const SLEEP_SCORE={'<6':1,'6-7':2,'7-8':3,'8+':4};
function quickLogSleep(bucket){
  const k=todayKey();
  let rd=S.readiness.find(r=>r.date===k);
  if(rd){ rd.sleep=bucket; } else { S.readiness.push({date:k, sleep:bucket, sore:'', energy:'', tier:'ok'}); }
  save(); renderSleep();
}
function sleepPerfData(){
  // pair each day's sleep bucket with that day's best e1RM across logged lifts
  const out=[];
  S.readiness.forEach(r=>{
    if(!r.sleep || !SLEEP_SCORE[r.sleep]) return;
    const log=S.logs.find(l=>l.date===r.date); if(!log) return;
    let best=0;
    log.entries.forEach(e=>e.sets.forEach(s=>{ const v=epley(+s.w||0,+s.r||0); if(v>best) best=v; }));
    if(best>0) out.push({date:r.date, sleep:SLEEP_SCORE[r.sleep], bucket:r.sleep, perf:Math.round(best)});
  });
  return out;
}
function renderSleep(){
  const el=document.getElementById('sleep'); if(!el) return;
  const today=S.readiness.find(r=>r.date===todayKey());
  let h='<p class="small">Log how you slept and the app tracks whether your strength actually tracks with sleep. Sleep is logged automatically when you do a pre-session check-in too.</p>';
  h+='<div class="card"><div class="chart-h" style="margin-bottom:8px">Last night\u2019s sleep'+(today&&today.sleep?' <span class="pill" style="border-color:var(--cyan-dim);color:var(--cyan)">logged: '+esc(today.sleep)+'h</span>':'')+'</div>'+
     '<div class="sleep-btns">'+['<6','6-7','7-8','8+'].map(b=>'<button class="'+(today&&today.sleep===b?'sel':'')+'" onclick="quickLogSleep(\''+b+'\')">'+b+'h</button>').join('')+'</div></div>';
  const data=sleepPerfData();
  if(data.length<3){
    h+='<div class="card"><p class="small">Not enough overlapping data yet \u2014 keep logging sleep and training for about a week and a correlation view will appear here. ('+data.length+'/3 days so far.)</p></div>';
  } else {
    const good=data.filter(d=>d.sleep>=3), poor=data.filter(d=>d.sleep<=2);
    const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b.perf,0)/arr.length):0;
    const gAvg=avg(good), pAvg=avg(poor);
    h+='<div class="card"><div class="chart-h" style="margin-bottom:10px">Sleep vs strength output</div>';
    if(good.length && poor.length){
      const diff=gAvg-pAvg; const pct=pAvg?Math.round(diff/pAvg*100):0;
      h+='<div class="stats" style="margin-bottom:10px">'+
        '<div class="stat"><div class="v good">'+gAvg+'</div><div class="l">Avg e1RM \u00b7 7h+ sleep</div><div class="s">'+good.length+' days</div></div>'+
        '<div class="stat"><div class="v '+(pAvg<gAvg?'bad':'')+'">'+pAvg+'</div><div class="l">Avg e1RM \u00b7 under 7h</div><div class="s">'+poor.length+' days</div></div>'+
        '</div>';
      h+='<p class="small" style="color:var(--text)">'+(diff>0
        ? 'On nights you slept 7h+, your best lifts averaged <b style="color:var(--cyan)">'+pct+'% higher</b>. The pattern is real \u2014 protect your sleep like it\u2019s part of the program, because it is.'
        : 'Interestingly, no clear strength penalty from shorter sleep in your data so far. Keep logging \u2014 small samples can hide the effect, and sleep still drives recovery and growth beyond just today\u2019s numbers.')+'</p>';
    } else {
      h+='<p class="small">You\u2019ve been consistent on one side of the sleep range \u2014 once you have a mix of good and short nights logged, the comparison will populate.</p>';
    }
    // simple trend of perf points
    h+='<div style="margin-top:10px">'+lineChart(data.map(d=>({date:d.date,v:d.perf})),'#B79BFF')+'</div></div>';
  }
  el.innerHTML=h;
}

let _dragSrc=null;
function enableSplitDrag(){
  document.querySelectorAll('#sdWrap .sd-ex').forEach(row=>{
    row.setAttribute('draggable','true');
    row.addEventListener('dragstart',e=>{ _dragSrc=row; row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    row.addEventListener('dragend',()=>{ row.classList.remove('dragging'); document.querySelectorAll('.sd-ex.dragover').forEach(r=>r.classList.remove('dragover')); });
    row.addEventListener('dragover',e=>{ e.preventDefault(); if(_dragSrc && _dragSrc!==row && _dragSrc.parentElement===row.parentElement){ row.classList.add('dragover'); } });
    row.addEventListener('dragleave',()=>row.classList.remove('dragover'));
    row.addEventListener('drop',e=>{ e.preventDefault(); row.classList.remove('dragover');
      if(_dragSrc && _dragSrc!==row && _dragSrc.parentElement===row.parentElement){
        const dk=row.getAttribute('data-dk'); const from=+_dragSrc.getAttribute('data-i'); const to=+row.getAttribute('data-i');
        moveExTo(dk, from, to);
      }
    });
  });
}

/* ===================== OVERRIDES / WIRING ===================== */
/* enhanced split editor: adds drag handle + data attrs, keeps arrows */
function splitEditorHTML(){
  let h='';
  Object.keys(S.split).forEach(dk=>{
    const d=S.split[dk]; const list=d.exercises||[];
    h+='<div class="sd-day"><div class="sd-dhead" onclick="toggleSdDay(\''+dk+'\')">'+
      '<span class="dk" style="color:'+(d.hex||'#8d909a')+'">'+dk+'</span>'+
      '<input class="dn" style="background:var(--base);border:1px solid var(--line);border-radius:5px;color:var(--text);padding:4px 8px;font-size:12px;flex:1;max-width:240px" value="'+esc(d.name||'')+'" onclick="event.stopPropagation()" onchange="renameDay(\''+dk+'\',this.value)">'+
      '<span class="chev" id="chev-'+dk+'">\u25be</span></div>'+
      '<div class="sd-body" id="sdbody-'+dk+'">';
    list.forEach((x,i)=>{
      const nm=exName(x), inc=exInc(x);
      const ff=typeof x==='object' && !!x.formFocus;
      const str=typeof x==='object' && x.repMode==='str';
      h+='<div class="sd-ex" data-dk="'+dk+'" data-i="'+i+'">'+
        '<span class="drag-h" title="Drag to reorder">\u2630</span>'+
        '<input class="nm" value="'+esc(nm)+'" onchange="renameEx(\''+dk+'\','+i+',this.value)">'+
        '<div class="inc-presets" title="Weight increment">'+
          INC_PRESETS.map(v=>'<button class="'+(Math.abs(inc-v)<0.01?'sel':'')+'" onclick="setInc(\''+dk+'\','+i+','+v+')">+'+v+'</button>').join('')+
        '</div>'+
        '<button class="ord ff-toggle" style="'+(ff?'color:var(--cyan);border-color:var(--cyan);font-weight:800':'')+'" onclick="toggleFormFocus(\''+dk+'\','+i+')">FORM</button>'+
        '<button class="ord ff-toggle" style="'+(str?'color:var(--violet);border-color:var(--violet);font-weight:800':'')+'" onclick="toggleRepMode(\''+dk+'\','+i+')">'+(str?'STR':'HYP')+'</button>'+
        '<button class="ord" title="Move up" onclick="moveEx(\''+dk+'\','+i+',-1)">\u2191</button>'+
        '<button class="ord" title="Move down" onclick="moveEx(\''+dk+'\','+i+',1)">\u2193</button>'+
        '<button class="xx" title="Delete" onclick="delEx(\''+dk+'\','+i+')">\u00d7</button>'+
      '</div>';
    });
    h+='<div style="padding:8px 0 2px"><button class="btn ghost sm" onclick="addEx(\''+dk+'\')">+ add exercise</button></div>';
    h+='</div></div>';
  });
  return h;
}
function refreshSplitEditor(){ const w=$('#sdWrap'); if(w){ w.innerHTML=splitEditorHTML(); enableSplitDrag(); } }

function renderProgressV2(){
  renderProgress();

  if(!sec.querySelector('.bodymap-card')){
    const wrap=document.createElement('div'); wrap.innerHTML=bodyMapCardHTML('progress');
    sec.insertBefore(wrap.firstElementChild, sec.firstChild); initBodyMap('progress');

  if(!sec.querySelector('.p2-extras')){
    const extras=document.createElement('div'); extras.className='p2-extras';
    const vol=volumeSeries();

}
