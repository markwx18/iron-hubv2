<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Hub">
<title>Iron Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#0E1217; --base2:#0A0D11; --panel:#161B22; --panel2:#1B212A;
    --line:#262E38; --line2:#37414E;
    --amber:#F6862F; --amber-soft:#FFB877; --amber-dim:#5e4127;
    --cyan:#46CDBA; --cyan-dim:#2c5e54;
    --red:#E15842; --red-dim:#5e2c27;
    --violet:#B79BFF; --violet-dim:#4b3f78;
    --text:#EAEFF4; --muted:#8B94A1; --dim:#59626E;
    --good:#46CDBA; --warn:#F6862F; --bad:#E15842;
    --glow:rgba(246,134,47,.20);
    --disp:'Saira Condensed',sans-serif; --body:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
    --accent:var(--amber); --d1:#d23b3b; --d2:#2f6fd0; --d3:#dfae36; --d4:#3da25f; --d5:#e9e7e2; --d6:#9aa0ab;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:
      radial-gradient(900px 480px at 18% -8%, rgba(246,134,47,.05), transparent 60%),
      radial-gradient(760px 560px at 112% 8%, rgba(70,205,186,.045), transparent 55%),
      var(--base2);
    color:var(--text); font-family:var(--body); min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.55;}
  ::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:var(--body);}
  b,strong{font-weight:600;}
  h2{font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:18px 2px 9px;}
  .mono{font-family:var(--mono);}
  .small{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .dim{color:var(--dim);} .up{color:var(--cyan);} .dn{color:var(--red);} .fl{color:var(--muted);} .ok{color:var(--cyan);} .err{color:var(--red);}

  .app-shell{max-width:780px; margin:0 auto; min-height:100vh; padding:0 0 96px; position:relative;}

  .topbar{position:sticky; top:0; z-index:40; backdrop-filter:blur(12px);
    background:linear-gradient(180deg,rgba(10,13,17,.92),rgba(10,13,17,.72)); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:12px;}
  .logo-mark{width:18px; height:18px; border:2px solid var(--amber); border-radius:4px; position:relative; transform:rotate(45deg); flex:none;}
  .logo-mark::after{content:""; position:absolute; inset:3.5px; background:var(--amber); border-radius:1px;}
  .brand-txt{font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:.03em; text-transform:uppercase; line-height:1;}
  .brand-txt small{display:block; font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:var(--dim); margin-top:2px; text-transform:uppercase; font-weight:400;}
  .topbar .spacer{flex:1;}

  .modeswitch{display:flex; gap:0; background:var(--base); border:1px solid var(--line2); border-radius:4px; overflow:hidden; flex:none;}
  .modeswitch button{font-family:var(--disp); font-weight:600; font-size:14px; letter-spacing:.08em; text-transform:uppercase; padding:8px 16px; background:none; border:none; color:var(--dim); position:relative; transition:.15s;}
  .modeswitch button .pdot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px;vertical-align:middle;}
  .modeswitch button.on.live{color:#1a0e02; background:var(--amber);}
  .modeswitch button.on.review{color:var(--base); background:var(--cyan);}

  .welcome{margin:16px; padding:18px 18px 16px; border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:4px; background:linear-gradient(180deg,rgba(246,134,47,.06),transparent 70%),var(--panel);}
  .welcome .greet{font-family:var(--disp); font-weight:700; font-size:25px; line-height:1.02; text-transform:uppercase; letter-spacing:.01em;}
  .welcome .greet .accent{color:var(--amber);}
  .welcome .submsg{font-size:13.5px; color:var(--muted); margin-top:7px; line-height:1.5;}
  .welcome .wcta{margin-top:13px; display:flex; gap:9px; flex-wrap:wrap;}

  .pad{padding:0 16px;}
  .card{margin:12px 16px; padding:15px 16px; background:var(--panel); border:1px solid var(--line); border-radius:4px;}
  .card.flat{background:none; border:none; padding:0; margin:12px 16px;}
  .pad .card,.live-body .card,.review-body .card{margin-left:0; margin-right:0;}

  .btn{font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.05em; text-transform:uppercase; padding:11px 16px; border-radius:3px; border:1px solid var(--line2); background:var(--panel2); color:var(--text); transition:.14s; display:inline-flex; align-items:center; justify-content:center; gap:7px;}
  .btn:hover{border-color:var(--amber);} .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--amber); color:#1a0e02; border-color:var(--amber);} .btn.primary:hover{filter:brightness(1.07);}
  .btn.cyan{background:var(--cyan); color:var(--base); border-color:var(--cyan);}
  .btn.ghost{background:none;} .btn.sm{font-size:13px; padding:7px 12px;}
  .btn.block{width:100%;} .btn:disabled{opacity:.4; cursor:not-allowed;}

  .pill{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:3px 9px; border-radius:2px; border:1px solid var(--line2); color:var(--muted); margin:2px;}

  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%; background:var(--base); border:1px solid var(--line2); border-radius:3px; color:var(--text); padding:10px 11px; font-size:14px; font-family:var(--mono);}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--amber);}
  label{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:5px;}
  .row{display:flex; gap:10px; flex-wrap:wrap;} .row>div{flex:1; min-width:90px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:9px;}
  .stat{background:var(--base); border:1px solid var(--line); border-radius:3px; padding:11px 12px;}
  .stat .v{font-family:var(--mono); font-size:20px; font-weight:600;}
  .stat .v.good{color:var(--cyan);} .stat .v.warn{color:var(--amber);} .stat .v.bad{color:var(--red);}
  .stat .l{font-family:var(--mono); font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin-top:3px;}
  .stat .s{font-size:11px; color:var(--muted); margin-top:2px;}

  .ex{margin:10px 0; border:1px solid var(--line); border-radius:4px; background:var(--panel); overflow:hidden;}
  .ex-head{padding:13px 14px 11px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ex-name{font-family:var(--disp); font-weight:600; font-size:18px; letter-spacing:.01em; text-transform:uppercase;}
  .ex-rec{font-family:var(--mono); font-size:13px; color:var(--amber); width:100%; margin-top:3px;}
  .ex-note{font-size:11.5px; color:var(--muted); width:100%; line-height:1.45;}
  .editex{margin-left:auto; background:none; border:1px solid var(--line2); color:var(--muted); width:30px; height:30px; border-radius:3px; font-size:13px;}
  .editex:hover{border-color:var(--amber); color:var(--amber);}
  .sets{padding:0 14px; display:flex; flex-direction:column; gap:7px;}
  .setrow{display:flex; align-items:center; gap:8px;}
  .setrow .sn{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--dim); width:34px; text-transform:uppercase;}
  .setrow input{width:74px; text-align:center; padding:8px;}
  .setrow .eff{font-family:var(--mono); font-size:11px; padding:7px 9px; border:1px solid var(--line2); border-radius:3px; background:var(--base); color:var(--muted); min-width:30px;}
  .setrow .rm{background:none; border:none; color:var(--dim); font-size:16px; padding:4px 8px;}

  .hm{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px;}
  .hm-cell{border:1px solid var(--line); border-radius:3px; padding:9px 10px; background:var(--base);}
  .hm-cell .g{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
  .hm-cell .n{font-family:var(--mono); font-size:19px; font-weight:600; margin-top:2px;}
  .hm-cell .l{font-size:10px; margin-top:1px;}
  .hm-bar{height:4px; border-radius:2px; background:var(--line); margin-top:6px; overflow:hidden;}
  .hm-bar i{display:block; height:100%;}

  .goal-card{margin:12px 0; border:1px solid var(--line); border-radius:4px; background:var(--panel); padding:15px;}
  .goal-head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;}
  .goal-name{font-family:var(--disp); font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:.02em;}
  .goal-tgt{font-family:var(--mono); font-size:12px; color:var(--muted);}
  .del,.xx{background:none; border:1px solid var(--line2); color:var(--dim); border-radius:3px; padding:3px 9px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;}
  .del:hover,.xx:hover{border-color:var(--red); color:var(--red);}

  .chat-box{display:flex; flex-direction:column; gap:9px; max-height:440px; overflow-y:auto; padding:4px;}
  .msg{padding:10px 13px; border-radius:6px; font-size:13.5px; line-height:1.5; max-width:88%;}
  .msg.me{align-self:flex-end; background:var(--amber); color:#1a0e02;}
  .msg.ai{align-self:flex-start; background:var(--panel2); border:1px solid var(--line); color:var(--text);}
  .msg.sys{align-self:center; color:var(--dim); font-size:11px; font-family:var(--mono);}
  .chat-in{display:flex; gap:8px; margin-top:10px;}
  .chat-in textarea{flex:1; resize:none; height:44px;}

  .prop-card{margin:12px 0; padding:14px; border:1px solid var(--amber-dim); border-left:3px solid var(--amber); border-radius:4px; background:linear-gradient(180deg,rgba(246,134,47,.05),transparent),var(--panel);}
  .prop-card .pt{font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--amber);}
  .prop-act{display:flex; gap:8px; margin-top:8px;}

  .sd-day{margin:10px 0; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .sd-dhead{padding:11px 13px; background:var(--panel2); display:flex; align-items:center; gap:9px; cursor:pointer;}
  .sd-body{padding:11px 13px; display:none;} .sd-day.open .sd-body{display:block;}
  .sd-ex{display:flex; align-items:center; gap:6px; padding:6px 0; flex-wrap:wrap; border-top:1px solid var(--line);}
  .sd-ex .nm{flex:1; min-width:120px;}
  .inc-presets{display:flex; gap:3px;} .inc-presets button{font-family:var(--mono); font-size:10px; padding:4px 7px; border:1px solid var(--line2); background:var(--base); color:var(--muted); border-radius:2px;}
  .inc-presets button.sel{border-color:var(--amber); color:var(--amber);}
  .ord{background:none; border:1px solid var(--line2); color:var(--muted); border-radius:2px; padding:4px 8px; font-size:11px; font-family:var(--mono);}

  .hist{border:1px solid var(--line); border-radius:4px; margin:8px 0; overflow:hidden;}
  .fh{padding:11px 13px; background:var(--panel2); cursor:pointer; display:flex; align-items:center; gap:9px;}
  .fm{padding:11px 13px; display:none;} .hist.open .fm{display:block;}
  .h-ex{font-size:13px; padding:3px 0;}

  .fuel-slot{margin:10px 0; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .fuel-shead{padding:11px 13px; background:var(--panel2); display:flex; align-items:center; gap:9px;}
  .fopt{padding:9px 13px; border-top:1px solid var(--line); font-size:13px;}
  .fn{font-weight:600;} .fopt .mono{color:var(--amber); font-size:11px;}

  .daychip{display:inline-block; padding:3px 10px; border-radius:3px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#0c0f13; font-weight:600;}

  .review-body{padding:0 16px;}
  .rnav{position:sticky; top:54px; z-index:30; display:flex; gap:6px; overflow-x:auto; padding:12px 0 10px; background:linear-gradient(180deg,var(--base2) 70%,transparent); -ms-overflow-style:none; scrollbar-width:none;}
  .rnav::-webkit-scrollbar{display:none;}
  .rnav button{font-family:var(--disp); font-weight:600; font-size:14px; letter-spacing:.05em; text-transform:uppercase; padding:8px 14px; border:1px solid var(--line); border-radius:3px; background:var(--panel); color:var(--muted); white-space:nowrap; flex:none;}
  .rnav button.on{background:var(--cyan); color:var(--base); border-color:var(--cyan);}
  main section{display:none;} main section.on{display:block;}

  .bodymap-card{margin:12px 16px; padding:15px 16px; background:var(--panel); border:1px solid var(--line); border-radius:4px;}
  .live-body .bodymap-card,.review-body .bodymap-card{margin-left:0;margin-right:0;}
  .bm-modes{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .bm-modes button{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 11px; border:1px solid var(--line2); border-radius:2px; background:var(--base); color:var(--muted);}
  .bm-modes button.on{border-color:var(--amber); color:var(--amber);}
  .bm-bodies{display:flex; gap:18px; justify-content:center; align-items:flex-start;}
  .bm-bwrap{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .bm-blabel{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);}
  .bm-mgrp{cursor:pointer; transition:filter .15s;}
  .bm-tip{font-size:12px; color:var(--muted); min-height:17px; text-align:center; margin-top:11px;}
  .bm-legend{display:flex; gap:13px; flex-wrap:wrap; justify-content:center; margin-top:10px; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);}
  .bm-legend span{display:flex; align-items:center; gap:5px;} .bm-sw{width:10px; height:10px; border-radius:2px;}
  .bm-excard{margin-top:12px; border:1px solid var(--line2); border-radius:4px; padding:12px 14px; background:var(--base); display:none;}
  .bm-excard.show{display:block;}
  .bm-excard .t{font-family:var(--disp); font-weight:600; font-size:16px; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center;}
  .bm-exitem{display:flex; align-items:center; gap:9px; font-size:13px; padding:4px 0; color:var(--muted);}
  .bm-exitem .r{font-family:var(--mono); font-size:10px; width:17px; height:17px; border-radius:50%; background:var(--panel2); display:flex; align-items:center; justify-content:center; color:var(--dim); flex:none;}
  .bm-exitem b{color:var(--text); font-weight:500;}

  .live-body{padding:0 16px;}
  .live-empty{margin:18px 0; text-align:center; padding:30px 18px; border:1px dashed var(--line2); border-radius:6px;}
  .live-empty .le-day{font-family:var(--disp); font-weight:700; font-size:30px; text-transform:uppercase; line-height:1;}
  .live-empty .le-sub{color:var(--muted); font-size:13.5px; margin:10px 0 18px;}

  .sessionbar{position:sticky; top:54px; z-index:20; display:flex; align-items:center; gap:10px; padding:11px 0; background:linear-gradient(180deg,var(--base2) 75%,transparent);}
  .sessionbar .sb-day{font-family:var(--disp); font-weight:700; font-size:18px; text-transform:uppercase;}
  .sessionbar .sb-clock{font-family:var(--mono); font-size:12px; color:var(--cyan); margin-left:auto;}
  .sessionbar .sb-prog{font-family:var(--mono); font-size:11px; color:var(--dim);}

  .liveex{margin:12px 0; border:1px solid var(--line); border-radius:5px; background:var(--panel); overflow:hidden; opacity:.5; transition:opacity .25s;}
  .liveex.active{opacity:1; border-color:var(--line2);}
  .liveex.done{opacity:.66;}
  .liveex-head{position:relative; padding:15px 15px 13px;}
  .liveex.active .liveex-head::before{content:""; position:absolute; top:-1px; left:-1px; width:15px; height:15px; border:2px solid var(--amber); border-right:none; border-bottom:none;}
  .liveex.active .liveex-head::after{content:""; position:absolute; top:-1px; right:-1px; width:15px; height:15px; border:2px solid var(--amber); border-left:none; border-bottom:none;}
  .liveex-name{font-family:var(--disp); font-weight:700; font-size:22px; text-transform:uppercase; letter-spacing:.01em; line-height:1;}
  .liveex-chips{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center;}
  .liveex-sets{padding:0 15px 8px; display:flex; flex-direction:column; gap:7px;}
  .lset{display:flex; align-items:center; gap:9px; padding:9px 11px; border:1px solid var(--line); border-radius:3px; background:var(--base);}
  .lset.logged{border-color:var(--cyan-dim);}
  .lset .lsn{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--dim); width:42px; text-transform:uppercase;}
  .lset .lval{font-family:var(--mono); font-size:15px;} .lset .lval .x{color:var(--dim); margin:0 2px;}
  .lset.logged .lchk{color:var(--cyan);} .lchk{color:var(--dim);}
  .lset .leff{margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 7px; border-radius:2px; border:1px solid var(--line2); color:var(--muted);}
  .lset.logged .leff.e-easy{color:var(--cyan); border-color:var(--cyan-dim);} .leff.e-grind{color:var(--amber); border-color:var(--amber-dim);} .leff.e-fail{color:var(--red); border-color:var(--red-dim);}

  .livedock{padding:13px 15px; border-top:1px solid var(--line); background:var(--panel2);}
  .livedock .dock-presc{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.04em; margin-bottom:9px;}
  .dockrow{display:flex; gap:8px; align-items:stretch;}
  .dockrow .field{flex:1;}
  .dockrow .field label{margin-bottom:4px;}
  .dockrow input{text-align:center; font-size:16px; padding:11px 8px; font-weight:600; min-width:0;}
  .efftog{display:flex; gap:4px; margin-top:9px;}
  .efftog button{flex:1; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:8px 4px; border:1px solid var(--line2); border-radius:2px; background:var(--base); color:var(--muted);}
  .efftog button.sel{color:#1a0e02;}
  .efftog button.sel.e-easy{background:var(--cyan); border-color:var(--cyan);}
  .efftog button.sel.e-solid{background:var(--muted); border-color:var(--muted);}
  .efftog button.sel.e-grind{background:var(--amber); border-color:var(--amber);}
  .efftog button.sel.e-fail{background:var(--red); border-color:var(--red); color:#fff;}
  .dockbtns{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:11px;}

  .resttimer{margin:12px 0; border:1px solid var(--line2); border-radius:5px; padding:15px; background:radial-gradient(120% 90% at 50% 0%,rgba(246,134,47,.07),transparent 70%),var(--panel2); text-align:center;}
  .rt-arcwrap{position:relative; width:158px; height:158px; margin:6px auto 2px;}
  .rt-arcwrap svg{transform:rotate(-90deg);}
  .rt-bg{fill:none; stroke:var(--line); stroke-width:7;}
  .rt-fg{fill:none; stroke:var(--amber); stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset .9s linear;}
  .rt-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .rt-time{font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:.02em;}
  .rt-label{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:2px;}
  .rt-btns{display:flex; gap:8px; justify-content:center; margin-top:12px;}
  .rt-btns button{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:7px 14px; border:1px solid var(--line2); border-radius:3px; background:var(--base); color:var(--muted);}

  .overlay{position:fixed; inset:0; z-index:100; background:rgba(8,11,15,.95); backdrop-filter:blur(4px); display:none; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center; overflow-y:auto;}
  .overlay.show{display:flex; animation:fade .35s ease;}

<script>
'use strict';
/* ================= STATE ================= */
const LS_KEY = 'ironhub:v1';
const DEFAULT_SPLIT = {
  D1:{name:'Chest + Triceps', color:'var(--d1)', hex:'#d23b3b', exercises:[
    {name:'Barbell Bench Press', inc:5, repMode:'str'},'Incline Dumbbell Press','Pec Deck Fly','Dips','JM Press']},
  D2:{name:'Back + Biceps', color:'var(--d2)', hex:'#2f6fd0', exercises:[
    'Lat Pulldown','Cable Row','Preacher Curl Machine','Incline Prone Reverse Fly','Hammer Curl']},
  D3:{name:'Legs + Abs (Squat)', color:'var(--d3)', hex:'#dfae36', exercises:[
    {name:'Barbell Back Squat', inc:10, repMode:'str'},'Machine Leg Curl','Machine Leg Extension','Hanging Leg Raise','Abdominal Machine']},
  D4:{name:'Shoulders + Arms', color:'var(--d4)', hex:'#3da25f', exercises:[
    'Cable Lateral Raise','Overhead Press Machine','Rear Delt Machine','Incline Dumbbell Curl','V-Cable Tricep Pushdown','Dumbbell Overhead Extension','Reverse EZ Bar Curl']},
  D5:{name:'Chest + Back (Accessory)', color:'var(--d5)', hex:'#e9e7e2', exercises:[
    'Smith Machine Bench Press','Incline Press Machine','Cable Fly','Plate-Loaded Lat Pulldown','Row Machine']},
  D6:{name:'Legs + Abs (Leg Press)', color:'var(--d6)', hex:'#9aa0ab', exercises:[
    'Leg Press','Machine Leg Curl','Machine Leg Extension','Hanging Leg Raise','Hip Thrust Machine']}
};
const DEFAULT_STATE = {
  split: JSON.parse(JSON.stringify(DEFAULT_SPLIT)),
  schedule: {1:'D1',2:'D2',3:'D3',4:'D4',5:'D5',6:'D6',0:'REST'}, // JS getDay(): 0=Sun
  overrideDay: null,           // {date:'YYYY-MM-DD', day:'D2'}
  logs: [],                    // {id, date, day, entries:[{exercise, sets:[{w,r}]}]}
  weights: [],                 // {date, lbs}
  nutrition: [],               // {date, cals, protein}
  chat: [],                    // {role, content}
  road: [],                    // {id, exercise, target, start, deadline}
  readiness: [],               // {date, sleep, sore, energy, tier}
  fuel: {likes:'', dislikes:'eggs, cup yogurt, rice, cottage cheese', limits:'', calTarget:3000, proTarget:150, meals:null},
  audit: {weekStart:'', proposals:null, status:''},  // weak-group reinforcement
  settings: {apiKey:'', repLow:8, repHigh:12, ghToken:'', gistId:'', autoSync:true},
  meta: {changedAt:0, lastSync:0}
};
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const s = JSON.parse(raw);
    const out = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), s);
    // migration: seed repMode:'str' on bench and squat if they predate the per-exercise rep-mode feature
    const STR_DEFAULTS = ['Barbell Bench Press','Barbell Back Squat'];
    for(const dk in out.split){
      const list = out.split[dk].exercises || [];
      list.forEach((x,i)=>{
        const nm = typeof x==='string' ? x : x.name;
        if(STR_DEFAULTS.includes(nm)){
          if(typeof x==='string') list[i] = {name:x, inc:incFor(x), repMode:'str'};
          else if(!x.repMode) list[i] = Object.assign({}, x, {repMode:'str'});
        }
      });
    }
    return out;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}
function save(touch){
  if(touch !== false){
    S.meta = S.meta || {changedAt:0,lastSync:0};
    S.meta.changedAt = Date.now();
    schedulePush();
  }
  localStorage.setItem(LS_KEY, JSON.stringify(S));
}
/* Exercises may be stored as strings (legacy) or {name, inc} objects.
   These accessors normalize access everywhere without a destructive migration. */
function exName(x){ return typeof x === 'string' ? x : (x && x.name) || ''; }
function exInc(x){
  if(x && typeof x === 'object' && x.inc != null) return x.inc;
  return incFor(exName(x)); // fall back to smart default
}
function dayExNames(dk){
  const d = S.split[dk]; if(!d) return [];
  return (d.exercises||[]).map(exName);
}
/* Rep-mode helpers — per-exercise override of the global rep range. */
function exRepMode(ex){
  for(const dk in S.split)
    for(const x of (S.split[dk].exercises||[]))
      if(exName(x)===ex && typeof x==='object' && x.repMode==='str') return {lo:3, hi:6};
  return {lo:S.settings.repLow, hi:S.settings.repHigh};
}
function isStrMode(ex){
  for(const dk in S.split)
    for(const x of (S.split[dk].exercises||[]))
      if(exName(x)===ex && typeof x==='object' && x.repMode==='str') return true;
  return false;
}
function toggleRepMode(dk, i){
  ensureObj(dk, i);
  const x = S.split[dk].exercises[i];
  x.repMode = (x.repMode==='str') ? null : 'str';
  save(); refreshSplitEditor(); renderToday();
}

/* ================= HELPERS ================= */
const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Tolerant JSON extraction from an LLM reply: strips fences/prose, isolates the
   outermost {...} or [...], and repairs common glitches (trailing commas, smart
   quotes, truncated tails) before parsing. Throws only if truly unrecoverable. */
function parseLooseJSON(raw){
  if(raw == null) throw new Error('empty response');
  let t = String(raw).replace(/```json|```/gi, '').trim();
  // isolate the first JSON-looking span
  const firstObj = t.indexOf('{'), firstArr = t.indexOf('[');
  let start = -1;
  if(firstObj === -1) start = firstArr;
  else if(firstArr === -1) start = firstObj;
  else start = Math.min(firstObj, firstArr);
  if(start > 0) t = t.slice(start);
  const lastObj = t.lastIndexOf('}'), lastArr = t.lastIndexOf(']');
  const end = Math.max(lastObj, lastArr);
  if(end > -1) t = t.slice(0, end+1);
  // first attempt: as-is
  try{ return JSON.parse(t); }catch(e){}
  // repairs: smart quotes -> straight, remove trailing commas
  let r = t.replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019]/g,"'")
           .replace(/,\s*([}\]])/g,'$1');
  try{ return JSON.parse(r); }catch(e){}
  // last resort: if the tail was truncated mid-array, close open brackets
  let depthC=0, depthS=0, inStr=false, esc2=false;
  for(const ch of r){
    if(esc2){ esc2=false; continue; }
    if(ch==='\\'){ esc2=true; continue; }
    if(ch==='"') inStr=!inStr;
    if(inStr) continue;
    if(ch==='{') depthC++; else if(ch==='}') depthC--;
    else if(ch==='[') depthS++; else if(ch===']') depthS--;
  }
  if(inStr) r += '"';
  r = r.replace(/,\s*$/,'');
  while(depthS-->0) r += ']';
  while(depthC-->0) r += '}';
  return JSON.parse(r); // if this still throws, caller handles it
}
function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(k){
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function epley(w,r){ return r<=1 ? w : w*(1+r/30); }
function currentDayKey(){
  const t = todayKey();
  if(S.overrideDay && S.overrideDay.date===t) return S.overrideDay.day;
  return S.schedule[new Date().getDay()] || 'REST';
}
function dayColor(d){ return (S.split[d] && S.split[d].hex) || '#8d909a'; }
function setAccent(){
  const d = currentDayKey();
  document.documentElement.style.setProperty('--accent', d==='REST' ? '#8d909a' : dayColor(d));
}
function incFor(name){
  const n = name.toLowerCase();
  if(/squat|leg press|hip thrust/.test(n)) return 10;
  if(/bench|row|pulldown|overhead press|dip/.test(n)) return 5;
  return 5; // machines/isolation — most stacks move in 5s
}
/* Look up a stored per-exercise increment by name; fall back to smart default. */
function incForExercise(name){
  for(const dk in S.split){
    const list = S.split[dk].exercises || [];
    for(const x of list){
      if(typeof x === 'object' && x.name === name && x.inc != null) return x.inc;
    }
  }
  return incFor(name);
}
const FORM_LO = 12, FORM_HI = 20, FORM_STREAK_NEEDED = 3;
function isFormFocus(name){
  for(const dk in S.split){
    const list = S.split[dk].exercises || [];
    for(const x of list){
      if(typeof x === 'object' && x.name === name && x.formFocus) return true;
    }
  }
  return false;
}
function sessionAllEasy(session){
  return session.sets.length>0 && session.sets.every(s=>s.e==='easy');
}
function consecutiveEasyStreak(hist){
  let c=0;
  for(const h of hist){ if(sessionAllEasy(h)) c++; else break; }
  return c;
}
function isBodyweight(name){ return /hanging leg raise/i.test(name); }

/* last sessions containing an exercise, newest first */
function historyFor(ex){
  const out = [];
  const sorted = [...S.logs].sort((a,b)=> b.date.localeCompare(a.date));
  for(const lg of sorted){
    const e = lg.entries.find(en => en.exercise===ex);
    if(e && e.sets.length) out.push({date:lg.date, sets:e.sets});
  }
  return out;
}

/* ================= RECOMMENDATION ENGINE ================= */
function recommend(ex, ready){
  const hist = historyFor(ex);
  const ff = isFormFocus(ex);
  const {lo: _lo, hi: _hi} = exRepMode(ex);
  const lo = ff ? FORM_LO : _lo;
  const hi = ff ? FORM_HI : _hi;
  if(!hist.length){
    const ffNote = ff ? ' This is in Form Focus mode \u2014 target '+lo+'\u2013'+hi+' clean, controlled reps. Weight only moves once 3 sessions in a row come back tagged Easy across every set, so tag honestly.' : '';
    return {target:'Find your weight', detail:'First logged session \u2014 pick a weight you can move for '+lo+'\u2013'+(lo+2)+' clean reps, leaving 1\u20132 in the tank.'+ffNote, sets:[{w:'',r:''},{w:'',r:''},{w:'',r:''}]};
  }
  const last = hist[0];
  const topW = Math.max(...last.sets.map(s=>+s.w||0));
  const topSets = last.sets.filter(s=>(+s.w||0)===topW);
  const minReps = Math.min(...topSets.map(s=>+s.r||0));
  const maxReps = Math.max(...topSets.map(s=>+s.r||0));
  // STR mode: weight moves when the top set hits the ceiling (one great set earns the jump).
  // HYP mode: weight moves when ALL top sets hit the ceiling (stricter — appropriate for accessory hypertrophy work).
  const str = !ff && isStrMode(ex);
  const ceilReps = str ? maxReps : minReps;
  let inc = incForExercise(ex);
  // effort tags from last session's top sets
  const effs = topSets.map(s=>s.e).filter(Boolean);
  const hadFail   = effs.includes('fail');
  const hadGrind  = effs.includes('grind') || hadFail;
  const allEasy   = effs.length===topSets.length && effs.length>0 && effs.every(e=>e==='easy');
  const pushNote  = ready==='high' ? ' Readiness is green \u2014 good day to push.' : '';

  if(isBodyweight(ex)){
    return {target:(minReps>=hi? 'Add reps or slow tempo':'Beat '+minReps+' reps'), detail:'Last: '+summ(last.sets)+'. Bodyweight movement \u2014 progress by reps and control.', sets:last.sets.map(s=>({w:s.w,r:''}))};
  }

  /* ---- FORM FOCUS branch: weight only moves on a 3-session easy streak ---- */
  if(ff){
    const streak = consecutiveEasyStreak(hist);
    if(hadFail){
      const dw = Math.max(topW - inc, inc);
      return {target:dw+' lb \u00d7 '+lo+'+', detail:'Form Focus, but a set broke down ('+summ(last.sets)+'). Step back to '+dw+' lb and rebuild clean reps \u2014 control over load here.', sets:[{w:dw,r:''},{w:dw,r:''},{w:dw,r:''}]};
    }
    if(streak >= FORM_STREAK_NEEDED){
      const nw = topW + inc;
      return {target:nw+' lb \u00d7 '+lo+'+', detail:'Form Focus: '+streak+' sessions in a row tagged easy across the board ('+summ(last.sets)+'). Your control has outpaced the weight \u2014 bump to '+nw+' lb, reps reset to '+lo+'.', sets:[{w:nw,r:''},{w:nw,r:''},{w:nw,r:''}]};
    }
    if(minReps < lo){
      return {target:topW+' lb \u00d7 build to '+lo, detail:'Form Focus: last session dipped below '+lo+' ('+summ(last.sets)+'). Hold '+topW+' lb \u2014 the goal here is control, not load.', sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
    }
    const streakTxt = streak>0 ? streak+'/'+FORM_STREAK_NEEDED+' easy sessions logged toward the next bump.' : 'Tag sets honestly \u2014 once '+FORM_STREAK_NEEDED+' sessions in a row come back fully easy, the weight moves.';
    return {target:topW+' lb \u00d7 '+lo+'\u2013'+hi, detail:'Form Focus: last '+summ(last.sets)+'. Hold '+topW+' lb, chase clean reps in the '+lo+'\u2013'+hi+' range with strict form. '+streakTxt+pushNote, sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
  }

  // stall detection: 3+ sessions same weight, no improvement in the rep metric used for ceiling check
  let stall = false;
  if(hist.length>=3){
    const w2=Math.max(...hist[1].sets.map(s=>+s.w||0)), w3=Math.max(...hist[2].sets.map(s=>+s.w||0));
    if(w2===topW && w3===topW){
      const ts2=hist[1].sets.filter(s=>+s.w===w2), ts3=hist[2].sets.filter(s=>+s.w===w3);
      const ceil2 = str ? Math.max(...ts2.map(s=>+s.r||0)) : Math.min(...ts2.map(s=>+s.r||0));
      if(ceilReps<=ceil2) stall = true;
    }
  }
  if(ceilReps>=hi){
    if(allEasy) inc = inc*2;
    const nw = topW+inc;
    if(ready==='low'){
      return {target:topW+' lb \u00d7 '+hi+' (bump deferred)', detail:'You earned the jump to '+nw+' lb ('+summ(last.sets)+'), but readiness is low today. Repeat '+topW+' lb, keep it crisp, and take the jump next session at full strength.', sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
    }
    const hitTxt = str ? 'Your top set hit '+hi+' reps ('+summ(last.sets)+').' : 'You hit '+hi+'+ on every top set ('+summ(last.sets)+').';
    return {target:nw+' lb \u00d7 '+lo+'+', detail:hitTxt+(allEasy?' All tagged easy \u2014 taking a double jump of '+inc+' lb.':' Load goes up '+inc+' lb \u2014 reps reset to the bottom of the range.')+(hadGrind?' Last bump was a grind, so expect this to feel heavy \u2014 that\u2019s normal.':'')+pushNote, sets:[{w:nw,r:''},{w:nw,r:''},{w:nw,r:''}]};
  }
  if(stall){
    return {target:topW+' lb \u2014 break the stall', detail:'Three sessions at '+topW+' lb without rep progress ('+summ(last.sets)+'). Options: tighten rest to 2\u20133 min and push the first set hard, or drop ~10% for one session and rebuild.', sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
  }
  if(minReps>=lo){
    let d = 'Last: '+summ(last.sets)+'. Same load \u2014 '+(str?'push your top set to '+hi+' reps before the weight moves.':'add at least 1 rep to your weakest set before the weight moves.');
    if(allEasy) d = 'Last: '+summ(last.sets)+', all tagged easy. You\u2019re leaving too much in the tank \u2014 take every set to 1\u20132 reps shy of failure today.';
    else if(hadFail) d = 'Last: '+summ(last.sets)+' with a failed set. Hold '+topW+' lb, stop each set 1 rep before breakdown, and win back the reps.';
    if(ready==='low') d += ' Low readiness: matching last session counts as a win today.';
    return {target:topW+' lb \u00d7 beat '+maxReps, detail:d+pushNote, sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
  }
  if(hadFail){
    const dw = Math.max(topW - inc, inc);
    return {target:dw+' lb \u00d7 '+lo+'+', detail:'Below range with failure tags ('+summ(last.sets)+'). Step back '+inc+' lb, own the rep range, then climb \u2014 backing up to speed up.', sets:[{w:dw,r:''},{w:dw,r:''},{w:dw,r:''}]};
  }
  return {target:topW+' lb \u00d7 build to '+lo, detail:'Last session dipped below range ('+summ(last.sets)+'). Hold '+topW+' lb and climb back to '+lo+' reps per set before adding load.'+(ready==='low'?' Low readiness \u2014 no heroics today.':''), sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
}
function summ(sets){ return sets.map(s=>s.w+'×'+s.r+(s.e?(EFF_MARK[s.e]||''):'')).join(', '); }


/* ================= PLATE CALCULATOR ================= */
function plateCalc(total){
  const BAR = 45;
  let per = (total - BAR) / 2;
  if(per < 0) return null;
  if(per === 0) return {plates:[], txt:'empty bar (45)'};
  const out = [];
  [45,35,25,10,5,2.5].forEach(pl=>{ while(per >= pl-0.001){ out.push(pl); per -= pl; } });
  return {plates:out, txt:out.join(' + ') + (per>0.01 ? ' (+'+per.toFixed(1)+' short)' : '')};
}
function isPlateLift(ex){ return /^barbell/i.test(ex); }

  'Hip Thrust Machine':{p:['Glutes'],s:['Hamstrings']},
  'Hanging Leg Raise':{p:['Abs'],s:[]},
  'Abdominal Machine':{p:['Abs'],s:[]}
};
function musclesFor(ex){
  if(EX_MUSCLES[ex]) return EX_MUSCLES[ex];
  const n = ex.toLowerCase(); // fallback keyword inference for custom exercises
  if(/squat|leg press|lunge|hack/.test(n)) return {p:['Quads','Glutes'],s:['Hamstrings']};
  if(/leg curl|rdl|romanian|hamstring/.test(n)) return {p:['Hamstrings'],s:[]};
  if(/extension/.test(n) && /leg/.test(n)) return {p:['Quads'],s:[]};
  if(/hip thrust|glute/.test(n)) return {p:['Glutes'],s:[]};
  if(/curl/.test(n)) return {p:['Biceps'],s:[]};
  if(/pushdown|tricep|jm|skull|dip/.test(n)) return {p:['Triceps'],s:[]};
  if(/lateral|delt|shoulder|overhead press|ohp/.test(n)) return {p:['Shoulders'],s:[]};
  if(/row|pulldown|pull-up|pullup|lat/.test(n)) return {p:['Back'],s:['Biceps']};
  if(/bench|chest|fly|pec|press/.test(n)) return {p:['Chest'],s:['Triceps']};
  if(/ab|crunch|leg raise|core/.test(n)) return {p:['Abs'],s:[]};
  return {p:[],s:[]};
}
const MUSCLE_GROUPS = ['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Abs'];
function dateKeyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekStartKey(){
  // Training week starts the day AFTER the most recent scheduled rest day.
  const restDays = Object.keys(S.schedule).filter(k=>S.schedule[k]==='REST').map(Number);
  if(restDays.length){
    for(let i=1;i<=7;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      if(restDays.includes(d.getDay())){
        const s = new Date(d); s.setDate(s.getDate()+1);
        return dateKeyOf(s);
      }
    }
  }
  // no rest day in schedule — fall back to rolling 7 days
  const c = new Date(); c.setDate(c.getDate()-6);
  return dateKeyOf(c);
}
function heatmapHTML(){
  const cutKey = weekStartKey();
  const vol = {}; MUSCLE_GROUPS.forEach(g=>vol[g]=0);
  S.logs.filter(l=>l.date>=cutKey).forEach(l=>l.entries.forEach(e=>{
    const m = musclesFor(e.exercise);
    const n = e.sets.length;
    m.p.forEach(g=>{ if(vol[g]!=null) vol[g]+=n; });
    m.s.forEach(g=>{ if(vol[g]!=null) vol[g]+=n*0.5; });
  }));
  let html = '<h2>Weekly Volume Heatmap <span style="font-weight:400;letter-spacing:0;text-transform:none">(this training week \u00b7 since '+fmtDate(cutKey)+' \u00b7 resets after rest day \u00b7 secondary muscles count half)</span></h2><div class="hm">';
  MUSCLE_GROUPS.forEach(g=>{
    const v = Math.round(vol[g]*10)/10;
    let col, tag;
    if(v===0){ col='#3a3d45'; tag='untouched'; }
    else if(v<6){ col='#dfae36'; tag='low'; }
    else if(v<=20){ col='#3da25f'; tag='solid'; }
    else { col='#d23b3b'; tag='very high'; }
    const pct = Math.min(100, v/20*100);
    html += '<div class="hm-cell"><div class="g">'+g+'</div><div class="n">'+v+'</div>'+
      '<div class="t" style="color:'+col+'">'+tag+'</div>'+
      '<div class="hm-bar"><i style="width:'+pct+'%;background:'+col+'"></i></div></div>';
  });
  html += '</div><p class="small" style="margin-top:8px">Rough hypertrophy guide: 10\u201320 hard sets per muscle per week. Yellow = room to add, red = watch recovery.</p>';
  return html;
}

/* ================= PR CELEBRATION ================= */
function bestE1RM(ex){ const pts = e1rmSeries(ex); return pts.length ? Math.max(...pts.map(p=>p.v)) : 0; }
/* The literal heaviest weight ever lifted for an exercise (any rep count), tie-broken
   by higher reps at that same weight. This is the "realistic" PR — no formula, no
   extrapolation, just the actual heaviest plate you've put up. */
/* The PR equivalent of e1rmSeries: at each logged session, the heaviest weight
   ever lifted for that exercise UP TO that point (a monotonic step series). This
   is what the Road now tracks \u2014 chunkier than e1RM since it only moves when a
   real heavier weight is touched, but never inflated by a formula. */
function prSeries(ex){
  const sorted = [...S.logs].filter(l=>l.entries.some(e=>e.exercise===ex)).sort((a,b)=>a.date.localeCompare(b.date));
  const out = [];
  let runningMax = 0;
  sorted.forEach(l=>{
    const e = l.entries.find(en=>en.exercise===ex);
    if(!e) return;
    e.sets.forEach(s=>{ const w = +s.w||0; if(w>runningMax) runningMax = w; });
    out.push({date:l.date, v:runningMax});
  });
  return out;
}
function actualPR(ex){
  let best = null;
  [...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    l.entries.forEach(e=>{
      if(e.exercise !== ex) return;
      e.sets.forEach(s=>{
        const w = +s.w||0, r = +s.r||0;
        if(w<=0) return;
        if(!best || w>best.w || (w===best.w && r>=best.r)) best = {w, r, date:l.date};
      });
    });
  });
  return best;
}
function prWatchList(){ return [...new Set([...Object.keys(PR_LIFTS), ...S.road.map(g=>g.exercise)])]; }
function snapshotPRs(){ const m={}; prWatchList().forEach(ex=>m[ex]=bestE1RM(ex)); return m; }
function checkPRs(before){
  let top = null;
  prWatchList().forEach(ex=>{
    const now = bestE1RM(ex);
    if(before[ex] > 0 && now > before[ex] + 0.01){
      if(!top || (now-before[ex]) > top.gain) top = {ex, now, prev:before[ex], gain:now-before[ex]};
    }
  });
  if(top) celebrate(top);
}
function celebrate(pr){
  const o = document.createElement('div');
  o.className = 'pr-overlay';
  o.innerHTML = '<div class="pr-card"><div class="pr-plate"></div>'+
    '<div class="pr-eyebrow">New PR</div>'+
    '<div class="pr-big">'+Math.round(pr.now)+' <span style="font-size:22px;color:var(--muted)">e1RM</span></div>'+
    '<div class="pr-sub">'+esc(pr.ex)+' \u00b7 was '+Math.round(pr.prev)+' (+'+pr.gain.toFixed(1)+' lb)</div>'+
    '<div class="pr-tap">tap to continue</div></div>';
  o.addEventListener('click', ()=>o.remove());
  document.body.appendChild(o);
  setTimeout(()=>{ if(o.parentNode) o.remove(); }, 7000);
}


/* ================= RPE / EFFORT ================= */
const EFF_ORDER = ['', 'easy', 'solid', 'grind', 'fail'];
const EFF_LABEL = {'':'\u2013', easy:'E', solid:'S', grind:'G', fail:'F'};
const EFF_MARK  = {easy:'\u1d49', solid:'', grind:'\u1d4d', fail:'\u02e3'};
function cycleEff(btn){
  const cur = btn.dataset.e || '';
  const next = EFF_ORDER[(EFF_ORDER.indexOf(cur)+1) % EFF_ORDER.length];
  btn.dataset.e = next;
  btn.textContent = EFF_LABEL[next];
  btn.title = 'Effort: ' + (next || 'untagged') + ' (tap to cycle: easy \u2192 solid \u2192 grind \u2192 fail)';
}
function effBtnHTML(e){
  e = e || '';
  return '<button class="eff" data-e="'+e+'" title="Effort: tap to cycle (easy/solid/grind/fail)" onclick="cycleEff(this)">'+EFF_LABEL[e]+'</button>';
}

/* ================= READINESS ================= */
const RD_SLEEP = {'<6':0,'6-7':1,'7-8':2,'8+':3};
const RD_SORE  = {'fresh':2,'mild':1,'beat up':0};
const RD_ENERGY= {'low':0,'ok':1,'high':2};
function readinessTier(r){
  const sc = (RD_SLEEP[r.sleep]||0)+(RD_SORE[r.sore]||0)+(RD_ENERGY[r.energy]||0);
  return sc<=2 ? 'low' : sc<=5 ? 'ok' : 'high';
}
function todayReadiness(){ return S.readiness.find(r=>r.date===todayKey()) || null; }
window._rd = {};
function pickRd(btn, key, val){
  window._rd[key]=val;
  btn.parentElement.querySelectorAll('.rpill').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}
function saveReadiness(){
  const r = window._rd;
  if(!r.sleep || !r.sore || !r.energy){ $('#rdMsg').textContent='Tap one option in each row.'; return; }
  const entry = {date:todayKey(), sleep:r.sleep, sore:r.sore, energy:r.energy};
  entry.tier = readinessTier(entry);
  S.readiness = S.readiness.filter(x=>x.date!==todayKey());
  S.readiness.push(entry);
  save(); window._rd = {}; renderToday();
}
function redoReadiness(){
  S.readiness = S.readiness.filter(x=>x.date!==todayKey());
  save(); renderToday();
}
function readinessCardHTML(){
  const rd = todayReadiness();
  if(rd){

    const msg = rd.tier==='high' ? 'Green light \u2014 good day to push top sets.'
              : rd.tier==='ok'   ? 'Normal day \u2014 work the plan.'
              : 'Rough recovery \u2014 targets are softened today. Move well, don\u2019t chase numbers.';
    return '<div class="card" style="border-left:4px solid '+col+'"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'+
      '<b style="color:'+col+';text-transform:uppercase;letter-spacing:.1em;font-size:12px">Readiness: '+rd.tier+'</b>'+
      '<span class="small mono">'+esc(rd.sleep)+'h sleep \u00b7 '+esc(rd.sore)+' \u00b7 '+esc(rd.energy)+' energy</span>'+
      '<button class="del" style="margin-left:auto" onclick="redoReadiness()">redo</button></div>'+
      '<p class="small" style="margin-top:4px">'+msg+'</p></div>';

    '<p class="small" style="margin:4px 0 10px">15 seconds \u2014 it tunes today\u2019s targets to how recovered you actually are.</p>'+
    grp('Sleep','sleep',['<6','6-7','7-8','8+'])+
    grp('Soreness','sore',['fresh','mild','beat up'])+
    grp('Energy','energy',['low','ok','high'])+

/* ================= PROGRESS TAB ================= */
const PR_LIFTS = {
  'Barbell Bench Press': {milestones:[95,115,135,155,185,205,225,245], capPerWeek:1.75},
  'Barbell Back Squat':  {milestones:[135,185,225,275,315,365], capPerWeek:2.5}
};
function e1rmSeries(ex){
  const pts = [];
  [...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    const e = l.entries.find(en=>en.exercise===ex);
    if(!e) return;
    let best = 0;
    e.sets.forEach(s=>{ const v = epley(+s.w||0, +s.r||0); if(v>best) best=v; });
    if(best>0) pts.push({date:l.date, v:Math.round(best*10)/10});
  });
  return pts;
}
function linreg(pts){
  // x in days since first point
  if(pts.length<2) return null;
  const x0 = new Date(pts[0].date).getTime();
  const xs = pts.map(p=>(new Date(p.date).getTime()-x0)/86400000);
  const ys = pts.map(p=>p.v);
  const n = xs.length;
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)**2; }
  if(den===0) return null;
  return {slope:num/den, intercept:my-(num/den)*mx, x0};
}
/* ================= PROGRESS STATUS (rule-based composite) ================= */
const PSTATUS_TIERS = [
  {key:'none',   label:'Not Making Progress', col:'#d23b3b'},
  {key:'slow',   label:'Slow Progress',       col:'#dfae36'},
  {key:'prog',   label:'Progress',            col:'#3da25f'},
  {key:'accel',  label:'Accelerated Progress',col:'#2f6fd0'}
];
function strengthScore(){
  const scores = []; const notes = [];
  for(const lift in PR_LIFTS){
    const cfg = PR_LIFTS[lift];
    const pts = e1rmSeries(lift);
    if(pts.length < 2) continue;
    const reg = linreg(pts.slice(-12));
    if(!reg){ continue; }
    let slopeWk = reg.slope*7;
    const ratio = slopeWk / cfg.capPerWeek; // negative/zero if flat or declining
    let pts3;
    if(ratio <= 0)      { pts3 = 0; notes.push(lift.split(' ').slice(-1)[0]+' flat/declining'); }
    else if(ratio < 0.3){ pts3 = 1; notes.push(lift.split(' ').slice(-1)[0]+' creeping up slowly'); }
    else if(ratio < 0.9){ pts3 = 2; notes.push(lift.split(' ').slice(-1)[0]+' climbing steadily'); }
    else                { pts3 = 3; notes.push(lift.split(' ').slice(-1)[0]+' climbing fast'); }
    scores.push(pts3);
  }
  if(!scores.length) return {available:false};
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  return {available:true, score:avg/3, notes}; // normalize 0-1
}
function consistencyScore(){
  const scheduled = Object.values(S.schedule).filter(v=>v!=='REST').length; // out of 7 weekday slots
  if(scheduled===0) return {available:false};
  const expectedPerWeek = scheduled; // distinct weekdays trained, scaled to a week
  const cut = new Date(Date.now()-6*86400000);
  const cutKey = dateKeyOf(cut);
  const distinctDays = new Set(S.logs.filter(l=>l.date>=cutKey).map(l=>l.date)).size;
  const ratio = Math.min(1, distinctDays/expectedPerWeek);
  let note;
  if(ratio>=0.9) note='right on schedule';
  else if(ratio>=0.6) note='mostly on schedule';
  else if(ratio>=0.3) note='missing sessions';
  else note='largely inactive this week';
  return {available:true, score:ratio, note, distinctDays, expectedPerWeek};
}
function bulkScore(){
  const w = [...S.weights].sort((a,b)=>a.date.localeCompare(b.date));
  if(w.length<2) return {available:false};
  const cutD = new Date(Date.now()-28*86400000);
  const cutKey = dateKeyOf(cutD);
  const recent = w.filter(p=>p.date>=cutKey);
  const set = recent.length>=2 ? recent : w;
  const span = daysBetween(set[0].date, set[set.length-1].date);
  if(span<=0) return {available:false};
  const rate = (set[set.length-1].lbs - set[0].lbs)/(span/7);
  let score, note;
  if(rate <= 0){ score=0; note='scale is flat or dropping'; }
  else if(rate < 0.25){ score=0.4; note='gaining, but slower than target'; }
  else if(rate <= 1.0){ score=1; note='right in the lean-bulk range'; }
  else if(rate <= 1.6){ score=0.7; note='gaining faster than ideal'; }
  else { score=0.4; note='gaining quite fast \u2014 likely some fat with it'; }
  return {available:true, score, note, rate};
}
function computeProgressStatus(){
  if(S.logs.length===0 && S.weights.length===0) return {tier:null, st:{available:false}, co:{available:false}, bu:{available:false}};
  const st = strengthScore(), co = consistencyScore(), bu = bulkScore();
  const parts = [];
  if(st.available) parts.push({w:0.5, s:st.score});
  if(co.available) parts.push({w:0.3, s:co.score});
  if(bu.available) parts.push({w:0.2, s:bu.score});
  if(!parts.length) return {tier:null, st, co, bu};
  const totalW = parts.reduce((a,p)=>a+p.w,0);
  const blended = parts.reduce((a,p)=>a+p.w*p.s,0)/totalW;
  let tier;
  if(blended < 0.2) tier='none';
  else if(blended < 0.45) tier='slow';
  else if(blended < 0.75) tier='prog';
  else tier='accel';
  return {tier, blended, st, co, bu};
}
function progressStatusCardHTML(){
  const r = computeProgressStatus();
  if(!r.tier){
    return '<div class="card"><p class="small">Not enough data yet for a progress verdict \u2014 log a few sessions (ideally with bench or squat) and this will populate.</p></div>';

  h += '<div class="stat"><div class="v" style="color:'+(r.co.available?(r.co.score>=0.75?'var(--good)':r.co.score>=0.3?'var(--warn)':'var(--bad)'):'var(--dim)')+'">'+(r.co.available?r.co.distinctDays+'/'+r.co.expectedPerWeek:'\u2014')+'</div>'+
    '<div class="l">sessions this week</div>'+(r.co.available?'<div class="s">'+esc(r.co.note)+'</div>':'<div class="s">no schedule set</div>')+'</div>';
  h += '<div class="stat"><div class="v" style="color:'+(r.bu.available?(r.bu.score>=0.75?'var(--good)':r.bu.score>=0.3?'var(--warn)':'var(--bad)'):'var(--dim)')+'">'+(r.bu.available?(r.bu.rate>=0?'+':'')+r.bu.rate.toFixed(2)+' lb/wk':'\u2014')+'</div>'+
    '<div class="l">bulk rate</div>'+(r.bu.available?'<div class="s">'+esc(r.bu.note)+'</div>':'<div class="s">log weight a few times</div>')+'</div>';
  h += '</div><p class="small" style="margin-top:10px">Blended from strength trend (50%), training consistency (30%), and bulk rate (20%) \u2014 whichever you have data for. Recalculates every time you open this tab.</p></div>';
  return h;

/* ================= NEXT LEVEL CARD ================= */
const TIER_ORDER = ['none','slow','prog','accel'];
const TIER_LABELS = {none:'Not Making Progress', slow:'Slow Progress', prog:'Progress', accel:'Accelerated Progress'};
const TIER_COLS   = {none:'var(--bad)', slow:'var(--warn)', prog:'var(--good)', accel:'#7b6ef6'};
function nextLevelCardHTML(){
  const r = computeProgressStatus();
  if(!r.tier) return '';
  if(r.tier==='accel'){
    return '<div class="card" style="border-left:4px solid #7b6ef6">'+
      '<b style="font-size:13px;letter-spacing:.05em;color:#7b6ef6">\u26a1 ACCELERATED \u2014 You\u2019re doing everything right</b>'+
      '<p class="small" style="margin-top:6px">Strength is climbing, you\u2019re hitting sessions, and the scale is moving at the right rate. The job now is consistency \u2014 don\u2019t change what\u2019s working, just keep showing up and eating.</p></div>';
  }
  const nextTier = TIER_ORDER[TIER_ORDER.indexOf(r.tier)+1];
  const nextLabel = TIER_LABELS[nextTier];
  const nextCol = TIER_COLS[nextTier];
  // identify the weakest available component
  const components = [];
  if(r.st.available) components.push({key:'strength', score:r.st.score, w:0.5});
  if(r.co.available) components.push({key:'consistency', score:r.co.score, w:0.3});
  if(r.bu.available) components.push({key:'bulk', score:r.bu.score, w:0.2});
  components.sort((a,b)=>a.score-b.score); // weakest first
  const weakest = components[0];
  // build tier+component specific advice
  const actions = [];
  if(weakest){
    if(weakest.key==='strength'){
      const flatLifts = (r.st.notes||[]).filter(n=>n.includes('flat')||n.includes('declining')).map(n=>n.split(' ')[0]);
      const slowLifts = (r.st.notes||[]).filter(n=>n.includes('slowly')).map(n=>n.split(' ')[0]);
      if(r.tier==='none'){
        actions.push('Your '+( flatLifts.length ? flatLifts.join(' and ')+' e1RM trend is flat or going backwards' : 'strength trend is not moving')+'. This almost always means one of three things: not pushing close enough to failure, skipping sessions, or not eating enough to recover.');
        actions.push('On bench and squat specifically \u2014 your top set should feel genuinely hard (RPE 8\u20139). If you\u2019re finishing sets and thinking \u201cthat was easy,\u201d you\u2019re leaving real progress on the table.');
        actions.push('Tag your effort honestly. The engine can\u2019t tell you\u2019re sandbagging unless you log it.');
      } else if(r.tier==='slow'){
        actions.push('Strength is moving but slowly'+(slowLifts.length?' \u2014 '+slowLifts.join(' and ')+' in particular':'')+'. The gap to the next tier is closing faster on the main lifts. Push your bench and squat top sets to near-failure \u2014 not past it, but close.');
        actions.push('Check your last 3 sessions: did the weight actually go up, or are you repeatedly hitting the same numbers? If same weight, you need to push harder on rep count before the system can increment.');
        actions.push('If the weight genuinely isn\u2019t moving despite effort, the bottleneck is usually food \u2014 strength stalls before size does when calories dip.');
      } else {
        actions.push('Strength trend is solid but not maximal. To push into Accelerated, your bench and squat need to be climbing near the cap rates (bench ~1.75 lb/wk, squat ~2.5 lb/wk).');
        actions.push('Consider testing heavier on your main lifts \u2014 if you\u2019ve been conservative, there may be more there than the trend suggests. A true max effort session every few weeks tells the system where you actually are.');
      }
    } else if(weakest.key==='consistency'){
      const {distinctDays:dd, expectedPerWeek:ep} = r.co;
      if(r.tier==='none'){
        actions.push('You\u2019re hitting '+(dd||0)+' of '+(ep||6)+' scheduled sessions this week. At your training age, showing up is the single most important variable \u2014 every missed session is a missed adaptation stimulus.');
        actions.push('D1 (bench) and D3 (squat) are the two you can\u2019t afford to miss. Everything else can slide before those two.');
        actions.push('If scheduling is the issue, consider which days are genuinely hard to hit and adjust the schedule in Settings rather than leaving them as ghost sessions.');
      } else if(r.tier==='slow'){
        actions.push('You\u2019re at '+(dd||0)+'/'+(ep||6)+' sessions \u2014 close but not full consistency. One or two more sessions per week over the next month will meaningfully compound.');
        actions.push('The sessions you\u2019re missing are likely the ones that feel least urgent (accessories, D5/D6). Those sessions are real volume for real muscle \u2014 they matter more than they feel like they do.');
      } else {
        actions.push('You\u2019re almost fully consistent at '+(dd||0)+'/'+(ep||6)+'. The final push to Accelerated might just be locking in that last session per week and making sure intensity is high across all of them, not just the main lift days.');
      }
    } else if(weakest.key==='bulk'){
      const rate = r.bu ? r.bu.rate : 0;
      if(rate<=0){
        actions.push('The scale is flat or going down. You cannot build meaningful muscle in a deficit at your training age \u2014 this is the biggest drag on your progress right now.');
        actions.push('Open Cal AI and check your last 7 days honestly. Are you actually hitting 3000+ calories most days? One or two big days don\u2019t offset four low ones.');
        actions.push('Protein matters, but total calories matter more for the bulk rate score. If you\u2019re hitting protein but not total cals, add calorie-dense foods (olive oil, nut butters, whole milk, rice) rather than more protein.');
      } else if(rate < 0.25){
        actions.push('You\u2019re gaining at '+rate.toFixed(2)+' lb/wk \u2014 below the 0.25 lb/wk floor for meaningful bulk progress. You need to be consistently above 0.5 lb/wk.');
        actions.push('Add 200\u2013300 calories to your daily target. At your size and training volume, your maintenance is probably around 2600\u20132800 \u2014 so 3000 cal might only be a ~200 cal surplus, which disappears fast on a heavy training day.');
      } else if(rate > 1.6){
        actions.push('You\u2019re gaining at '+rate.toFixed(2)+' lb/wk \u2014 faster than ideal. Some of that is fat, which is fine in a bulk, but above ~1 lb/wk the fat gain starts to outpace the muscle gain.');
        actions.push('Pull back ~150\u2013200 cal/day. You don\u2019t need to cut, just slow the rate to 0.5\u20131.0 lb/wk to maximize the muscle-to-fat ratio of the gain.');
      }
    }
  }
  // second component advice if scores diverge significantly
  if(components.length>1 && components[1] && components[1].score < 0.5 && components[1].key!==weakest.key){
    const sec = components[1];
    if(sec.key==='bulk' && r.bu.available && r.bu.rate <= 0.25){

    } else if(sec.key==='consistency' && r.co.available){
      actions.push('Secondary gap: consistency at '+(r.co.distinctDays||0)+'/'+(r.co.expectedPerWeek||6)+' sessions. Even one more session per week compounds meaningfully over a month.');
    } else if(sec.key==='strength' && r.st.available){
      actions.push('Secondary gap: strength trend also needs attention \u2014 push harder on bench and squat top sets.');
    }
  }
  if(!actions.length) actions.push('Keep doing what you\u2019re doing and push every session a little harder than feels comfortable.');
  return '<div class="card" style="border-left:4px solid '+nextCol+'">'+
    '<b style="font-size:13px;letter-spacing:.05em;color:'+nextCol+'">HOW TO REACH: '+esc(nextLabel.toUpperCase())+'</b>'+
    '<p class="small" style="margin:6px 0 4px">Weakest link: <b>'+esc(weakest ? weakest.key.charAt(0).toUpperCase()+weakest.key.slice(1) : 'unknown')+'</b>'+(components.length>1?' (strength '+(r.st.available?Math.round(r.st.score*100)+'%':'—')+' \u00b7 consistency '+(r.co.available?Math.round(r.co.score*100)+'%':'—')+' \u00b7 bulk rate '+(r.bu.available?Math.round(r.bu.score*100)+'%':'—')+')':'')+'</p>'+
    actions.map((a,i)=>'<div class="small" style="padding:4px 0;'+(i>0?'border-top:1px solid var(--line)':'')+'"><span style="color:'+nextCol+';font-weight:700">'+(i===0?'\u25b8 Main fix':'\u25b9 Also'+(i===actions.length-1&&actions.length>2?' (secondary)':''))+'</span> '+esc(a)+'</div>').join('')+
    '</div>';
}
function projectMetric(pts, capPerWeek, horizonWeeks){
  if(pts.length < 3) return null;
  const recent = pts.slice(-12);
  const reg = linreg(recent);
  if(!reg) return null;
  let slopeWk = reg.slope*7;
  if(capPerWeek!=null && slopeWk > capPerWeek) slopeWk = capPerWeek;
  const lastV = pts[pts.length-1].v;
  const proj = lastV + slopeWk*horizonWeeks;
  const x0 = new Date(recent[0].date).getTime();
  const resid = recent.map(p=>{
    const x = (new Date(p.date).getTime()-x0)/86400000;
    return p.v - (reg.intercept + reg.slope*x);
  });
  const sd = Math.sqrt(resid.reduce((a,r)=>a+r*r,0)/Math.max(1,resid.length-1)) || 0;
  const band = (sd*1.5) + Math.abs(slopeWk)*horizonWeeks*0.35;
  return {value:Math.round(proj), lo:Math.round(proj-band), hi:Math.round(proj+band), slopeWk};
}

function dayColorForLift(l){ return l.includes('Squat') ? '#dfae36' : '#d23b3b'; }
function milestoneBarGraphic(cur, milestones){
  const W=700, H=78;
  const trackX1=20, trackX2=W-20, trackY=38, trackH=14;
  const maxM = milestones[milestones.length-1];
  const scaleX = v => trackX1 + Math.max(0,Math.min(1, v/maxM)) * (trackX2-trackX1);
  const fillX2 = scaleX(Math.min(cur, maxM));
  const reached = milestones.filter(m=>m<=cur).length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Milestone progress bar" style="width:100%;height:auto">`;
  // background track
  svg += `<rect x="${trackX1}" y="${trackY}" width="${trackX2-trackX1}" height="${trackH}" rx="7" fill="#23262d" stroke="#2a2d35"/>`;
  // filled progress
  if(fillX2 > trackX1+2){
    svg += `<rect x="${trackX1}" y="${trackY}" width="${fillX2-trackX1}" height="${trackH}" rx="7" fill="var(--accent)" opacity="0.85"/>`;
  }
  // tick marks + numbers at each milestone
  milestones.forEach(m=>{
    const x = scaleX(m), hit = m<=cur;
    svg += `<line x1="${x}" x2="${x}" y1="${trackY-4}" y2="${trackY+trackH+4}" stroke="${hit?'#101114':'#5b5e68'}" stroke-width="2" opacity="${hit?0.55:1}"/>`;
    svg += `<text x="${x}" y="${trackY+trackH+18}" text-anchor="middle" font-size="10.5" font-weight="${hit?800:400}" fill="${hit?'#e9e7e2':'#5b5e68'}">${m}</text>`;
  });
  // current value marker (small arrow + label) above the bar
  const cx = scaleX(Math.min(cur,maxM));
  svg += `<polygon points="${cx-5},${trackY-6} ${cx+5},${trackY-6} ${cx},${trackY+1}" fill="#e9e7e2"/>`;
  svg += `<text x="${cx}" y="${trackY-10}" text-anchor="middle" font-size="11" font-weight="800" fill="#e9e7e2">${Math.round(cur)}</text>`;
  svg += `<text x="${trackX1}" y="14" font-size="10.5" fill="#8d909a">Milestones reached: <tspan font-weight="800" fill="#e9e7e2">${reached}/${milestones.length}</tspan></text>`;
  svg += '</svg>';
  return `<div class="bar-wrap">${svg}</div>`;
}
function lineChart(pts, color){
  const W=700, H=200, P=36;
  if(pts.length===1){
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><circle cx="'+(W/2)+'" cy="'+(H/2)+'" r="4" fill="'+color+'"/><text x="'+(W/2)+'" y="'+(H/2-12)+'" text-anchor="middle" font-size="12" fill="#8d909a">'+pts[0].v+' lb — one point so far</text></svg>';
  }
  const t0=new Date(pts[0].date).getTime(), t1=new Date(pts[pts.length-1].date).getTime()||t0+1;
  const vmin=Math.min(...pts.map(p=>p.v)), vmax=Math.max(...pts.map(p=>p.v));
  const pad=(vmax-vmin)*0.15||5;
  const x=t=>P+( (t-t0)/(t1-t0||1) )*(W-2*P);
  const y=v=>H-P-((v-(vmin-pad))/((vmax+pad)-(vmin-pad)))*(H-2*P);
  let path='';
  pts.forEach((p,i)=>{ path += (i?'L':'M')+x(new Date(p.date).getTime()).toFixed(1)+' '+y(p.v).toFixed(1)+' '; });
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  [vmin, (vmin+vmax)/2, vmax].forEach(v=>{
    svg+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#2a2d35" stroke-width="1"/>'+
         '<text x="'+(P-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="#5b5e68">'+Math.round(v)+'</text>';
  });
  svg+='<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(p=>{ svg+='<circle cx="'+x(new Date(p.date).getTime())+'" cy="'+y(p.v)+'" r="3.5" fill="'+color+'"/>'; });
  svg+='<text x="'+P+'" y="'+(H-8)+'" font-size="10" fill="#5b5e68">'+fmtDate(pts[0].date)+'</text>';
  svg+='<text x="'+(W-P)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="#5b5e68">'+fmtDate(pts[pts.length-1].date)+'</text>';
  svg+='</svg>';
  return svg;
}

function goalCard(g){

  // seeded above your current PR is impossible under the new basis, so reseed it.
  if(!g.start || g.start > cur){ g.start = seedStart; save(false); }
  const start = g.start || 0;
  const span = Math.max(g.target - start, 1);

  const done = cur >= g.target;
  // trend — now computed on the PR step series, so expect chunkier, less frequent movement

  const cap = PR_LIFTS[g.exercise] ? PR_LIFTS[g.exercise].capPerWeek : 2.0;

  const e1cur = e1pts.length ? e1pts[e1pts.length-1].v : 0;
  return '<div class="goal-card" style="border-left:4px solid '+(done?'#3da25f':'var(--accent)')+'">'+
    '<div class="goal-head"><span class="goal-name">Road to '+g.target+'</span>'+
    '<span class="goal-tgt">'+esc(g.exercise)+'</span>'+
    '<button class="del" style="margin-left:auto" onclick="delGoal('+g.id+')">remove</button></div>'+
    '<div class="stats" style="margin:10px 0">'+
      '<div class="stat" style="border-color:var(--accent)"><div class="v" style="font-size:17px">'+prTxt+'</div><div class="l">your pr \u00b7 drives the road</div></div>'+
      '<div class="stat"><div class="v" style="color:var(--dim);font-size:15px">'+(e1cur?Math.round(e1cur):'\u2014')+'</div><div class="l">est. 1rm (reference only)</div></div>'+
      '<div class="stat"><div class="v">'+g.target+'</div><div class="l">target</div></div>'+
      '<div class="stat"><div class="v '+(done?'up':'')+'">'+(done?'\u2713':Math.round(pct)+'%')+'</div><div class="l">of the road</div></div>'+
      '<div class="stat"><div class="v" style="font-size:13px;line-height:2.1">'+esc(projTxt)+'</div><div class="l">projection</div></div></div>'+
    '<p class="small" style="margin:0 0 8px">The road now runs entirely on your literal PR \u2014 it only moves when you actually lift a heavier weight. Estimated 1RM is shown above purely for reference and no longer drives anything.</p>'+
    roadSVG(start, cur, g.target, done) + paceTxt +
    liftTipsHTML(g.exercise) + '</div>';
}
function roadSVG(start, cur, target, done){
  const W=700, H=84, L=30, R=W-30;
  const x = v => L + Math.max(0,Math.min(1,(v-start)/Math.max(target-start,1)))*(R-L);
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Progress road" style="width:100%;height:auto">';
  svg += '<rect x="'+L+'" y="30" width="'+(R-L)+'" height="26" rx="6" fill="#23262d" stroke="#2a2d35"/>';
  svg += '<line x1="'+(L+8)+'" x2="'+(R-8)+'" y1="43" y2="43" stroke="#5b5e68" stroke-width="2.5" stroke-dasharray="12 10"/>';
  // quarter mile markers
  for(let q=1;q<4;q++){
    const v = start + (target-start)*q/4;
    svg += '<line x1="'+x(v)+'" x2="'+x(v)+'" y1="30" y2="56" stroke="#2a2d35" stroke-width="2"/>'+
           '<text x="'+x(v)+'" y="70" text-anchor="middle" font-size="10" fill="#5b5e68">'+Math.round(v)+'</text>';
  }
  // finish: checkered
  for(let r2=0;r2<4;r2++) for(let c=0;c<2;c++){
    svg += '<rect x="'+(R-10+c*5)+'" y="'+(30+r2*6.5)+'" width="5" height="6.5" fill="'+(((r2+c)%2)?'#e9e7e2':'#101114')+'"/>';
  }
  svg += '<text x="'+L+'" y="22" font-size="10" fill="#5b5e68">START '+Math.round(start)+'</text>';
  svg += '<text x="'+R+'" y="22" text-anchor="end" font-size="11" font-weight="bold" fill="'+(done?'#3da25f':'#e9e7e2')+'">'+target+'</text>';
  // your plate marker
  const px = x(cur);
  svg += '<circle cx="'+px+'" cy="43" r="12" fill="var(--accent)" stroke="#0e0f12" stroke-width="3"/>'+
         '<circle cx="'+px+'" cy="43" r="3.5" fill="#0e0f12"/>';
  svg += '</svg>';
  return svg;
}

async function callClaude(messages, system, maxTokens){
  const headers = {'Content-Type':'application/json'};
  if(S.settings.apiKey){
    headers['x-api-key'] = S.settings.apiKey;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  const body = {model:'claude-sonnet-4-6', max_tokens:maxTokens||1000, messages};
  if(system) body.system = system;
  const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error('API '+res.status+': '+t.slice(0,200)); }
  const data = await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}

/* ================= GIST SYNC ================= */
const GIST_FILE = 'ironhub_data.json';
function syncReady(){ return !!(S.settings.ghToken && S.settings.gistId); }
function ghHeaders(){ return {'Authorization':'Bearer '+S.settings.ghToken, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}; }
function syncPayload(){
  const d = JSON.parse(JSON.stringify(S));
  delete d.settings.ghToken; delete d.settings.gistId; delete d.settings.apiKey; // secrets never leave the device
  return JSON.stringify({app:'ironhub', v:1, exportedAt:Date.now(), data:d});
}
function setSyncMsg(t, err){ const el = $('#syncMsg'); if(el){ el.textContent = t; el.className = err ? 'err' : 'small ok'; } }
function markSynced(){
  S.meta = S.meta || {changedAt:0,lastSync:0};
  S.meta.lastSync = Date.now();
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  const el = $('#hdrSync');
  if(el) el.textContent = '\u25cf synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
async function connectSync(){
  const tok = $('#ghToken').value.trim();
  if(!tok){ setSyncMsg('Paste a token first.', true); return; }
  S.settings.ghToken = tok; save(false);
  setSyncMsg('Connecting to GitHub\u2026');
  try{
    const res = await fetch('https://api.github.com/gists?per_page=100',{headers:ghHeaders()});
    if(!res.ok) throw new Error('GitHub error '+res.status+(res.status===401?' \u2014 token invalid or missing the gist scope':''));
    const gists = await res.json();
    const found = gists.find(g=>g.files && g.files[GIST_FILE]);
    if(found){
      S.settings.gistId = found.id; save(false);
      await syncPull(true);
      setSyncMsg('\u2713 Connected \u2014 found your existing sync gist and pulled its data.');
    } else {
      const c = await fetch('https://api.github.com/gists',{method:'POST',headers:ghHeaders(),
        body:JSON.stringify({description:'Iron Hub training data (auto-sync)', public:false, files:{[GIST_FILE]:{content:syncPayload()}}})});
      if(!c.ok) throw new Error('Could not create gist ('+c.status+')');
      const g = await c.json();
      S.settings.gistId = g.id; save(false);
      setSyncMsg('\u2713 Private sync gist created \u2014 this device pushed the first copy.');
    }
    markSynced(); renderSettings();
  }catch(e){ setSyncMsg(e.message, true); }
}
async function syncPush(manual){
  if(!syncReady()){ if(manual) setSyncMsg('Not connected \u2014 paste your token and hit Connect first.', true); return; }
  try{
    const res = await fetch('https://api.github.com/gists/'+S.settings.gistId,{method:'PATCH',headers:ghHeaders(),
      body:JSON.stringify({files:{[GIST_FILE]:{content:syncPayload()}}})});
    if(!res.ok) throw new Error('Push failed ('+res.status+')');
    markSynced();
    if(manual) setSyncMsg('\u2713 Pushed to cloud at '+new Date().toLocaleTimeString());
  }catch(e){ if(manual) setSyncMsg(e.message, true); }
}
async function fetchGistData(){
  const res = await fetch('https://api.github.com/gists/'+S.settings.gistId,{headers:ghHeaders()});
  if(!res.ok) throw new Error('Pull failed ('+res.status+')');
  const g = await res.json();
  const f = g.files && g.files[GIST_FILE];
  if(!f) throw new Error('Sync file missing from gist.');
  let content = f.content;
  if(f.truncated) content = await (await fetch(f.raw_url)).text();
  const p = JSON.parse(content);
  if(p.app !== 'ironhub') throw new Error('Gist content not recognized as Iron Hub data.');
  return p;
}
async function syncPull(force){
  if(!syncReady()){ setSyncMsg('Not connected \u2014 paste your token and hit Connect first.', true); return; }
  try{
    const p = await fetchGistData();
    if(!force && S.meta && S.meta.changedAt > p.exportedAt){
      if(!confirm('This device has NEWER local changes than the cloud copy. Pull anyway and overwrite them?')) return;
    }
    applyPulled(p.data);
    markSynced();
    setSyncMsg('\u2713 Pulled cloud data at '+new Date().toLocaleTimeString());
    setAccent(); renderHeader(); renderToday(); renderSettings();
  }catch(e){ setSyncMsg(e.message, true); }
}
function applyPulled(d){
  const keep = {apiKey:S.settings.apiKey, ghToken:S.settings.ghToken, gistId:S.settings.gistId, autoSync:S.settings.autoSync};
  S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), d);
  S.settings = Object.assign({}, DEFAULT_STATE.settings, d.settings||{}, keep);
  S.meta = S.meta || {changedAt:0,lastSync:0};
  S.meta.changedAt = d && d.meta ? (d.meta.changedAt||Date.now()) : Date.now();
  save(false);
}
let _pushTimer = null;
function schedulePush(){
  if(!syncReady() || S.settings.autoSync === false) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(()=>syncPush(false), 2500);
}
async function autoPullOnLoad(){
  if(!syncReady() || S.settings.autoSync === false) return;
  try{
    const p = await fetchGistData();
    if(p.exportedAt > (S.meta ? S.meta.changedAt : 0)){
      applyPulled(p.data);
      setAccent(); renderHeader(); renderToday();
    }
    markSynced();
  }catch(e){ const el=$('#hdrSync'); if(el){ el.textContent='\u25cb sync offline'; } }
}
function disconnectSync(){
  if(!confirm('Disconnect cloud sync on this device? (The gist itself is not deleted \u2014 other devices keep working.)')) return;
  S.settings.ghToken=''; S.settings.gistId=''; save(false); renderSettings();
}

/* ================= WEAK-GROUP REINFORCEMENT (mini-audit) ================= */
function lastCompletedWeekRange(){
  // The training week that just ended, i.e. the one before the current weekStart.
  const curStart = weekStartKey();
  const end = new Date(curStart+'T00:00:00'); end.setDate(end.getDate()-1);
  const start = new Date(end); start.setDate(start.getDate()-6);
  return {start:dateKeyOf(start), end:dateKeyOf(end), curStart};
}
function weeklyVolumeByGroup(startKey, endKey){
  const vol = {}; MUSCLE_GROUPS.forEach(g=>vol[g]=0);
  S.logs.filter(l=>l.date>=startKey && l.date<=endKey).forEach(l=>l.entries.forEach(e=>{
    const m = musclesFor(e.exercise); const n = e.sets.length;
    m.p.forEach(g=>{ if(vol[g]!=null) vol[g]+=n; });
    m.s.forEach(g=>{ if(vol[g]!=null) vol[g]+=n*0.5; });
  }));
  return vol;
}
/* An exercise is "main/compound" and therefore NOT swap-eligible if it's a PR lift
   or matches a primary compound pattern. Only accessories get swap proposals. */
function isSwapEligible(name){
  if(PR_LIFTS[name]) return false;
  const n = name.toLowerCase();
  // primary compounds — protected from swaps
  if(/barbell (bench|back squat|squat|row|overhead press|press)/.test(n)) return false;
  if(/^(bench press|back squat|deadlift|overhead press|dips?|leg press|romanian deadlift|rdl)$/.test(n)) return false;
  if(/leg press|hip thrust/.test(n)) return false; // big lower-body drivers
  return true;
}
/* Find accessory exercises whose e1RM hasn't improved in 4+ weeks of logged history. */
function staleExercises(){
  const STALE_WEEKS = 4;
  const out = [];
  const allNames = [...new Set(Object.values(S.split).flatMap(d=>(d.exercises||[]).map(exName)))];
  allNames.forEach(name=>{
    if(!isSwapEligible(name)) return;
    if(isBodyweight(name)) return; // rep-based, e1RM not meaningful
    const series = e1rmSeries(name); // [{date, v}] oldest->newest
    if(series.length < 3) return; // need a few sessions to judge
    const firstMs = new Date(series[0].date).getTime();
    const lastMs  = new Date(series[series.length-1].date).getTime();
    const spanWeeks = (lastMs - firstMs)/(7*86400000);
    if(spanWeeks < STALE_WEEKS) return; // not enough time elapsed to call it stale
    const cutMs = lastMs - STALE_WEEKS*7*86400000;
    const recent = series.filter(p=>new Date(p.date).getTime() >= cutMs);
    const older  = series.filter(p=>new Date(p.date).getTime() <  cutMs);
    if(!older.length || !recent.length) return;
    const bestRecent = Math.max(...recent.map(p=>p.v));
    const bestOlder  = Math.max(...older.map(p=>p.v));
    if(bestRecent <= bestOlder * 1.01){ // no meaningful (>1%) improvement
      let day = null;
      for(const dk in S.split){ if(dayExNames(dk).includes(name)){ day = dk; break; } }
      out.push({name, day, weeks:Math.round(spanWeeks), bestRecent:Math.round(bestRecent), bestOlder:Math.round(bestOlder)});
    }
  });
  return out.sort((a,b)=>b.weeks-a.weeks).slice(0,3);
}
