/* ---------------- OVERVIEW (annual review + milestones) ---------------- */
function renderAnOverview(){
  const el = document.getElementById('an_over'); if(!el) return;
  const year = todayKey().slice(0,4);
  const logs = S.logs.filter(l=>l.date.startsWith(year));
  if(!logs.length){ el.innerHTML = anEmpty('Nothing logged in '+year+' yet.'); return; }
  let sets=0, vol=0; const exSet = new Set(); const monthCount = {};
  logs.forEach(l=>{
    monthCount[l.date.slice(0,7)] = (monthCount[l.date.slice(0,7)]||0)+1;
    l.entries.forEach(e=>{ exSet.add(e.exercise); sets+=e.sets.length; e.sets.forEach(s=>{ vol += (+s.w||0)*(+s.r||0); }); });
  });
  const bigMonth = Object.entries(monthCount).sort((a,b)=>b[1]-a[1])[0];
  const monthName = m => new Date(m+'-02T00:00:00').toLocaleString('en-US',{month:'long'});
  // e1RM gains this year for top lifts
  const gains = anBigLifts(4).slice(0,5).map(ex=>{
    const pts = e1rmSeries(ex).filter(p=>p.date.startsWith(year));
    if(pts.length<2) return null;
    const first = pts[0].v, best = Math.max(...pts.map(p=>p.v));
    return {ex, first, best, gain:best-first};
  }).filter(g=>g && g.gain>0.5).sort((a,b)=>b.gain-a.gain);
  // bodyweight change this year
  const bw = [...S.weights].filter(w=>w.date.startsWith(year)).sort((a,b)=>a.date.localeCompare(b.date));
  // actual-weight PRs set this year
  const prs = [];
  anBigLifts(3).forEach(ex=>{
    const p = actualPR(ex);
    if(p && p.date.startsWith(year)) prs.push({ex, w:p.w, r:p.r, date:p.date});
  });
  prs.sort((a,b)=>b.date.localeCompare(a.date));

  let h = '<div class="card"><div class="k">'+year+' so far</div>'+
    '<div class="an-stats">'+
    '<div class="an-stat"><span class="an-stat-n">'+logs.length+'</span><span class="an-stat-l">sessions</span></div>'+
    '<div class="an-stat"><span class="an-stat-n">'+sets+'</span><span class="an-stat-l">sets</span></div>'+
    '<div class="an-stat"><span class="an-stat-n">'+(vol>=1000000 ? (vol/1000000).toFixed(1)+'M' : Math.round(vol/1000)+'k')+'</span><span class="an-stat-l">lb moved</span></div>'+
    '<div class="an-stat"><span class="an-stat-n">'+exSet.size+'</span><span class="an-stat-l">exercises</span></div>'+
    '</div>'+
    (bigMonth ? '<p class="small" style="margin-top:10px;color:var(--dim)">Biggest month: '+monthName(bigMonth[0])+' ('+bigMonth[1]+' sessions)'+
      (bw.length>=2 ? ' \u00b7 bodyweight '+bw[0].lbs+' \u2192 '+bw[bw.length-1].lbs+' lb' : '')+'</p>' : '')+
    '</div>';
  if(gains.length){
    h += '<div class="card"><div class="k">Strength gained this year</div>';
    const maxG = gains[0].gain;
    gains.forEach(g=>{ h += anBarRow(g.ex, 100*g.gain/maxG, '+'+Math.round(g.gain)+' lb e1RM ('+Math.round(g.first)+' \u2192 '+Math.round(g.best)+')', 'var(--amber)'); });
    h += '</div>';
  }
  if(prs.length){
    h += '<div class="card"><div class="k">PRs set in '+year+'</div>';
    prs.slice(0,8).forEach(p=>{
      h += '<div class="an-pr"><span class="mono" style="color:var(--amber)">'+p.w+'\u00d7'+p.r+'</span>'+
        '<span style="flex:1;min-width:0">'+esc(p.ex)+'</span>'+
        '<span class="small" style="color:var(--dim)">'+fmtDate(p.date)+'</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="card"><p class="small" style="color:var(--dim)">Dig deeper in the other Analytics views \u2014 strength curve, fatigue, recovery, development, and predictions each cut this data a different way.</p></div>';
  el.innerHTML = h;
}

/* ============================================================
   READINESS CHECK-IN V3 — runs at session start, five quick taps.
   Low readiness triggers an ACTIVE choice (trim volume / keep plan),
   never a silent change.
   ============================================================ */
const RD_STRESS_OPTS = ['calm','normal','wired'];
const RD_MOTIV_OPTS  = ['meh','ready','fired up'];
let _rdV3 = {};
let _rdPendingDay = null;
let liveTrimVol = false;

function readinessTierV3(r){
  let sc = (RD_SLEEP[r.sleep]||0)+(RD_SORE[r.sore]||0)+(RD_ENERGY[r.energy]||0);
  if(r.stress==='wired') sc -= 1; else if(r.stress==='calm') sc += 0.5;
  if(r.motiv==='meh')  sc -= 0.5; else if(r.motiv==='fired up') sc += 1;
  return sc<=2 ? 'low' : sc<=5 ? 'ok' : 'high';
}
function openReadyCheck(dk){
  _rdPendingDay = dk; _rdV3 = {};
  // Called AFTER the WHOOP prefill below runs, so _rdV3[key] already holds any pre-filled
  // value by the time this actually builds markup -- that's what lets it mark the matching
  // pill 'on' instead of just quietly holding a value nothing on screen shows as selected.
  const grp = (label,key,opts)=>'<div class="rd3-group"><span class="rd3-gl">'+label+'</span><div class="rd3-pills">'+
    opts.map(o=>'<button class="rd3-pill'+(_rdV3[key]===o?' on':'')+'" data-k="'+key+'" data-v="'+o+'" onclick="rd3Pick(this)">'+o+'</button>').join('')+'</div></div>';
  // With a fresh WHOOP recovery score the check-in stops being a questionnaire and becomes
  // a confirmation: sleep is filled in from the measurement, and the intro says what it
  // already knows. Without one, this is exactly the screen it has always been.
  const _wf = (typeof whoopFresh==='function') && whoopFresh();
  if(_wf){
    const wr = S.whoop.recovery, ws = S.whoop.sleep;
    if(ws && ws.date === todayKey() && ws.hours != null){
      _rdV3.sleep = ws.hours < 6 ? '<6' : ws.hours < 7 ? '6-7' : ws.hours < 8 ? '7-8' : '8+';
    }
    _rdV3.energy = wr.score >= 67 ? 'high' : wr.score >= 34 ? 'ok' : 'low';
  }
  document.getElementById('readyBody').innerHTML =
    (_wf ? '<p class="small" style="margin-bottom:10px;color:var(--cyan)">WHOOP has you at '+
       S.whoop.recovery.score+'% recovered'+
       (S.whoop.sleep && S.whoop.sleep.date===todayKey() && S.whoop.sleep.hours!=null
          ? ' on '+S.whoop.sleep.hours.toFixed(1)+'h sleep' : '')+
       ' \u2014 pre-filled below. Change anything that doesn\u2019t match how you actually feel.</p>'
       : '')+
    '<p class="small" style="margin-bottom:14px">Ten seconds \u2014 this tunes today\u2019s targets to how recovered you actually are.</p>'+
    grp('Sleep','sleep',['<6','6-7','7-8','8+'])+
    grp('Soreness','sore',['fresh','mild','beat up'])+
    grp('Energy','energy',['low','ok','high'])+
    grp('Stress','stress',RD_STRESS_OPTS)+
    grp('Motivation','motiv',RD_MOTIV_OPTS)+
    '<div style="display:flex;gap:8px;margin-top:16px;align-items:center">'+
    '<button class="btn primary" style="flex:1;padding:13px" onclick="rd3Lock()">Start session</button>'+
    '<button class="btn ghost sm" onclick="rd3Skip()">Skip</button></div>'+
    '<p class="small err" id="rd3Msg" style="margin-top:8px"></p>';
  document.getElementById('readyOverlay').classList.add('show');
}
function rd3Pick(btn){
  const k = btn.dataset.k;
  _rdV3[k] = btn.dataset.v;
  document.querySelectorAll('.rd3-pill[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on', b===btn));
}
function rd3Skip(){
  S.readySkipDate = todayKey(); save(false);
  closeReadyOverlay(); _startLiveNow(_rdPendingDay, false);
}
function closeReadyOverlay(){ const el=document.getElementById('readyOverlay'); if(el) el.classList.remove('show'); }
function rd3Lock(){
  if(!_rdV3.sleep || !_rdV3.sore || !_rdV3.energy || !_rdV3.stress || !_rdV3.motiv){
    document.getElementById('rd3Msg').textContent = 'Tap one option in each row (or Skip).'; return;
  }
  const entry = {date:todayKey(), sleep:_rdV3.sleep, sore:_rdV3.sore, energy:_rdV3.energy, stress:_rdV3.stress, motiv:_rdV3.motiv};
  entry.tier = readinessTierV3(entry);
  S.readiness = S.readiness.filter(x=>x.date!==todayKey());
  S.readiness.push(entry); save();
  if(entry.tier==='low'){ rd3ShowTrimPrompt(entry); return; }   // active choice, never silent
  closeReadyOverlay(); _startLiveNow(_rdPendingDay, false);
}
function rd3ShowTrimPrompt(entry){
  document.getElementById('readyBody').innerHTML =
    '<div style="border-left:3px solid var(--red);padding-left:12px;margin-bottom:14px">'+
    '<b style="color:var(--red);text-transform:uppercase;letter-spacing:.08em;font-size:13px">Readiness: low</b>'+
    '<p class="small" style="margin-top:5px">'+esc(entry.sleep)+'h sleep \u00b7 '+esc(entry.sore)+' \u00b7 '+esc(entry.energy)+' energy \u00b7 '+esc(entry.stress)+' \u00b7 '+esc(entry.motiv)+'</p></div>'+
    '<p style="font-size:14px;line-height:1.55;margin-bottom:6px">Rough recovery day. Want to trim today\u2019s volume?</p>'+
    '<p class="small" style="margin-bottom:14px;color:var(--dim)">Trim = one fewer working set per exercise, and weight targets soften automatically. Showing up beats skipping; trimming beats grinding through junk sets.</p>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+
    '<button class="btn primary" style="padding:13px" onclick="rd3Start(true)">Trim volume today</button>'+
    '<button class="btn ghost" style="padding:12px" onclick="rd3Start(false)">Keep the full plan</button></div>';
}
function rd3Start(trim){
  closeReadyOverlay(); _startLiveNow(_rdPendingDay, trim);
}


/* ============================================================
   COACH MEMORY — durable notes the coach can propose to remember.
   Written only through the normal tap-to-apply proposal flow;
   the coach can never silently write to memory.
   ============================================================ */
const COACH_MEM_MAX = 40;
function coachMem(){ if(!Array.isArray(S.coachMem)) S.coachMem = []; return S.coachMem; }
function coachMemAdd(note, tag){
  const arr = coachMem();
  const clean = String(note||'').trim().slice(0,240);
  if(!clean) return null;
  const rec = {id:'m_'+Math.random().toString(36).slice(2,9), note:clean, tag:tag||'general', date:todayKey()};
  arr.push(rec);
  while(arr.length > COACH_MEM_MAX) arr.shift();   // oldest falls off
  save();
  return rec;
}
function coachMemDelete(id){
  S.coachMem = coachMem().filter(m=>m.id!==id);
  save(); renderCoach();
}
function coachMemClear(){
  if(!confirm('Delete everything the coach remembers? This cannot be undone.')) return;
  S.coachMem = []; save(); renderCoach();
}
function coachMemContext(){
  const arr = coachMem();
  if(!arr.length) return '';
  return '\nWHAT YOU REMEMBER ABOUT HIM (things he told you to remember in past chats):\n'+
    arr.map(m=>'- ['+m.tag+'] '+m.note+' (noted '+fmtDate(m.date)+')').join('\n')+'\n';
}
function coachMemCardHTML(){
  const arr = coachMem();
  let h = '<div class="cmem-card"><div class="cmem-top">'+
    '<span class="cmem-title">Coach memory</span>'+
    '<span class="cmem-count">'+arr.length+'/'+COACH_MEM_MAX+'</span>'+
    (arr.length?'<button class="cmem-clear" onclick="coachMemClear()">clear all</button>':'')+'</div>';
  if(!arr.length){
    h += '<p class="small" style="color:var(--dim);margin:0">Nothing remembered yet. Tell the coach something like \u201cremember my left shoulder gets cranky on overhead press\u201d and it\u2019ll propose saving it \u2014 you tap to confirm.</p>';
  } else {
    h += '<div class="cmem-list">'+arr.map(m=>
      '<div class="cmem-item"><span class="cmem-tag">'+esc(m.tag)+'</span>'+
      '<span class="cmem-note">'+esc(m.note)+'</span>'+
      '<button class="cmem-x" onclick="coachMemDelete(\''+m.id+'\')" title="Forget this">\u00d7</button></div>').join('')+'</div>';
  }
  return h + '</div>';
}

/* ============================================================
   OPERATIONS \u2014 multi-agent layer (CHARLIE / DELTA / ECHO / ZULU)
   ------------------------------------------------------------
   ZULU is the former Coach. It deliberately reuses S.chat and
   S.coachMem rather than copying them into new keys: relabelling
   in the UI is a zero-risk migration, whereas moving the data
   risks losing notes on a half-completed write or a sync race.
   ============================================================ */
const AGENTS = {
  zulu:    {name:'ZULU',    lead:true, col:'#dfae36',
            role:'Lead \u2014 oversight, coaching and cross-domain synthesis'},
  charlie: {name:'CHARLIE', col:'#46CDBA',
            role:'App logistics, data health and workout schedule'},
  delta:   {name:'DELTA',   col:'#F6862F',
            role:'Workouts, splits and progressive overload'},
  echo:    {name:'ECHO',    col:'#B79BFF',
            role:'Bulk, fuel and bodyweight trend'}
};
const AG_ORDER = ['charlie','delta','echo'];
const AG_PROP_TTL = 7; // days before a pending proposal auto-expires

function agState(){
  if(!S.agents) S.agents = {};
  const a = S.agents;
  if(!a.proposals) a.proposals = [];
  if(!a.log) a.log = [];
  if(!a.chats) a.chats = {};
  AG_ORDER.forEach(k=>{ if(!a.chats[k]) a.chats[k] = []; });
  if(!a.status) a.status = {};
  if(a.autoRun===undefined) a.autoRun = true;
  if(!a.lastRun) a.lastRun = '';
  // v4c and earlier persisted the in-flight flag onto S. Nothing reads it now, but it would
  // otherwise ride along in every gist push forever \u2014 drop it on first touch.
  if('_running' in a) delete a._running;
  return a;
}
function agUid(){ return 'ag'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
/* Cheap fingerprint of everything OPERATIONS renders. Used to skip pointless timer repaints.
   The trailing 5-minute bucket lets relative timestamps refresh without repainting every tick. */
let _opsSig = '';
function opsSignature(){
  const a = agState();
  return [
    a.proposals.length, a.log.length, a.lastRunAt||'',
    (a.brief&&a.brief.at)||'', (a.letter&&a.letter.at)||'',
    (S.chat||[]).length,
    AG_ORDER.map(k=>(a.chats[k]||[]).length).join(','),
    Object.keys(a.status||{}).map(k=>k+':'+(a.status[k].at||'')).join(','),
    _agRunning?1:0, a.autoRun?1:0,
    agActiveChat, agChatTall?1:0, agThinkingFor||'', agChatErr?agChatErr.id:'',
    Math.floor(Date.now()/300000)
  ].join('|');
}
function agPending(){ return agState().proposals.filter(p=>p.status==='pending'); }
function agPendingFor(id){ return agPending().filter(p=>p.agent===id); }

function agLog(agent, text){
  const a = agState();
  a.log.unshift({id:agUid(), agent, text, at:new Date().toISOString()});
  if(a.log.length > 120) a.log.length = 120; // bounded \u2014 this syncs to the gist
}

/* ---- expiry sweep: pending proposals die after 7 days ---- */
function agSweepExpired(){
  const a = agState(); let n=0;
  const today = new Date(todayKey());
  a.proposals.forEach(p=>{
    if(p.status!=='pending') return;
    if(new Date(p.expires) < today){ p.status='expired'; n++; }
  });
  return n;
}

/* ---- fix validation: never trust model output straight into state ---- */
const AG_FIX_TYPES = ['cal','pro','liftReset','deload','addEx','swapEx','schedule','cycleSchedule'];
/* Every exercise Mark actually trains — split slots plus anything he has logged. NOT
   allKnownExerciseNames(), which folds in the whole EX_LIBRARY: an override on a lift he
   has never performed is inert by construction, so accepting one would just be a different
   way of writing a dead key. */
function agTrainedExNames(){
  const set = new Set();
  Object.keys(S.split).forEach(dk=>(S.split[dk].exercises||[]).forEach(x=>set.add(exName(x))));
  // Also the split actually IN FORCE. An approved meso strength block trains S1/S2/S3
  // exercises that may not appear in S.split at all, so a perfectly legitimate liftReset
  // against one of them used to resolve to null and get discarded — the agent said it had
  // capped the lift, and nothing was ever written.
  try{
    const act = (typeof activeSplitObj==='function') ? activeSplitObj() : null;
    if(act) Object.keys(act).forEach(dk=>(act[dk].exercises||[]).forEach(x=>set.add(exName(x))));
  }catch(e){}
  S.logs.forEach(l=>(l.entries||[]).forEach(e=>set.add(e.exercise)));
  return [...set].filter(Boolean);
}
/* Resolve a model-supplied exercise name to the real one, or null. Returning the CANONICAL
   spelling matters as much as rejecting junk: it means the override lands under exactly the
   key the split uses, so the lenient match in invOverrideFor() is a safety net rather than
   the thing load-bearing the feature. DELTA has already proposed a liftReset for "Trap Bar
   Deadlift", which is not in the split at all — approving that wrote nothing anyone would
   ever see fire. */
function agResolveExName(raw){
  const want = invNormName(raw);
  if(!want) return null;
  const names = agTrainedExNames();
  return names.find(n=>n===raw) || names.find(n=>invNormName(n)===want) || null;
}
function agValidateFix(fx){
  if(!fx || !fx.type) return null;
  if(AG_FIX_TYPES.indexOf(fx.type) < 0) return null;
  const p = fx.payload || {};
  if(fx.type==='cal'){
    const d = Math.round(+p.delta||0);
    if(!d || Math.abs(d) > 500) return null;      // clamp: no wild swings
    return {type:'cal', payload:{delta:d}};
  }
  if(fx.type==='pro'){
    const to = Math.round(+p.to||0);
    if(to < 80 || to > 300) return null;
    return {type:'pro', payload:{to}};
  }
  if(fx.type==='liftReset'){
    const w = Math.round(+p.w||0), days = Math.round(+p.days||0);
    if(!p.name || w<=0 || days<1 || days>30) return null;
    // Tightened, not loosened: the name has to resolve to a lift he actually trains, and it
    // is rewritten to that lift's canonical spelling before it can reach state.
    const name = agResolveExName(p.name);
    if(!name) return null;
    return {type:'liftReset', payload:{name, w, days}};
  }
  if(fx.type==='deload') return {type:'deload', payload:{}};
  if(fx.type==='addEx'){
    if(!p.name || !p.day || !S.split[p.day]) return null;
    return {type:'addEx', payload:{name:String(p.name), day:String(p.day)}};
  }
  if(fx.type==='swapEx'){
    if(!p.from || !p.to) return null;
    return {type:'swapEx', payload:{from:String(p.from), to:String(p.to)}};
  }
  if(fx.type==='schedule'){
    // A day-of-week map is meaningless once a rotating cycle is active \u2014 currentDayKey()
    // ignores S.schedule entirely in cycle mode, so silently accepting this would let an
    // agent "successfully" apply a change that has zero effect. Reject it outright instead
    // of applying something inert; cycle-mode schedule edits go through cycleSchedule below.
    if(scheduleMode()==='cycle') return null;
    const m = p.map||{}; const out = {};
    for(let d=0; d<7; d++){
      const v = m[d] !== undefined ? m[d] : m[String(d)];
      if(v===undefined) return null;             // must be a complete week
      const s = String(v);
      if(s!=='REST' && !S.split[s]) return null; // must reference a real day
      out[d] = s;
    }
    return {type:'schedule', payload:{map:out}};
  }
  if(fx.type==='cycleSchedule'){
    // Mirror image of the check above: this fix is only meaningful while cycle mode is
    // active, since dow mode never reads S.cycleSchedule at all.
    if(scheduleMode()!=='cycle') return null;
    const arr = p.pattern;
    if(!Array.isArray(arr) || arr.length<1 || arr.length>14) return null; // sane cycle length
    const out = [];
    for(const v of arr){
      const s = String(v);
      if(s!=='REST' && !S.split[s]) return null; // must reference a real split day
      out.push(s);
    }
    if(!out.some(d=>d!=='REST')) return null; // an all-rest cycle is never a legitimate proposal
    // Deliberately NOT letting the agent touch the anchor date: shifting it silently changes
    // what TODAY resolves to (today could flip from a lifting day to REST with no visible
    // cause). That's a bigger, more confusing change than reordering the pattern and stays
    // manual-only, via Settings.
    return {type:'cycleSchedule', payload:{pattern: out}};
  }
  return null;
}
/* Why agValidateFix() turned a fix down, in plain words rather than a code. Purely for the
   activity log \u2014 it has no authority over the decision, which agValidateFix() alone makes. */
function agRejectReason(fx){
  if(!fx || !fx.type) return 'malformed';
  if(AG_FIX_TYPES.indexOf(fx.type) < 0) return 'unknown fix type \u201c'+String(fx.type).slice(0,24)+'\u201d';
  const p = fx.payload||{};
  if(fx.type==='liftReset'){
    if(p.name && !agResolveExName(p.name)) return '\u201c'+String(p.name).slice(0,40)+'\u201d is not a lift you train';
    return 'weight or duration out of range';
  }
  if(fx.type==='schedule')      return scheduleMode()==='cycle' ? 'weekday map sent while a rotating cycle is active' : 'incomplete or invalid week';
  if(fx.type==='cycleSchedule') return scheduleMode()!=='cycle' ? 'cycle pattern sent while on a weekday schedule' : 'invalid cycle pattern';
  if(fx.type==='addEx')  return 'target day does not exist';
  if(fx.type==='swapEx') return 'missing from/to exercise';
  return 'value out of the allowed range';
}
function agFixSummary(fx){
  if(!fx) return 'Advisory only \u2014 nothing changes if you approve.';
  const p = fx.payload||{};
  if(fx.type==='cal')      return 'calories '+(p.delta>0?'+':'')+p.delta+'/day';
  if(fx.type==='pro')      return 'protein target \u2192 '+p.to+'g/day';
  if(fx.type==='liftReset')return p.name+' \u2192 '+p.w+' lb for '+p.days+'d';
  if(fx.type==='deload')   return 'start a deload week';
  if(fx.type==='addEx')    return 'add '+p.name+' to '+p.day;
  if(fx.type==='swapEx')   return p.from+' \u2192 '+p.to;
  if(fx.type==='schedule') return 'reschedule the training week';
  if(fx.type==='cycleSchedule') return 'rotating cycle \u2192 '+p.pattern.join(' \u2192 ');
  return fx.type;
}
/* ---- the only place an agent proposal is allowed to touch state ---- */
function agApplyFix(fx){
  const p = fx.payload||{};
  if(fx.type==='cal'){ S.fuel = S.fuel||{}; S.fuel.calTarget = (S.fuel.calTarget||3000) + p.delta; return true; }
  if(fx.type==='pro'){ S.fuel = S.fuel||{}; S.fuel.proTarget = p.to; return true; }
  if(fx.type==='liftReset'){
    invState().overrides[p.name] = {w:p.w, until:dateKeyOf(new Date(Date.now()+p.days*86400000)),
      note:'Agent reset \u2014 rebuild with clean reps, expires '+p.days+'d'};
    return true;
  }
  if(fx.type==='deload'){ startDeloadWeek(); return true; }
  if(fx.type==='addEx'){
    if(!S.split[p.day]) return false;
    S.split[p.day].exercises.push({name:p.name, inc:incFor(p.name)});
    return true;
  }
  if(fx.type==='swapEx'){
    for(const dk in S.split){
      const arr = S.split[dk].exercises;
      const i = arr.findIndex(x=>exName(x)===p.from);
      if(i>=0){ arr[i] = {name:p.to, inc:incFor(p.to)}; return true; }
    }
    return false;
  }
  if(fx.type==='schedule'){ S.schedule = Object.assign({}, p.map); return true; }
  if(fx.type==='cycleSchedule'){ scheduleInit(); S.cycleSchedule.pattern = p.pattern.slice(); return true; }
  return false;
}
function agApprove(pid){
  const p = agState().proposals.find(x=>x.id===pid);
  if(!p || p.status!=='pending') return;
  let ok = true;
  if(p.fix){ try{ ok = agApplyFix(p.fix); }catch(e){ ok = false; p.error = e.message; } }
  p.status = ok ? 'approved' : 'failed';
  p.closed = todayKey();
  agLog(p.agent, ok ? 'You approved \u201c'+p.title+'\u201d. '+(p.fix?'Applied: '+agFixSummary(p.fix)+'.':'Noted.')
                    : 'Tried to apply \u201c'+p.title+'\u201d but it did not land'+(p.error?' ('+p.error+')':'')+'. Nothing changed.');
  save(); setAccent(); renderOps();
}
function agReject(pid){
  const p = agState().proposals.find(x=>x.id===pid);
  if(!p || p.status!=='pending') return;
  p.status='rejected'; p.closed = todayKey();
  agLog(p.agent, 'You turned down \u201c'+p.title+'\u201d. I won\u2019t raise it again unless the picture changes.');
  save(); renderOps();
}

/* ---- context handed to the agents ---- */
function agContext(){
  const sc = scheduleMode()==='cycle'
    ? 'ROTATING CYCLE (repeats every '+cyclePattern().length+' days, independent of the calendar day \u2014 do NOT describe this in terms of weekdays): '+
      cyclePattern().map((d,i)=>'day '+(i+1)+'='+d).join(', ')+
      '. Anchor date '+S.cycleSchedule.anchor+' (fixed \u2014 not editable by proposal). Today is day '+(cyclePosition(todayKey())+1)+' of the cycle ('+currentDayKey()+'). '+
      'You may propose a cycleSchedule fix to reorder days, swap a day, or change which/how many days are REST. '+
      'Use it sparingly \u2014 this is Mark\u2019s standing schedule, not something to tweak reactively from a single rough session.'
    : Object.keys(S.schedule||{}).sort().map(d=>
        ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]+'='+S.schedule[d]).join(', ');
  const splitTxt = Object.keys(S.split).map(k=>
    k+' ('+S.split[k].name+'): '+(S.split[k].exercises||[]).map(exName).join(', ')).join('\n');
  const activeBid = mesoActiveStrBlockId();
  let blockTxt = '';
  if(activeBid){
    const rec = mesoState().active.splits[activeBid];
    const w = mesoCurrentWeek();
    const blockSplitTxt = Object.keys(rec.split).map(k=>
      k+' ('+rec.split[k].name+'): '+(rec.split[k].exercises||[]).map(exName).join(', ')).join('\n');
    blockTxt = '\n\nACTIVE MESO STRENGTH BLOCK (in force through '+w.endKey+', then reverts to the split above automatically): \n'+
      blockSplitTxt+
      '\nThis REPLACES the permanent split above for these dates only, on its own 3-on/2-off rotation — '+
      'do not treat this as a deviation from his plan, and do not propose changes against the permanent split\'s '+
      'exercises while this is in force.';
  }
  const deloadTxt = deloadActive()
    ? '\n\nDELOAD ACTIVE through '+S.deload.until+' (started '+S.deload.startedAt+') — loads and sets are '+
      'intentionally reduced; do not flag this window as a stall, regression, or missed progression.'
    : '';
  const ov = invState().overrides;
  const ovTxt = Object.keys(ov).length
    ? Object.keys(ov).map(k=>k+' capped at '+ov[k].w+' lb until '+ov[k].until).join('; ') : 'none';
  const flags = invActiveFlags().map(f=>'['+f.severity+'] '+f.title+' ('+f.status+')').join('; ') || 'none';
  const mx = maxedList();
  const mxTxt = mx.length
    ? mx.join('; ')+' \u2014 these machines are at their heaviest setting. NEVER propose adding load to '+
      'these; progression must come from reps, sets or tempo. A flat weight trend on these is expected, not a stall.'
    : 'none';
  const recentRejects = agState().proposals.filter(p=>p.status==='rejected').slice(-6)
    .map(p=>p.agent.toUpperCase()+': '+p.title).join('; ') || 'none';
  return '\nCURRENT SCHEDULE: '+sc+
    '\n\nSPLIT:\n'+splitTxt+
    blockTxt+
    deloadTxt+
    '\n\nFUEL TARGETS: '+(S.fuel&&S.fuel.calTarget||'?')+' cal / '+(S.fuel&&S.fuel.proTarget||'?')+'g protein per day.'+
    '\nAvoids: '+((S.fuel&&S.fuel.dislikes)||'\u2014')+
    painContext()+
    '\n\nACTIVE LIFT OVERRIDES: '+ovTxt+
    '\nMAXED OUT (at machine ceiling): '+mxTxt+
    '\nINVESTIGATION FLAGS: '+flags+
    '\n\nPROPOSALS HE HAS ALREADY REJECTED (do not repeat these): '+recentRejects+'\n';
}
function agSharedBrief(){
  return 'You are the agent team inside Iron Hub, a training app built by and for Mark (18, lean bulking, '+
    'trains 5\u20136x/week, interested in a federal law-enforcement career). Four agents:\n'+
    '- CHARLIE: app logistics, data hygiene and the weekly training SCHEDULE (which day falls on which weekday, rest-day placement).\n'+
    '- DELTA: exercise selection, volume, rep ranges and progressive overload.\n'+
    '- ECHO: bodyweight trend, rate of gain, calorie and protein targets.\n'+
    '- ZULU: lead \u2014 oversight, coaching, and cross-domain synthesis.\n\n'+
    'Be specific and numeric. Cite the actual figures from his data rather than generalities. '+
    'Never invent data you were not given. If an agent has nothing worth saying this cycle, it says so plainly '+
    'and proposes nothing \u2014 silence is better than filler. Do not propose anything he has already rejected. '+
    'If two agents would pull in opposite directions, say so inside the proposal and give him the options.\n';
}

/* ---- per-agent role briefs ----
   Each specialist used to get the SAME prompt as the other three, with one shared JSON
   envelope carrying all four replies. That had two costs. Every agent read every other
   agent's instructions, so nothing was actually focused; and a single malformed reply took
   all four down together, because there was only one JSON object to parse. Now each runs
   its own call with only its own remit, and one agent failing costs only that agent. */
const AG_ROLE_BRIEF = {
  charlie:
    'You are CHARLIE. Your remit is app logistics, data hygiene and the training SCHEDULE -- '+
    'which day falls where, rest-day placement, missed or duplicated sessions, gaps in the log. '+
    'Progression, exercise selection and nutrition belong to DELTA and ECHO; do not comment on them.',
  delta:
    'You are DELTA. Your remit is exercise selection, volume, rep ranges, progressive overload, '+
    'stalls and progression. The schedule itself is CHARLIE\u2019s and bodyweight '+
    'or intake is ECHO\u2019s; do not comment on those.',
  echo:
    'You are ECHO. Your remit is bodyweight trend, rate of gain, and calorie and protein targets. '+
    'Training content and scheduling belong to DELTA and CHARLIE; do not comment on them.'
};
/* The fix shapes each agent is allowed to propose. A shape absent from an agent's list is
   still rejected by agValidateFix() downstream -- this only keeps the prompt honest so the
   model is not invited to produce something that will be thrown away. */
const AG_FIX_MENU = {
  charlie:
    '  {"type":"schedule","payload":{"map":{"0":"REST","1":"D1","2":"D2","3":"D3","4":"D4","5":"D5","6":"REST"}}}  -- ONLY valid in day-of-week mode; discarded in cycle mode'+'\n'+
    '  {"type":"cycleSchedule","payload":{"pattern":["D1","D2","D3","REST"]}}  -- ONLY valid in rotating-cycle mode; discarded otherwise. Full replacement, 1-14 entries, at least one non-REST. The anchor date can never be changed this way.',
  delta:
    '  {"type":"liftReset","payload":{"name":"<exact exercise name>","w":<lb, a REAL working weight not an e1RM>,"days":1..30}}'+'\n'+
    '  {"type":"deload","payload":{}}'+'\n'+
    '  {"type":"addEx","payload":{"name":"...","day":"D1".."D6"}}'+'\n'+
    '  {"type":"swapEx","payload":{"from":"...","to":"..."}}',
  echo:
    '  {"type":"cal","payload":{"delta":-500..500}}'+'\n'+
    '  {"type":"pro","payload":{"to":80..300}}'
};

/* Shared tail: the JSON contract, identical for all three specialists. */
function agJsonSpec(id){
  return '\n'+'Respond with ONLY valid JSON -- no markdown fences, no commentary before or after:'+'\n'+
    '{"summary":"...","proposals":[]}'+'\n'+
    'summary = 1-3 sentences, first person, addressed to Mark, describing what you found this cycle. '+
    'Observations, things worth watching, and "no action needed but here is why" all belong here.'+'\n'+
    'proposals = ONLY things with a concrete fix attached. If you have nothing worth applying, return an '+
    'empty array. Do not add a proposal just to have said something -- say it in summary instead. A '+
    'proposal with fix:null is a contradiction: if there is nothing to apply, it is not a proposal.'+'\n'+
    'Each proposal = {"title":"short imperative","reasoning":"why, citing his actual numbers","fix":<one of>}'+'\n'+
    (AG_FIX_MENU[id]||'')+'\n'+
    'Anything not on that list, including null, is discarded -- do not submit it.'+'\n'+
    'Cap: at most 2 proposals. Fewer is better; most nights the right answer is zero.'+'\n'+
    'IMPORTANT: do not describe a change in your summary as though it were already made. Nothing you '+
    'propose takes effect until Mark taps Approve, and a proposal that fails validation is discarded '+
    'entirely. Say what you would change, not what you have changed.'+'\n'+
    // DELTA alone also refreshes the Overload Status tab. Read-only and informational, so it
    // sits outside the proposal queue entirely -- but it still has to be ASKED for, or the tab
    // quietly keeps showing last week's commentary forever.
    (id!=='delta' ? '' :
      '\n'+'ALSO include a top-level "overload" key refreshing the Overload Status tab '+
      '(informational only, nothing is applied):'+'\n'+
      '  "overload":{"lifts":[{"lift":"<exact name from OVERLOAD STATUS below>","direction":"up|flat|down","verdict":"on-track|stalling|attention","tip":"<=200 chars, only if there is something actionable -- otherwise \"\""}]}'+'\n'+
      '  Cover every lift listed under OVERLOAD STATUS. "direction" MUST match the dir= given there; '+
      'a row whose direction disagrees is discarded, not shown. "verdict" may move at most one step '+
      'from the app verdict given there (on-track < stalling < attention) -- rows that invert it are '+
      'discarded too. Tips should cite his numbers; leave tip empty rather than writing filler.'+'\n');
}

/* Everything an agent is handed before it starts asking questions. Deliberately still a
   summary rather than a dump -- the data tools exist so it can go and get the detail. */
function agBaseContext(id){
  return coachMemContext()+trainingContext()+agContext()+
    (id==='delta' ? olAgentContext() : '');
}

function agToolNote(){
  return '\n'+'You have read-only tools for his full history: list_lifts, get_lift_history, '+
    'get_e1rm_series, get_bodyweight, get_nutrition, get_readiness, get_weekly_volume. The summary '+
    'above is only the most recent slice -- if a claim depends on anything older or more precise, '+
    'LOOK IT UP rather than inferring. Never cite a number you have not seen. Exercise names must '+
    'come from list_lifts; a name that does not match one of those cannot be applied.'+'\n';
}

/* Run ONE specialist. Returns {summary, proposals} or null if it failed. */
async function agRunSpecialist(id, manual){
  const sys = agSharedBrief()+'\n'+AG_ROLE_BRIEF[id]+'\n'+agToolNote()+agJsonSpec(id)+agBaseContext(id);
  const consulted = [];
  const {text} = await callClaudeWithData(
    [{role:'user', content:'Run the '+(manual?'on-demand':'daily')+' cycle for '+todayKey()+'.'}],
    sys, 8000, {effort:'high'},
    function(n){ if(consulted.indexOf(n)<0) consulted.push(n); });
  const parsed = parseLooseJSON(text);
  if(parsed) parsed._consulted = consulted;
  return parsed;
}

/* ---- the daily run: three specialists, then the lead ---- */
let _agRunning = false;   // module-scoped ON PURPOSE: see note in agRunAll

/* Ingest one specialist's parsed reply into state. Split out of agRunAll so all four agents
   go through exactly the same validation path -- there is no shortcut for the lead. */
function agIngest(a2, id, blk){
  if(!blk) return 0;
  let raised = 0;
  if(blk.summary){
    a2.status[id] = {summary:String(blk.summary), at:new Date().toISOString(),
                     consulted:(blk._consulted||[]).slice(0,8)};
    agLog(id, String(blk.summary));
  }
  (blk.proposals||[]).slice(0,2).forEach(function(pr){
    if(!pr || !pr.title) return;
    const fix = agValidateFix(pr.fix);
    // Advisory-only entries (no fix, or one that failed validation) do not belong in the
    // approval queue -- there is nothing for Approve to apply, so it was a no-op button next
    // to text already read in the summary above.
    if(!fix){
      if(!pr.fix){
        agLog(id, pr.title+(pr.reasoning?' \u2014 '+pr.reasoning:''));
      } else {
        // A fix that FAILED validation used to vanish with no trace at all, while the agent's
        // free-text summary went on announcing the change. Reading that, you would believe an
        // override was live when none had ever been written. Validation is unchanged: this
        // only makes the refusal VISIBLE, it never lets one through.
        agLog(id, 'I proposed \u201c'+pr.title+'\u201d but it did not pass validation ('+
          agRejectReason(pr.fix)+'), so NOTHING was applied. Ignore any part of my summary '+
          'above that says otherwise.');
      }
      return;
    }
    a2.proposals.unshift({
      id:agUid(), agent:id, title:String(pr.title),
      reasoning:String(pr.reasoning||''), fix,
      created:todayKey(),
      expires:dateKeyOf(new Date(Date.now()+AG_PROP_TTL*86400000)),
      status:'pending'
    });
    raised++;
  });
  return raised;
}

/* ---- the daily run ----
   Three specialists in parallel, then ZULU on top of their output.

   Parallel, not sequential, on purpose: this is four calls now instead of one, and run
   back-to-back that is a two-to-three minute wait whenever he taps "Run cycle now" himself.
   The cost of parallelism is that the three cannot share a prompt cache (a cache entry is
   only readable once the response that wrote it has started streaming, so simultaneous
   requests with the same prefix all pay full price). That trade is worth roughly three cents
   a night, and it buys back the wait -- which is why there is no cache_control here. Adding
   one would charge the 1.25x write premium for a cache nothing ever reads. */
async function agRunAll(manual){
  const a = agState();
  if(!S.settings.apiKey){
    if(manual) alert('Add your API key in Settings first \u2014 the agents need it to run.');
    return;
  }
  // The in-flight guard must NOT live on S. S is replaced wholesale by applyPulled(), so a
  // background sync landing mid-cycle would wipe the flag and let a second cycle start on top
  // of the first; and because S persists, a crash mid-cycle would leave a stale `true` on disk
  // that blocks every future run. A module-level flag has neither problem.
  if(_agRunning) return;
  _agRunning = true; renderOps();
  let raised = 0;
  try{
    // Settled, not all: one specialist failing must not take the other two down with it.
    // Under the old single-call design a malformed reply cost every agent its night.
    const results = await Promise.all(AG_ORDER.map(function(id){
      return agRunSpecialist(id, manual).then(
        function(v){ return {id:id, ok:true, val:v}; },
        function(e){ return {id:id, ok:false, err:e}; });
    }));

    // CRITICAL: re-resolve state AFTER the await. applyPulled() replaces S wholesale, so a
    // reference captured before the await now points at an orphaned object that save() will
    // never serialize. That asymmetry -- log entries surviving while status/lastRun vanished --
    // is the fingerprint of this bug, and it has bitten this function before.
    const a2 = agState();
    const digest = [];
    let failures = 0;
    results.forEach(function(r){
      if(!r.ok || !r.val){
        failures++;
        agLog(r.id, 'I could not complete tonight\u2019s check ('+
          (r.ok ? 'unreadable reply' : (r.err && r.err.message) || 'error')+'). Nothing changed.');
        return;
      }
      raised += agIngest(a2, r.id, r.val);
      digest.push(AGENTS[r.id].name+': '+String(r.val.summary||'(nothing)'));
      // DELTA alone refreshes the Overload Status tab. Read-only and informational, so it sits
      // outside the proposal queue -- but still validated against freshly computed signals, and
      // on failure the PREVIOUS report is kept rather than cleared. A bad night should cost the
      // tab its newest commentary, not the commentary it already had.
      if(r.id==='delta'){
        try{
          const olv = olValidateReport(r.val.overload, olSignals());
          if(olv) a2.overload = olv;
          else if(r.val.overload) agLog('delta','Overload status update didn\u2019t pass the sanity check \u2014 kept the previous read rather than showing it.');
        }catch(e){ agLog('delta','Overload status update failed to parse ('+e.message+') \u2014 previous read kept.'); }
      }
    });
    save();
    renderOps();

    // ZULU last, and only if at least one specialist actually reported -- synthesising three
    // failures is a waste of a call.
    if(digest.length){
      try{
        const zres = await agRunLead(digest, manual);
        const a3 = agState();
        raised += agIngest(a3, 'zulu', zres);
        if(zres && zres.brief) agSetBrief(String(zres.brief));
      }catch(e){
        agLog('zulu','I could not write tonight\u2019s synthesis ('+e.message+'), but the specialists above still reported.');
      }
      // Sunday only, and its own try: a failed letter must not cost him the cycle that
      // already succeeded above it.
      if(agLetterDue()){
        try{
          const letter = await agWriteLetter(digest);
          if(letter){ agSetLetter(letter); agLog('zulu','Your weekly letter is ready.'); }
        }catch(e){
          agLog('zulu','I couldn\u2019t write this week\u2019s letter ('+e.message+'). Everything else above still stands.');
        }
      }
    }
    // "Nothing needed your attention" and "every agent errored" look identical from the
    // outside but mean opposite things, and only one of them is safe to trust. Never report
    // silence as an all-clear when it was actually a total failure.
    if(failures === AG_ORDER.length){
      agLog('zulu','Cycle failed: every agent errored or came back unreadable, so nothing was '+
        'checked tonight \u2014 no retry today. Use Run cycle now if you want another attempt.');
    } else if(!raised){
      agLog('zulu','Cycle complete \u2014 nothing needed your attention today.');
    }
  }catch(e){
    agLog('zulu','Cycle failed: '+e.message+' \u2014 no retry today; use Run cycle now if you want another attempt.');
  }finally{
    // Stamp the day even on failure, and again resolve fresh \u2014 the pull may have landed
    // between the try body and here. Previously this lived at the end of the try, so a thrown
    // parse left lastRun untouched, the "already ran today" gate stayed open, and the next
    // trigger fired a fresh cycle minutes later.
    const a4 = agState();
    a4.lastRun = todayKey(); a4.lastRunAt = new Date().toISOString();
    _agRunning = false; save(); renderOps();
  }
}

/* ZULU reads the other three and writes the synthesis plus the morning Daily Brief. It sees
   their conclusions rather than re-deriving them, which is the whole point of a lead. */
async function agRunLead(digest, manual){
  const pend = agPending().map(function(p){ return AGENTS[p.agent].name+': '+p.title; });
  const sc = currentDayKey();
  const sys = agSharedBrief()+
    '\n'+'You are ZULU, the lead. CHARLIE, DELTA and ECHO have each just reported. Your job is '+
    'synthesis and conflict-spotting, not repeating them. You rarely propose a fix of your own; '+
    'when two of them pull in opposite directions, say so and give him the options.'+
    agToolNote()+
    '\n'+'Respond with ONLY valid JSON:'+'\n'+
    '{"summary":"...","brief":"...","proposals":[]}'+'\n'+
    'summary = 1-3 sentences to Mark: what the three reports add up to, and any conflict between them.'+'\n'+
    'brief = his morning Daily Brief. 2-4 short sentences covering how recovered he is, what is '+
    'scheduled today, and anything actually waiting on him. Write it as something worth reading at '+
    '7am, not a status dump. If nothing needs him, say that plainly and confidently rather than '+
    'inventing something to fill the space \u2014 "nothing needs you today, train as planned" is a '+
    'complete and good brief.'+'\n'+
    'proposals = almost always []. Same rules and the same fix shapes as the specialists; anything '+
    'else is discarded.'+'\n'+
    'Do not describe anything as already changed. Nothing takes effect until he taps Approve.'+'\n'+
    '\n'+'WHAT THE SPECIALISTS REPORTED TONIGHT:'+'\n'+digest.join('\n')+
    '\n'+'\n'+'ALREADY WAITING ON HIS APPROVAL: '+(pend.length?pend.join('; '):'nothing')+
    '\n'+'TODAY IS: '+(sc==='REST'?'a REST day':sc+' \u2014 '+dayName(sc))+
    '\n'+agBaseContext('zulu');
  const {text} = await callClaudeWithData(
    [{role:'user', content:'Write tonight\u2019s synthesis and tomorrow\u2019s brief.'}],
    sys, 8000, {effort:'high'});
  return parseLooseJSON(text);
}

/* ---- the weekly coach letter ----
   A written synthesis in ZULU's voice, once a week, so the week reads as a story rather than
   four tabs of numbers he has to assemble himself. One extra call a week -- about a penny --
   and it deliberately runs at the END of the nightly cycle so it can use everything the
   specialists just found rather than re-deriving it. */
function agLetterDue(){
  const a = agState();
  // Sunday night: the week is finished, and it is the natural moment to look back at it.
  if(new Date().getDay() !== 0) return false;
  const wk = weekStartKey(todayKey());
  return !(a.letter && a.letter.week === wk);
}
async function agWriteLetter(digest){
  const sys = agSharedBrief()+
    '\n'+'You are ZULU, writing Mark\u2019s weekly coach letter. This is the one thing he reads that '+
    'is prose rather than numbers: a few paragraphs pulling the week together -- how training '+
    'actually went, what the bodyweight trend is really doing, what you want from him next week. '+
    'Write it TO him, in your own voice. Be specific and cite real figures, but this is a letter, '+
    'not a report: no bullet lists, no headings, no restating the dashboard. 200-350 words.'+
    '\n'+'If the week was unremarkable, say so honestly and briefly rather than inflating it. A '+
    'short honest letter beats a padded one.'+
    '\n'+'Do not describe anything as already changed \u2014 nothing takes effect until he approves it.'+
    agToolNote()+
    '\n'+'WHAT THE SPECIALISTS FOUND TONIGHT:'+'\n'+(digest||[]).join('\n')+
    '\n'+'\n'+agBaseContext('zulu');
  const {text} = await callClaudeWithData(
    [{role:'user', content:'Write this week\u2019s letter.'}], sys, 8000, {effort:'high'});
  return (text||'').trim();
}
function agSetLetter(text){
  const a = agState();
  a.letter = {text:text, at:new Date().toISOString(), week:weekStartKey(todayKey())};
}
function agLetter(){
  const a = agState();
  return (a.letter && a.letter.text) ? a.letter : null;
}

/* The Daily Brief is one string with a date on it, kept where every other agent output is
   kept so it syncs and expires the same way. Deliberately NOT a separate API call: it falls
   out of a synthesis ZULU is already doing, so it costs nothing extra. */
function agSetBrief(text){
  const a = agState();
  a.brief = {text:text, at:new Date().toISOString(), date:todayKey()};
}
function agBrief(){
  const a = agState();
  return (a.brief && a.brief.text) ? a.brief : null;
}


/* ---- per-agent chat (ZULU routes to the existing coach engine) ---- */
let agActiveChat = 'zulu';
function agSelectChat(id){ agActiveChat = id; renderOps(); }
async function agSendChat(id){
  const el = document.getElementById('agChatIn'); if(!el) return;
  const q = (el.value||'').trim(); if(!q) return;
  el.value='';
  const a = agState();
  agChatErr = null;
  a.chats[id].push({role:'user', content:q});
  save(); agThinkingFor = id; renderOps();
  try{
    const sys = agSharedBrief()+
      '\nYou are '+AGENTS[id].name+'. Answer only within your own domain ('+AGENTS[id].role+'). '+
      'If the question belongs to another agent, say which one and give a short answer anyway if you can. '+
      'You cannot change app state from this chat \u2014 structural changes come from the daily cycle or from ZULU. '+
      'If you think something should change, say so and tell him to run a cycle.'+
      agToolNote()+'\n'+
      coachMemContext()+trainingContext()+agContext();
    const msgs = a.chats[id].slice(-14).map(m=>({role:m.role, content:m.content}));
    // Read-only tools only: this chat still cannot change anything, it can look things up.
    const {text} = await callClaudeWithData(msgs, sys, 4000, {});
    // re-resolve: a sync pull during the await may have replaced S (see note in agRunAll)
    agState().chats[id].push({role:'assistant', content:text||'\u2014'});
    save(); agThinkingFor = null; renderOps();
  }catch(e){
    agThinkingFor = null;
    agChatErr = {id, msg:AGENTS[id].name+' unavailable: '+e.message};
    renderOps();
  }
}

   HOME  --  dashboard, status strip, notification centre

/* THE readiness reading, in one place, so the dashboard and the strip can never disagree
   about how recovered he is. Returns {pct, label, tone, source} or null.

   WHOOP is not connected yet (it cannot be, from a browser -- see the V4 notes), so this
   reads the self-reported check-in today and is written so that adding a WHOOP source later
   is one branch at the top rather than a rewrite of both surfaces. Every caller already
   renders `source`, so the day WHOOP lands the provenance is visible with no further work. */
function readinessNow(){
  const w = (S.whoop && S.whoop.recovery) || null;   // reserved for the WHOOP relay
  if(w && w.date === todayKey() && typeof w.score === 'number'){
    const p = Math.max(0, Math.min(100, Math.round(w.score)));
    return {pct:p, label:(p>=67?'high':p>=34?'moderate':'low'), tone:(p>=67?'good':p>=34?'mid':'low'), source:'WHOOP'};
  }
  const r = todayReadiness();
  if(!r) return null;
  const pct = {high:80, med:55, low:28}[r.tier];
  return {pct:pct, label:(r.tier==='med'?'moderate':r.tier), tone:(r.tier==='high'?'good':r.tier==='med'?'mid':'low'),
          source:'self-reported'};
}
function readinessColor(tone){
  return tone==='good' ? 'var(--cyan)' : tone==='low' ? 'var(--red)' : 'var(--amber)';
}

/* Today, in one object, shared by both surfaces. */
function dashToday(){
  const dk = currentDayKey();
  const rest = (dk === 'REST');
  return {dayKey:dk, rest:rest, name: rest ? 'Rest day' : (dayName(dk) || dk),
          logged: S.logs.some(function(l){ return l.date === todayKey(); })};
}

/* ---- the status strip ---- */
function statusStripHTML(){
  const rd = readinessNow();
  const t = dashToday();
  const streak = streakDays();
  const cell = function(label, value, colour, extra){
    return '<div class="sstrip-cell"><span class="sstrip-l">'+esc(label)+'</span>'+
      '<span class="sstrip-v"'+(colour?' style="color:'+colour+'"':'')+'>'+esc(value)+'</span>'+
      (extra?'<span class="sstrip-src">'+esc(extra)+'</span>':'')+'</div>';
  };
  let h = '<div class="sstrip">';
  h += rd ? cell('recovery', rd.label.toUpperCase(), readinessColor(rd.tone), rd.source==='WHOOP'?'whoop':'self')
          : cell('recovery', 'not logged', 'var(--dim)', 'tap Live');
  h += cell('streak', streak > 0 ? streak+'d' : '\u2014', streak>=3 ? 'var(--cyan)' : null);
  h += cell('today', t.rest ? 'REST' : t.dayKey, t.rest ? 'var(--dim)' : dayColor(t.dayKey));
  const pend = agPending().length;
  if(pend) h += cell('waiting', pend+' to approve', 'var(--amber)');
  return h + '</div>';
}
/* Painted directly rather than through a tab re-render, so the strip stays current even
   while an input has focus -- refreshBlocked() stops full repaints, and rightly so, but this
   is a read-only bar that cannot eat anything he has typed. */
function renderStatusStrip(){
  const el = document.getElementById('statusStrip');
  if(!el) return;
  // The one hard rule from the brief: never during a LIVE session.
  if(MODE === 'live'){ el.innerHTML = ''; return; }
  const html = statusStripHTML();
  if(el.innerHTML !== html) el.innerHTML = html;   // avoid pointless DOM churn

/* ---- notification centre ----
   In-app only, and deliberately so. A real push notification needs a service worker (and on
   iOS an installed PWA with one), and this app has none on purpose: there is no cache to
   bust, so every launch picks up the newest build. That auto-update property is worth more
   than a badge on the home screen, so this is a panel he opens rather than something that
   buzzes his phone. */
let notifOpen = false;
function notifItems(){
  const out = [];
  const brief = agBrief();
  if(brief && brief.date === todayKey()){
    out.push({tone:AGENTS.zulu.col, title:'Daily brief', body:brief.text, when:brief.at});
  }
  const letter = agLetter();
  if(letter){
    out.push({tone:AGENTS.zulu.col, title:'Weekly letter',
              body:String(letter.text).slice(0,180)+(letter.text.length>180?'\u2026':''),
              when:letter.at, go:"showReviewTab('ops')"});
  }
  agPending().forEach(function(p){
    out.push({tone:(AGENTS[p.agent]||{}).col||'var(--muted)',
              title:(AGENTS[p.agent]||{}).name+' \u2014 '+p.title,
              body:p.reasoning||'Waiting for your approval.', when:null, go:"showReviewTab('ops')"});
  });
  invActiveFlags().forEach(function(f){
    out.push({tone:'var(--amber)', title:'Investigation \u2014 '+f.title,
              body:(f.findings&&f.findings[0])||'Open the Investigate tab for detail.',
              when:null, go:"showReviewTab('invest')"});
  });
  const wr = waterReminder();
  if(wr) out.push({tone:'var(--cyan)', title:'Water', body:wr, when:null});
  return out;
}
/* A nudge, not a tracker. He does not log water and this app is not going to start asking
   him to; this just reminds him on the days it actually matters. */
function waterReminder(){
  const t = dashToday();
  if(t.rest) return '';
  const rd = readinessNow();
  const hard = rd && rd.tone === 'low';
  return 'Training day \u2014 drink through the session, not just after it.'+
         (hard ? ' Recovery is low today, so hydration and sleep matter more than the numbers.' : '');
}
function notifToggle(){
  notifOpen = !notifOpen;
  renderNotif();
}
function notifCount(){
  return agPending().length + invActiveFlags().length +
         ((agBrief() && agBrief().date === todayKey()) ? 1 : 0);
}
function renderNotif(){
  const btn = document.getElementById('notifBtn');
  const badge = document.getElementById('notifBadge');
  const panel = document.getElementById('notifPanel');
  if(!btn || !panel) return;
  const n = notifCount();
  if(badge){
    badge.textContent = n > 9 ? '9+' : String(n);
    badge.className = 'notif-badge'+(n?' on':'');
  }
  btn.className = 'notif-btn'+(n?' has':'');
  panel.className = 'notif-panel'+(notifOpen?' open':'');
  if(!notifOpen){ panel.innerHTML = ''; return; }
  const items = notifItems().filter(function(i){ return i.body || i.title; });
  let h = '<div class="notif-head"><span>Notifications</span>'+
          '<button class="pain-btn" style="margin-left:auto" onclick="notifToggle()">close</button></div>';
  h += items.length ? items.map(function(i){
        return '<div class="notif-item" style="border-left-color:'+i.tone+'"'+
          (i.go?' onclick="notifToggle();'+i.go+'" style="cursor:pointer;border-left-color:'+i.tone+'"':'')+'>'+
          '<div class="notif-t">'+esc(i.title)+'</div>'+
          '<div class="notif-b">'+esc(i.body)+'</div>'+
          (i.when?'<div class="notif-when">'+esc(agTimeAgo(i.when))+'</div>':'')+'</div>';
      }).join('')
    : '<div class="notif-empty">Nothing to tell you. No proposals waiting, no flags open, '+
      'and no brief yet today.</div>';
  panel.innerHTML = h;
}

/* ---- rendering ---- */
function agTimeAgo(iso){
  if(!iso) return 'never';
  const mins = Math.round((Date.now()-new Date(iso))/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const h = Math.round(mins/60); if(h < 24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}

/* Animation bookkeeping: only messages the user hasn't seen rendered before get the entrance
   animation. Without this, every live-refresh repaint would re-animate the whole transcript.
   A chat opened for the first time is treated as fully seen so history doesn't cascade in. */
const agSeen = {};
let agChatTall = false;
let agThinkingFor = null;   // agent id currently awaiting a reply
let agChatErr = null;       // {id, msg} \u2014 surfaced in-box instead of via DOM poking
function agChatToggleTall(){ agChatTall = !agChatTall; renderOps(); }
function agChatHTML(){

  });

    (agChatTall?'Shrink':'Expand')+'</button></div>';

  if(!msgs.length){
    h += '<div class="msg sys">'+esc(A.name)+' \u2014 '+esc(A.role)+'. '+
      (isZulu ? 'Carries everything Coach knew, including its memory and your full chat history.'
              : 'Ask about its domain; it reads your full training data.')+'</div>';
  }
  msgs.forEach((m,i)=>{

  if(agChatErr && agChatErr.id === id){
    h += '<div class="msg sys" style="color:var(--amber)">'+esc(agChatErr.msg)+'</div>';
  }
  agSeen[id] = msgs.length;
  h += '</div>'+
    '<div class="ag-chat-in">'+
    '<textarea id="agChatIn" placeholder="Ask '+esc(A.name)+'\u2026" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();'+
      (isZulu?'sendChat()':'agSendChat(\''+id+'\')')+';}"></textarea>'+
    '<button class="btn" onclick="'+(isZulu?'sendChat()':'agSendChat(\''+id+'\')')+'">Send</button></div></div>';
  if(msgs.length){
    h += '<div style="margin-top:6px"><button class="btn ghost sm" onclick="agClearChat(\''+id+'\')">Clear '+esc(A.name)+' chat</button></div>';
  }
  return h;
}
function agClearChat(id){
  if(!confirm('Clear '+AGENTS[id].name+'\u2019s chat history? '+(id==='zulu'?'Its memory is kept separately and stays.':'')+' This only clears the conversation, not proposals or the activity log.')) return;
  if(id==='zulu'){ S.chat = []; } else { agState().chats[id] = []; }

function renderOps(){
  const el = document.getElementById('ops'); if(!el) return;
  // Capture chat scroll BEFORE the repaint. Previously this function unconditionally slammed
  // scrollTop to the bottom on every render \u2014 fine when you'd just sent a message, but the
  // 30s live-refresh repaint then yanked you back down mid-read if you'd scrolled up. Now the
  // jump to bottom only happens when you were already near the bottom (or a message arrived).
  const oldBox = document.getElementById('agChatBox');
  let prevTop = null, wasAtBottom = true;
  if(oldBox){
    prevTop = oldBox.scrollTop;
    wasAtBottom = (oldBox.scrollHeight - oldBox.scrollTop - oldBox.clientHeight) < 60;
  }
  const a = agState();
  const msgCountBefore = agSeen[agActiveChat];
  agSweepExpired();
  const pend = agPending();
  let h = '<h2>Operations</h2>';
  h += '<div class="ag-bar">'+
    '<button class="btn sm" onclick="agRunAll(true)"'+(_agRunning?' disabled':'')+'>'+(_agRunning?'Running\u2026':'Run cycle now')+'</button>'+
    '<label class="ag-when" style="display:flex;align-items:center;gap:6px;cursor:pointer">'+
      '<input type="checkbox" '+(a.autoRun?'checked':'')+' onchange="agState().autoRun=this.checked;save();renderOps()" style="width:auto"> auto-run daily at 9 PM</label>'+
    '<span class="ag-when" style="margin-left:auto">last cycle: '+(a.lastRunAt?agTimeAgo(a.lastRunAt):'never')+'</span></div>';

  // hierarchy: ZULU on top, the three reports nested beneath
  h += '<div class="ag-lead">'+agCardHTML('zulu')+
       '<div class="ag-kids">'+AG_ORDER.map(agCardHTML).join('')+'</div></div>';

  const _brief = agBrief(), _letter = agLetter();
  if(_brief){
    h += '<div class="card" style="border-left:3px solid '+AGENTS.zulu.col+'">'+
      '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">'+
      '<b style="color:'+AGENTS.zulu.col+';letter-spacing:.04em">DAILY BRIEF</b>'+
      '<span class="ag-when">'+esc(fmtDate(_brief.date))+'</span></div>'+
      '<p class="small" style="margin-top:6px">'+esc(_brief.text)+'</p></div>';
  }
  if(_letter){
    h += subSection('Weekly letter \u2014 '+fmtDate(_letter.week),
      '<div class="card flat"><p class="small" style="white-space:pre-wrap;line-height:1.55">'+
      esc(_letter.text)+'</p></div>', false);
  }

  h += '<h2>Pending proposals'+(pend.length?' ('+pend.length+')':'')+'</h2>';
  h += pend.length ? pend.map(agPropHTML).join('')
                   : '<div class="card"><p class="ag-empty">Nothing awaiting your approval.</p></div>';

  h += '<h2>Agent chat</h2>'+agChatHTML();

  h += '<h2>Activity log</h2><div class="card"><div class="ag-log">';
  if(!a.log.length){
    h += '<p class="ag-empty">No activity yet. Run a cycle to get started.</p>';
  } else {
    h += a.log.slice(0,40).map(e=>{
      const A = AGENTS[e.agent]||{name:e.agent, col:'var(--muted)'};
      return '<div class="ag-le"><span class="ag-dot" style="background:'+A.col+';margin-top:6px"></span>'+
        '<div class="ag-le-b"><div class="ag-le-h" style="color:'+A.col+'">'+A.name+' \u00b7 '+
        new Date(e.at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</div>'+
        '<div class="ag-le-t">'+esc(e.text)+'</div></div></div>';
    }).join('');
  }
  h += '</div>'+(a.log.length?'<div style="margin-top:8px"><button class="btn ghost sm" onclick="if(confirm(\'Clear the activity log? Proposals and memory are kept.\')){agState().log=[];save();renderOps();}">Clear log</button></div>':'')+'</div>';

  el.innerHTML = h;
  const box = document.getElementById('agChatBox');
  if(box){
    const grew = msgCountBefore !== undefined && agSeen[agActiveChat] > msgCountBefore;
    if(wasAtBottom || grew || agThinkingFor) box.scrollTop = box.scrollHeight;
    else if(prevTop != null) box.scrollTop = prevTop;
  }
  _opsSig = opsSignature();
}
REVIEW_RENDER.ops = renderOps;
/* Coach is gone as a tab; anything that still calls renderCoach now repaints OPERATIONS.
   Declared last so hoisting makes this the live definition. */
function renderCoach(){ renderOps(); }

/* ---- 9 PM daily scheduler ---- */
function agMaybeAutoRun(){
  const a = agState();
  if(!a.autoRun || _agRunning) return;
  if(!S.settings.apiKey) return;
  if(a.lastRun === todayKey()) return;
  if(new Date().getHours() < 21) return;
  agRunAll(false);
}

/* ============================================================
   LIVE REFRESH \u2014 keep the open page current without a manual reload
   ============================================================ */
/* Repainting the DOM under someone's fingers is worse than slightly stale data, so this
   deliberately refuses to redraw in two cases: while a field has focus (it would blow away
   half-typed input), and during an active LIVE session (the dock can hold a weight/reps the
   user has typed but not yet logged \u2014 losing that mid-workout is unacceptable). */
function refreshBlocked(){
  const el = document.activeElement;
  if(el){
    const tag = (el.tagName||'').toLowerCase();
    if(tag==='input' || tag==='textarea' || tag==='select' || el.isContentEditable) return true;
  }
  if(MODE==='live' && live) return true;
  return false;
}
/* Cheap fingerprint of everything a review tab draws from. Ops has had one of these for a
   while (opsSignature); this is the same idea applied to every other tab, because a repaint
   that changes nothing is pure downside: it drops text selection, resets scroll inside
   cards, and interrupts whatever you were reading. changedAt catches every save() ; the
   explicit lengths catch the save(false) writers that deliberately do not touch it. The
   5-minute bucket lets relative timestamps refresh without thrashing the DOM every 30s. */
let _tabSig = '';
function tabSignature(){
  const a = S.agents || {};
  return [
    MODE, activeMainTab, navMemory[activeMainTab] || activeReviewTab,
    notifOpen?1:0,
    S.meta ? S.meta.changedAt : 0,
    S.logs.length, S.weights.length, S.nutrition.length, S.readiness.length,
    (a.proposals||[]).length, (a.log||[]).length,
    (S.invest && S.invest.flags ? S.invest.flags.length : 0),
    todayKey(),
    Math.floor(Date.now()/300000)
  ].join('|');
}
function rerenderActive(force){
  try{ invUpdateBadge(); }catch(e){}   // badge is cheap and safe to update regardless
  // Both of these are read-only bars. They are painted BEFORE the refreshBlocked() gate on
  // purpose: that gate exists to stop a repaint eating half-typed input, and neither of
  // these can do that. The brief asks the strip to stay current without a manual refresh,
  // and it would not if it sat behind the gate.
  try{ renderStatusStrip(); }catch(e){}
  try{ renderNotif(); }catch(e){}
  if(refreshBlocked()) return;
  try{
    if(MODE==='live'){ renderLive(); return; }
    // Nothing this tab draws has moved, so redrawing it can only take things away from the
    // user. Callers with a reason to repaint anyway (a sync pull just landed, the tab just
    // changed) pass force.
    const sig = tabSignature();
    if(!force && sig === _tabSig) return;
    _tabSig = sig;
    const sub = navMemory[activeMainTab] || activeReviewTab;
    const fn = REVIEW_RENDER[sub];
    // Operations holds a live chat transcript. Repainting it on a timer when nothing has
    // actually changed destroys text selection and is visible churn for no benefit, so skip
    // unless the signature moved. The signature includes a 5-minute bucket so relative
    // timestamps ("2m ago") still refresh periodically without thrashing the chat every 30s.
    if(fn === renderOps && opsSignature() === _opsSig) return;
    if(typeof fn === 'function') fn();
  }catch(e){ console.warn('rerenderActive failed', e); }
}
let _bgPulling = false;
async function bgSyncTick(){
  if(_bgPulling) return;
  if(document.visibilityState !== 'visible') return;   // don't burn API calls in the background
  if(!syncReady() || S.settings.autoSync === false) return;
  _bgPulling = true;
  try{
    await pushUnconfirmedChanges();
    const p = await fetchGistData();
    if(p.exportedAt > (S.meta ? S.meta.changedAt : 0)){
      applyPulled(p.data, p.exportedAt);
      setAccent(); renderHeader();
      rerenderActive(true);   // remote state genuinely changed — redraw regardless of the signature
    }
  }catch(e){ /* transient network/rate-limit \u2014 silent, next tick retries */ }
  _bgPulling = false;
}
function startLiveRefresh(){
  setInterval(bgSyncTick, 60000);          // pull other devices' changes while the tab is open
  setInterval(rerenderActive, 30000);      // repaint so relative timestamps + local state stay current
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible'){ bgSyncTick(); rerenderActive(); }
  });
  window.addEventListener('online', bgSyncTick);
}

/* ===================== BOOT ===================== */
try{ if(pruneRemovedKeys()) save(false); }catch(e){}
setAccent();
setupPWA();
buildBotNav();
// resume an in-progress session if one exists for today
const _draft = loadLiveDraft();
if(_draft){ live=_draft; liveActiveIdx = live.exercises.findIndex(e=>!e.done); if(liveActiveIdx<0) liveActiveIdx=0; }
try{ invAutoRun(); }catch(e){ console.warn('invAutoRun failed', e); }
renderLive();
/* Land on HOME rather than straight into the rack view.
   The one exception is a session already in progress: if he backgrounded the app mid-workout
   and came back, he wants the dock, not a dashboard telling him what he is already doing.
   Goes through setMode() rather than assigning MODE directly, because the two panes are shown
   and hidden by class -- setting MODE alone would leave HOME rendered underneath a visible
   LIVE pane. */
try{ setMode(_draft ? 'live' : 'review'); }catch(e){ console.warn('initial mode failed', e); }
// session clock ticker
setInterval(()=>{ if(live && MODE==='live') updateSessionBar(); }, 1000);
// review nav wiring
try{ renderSidenav(); }catch(e){}
// background sync + weekly audit (no-ops gracefully in sandbox)
// The initial pull is awaited before the agent scheduler's first check on purpose: running the
// cycle concurrently with a pull means the pull can swap S mid-flight. The stale-reference guards
// inside agRunAll make that survivable, but not racing at all is better than surviving the race.
// .catch keeps a failed/absent sync from blocking the agents entirely.
const _bootPull = (async()=>{ try{ await autoPullOnLoad(); }catch(e){} })();
try{ startUpdateWatcher(); }catch(e){}
try{ maybeRunAudit().then(()=>{ if(MODE==='review' && activeReviewTab==='progress') renderProgressV2(); }); }catch(e){}
// agents: expire stale proposals on load, then poll for the 9 PM window
try{ if(agSweepExpired()) save(false); }catch(e){}
_bootPull.then(()=>{
  try{ agMaybeAutoRun(); }catch(e){}
  try{ setInterval(agMaybeAutoRun, 15*60*1000); }catch(e){}
});
try{ startLiveRefresh(); }catch(e){}
</script>
