  pat.forEach((day,i)=>{
    const isToday = i===todayPos;
    let opts = '<option value="REST"'+(day==='REST'?' selected':'')+'>Rest</option>';
    Object.keys(S.split).forEach(k=>{ opts += '<option value="'+k+'"'+(day===k?' selected':'')+'>'+k+' \u2014 '+esc(S.split[k].name)+'</option>'; });
    h += '<div class="row" style="align-items:center'+(isToday?';background:rgba(246,134,47,.08);border-radius:8px;padding:4px 6px':'')+'">'+
      '<div style="flex:0 0 80px" class="small"><b>Day '+(i+1)+'</b>'+(isToday?' <span style="color:var(--amber)">\u2190 today</span>':'')+'</div>'+
      '<div style="flex:0 0 auto"><select onchange="cycleSetDay('+i+',this.value)">'+opts+'</select></div>'+
      '<div style="margin-left:auto;display:flex;gap:4px">'+
      (i>0?'<button class="btn ghost sm" title="Move earlier" onclick="cycleMoveDay('+i+',-1)">\u2191</button>':'')+
      (i<pat.length-1?'<button class="btn ghost sm" title="Move later" onclick="cycleMoveDay('+i+',1)">\u2193</button>':'')+
      '<button class="btn ghost sm" title="Remove this day" onclick="cycleRemoveDay('+i+')">\u2715</button></div></div>';
  });
  h += '</div><div style="margin-top:10px"><button class="btn sm ghost" onclick="cycleAddDay()">+ Add day to cycle</button></div>';
  h += '<p class="small" style="margin-top:8px;color:var(--dim)">The cycle repeats independent of the calendar, so training days drift across weekdays over time \u2014 that\u2019s expected. \u201cWeekly\u201d volume and the heatmap reset at the start of each full pass through this list, not after every rest day.</p>';
  return h;
}
function cycleSetAnchor(v){
  if(!v) return;
  scheduleInit(); S.cycleSchedule.anchor = v; save(); renderSettings(); renderToday(); setAccent(); renderHeader();
}
function cycleSetDay(i,v){
  scheduleInit(); S.cycleSchedule.pattern[i] = v; save(); renderSettings(); renderToday(); setAccent(); renderHeader();
}
function cycleMoveDay(i,dir){
  scheduleInit();
  const pat = S.cycleSchedule.pattern;
  const j = i+dir; if(j<0||j>=pat.length) return;
  const tmp = pat[i]; pat[i]=pat[j]; pat[j]=tmp;
  save(); renderSettings(); renderToday(); setAccent(); renderHeader();
}
function cycleAddDay(){
  scheduleInit(); S.cycleSchedule.pattern.push('REST'); save(); renderSettings();
}
function cycleRemoveDay(i){
  scheduleInit();
  const pat = S.cycleSchedule.pattern;
  if(pat.length<=1) return; // never allow an empty cycle
  pat.splice(i,1); save(); renderSettings(); renderToday(); setAccent(); renderHeader();
}
function scheduleRow(i, name){
  let opts = '<option value="REST"'+(S.schedule[i]==='REST'?' selected':'')+'>Rest</option>';
  Object.keys(S.split).forEach(k=>{ opts += '<option value="'+k+'"'+(S.schedule[i]===k?' selected':'')+'>'+k+' — '+esc(S.split[k].name)+'</option>'; });
  return '<div class="row" style="margin-bottom:6px;align-items:center"><div style="flex:0 0 110px" class="small"><b>'+name+'</b></div>'+
    '<div><select onchange="S.schedule['+i+']=this.value;save();setAccent();renderHeader();renderToday();">'+opts+'</select></div></div>';
}
function homeEquipInit(){
  if(!S.homeEquipment) S.homeEquipment = {dumbbells:[2,5,8,12,15,20,30,40,50], kettlebells:[18,26,35,44,53], hasBarbellRackBench:true, hasRower:true, hasBike:true};
  return S.homeEquipment;
}
function homeEquipmentCardHTML(){
  const he = homeEquipInit();
  return '<h2>Home Equipment</h2><div class="card">'+
    '<p class="small">Used when “Train at home today” is on — substituted exercises round their suggested weight to the nearest value in these lists instead of normal plate increments.</p>'+
    '<div style="margin-top:8px"><label>Dumbbells (lb, comma-separated)</label>'+
    '<input type="text" id="heDb" value="'+esc((he.dumbbells||[]).join(', '))+'"></div>'+
    '<div style="margin-top:8px"><label>Kettlebells (lb, comma-separated)</label>'+
    '<input type="text" id="heKb" value="'+esc((he.kettlebells||[]).join(', '))+'"></div>'+
    '<label style="margin-top:12px;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)">'+
    '<input type="checkbox" style="width:auto" id="heRack" '+(he.hasBarbellRackBench?'checked':'')+'> Have barbell + rack + bench at home</label>'+
    '<label style="margin-top:6px;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)">'+
    '<input type="checkbox" style="width:auto" id="heRower" '+(he.hasRower?'checked':'')+'> Have a rower at home</label>'+
    '<label style="margin-top:6px;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)">'+
    '<input type="checkbox" style="width:auto" id="heBike" '+(he.hasBike?'checked':'')+'> Have a bike at home</label>'+
    '<div style="margin-top:10px"><button class="btn sm" onclick="saveHomeEquipment()">Save</button> <span class="ok small" id="heMsg"></span></div></div>';
}
function parseWeightList(str){
  return (str||'').split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n)&&n>0)
    .filter((n,i,arr)=>arr.indexOf(n)===i).sort((a,b)=>a-b);
}
function saveHomeEquipment(){
  const he = homeEquipInit();
  he.dumbbells = parseWeightList($('#heDb').value);
  he.kettlebells = parseWeightList($('#heKb').value);
  he.hasBarbellRackBench = $('#heRack').checked;
  he.hasRower = $('#heRower').checked;
  he.hasBike = $('#heBike').checked;
  save(); renderSettings();
  const m=$('#heMsg'); if(m){ m.textContent='✓ saved'; setTimeout(()=>{const m2=$('#heMsg'); if(m2) m2.textContent='';},1500); }
}
function saveSettings(){
  S.settings.apiKey = $('#apiKey').value.trim();
  S.settings.repLow = parseInt($('#repLow').value)||8;
  S.settings.repHigh = parseInt($('#repHigh').value)||12;
  save(); $('#setMsg').textContent='✓ saved';
  setTimeout(()=>{const m=$('#setMsg'); if(m) m.textContent='';},1500);
}
const INC_PRESETS = [2.5, 5, 10, 15];
function splitEditorHTML(){
  let h = '';
  Object.keys(S.split).forEach(dk=>{
    const d = S.split[dk];
    const list = d.exercises || [];
    h += '<div class="sd-day"><div class="sd-dhead" onclick="toggleSdDay(\''+dk+'\')">'+
      '<span class="dk" style="color:'+(d.hex||'#8d909a')+'">'+dk+'</span>'+
      '<input class="dn" style="background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--text);padding:4px 8px;font-size:12px;flex:1;max-width:240px" value="'+esc(d.name||'')+'" onclick="event.stopPropagation()" onchange="renameDay(\''+dk+'\',this.value)">'+
      '<span class="chev" id="chev-'+dk+'">\u25be</span></div>'+
      '<div class="sd-body" id="sdbody-'+dk+'">';
    list.forEach((x,i)=>{
      const nm = exName(x), inc = exInc(x);
      const ff = typeof x === 'object' && !!x.formFocus;
      const str = typeof x === 'object' && x.repMode === 'str';
      h += '<div class="sd-ex">'+
        '<input class="nm" value="'+esc(nm)+'" onchange="renameEx(\''+dk+'\','+i+',this.value)">'+
        '<div class="inc-presets" title="Weight increment">'+
          INC_PRESETS.map(v=>'<button class="'+(Math.abs(inc-v)<0.01?'sel':'')+'" onclick="setInc(\''+dk+'\','+i+','+v+')">+'+v+'</button>').join('')+
        '</div>'+
        '<button class="ord ff-toggle" title="Form Focus: hold weight, target '+FORM_LO+'\u2013'+FORM_HI+' reps, only bump after 3 straight easy sessions" style="'+(ff?'color:var(--good);border-color:var(--good);font-weight:800':'')+'" onclick="toggleFormFocus(\''+dk+'\','+i+')">FORM</button>'+
        '<button class="ord ff-toggle" title="Strength mode: 3\u20136 rep range, weight-first progression. Toggle to switch between STR (3\u20136) and HYP (your global setting)." style="'+(str?'color:#7b6ef6;border-color:#7b6ef6;font-weight:800':'')+'" onclick="toggleRepMode(\''+dk+'\','+i+')">'+(str?'STR':'HYP')+'</button>'+
        '<button class="ord" title="Move up" onclick="moveEx(\''+dk+'\','+i+',-1)">\u2191</button>'+
        '<button class="ord" title="Move down" onclick="moveEx(\''+dk+'\','+i+',1)">\u2193</button>'+
        '<button class="xx" title="Delete" onclick="delEx(\''+dk+'\','+i+')">\u00d7</button>'+
      '</div>';
    });
    h += '<div style="padding:8px 0 2px"><button class="btn ghost sm" onclick="addEx(\''+dk+'\')">+ add exercise</button></div>';
    h += '</div></div>';
  });
  return h;
}
function refreshSplitEditor(){ const w=$('#sdWrap'); if(w) w.innerHTML = splitEditorHTML(); }
function toggleSdDay(dk){
  const b = $('#sdbody-'+dk), c = $('#chev-'+dk);
  if(!b) return;
  const open = b.classList.toggle('open');
  if(c) c.textContent = open ? '\u25b4' : '\u25be';
}
function ensureObj(dk,i){
  const x = S.split[dk].exercises[i];
  if(typeof x === 'string') S.split[dk].exercises[i] = {name:x, inc:incFor(x)};
  return S.split[dk].exercises[i];
}
function renameDay(dk,v){ S.split[dk].name = v.trim()||S.split[dk].name; save(); setAccent(); renderHeader(); }
function renameEx(dk,i,v){
  const o = ensureObj(dk,i); const nv = v.trim();
  if(nv) o.name = nv;
  save();
}
function setInc(dk,i,v){ ensureObj(dk,i).inc = v; save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open'); }
function toggleFormFocus(dk,i){
  const o = ensureObj(dk,i);
  o.formFocus = !o.formFocus;
  save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open'); renderToday();
}
function moveEx(dk,i,dir){
  const list = S.split[dk].exercises; const j = i+dir;
  if(j<0||j>=list.length) return;
  [list[i],list[j]]=[list[j],list[i]]; save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open');
}
function delEx(dk,i){
  const nm = exName(S.split[dk].exercises[i]);
  if(!confirm('Remove "'+nm+'" from '+dk+'? (Your logged history for it is kept.)')) return;
  S.split[dk].exercises.splice(i,1); save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open');
}
function addEx(dk){
  const nm = prompt('New exercise name for '+dk+':');
  if(!nm||!nm.trim()) return;
  S.split[dk].exercises.push({name:nm.trim(), inc:incFor(nm.trim())});
  save(); refreshSplitEditor(); $('#sdbody-'+dk).classList.add('open');
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ironhub_backup_'+todayKey()+'.json';
  a.click();
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const p = JSON.parse(r.result);
      if(!p.logs || !p.split) throw new Error('Not an Iron Hub backup');
      if(!confirm('Replace ALL current data with this backup ('+p.logs.length+' sessions)?')) return;
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), p);
      save(); location.reload();
    }catch(e){ alert('Import failed: '+e.message); }
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('This wipes every log, weight entry, and setting. Export first if you want a backup. Continue?')) return;
  if(!confirm('Last check — really delete everything?')) return;
  localStorage.removeItem(LS_KEY); location.reload();
}

/* ================= SHELL ================= */
function renderHeader(){
  const dk = currentDayKey();
  $('#hdrDate').innerHTML = '<b>'+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+'</b>';
  $('#hdrDay').textContent = dk==='REST' ? 'Rest Day' : dk+' · '+S.split[dk].name;
  $('#hdrDay').style.background = dk==='REST' ? '#8d909a' : dayColor(dk);
}
</script>
<script>
/* ============================================================
   IRON HUB V2 — tactical shell, LIVE/REVIEW modes, live engine
   Built on the V1 engine above (reused verbatim).
   ============================================================ */

/* ---- overrides of V1 header/accent (V2 has its own chrome) ---- */
function setAccent(){ document.documentElement.style.setProperty('--accent', 'var(--amber)'); }
function renderHeader(){ /* V2 uses the topbar; no per-day header plate */ }

/* ===================== MODE SWITCHING ===================== */
let MODE = 'live';
function setMode(m){
  MODE = m;
  document.getElementById('liveMode').classList.toggle('hidden', m!=='live');
  document.getElementById('reviewMode').classList.toggle('hidden', m!=='review');
  document.getElementById('mLive').classList.toggle('on', m==='live');
  document.getElementById('mReview').classList.toggle('on', m==='review');
  buildBotNav();
  if(m==='live'){ renderLive(); try{ renderSidenav(); }catch(e){} }
  else { showMainTab(activeMainTab, navMemory[activeMainTab]); }
  try{ invUpdateBadge(); }catch(e){}
  window.scrollTo({top:0, behavior:'instant'});
}
/* ===================== REVIEW NAV ===================== */
let activeReviewTab = 'progress';
const REVIEW_RENDER = {progress:renderProgressV2, road:renderRoad, bulk:renderBulk, fuel:renderFuel, coach:renderCoach, log:renderLog, settings:renderSettings};

/* ============================================================
   V3 NAVIGATION — 7 main categories with embedded subcategories.
   Desktop: left sidebar accordion. Mobile: bottom nav + pill strip.
   Old tab ids keep working through the showReviewTab shim.
   ============================================================ */
const NAV_MODEL = [
  {id:'progress',  label:'Progress',    ic:'\u25d4', subs:[
    {id:'progress', label:'Overview'},
    {id:'log',      label:'Log'}]},
  {id:'plan',      label:'Plan',        ic:'\u25a6', subs:[
    {id:'meso',     label:'Mesocycle'}]},
  {id:'analytics', label:'Analytics',   ic:'\u223f', subs:[
    {id:'an_over',     label:'Overview'},
    {id:'road',        label:'Road'},
    {id:'an_strength', label:'Strength curve'},
    {id:'an_fatigue',  label:'Fatigue'},
    {id:'an_recovery', label:'Recovery'},
    {id:'an_dev',      label:'Development'},
    {id:'an_pred',     label:'Predictions'}]},
  {id:'bulk',      label:'Bulk',        ic:'\u25c6', subs:[
    {id:'bulk',     label:'Bodyweight'},
    {id:'fuel',     label:'Fuel'}]},
  {id:'invest',    label:'Investigate', ic:'\u26a0', subs:[
    {id:'invest',   label:'Flags'}]},
  {id:'ops',       label:'Operations',  ic:'\u25c9', short:'Ops', subs:[
    {id:'ops',      label:'Agents'}]},
  {id:'settings',  label:'Settings',    ic:'\u2699', subs:[
    {id:'settings', label:'General'},
    {id:'library',  label:'Library'}]}
];
/* old flat tab id -> [mainId, sectionId] */
const NAV_LEGACY = {
  progress:['progress','progress'], log:['progress','log'],
  meso:['plan','meso'],
  road:['analytics','road'], an_over:['analytics','an_over'], an_strength:['analytics','an_strength'],
  an_fatigue:['analytics','an_fatigue'], an_recovery:['analytics','an_recovery'],
  an_dev:['analytics','an_dev'], an_pred:['analytics','an_pred'],
  bulk:['bulk','bulk'], fuel:['bulk','fuel'],
  invest:['invest','invest'],
  // Coach was folded into ZULU inside OPERATIONS \u2014 keep the old id routing so any
  // existing showReviewTab('coach') call still lands somewhere real instead of Progress.
  coach:['ops','ops'], ops:['ops','ops'],
  settings:['settings','settings'], library:['settings','library']
};
let activeMainTab = 'progress';
let navMemory = {};   // remembers last sub per main tab, session-scoped

function navMain(id){ return NAV_MODEL.find(n=>n.id===id); }
function showMainTab(mainId, subId){
  const m = navMain(mainId); if(!m) return;
  activeMainTab = mainId;
  const sub = subId || navMemory[mainId] || m.subs[0].id;
  navMemory[mainId] = sub;
  activeReviewTab = sub;   // keep the legacy pointer accurate for boot re-renders
  document.querySelectorAll('#reviewMode main section').forEach(s=>s.classList.toggle('on', s.id===sub));
  renderSidenav(); renderSubnav(); buildBotNav();
  (REVIEW_RENDER[sub]||function(){})();
  try{ invUpdateBadge(); }catch(e){}
  window.scrollTo({top:0, behavior:'instant'});
}
function renderSidenav(){
  const el = document.getElementById('sidenav'); if(!el) return;
  let h = '<div class="sn-brand">IRON<span>HUB</span></div>';
  h += '<button class="sn-item sn-live '+(MODE==='live'?'on':'')+'" onclick="setMode(\'live\')"><span class="sn-ic">\u26a1</span>Live</button>';
  h += '<div class="sn-sep"></div>';
  NAV_MODEL.forEach(m=>{
    const on = MODE==='review' && m.id===activeMainTab;
    const badge = (m.id==='invest') ? '<span class="sn-badge" id="snInvBadge"></span>' : '';
    h += '<button class="sn-item '+(on?'on':'')+'" onclick="setMode(\'review\');showMainTab(\''+m.id+'\')"><span class="sn-ic">'+m.ic+'</span>'+m.label+badge+'</button>';
    if(on && m.subs.length>1){
      h += '<div class="sn-subs">';
      m.subs.forEach(s=>{
        const son = navMemory[m.id]===s.id;
        h += '<button class="sn-sub '+(son?'on':'')+'" onclick="showMainTab(\''+m.id+'\',\''+s.id+'\')">'+s.label+'</button>';
      });
      h += '</div>';
    }
  });
  el.innerHTML = h;
}
function renderSubnav(){
  const el = document.getElementById('subnav'); if(!el) return;
  const m = navMain(activeMainTab);
  if(!m || m.subs.length<2){ el.innerHTML=''; el.classList.remove('has'); return; }
  el.classList.add('has');
  el.innerHTML = m.subs.map(s=>{
    const on = navMemory[m.id]===s.id;
    return '<button class="'+(on?'on':'')+'" onclick="showMainTab(\''+m.id+'\',\''+s.id+'\')">'+s.label+'</button>';
  }).join('');
}

/* mobile bottom nav: Live + all 7 categories */
function buildBotNav(){
  const nav = document.getElementById('botnav'); if(!nav) return;
  let h = '<button class="ni '+(MODE==='live'?'on':'')+'" onclick="setMode(\x27live\x27)"><span class="ic">\u26a1</span>Live</button>';
  NAV_MODEL.forEach(m=>{
    const on = MODE==='review' && m.id===activeMainTab;
    const badge = (m.id==='invest') ? '<span class="ni-badge" id="niInvBadge"></span>' : '';
    const short = m.short || m.label.slice(0, m.id==='invest'?6:9);
    h += '<button class="ni review-tint '+(on?'on':'')+'" onclick="setMode(\x27review\x27);showMainTab(\x27'+m.id+'\x27)"><span class="ic">'+m.ic+badge+'</span>'+short+'</button>';
  });
  nav.innerHTML = h;
}
/* legacy shim: every old showReviewTab('x') call still lands in the right place */
function showReviewTab(t){
  const map = NAV_LEGACY[t];
  if(map){ showMainTab(map[0], map[1]); return; }
  showMainTab('progress');
}

/* Progress in V2 = ported V1 progress + a body heatmap card on top */
function renderProgressV2(){
  renderProgress();
  const sec = document.getElementById('progress');
  if(sec && !sec.querySelector('.bodymap-card')){
    const wrap = document.createElement('div');
    wrap.innerHTML = bodyMapCardHTML('progress');
    sec.insertBefore(wrap.firstElementChild, sec.firstChild);
    initBodyMap('progress');
  }
}

/* ===================== WELCOME ===================== */
function greetWord(){
  const h = new Date().getHours();
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  return 'Good evening';
}
function streakDays(){
  // count consecutive prior calendar days (incl today) that have at least one log
  const have = new Set(S.logs.map(l=>l.date));
  let n=0; const d=new Date();
  for(let i=0;i<60;i++){
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(scheduledDayFor(k)==='REST'){ d.setDate(d.getDate()-1); continue; } // rest days don't break streak
    if(have.has(k)) n++; else if(i>0) break; // allow today to be not-yet-done
    d.setDate(d.getDate()-1);
  }
  return n;
}
function coachPlanBannerHTML(){
  clearExpiredCoachDayPlan();
  const p = S.coachDayPlan;
  if(!p || p.date!==todayKey()) return '';
  return '<div class="coach-plan-banner"><span class="cpb-tag">COACH · TODAY</span>'+
    '<span class="cpb-txt">'+esc(p.day)+' is set to a custom plan: '+esc(p.exercises.join(', '))+'</span>'+
    '<button class="cpb-x" onclick="S.coachDayPlan=null;save();renderLive()" title="Cancel today-only plan">&times;</button></div>';
}
function welcomeHTML(){
  const dk = currentDayKey();
  const name = 'Mark';
  let sub, cta;
  const sCount = streakDays();
  const streakTxt = sCount>=2 ? ' You\u2019re '+sCount+' sessions into a clean stretch — keep it rolling.' : '';
  if(dk==='REST'){
    sub = 'Rest day on the schedule. Recovery is where the size gets built — eat your surplus and sleep.'+streakTxt;
    cta = '<button class="btn ghost sm" onclick="liveStartPicker()">Train anyway</button>'+
          '<button class="btn ghost sm" onclick="setMode(\'review\')">Review stats</button>';
  } else {
    const already = S.logs.some(l=>l.date===todayKey());
    sub = already
      ? 'You already logged '+dk+' today. Open the session to add more, or review your trends.'+streakTxt
      : dk+' is on deck — '+S.split[dk].name+'.'+streakTxt+' Tap below when you\u2019re at the rack.';
    cta = '<button class="btn primary sm" onclick="liveStartSession()">'+(already?'Log again':'Start session')+'</button>'+
          '<button class="btn ghost sm" onclick="setMode(\'review\')">Review stats</button>';
  }
  const homeOn = homeActiveToday();
  const homeToggle = '<button class="btn ghost sm" style="margin-top:8px'+(homeOn?';color:var(--good);border-color:var(--good);font-weight:800':'')+'" onclick="toggleHomeToday()" title="Substitutes/skips per exercise from the split editor, rounds weights to your home dumbbells/kettlebells, and keeps Investigation from misreading a lighter session as a decline.">'+
    (homeOn?'✓ Training at home today':'Train at home today')+'</button>';
  const bpDone = !!bpTodayEntry();
  const bpBtn = '<button class="btn ghost sm" style="margin-top:8px" onclick="openBenchPractice()" title="Standalone home bench frequency work — a few quick sets, kept separate from your tracked split, progression, and Investigation.">'+
    (bpDone?'✓ Bench practice logged':'Bench Practice')+'</button>';
  return '<div class="welcome"><div class="greet">'+greetWord()+', <span class="accent">'+esc(name)+'</span></div>'+
    '<div class="submsg">'+sub+'</div>'+coachPlanBannerHTML()+'<div class="wcta">'+cta+'</div>'+homeToggle+bpBtn+'</div>';
}

/* ===================== LIVE SESSION ENGINE ===================== */
const LIVE_KEY = 'ironhub:live';
let live = null;      // active session runtime
let liveActiveIdx = 0;

function loadLiveDraft(){
  try{ const raw=localStorage.getItem(LIVE_KEY); if(!raw) return null; const d=JSON.parse(raw);
    return (d && d.date===todayKey()) ? d : null; }catch(e){ return null; }

function buildOneLiveExercise(nm, homeEquipList){
  const tier = currentReadinessTier();
  if(deloadActive()){
    const dex = deloadExercise(nm);
    dex._decision = {code:'deload', moved:false, reason:'Deload week — loaded ~60% for 2 light sets. This session is excluded from progression and trend charts.'};
    return dex;
  }
  const rec = recommend(nm, tier);
  let firstW = (rec.sets && rec.sets[0] && rec.sets[0].w!=='') ? +rec.sets[0].w : '';
  const {lo,hi} = exRepMode(nm);
  let decision; try{ decision = classifyDecision(nm, tier); }catch(e){ decision = null; }
  // investigation target override (reset & rebuild)
  const _ov = (typeof invOverrideFor==='function') ? invOverrideFor(nm) : null;
  if(_ov){
    firstW = _ov.w;
    rec.target = _ov.w+' lb \u00d7 '+lo+'\u2013'+hi+' (rebuild)';
    rec.detail = _ov.note+'. Keep every rep clean \u2014 climbing back fast is the point.';
    decision = {code:'inv-override', moved:true, reason:'Investigation fix active: targets reset to '+_ov.w+' lb through '+fmtDate(_ov.until)+' to rebuild momentum.'};
  }
  let planned = (rec.sets||[]).length||3;
  if(liveTrimVol){ planned = Math.max(2, planned-1); rec.detail = (rec.detail||'')+' Volume trimmed for low readiness \u2014 quality over quantity today.'; }
  let backoffW = backoffWeightFor(nm, +firstW||0);
  // HOME mode: the normal progression engine above still computes a suggested weight
  // (and backoff) \u2014 it just gets snapped to what's actually on hand (dumbbells/
  // kettlebells come in fixed increments, not 5-lb plate math) instead of the
  // exercise's usual increment.
  if(homeEquipList && homeEquipList.length){
    if(firstW!=='' && firstW!=null) firstW = roundToEquipList(+firstW, homeEquipList);
    if(backoffW) backoffW = roundToEquipList(backoffW, homeEquipList);
  }
  return {
    name:nm, repMode:isStrMode(nm)?'str':'hyp', formFocus:isFormFocus(nm),
    targetW:firstW, lo:lo, hi:hi,
    backoffW: backoffW,
    recTarget:rec.target, recDetail:rec.detail,
    planned:planned,
    sets:[], done:false, _decision:decision,
    advW:firstW, advLo:lo, advHi:hi, advTag:'', advCls:'', advMsg:rec.detail,
    _swapped:false,
    _homeEquipList: (homeEquipList && homeEquipList.length) ? homeEquipList : null
  };
}
function buildLiveExercises(dk){
  clearExpiredCoachDayPlan();

  let names = plan ? plan.exercises.slice() : dayExNames(dk);
  const homeEquipByName = {};
  if(homeActiveToday()){
    const mapped = [];
    names.forEach(nm=>{
      if(homeSkipFor(nm)) return; // omitted from a HOME session, shorter workout not a forced substitute
      const sub = homeSubFor(nm);
      if(sub && sub.name){
        mapped.push(sub.name);
        homeEquipByName[sub.name] = (homeEquipInit()[sub.equip==='kb'?'kettlebells':'dumbbells']) || [];
      } else {

/* intra-session autoregulation: tune the NEXT set from the last one */
function intraAdvice(ex){
  const sets = ex.sets;
  if(!sets.length) return {w:ex.targetW, lo:ex.lo, hi:ex.hi, tag:'', cls:'', msg:ex.recDetail};
  const last = sets[sets.length-1];
  const r=+last.r||0, e=last.e, w=+last.w||0;
  const lo=ex.lo, hi=ex.hi, inc=incForExercise(ex.name);
  if(e==='fail' || (r>0 && r<lo)){
    let dw=Math.max(w-inc,inc);
    if(ex._homeEquipList) dw = roundToEquipList(dw, ex._homeEquipList);
    return {w:dw, lo:lo, hi:hi, tag:'Back off', cls:'back', msg:'That set fell short — drop to '+dw+' lb and keep the reps clean.'};
  }
  // Top set is done \u2014 drop to the backoff load for the remaining sets. Deliberately placed
  // AFTER the fail branch: if the top set actually fell short, that safety response wins and
  // we never suggest a weight higher than the autoregulated one.
  if(ex.backoffW && ex.backoffW < w){
    const bw = ex.backoffW;
    const grindNote = e==='grind' ? ' That one was a grind, so the lighter sets should feel right.' : '';
    return {w:bw, lo:lo, hi:hi, tag:'Backoff', cls:'hold',
      msg:'Top set logged at '+w+' lb. Backoff sets run '+bw+' lb \u2014 same rep target, more speed on the bar.'+grindNote};
  }
  if(r>=hi && (e==='easy'||!e)){
    return {w:w, lo:lo, hi:hi, tag:'Strong', cls:'up', msg:'Top of the range — hold '+w+'. Keep this up and you earn a jump next session.'};
  }
  if(e==='grind'){
    return {w:w, lo:lo, hi:hi, tag:'Hold', cls:'hold', msg:'That was a grind — stay at '+w+', match the reps, stop one short of failure.'};
  }
  return {w:w, lo:lo, hi:hi, tag:'On target', cls:'hold', msg:'Solid — repeat '+w+' lb and chase one more rep than last set.'};
}

/* Smart rest: exercise type + rep mode + how the last set actually went. */
function smartRestSecs(ex){
  if(ex._deload || deloadActive()) return {secs:75, why:'Deload \u2014 keep it moving'};
  const comp = (typeof mesoIsCompound==='function') ? mesoIsCompound(ex.name) : true;
  let secs = comp ? (ex.repMode==='str' ? 195 : 150) : 90;
  let why = comp ? (ex.repMode==='str' ? 'Heavy compound' : 'Compound') : 'Isolation';
  const last = ex.sets[ex.sets.length-1];
  if(last){
    if(last.e==='grind' || last.e==='fail'){ secs += 30; why += ' \u00b7 hard set'; }
    else if(last.e==='easy' && !comp){ secs -= 15; why += ' \u00b7 easy set'; }
    const best = bestE1RM(ex.name);
    if(comp && best>0 && (+last.w||0) >= best*0.9){ secs += 30; why += ' \u00b7 near-max load'; }
  }
  return {secs:Math.max(45, secs), why};
}

function logLiveSet(i){
  const ex = live.exercises[i];

  const r = parseInt(document.getElementById('dockR').value);
  if(!(w>0) || !(r>0)){ alert('Enter weight and reps for this set.'); return; }
  ex.sets.push({w:w, r:r, e:liveDockEff||undefined});
  liveDockEff = '';
  saveLiveDraft();
  if(ex._1rm && ex._1rmRamp){
    const step = ex._1rmRamp[ex.sets.length-1];
    startRest(step ? rampRestSecs(step) : 180, i);
  } else {
    startRest(smartRestSecs(ex).secs, i);

function finishExercise(i){
  live.exercises[i].done = true;

  const next = live.exercises.findIndex((e,idx)=>idx>i && !e.done);
  liveActiveIdx = next>=0 ? next : live.exercises.findIndex(e=>!e.done);
  if(liveActiveIdx<0) liveActiveIdx = i;
  liveDockEff=''; stopRest(); saveLiveDraft(); renderLive();
}

/* ---- end session: consolidate -> log -> PRs -> summary ---- */
function endLiveSession(){
  const entries = live.exercises.filter(e=>e.sets.length).map(e=>({exercise:e.name, sets:e.sets.map(s=>({w:s.w,r:s.r,e:s.e}))}));
  if(!entries.length){ live=null; clearLiveDraft(); renderLive(); return; }
  const before = snapshotPRs();
  const prsBefore = {};
  entries.forEach(en=>{ prsBefore[en.exercise]=actualPR(en.exercise); });
  // capture engine decisions + deload flag for the system logger
  const decisions = {};
  live.exercises.forEach(e=>{ if(e._decision) decisions[e.name]=e._decision; });
  const isDeload = deloadActive() || live.exercises.some(e=>e._deload);
  const logRec = {id:Date.now(), date:todayKey(), day:live.day, entries, decisions};
  if(isDeload) logRec.deload = true;
  if(live.home) logRec.home = true;
  S.logs.push(logRec);
  save();
  // compute summary
  const totalSets = entries.reduce((a,e)=>a+e.sets.length,0);
  const totalVol = entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const newPRs = [];
  entries.forEach(en=>{
    const prevPR = prsBefore[en.exercise];
    const heaviest = en.sets.reduce((m,s)=>(+s.w>(m?+m.w:0)?s:m), null);
    if(heaviest && (!prevPR || +heaviest.w>prevPR.w)) newPRs.push(en.exercise+' · '+heaviest.w+' lb × '+heaviest.r);
  });
  const note = sessionNote(entries, live.day);
  showSummary({exercises:entries.length, sets:totalSets, vol:totalVol, prs:newPRs, note});
  checkPRs(before);  // fires the e1RM-based PR overlay if applicable (after summary close it remains)
  live=null; clearLiveDraft(); stopRest();
  // resolving a flag here without refreshing the banner leaves stale WATCH/ALERT text on screen
  // until the next unrelated tab click quietly swaps it out \u2014 refresh both together, always.
  try{ invCheckResolutions(); invUpdateBadge(); }catch(e){}
}
function sessionNote(entries, dk){
  // compare to previous same-day session
  const prior = S.logs.filter(l=>l.day===dk && l.date!==todayKey()).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!prior) return 'First '+dk+' session on record — this is your baseline. Every one from here builds on it.';
  const volOf = l=>l.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const todayVol = entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const pv = volOf(prior);
  if(pv<=0) return 'Solid work logged. Keep the effort tags honest and the targets sharpen.';
  const delta = Math.round((todayVol-pv)/pv*100);
  if(delta>=3) return 'Total tonnage up '+delta+'% vs your last '+dk+'. That\u2019s real progressive overload — exactly the goal.';
  if(delta<=-8) return 'Tonnage down '+Math.abs(delta)+'% vs last '+dk+'. Could be a lighter day or fewer sets — no problem if it was deliberate, worth a look if not.';
  return 'Right on pace with your last '+dk+' (tonnage '+(delta>=0?'+':'')+delta+'%). Consistent is what compounds.';
}

/* ===================== REST TIMER ===================== */
const RT_C = 2*Math.PI*70;
/* Wall-clock rest timer: stores endTime so background pauses don't lose time.
   On visibilitychange (returning to app), paintRest() recalculates from real clock. */
let rest = {running:false, endTime:0, total:0, exIdx:-1, timer:null};
function restSecsRemaining(){ return Math.max(0, Math.round((rest.endTime - Date.now()) / 1000)); }
function startRest(seconds, exIdx){
  stopRest();
  rest = {running:true, endTime:Date.now()+seconds*1000, total:seconds, exIdx:exIdx, timer:setInterval(restTick,500)};
  mountRestTimer();
}
function stopRest(){ if(rest.timer) clearInterval(rest.timer); rest.running=false; rest.timer=null; const slot=document.getElementById('restSlot'); if(slot) slot.innerHTML=''; }
function restTick(){ paintRest(); if(restSecsRemaining()<=0){ clearInterval(rest.timer); rest.timer=null; } }
function adjustRest(d){ rest.endTime = Math.max(Date.now(), rest.endTime + d*1000); rest.total = Math.max(rest.total, restSecsRemaining()); paintRest(); }
function skipRest(){ stopRest(); }
document.addEventListener('visibilitychange', function(){ if(!document.hidden && rest.running) paintRest(); });
function mountRestTimer(){
  const slot = document.getElementById('restSlot');
  if(!slot){ return; }
  slot.innerHTML =
    '<div class="resttimer"><div class="rt-arcwrap"><svg width="158" height="158" viewBox="0 0 158 158">'+
    '<circle class="rt-bg" cx="79" cy="79" r="70"></circle>'+
    '<circle class="rt-fg" id="rtArc" cx="79" cy="79" r="70" stroke-dasharray="'+RT_C.toFixed(1)+'" stroke-dashoffset="0"></circle>'+
    '</svg><div class="rt-center"><div class="rt-time" id="rtTime">0:00</div><div class="rt-label" id="rtLabel">Rest</div></div></div>'+
    '<div class="rt-btns"><button onclick="adjustRest(-15)">−15s</button><button onclick="adjustRest(15)">+15s</button><button onclick="skipRest()">Skip</button></div></div>';
  paintRest();
}
function paintRest(){
  const arc=document.getElementById('rtArc'), t=document.getElementById('rtTime'), l=document.getElementById('rtLabel');
  if(!arc||!t) return;
  const secs = restSecsRemaining();
  const frac = rest.total>0 ? Math.max(0,secs/rest.total) : 0;
  arc.style.strokeDashoffset = (RT_C*(1-frac)).toFixed(1);
  t.textContent = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  if(secs<=0){ arc.style.stroke='var(--cyan)'; t.style.color='var(--cyan)'; if(l) l.textContent='Ready — go'; }
  else { arc.style.stroke='var(--amber)'; t.style.color='var(--text)'; if(l) l.textContent='Rest'; }
}

/* ===================== BODY HEATMAP ===================== */
const BM_GROUPS = ['chest','traps','frontDelts','sideDelts','rearDelts','biceps','triceps','forearms','abs','obliques','lats','lowerBack','glutes','quads','hamstrings','calves'];
const BM_LABELS = {chest:'Chest',traps:'Trapezius',frontDelts:'Front delts',sideDelts:'Side delts',rearDelts:'Rear delts',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',abs:'Abs',obliques:'Obliques',lats:'Lats',lowerBack:'Lower back',glutes:'Glutes',quads:'Quads',hamstrings:'Hamstrings',calves:'Calves'};
/* map fine heatmap groups -> V1 broad groups */
const BM_TO_BROAD = {chest:'Chest',traps:'Back',frontDelts:'Shoulders',sideDelts:'Shoulders',rearDelts:'Shoulders',biceps:'Biceps',triceps:'Triceps',forearms:'Biceps',abs:'Abs',obliques:'Abs',lats:'Back',lowerBack:'Back',glutes:'Glutes',quads:'Quads',hamstrings:'Hamstrings',calves:'Quads'};
const BM_C = {green:'#3a9e6e',yellow:'#c9952a',red:'#c04040',off:'#39424e'};
const BM_OP = {green:.92,yellow:.86,red:.86,off:.34};
let bmState = {}; // container -> {mode, selected}

function bmTrainedDays(broad){
  // most recent date a broad group was trained, days ago (Infinity if never)
  let best=Infinity;
  S.logs.forEach(l=>{ const hit=l.entries.some(e=>{const m=musclesFor(e.exercise); return m.p.includes(broad)||m.s.includes(broad);});
    if(hit){ const d=daysBetween(l.date, todayKey()); if(d>=0 && d<best) best=d; } });
  return best;
}
function bmWeeklyVol(broad){
  const wk = weekStartKey();
  let v=0;
  S.logs.filter(l=>l.date>=wk).forEach(l=>l.entries.forEach(e=>{const m=musclesFor(e.exercise); const n=e.sets.length;
    if(m.p.includes(broad)) v+=n; if(m.s.includes(broad)) v+=n*0.5;}));
  return v;
}
function bmProgress(broad){
  // green if any exercise hitting this group improved e1RM in last ~4wks, yellow if flat, red if declining, off if no data
  // walk every exercise actually logged (not just the hardcoded EX_MUSCLES keys) so keyword-fallback
  // exercises (e.g. anything matched via musclesFor's regex fallback) aren't silently excluded
  const seen = new Set();
  S.logs.forEach(l=>l.entries.forEach(e=>seen.add(e.exercise)));
  Object.keys(S.split).forEach(dk=>(S.split[dk].exercises||[]).forEach(x=>seen.add(exName(x))));
  let any=false, improved=false, declined=false;
  seen.forEach(ex=>{
    const m=musclesFor(ex); if(!m.p.includes(broad) && !m.s.includes(broad)) return;
    const pts=e1rmSeries(ex); if(pts.length<2) return; any=true;
    const recent=pts.slice(-4); const a=recent[0].v, b=recent[recent.length-1].v;
    if(b>a*1.01) improved=true; else if(b<a*0.99) declined=true;
  });
  if(!any) return 'off';
  if(improved) return 'green'; if(declined) return 'red'; return 'yellow';
}
function bmStatus(container, key){
  const mode = bmState[container].mode;
  const broad = BM_TO_BROAD[key];
  if(!broad) return 'off';
  if(mode==='today'){
    const dk=currentDayKey(); if(dk==='REST') return 'off';
    let st='off';
    dayExNames(dk).forEach(nm=>{const m=musclesFor(nm); if(m.p.includes(broad)) st='green'; else if(m.s.includes(broad)&&st==='off') st='yellow';});
    return st;
  }
  if(mode==='weekly'){
    const v=bmWeeklyVol(broad); if(v<=0) return 'off'; if(v<6) return 'red'; if(v<10) return 'yellow'; return 'green';
  }
  if(mode==='recovery'){
    const d=bmTrainedDays(broad); if(d===Infinity) return 'off'; if(d<2) return 'red'; if(d<4) return 'yellow'; return 'green';
  }
  if(mode==='progress'){ return bmProgress(broad); }
  return 'off';
}
function bmExercisesFor(key){
  const broad = BM_TO_BROAD[key];
  if(!broad) return [];
  // exercises in the user's own split that hit this group (primary first), then fall back to library
  const inSplit=[];
  for(const dk in S.split) for(const x of (S.split[dk].exercises||[])){
    const nm=exName(x); const m=musclesFor(nm);
    if(m.p.includes(broad)) inSplit.push({nm, pri:true}); else if(m.s.includes(broad)) inSplit.push({nm, pri:false});
  }
  const seen=new Set(); const uniq=[];
  inSplit.sort((a,b)=>(b.pri-a.pri)).forEach(o=>{ if(!seen.has(o.nm)){seen.add(o.nm); uniq.push(o.nm);} });
  return uniq.slice(0,4);
}

/* ===================== PWA (single-file) ===================== */
function setupPWA(){
  try{
    // generate a forge-diamond home-screen icon at runtime (no second file needed)
    function iconURL(size){
      const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
      x.fillStyle='#0E1217'; x.fillRect(0,0,size,size);
      const cx=size/2, r=size*0.27;
      x.save(); x.translate(cx,cx); x.rotate(Math.PI/4);
      x.strokeStyle='#F6862F'; x.lineWidth=size*0.05; x.strokeRect(-r,-r,2*r,2*r);
      x.fillStyle='#F6862F'; const ir=r*0.5; x.fillRect(-ir,-ir,2*ir,2*ir);
      x.restore();
      return c.toDataURL('image/png');
    }
    const i180=iconURL(180), i512=iconURL(512);
    const al=document.createElement('link'); al.rel='apple-touch-icon'; al.href=i180; document.head.appendChild(al);
    const fav=document.createElement('link'); fav.rel='icon'; fav.href=i180; document.head.appendChild(fav);
    const manifest={ name:'Iron Hub', short_name:'Iron Hub', start_url:'.', scope:'.', display:'standalone',
      background_color:'#0A0D11', theme_color:'#0E1217', orientation:'portrait',
      icons:[ {src:i512, sizes:'512x512', type:'image/png', purpose:'any maskable'}, {src:i180, sizes:'180x180', type:'image/png'} ] };
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const ml=document.createElement('link'); ml.rel='manifest'; ml.href=URL.createObjectURL(blob); document.head.appendChild(ml);
  }catch(e){ /* canvas unavailable (e.g. test env) — home-screen meta tags still apply */ }
}

/* ===================== MARKDOWN RENDERER ===================== */
function renderMarkdown(raw){
  let s = esc(raw);
  s = s.replace(/^## (.+)$/gm, '<span style="display:block;margin:10px 0 3px;font-weight:600;font-size:13.5px;color:var(--amber)">$1</span>');
  s = s.replace(/^### (.+)$/gm, '<span style="display:block;margin:8px 0 2px;font-weight:600;color:var(--text)">$1</span>');
  s = s.replace(/^# (.+)$/gm, '<span style="display:block;margin:10px 0 4px;font-weight:700;font-size:14px;color:var(--amber)">$1</span>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/^[-\u2022*] (.+)$/gm, '<div style="padding:2px 0 2px 14px;position:relative"><span style="position:absolute;left:4px;color:var(--amber)">\u00b7</span>$1</div>');
  s = s.replace(/\n\n+/g, '<div style="height:7px"></div>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

function setDeltaChip(name, setIdx, w, r){
  const ls=lastSessionFor(name); if(!ls||!ls.sets[setIdx]) return '';
  const pw=+ls.sets[setIdx].w||0, pr=+ls.sets[setIdx].r||0;
  const dw=w-pw, dr=r-pr;
  if(dw===0 && dr===0) return '<span class="delta same">=</span>';
  let parts=[];
  if(dw!==0) parts.push((dw>0?'+':'')+dw+'lb');
  if(dr!==0) parts.push((dr>0?'+':'')+dr+'r');
  const better = dw>0 || (dw===0&&dr>0);
  return '<span class="delta '+(better?'up':(dw<0&&dr<=0?'down':'same'))+'">'+parts.join(' ')+'</span>';
}

/* ===================== 5. DELOAD DETECTION ===================== */
function deloadCheck(){
  const reasons=[]; let score=0;
  const mains=['Barbell Bench Press','Barbell Back Squat'];
  // 1) main lift e1RM flat/declining over last 4 sessions
  mains.forEach(ex=>{
    const pts=e1rmSeries(ex); if(pts.length>=4){
      const recent=pts.slice(-4); const first=recent[0].v, last=recent[recent.length-1].v;
      if(last < first*0.985){ reasons.push(ex.replace('Barbell ','')+' e1RM has slipped over the last 4 sessions'); score+=2; }
      else if(last < first*1.005){ reasons.push(ex.replace('Barbell ','')+' has stalled (no e1RM gain in 4 sessions)'); score+=1; }
    }
  });
  // 2) recent grind/fail density across last ~10 logged sessions
  const recentLogs=[...S.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  let grind=0, total=0;
  recentLogs.forEach(l=>l.entries.forEach(e=>e.sets.forEach(s=>{ total++; if(s.e==='grind'||s.e==='fail') grind++; })));
  if(total>=10){ const pct=grind/total; if(pct>=0.4){ reasons.push(Math.round(pct*100)+'% of recent sets tagged grind/fail \u2014 effort is creeping up'); score+=2; } else if(pct>=0.25){ reasons.push('A quarter of recent sets are grinders'); score+=1; } }
  // 3) consecutive training weeks (sessions logged) without a light week
  const weeks=new Set(S.logs.map(l=>weekKeyOf(l.date)));
  if(weeks.size>=6){ reasons.push(weeks.size+' weeks of accumulated training on record'); score+=1; }
  let severity = score>=4 ? 'recommend' : score>=2 ? 'watch' : 'clear';
  return {severity, score, reasons};
}

/* ===================== 7. 1RM TEST PROTOCOL ===================== */
function oneRMRamp(target){
  target=Math.round(target);
  const round5=w=>Math.round(w/5)*5;
  const steps=[
    {pct:0,   reps:'8\u201310', rest:'\u2014',    label:'Empty bar', note:'Grease the groove'},
    {pct:.40, reps:5,          rest:'60s',  label:'Warm-up'},
    {pct:.60, reps:3,          rest:'90s',  label:'Warm-up'},
    {pct:.75, reps:2,          rest:'2 min', label:'Warm-up'},
    {pct:.85, reps:1,          rest:'2\u20133 min', label:'Primer'},
    {pct:.93, reps:1,          rest:'3\u20134 min', label:'Last primer', note:'Should move fast'},
    {pct:1.00,reps:1,          rest:'3\u20135 min', label:'1RM ATTEMPT', attempt:true},
    {pct:1.03,reps:1,          rest:'3\u20135 min', label:'If it flew \u2014 small jump', attempt:true}
  ];
  return steps.map(s=>({...s, w: s.pct===0 ? 'Bar' : round5(target*s.pct)}));
}

  const pr=actualPR(sel);

  let h='<p class="small">A structured warm-up ramp to a true 1-rep max. Test a main lift every 8\u201312 weeks \u2014 not more. Make sure you\u2019re fresh (ideally after a rest day) and have a spotter for bench.</p>';

     '<div><label>Lift</label><select id="rmLift" onchange="setRmLift(this.value)">'+mains.map(m=>'<option'+(m===sel?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select></div>'+

  const ramp=oneRMRamp(+est||135);
  h+='<div class="card" style="padding:0;overflow:hidden">';
  ramp.forEach((s,i)=>{
    h+='<div class="rm-step'+(s.attempt?' attempt':'')+'">'+
       '<div class="rm-w">'+(s.w==='Bar'?'Bar':s.w+'<span class="rm-lb">lb</span>')+'</div>'+
       '<div class="rm-mid"><div class="rm-label">'+esc(s.label)+(s.pct>0?' \u00b7 '+Math.round(s.pct*100)+'%':'')+'</div>'+(s.note?'<div class="rm-note">'+esc(s.note)+'</div>':'')+'</div>'+
       '<div class="rm-reps">\u00d7'+s.reps+'</div>'+
       '<div class="rm-rest">'+s.rest+'</div>'+
       '</div>';
  });
  h+='</div>';
  h+='<p class="small">After a successful single moves fast, take one more small jump (+3\u20135%). The first rep that grinds hard or stalls is your max for the day \u2014 stop there.</p>';

  // plate calculator
  h+='<div class="card"><div class="chart-h" style="margin-bottom:10px">Plate Calculator <span class="chart-sub">45 lb bar</span></div>'+
     '<div class="row" style="margin-bottom:10px">'+
     '<div><label>Weight (lb)</label><input id="pcWeight" inputmode="numeric" placeholder="185" oninput="calcPlates(this.value)"></div>'+
     '</div>'+
     '<div id="pcOut" class="small" style="font-family:var(--mono);line-height:2"></div></div>';

  el.innerHTML=h;

  // pre-fill plate calc with current target
  const pcIn = document.getElementById('pcOut');
  if(pcIn) calcPlates(+est||135);
}

function calcPlates(total){
  const out = document.getElementById('pcOut'); if(!out) return;
  total = Math.round(+total||0);
  const BAR = 45;
  if(total < BAR){ out.innerHTML='<span style="color:var(--red)">Below bar weight (45 lb)</span>'; return; }
  if(total === BAR){ out.innerHTML='Empty bar · 45 lb'; return; }
  let per = (total - BAR) / 2;
  const plates = [45,35,25,10,5,2.5];
  const used = []; let rem = per;
  plates.forEach(p=>{ while(rem >= p-0.001){ used.push(p); rem -= p; } });
  if(rem > 0.1){ out.innerHTML='<span style="color:var(--amber)">Cannot make '+total+' lb exactly with standard plates ('+rem.toFixed(1)+' lb short)</span>'; return; }
  // group plates
  const counts = {}; used.forEach(p=>counts[p]=(counts[p]||0)+1);
  const summary = plates.filter(p=>counts[p]).map(p=>counts[p]+'\u00d7'+p).join(' + ');
  out.innerHTML='<div style="color:var(--amber);font-size:15px;margin-bottom:4px">'+summary+' <span style="font-size:11px;color:var(--dim)">per side</span></div>'+
    '<div style="color:var(--muted)">Total: <b style="color:var(--text)">'+total+' lb</b> · '+used.length+' plate'+(used.length!==1?'s':'')+' per side</div>';
}

/* ===================== 8. SLEEP / PERFORMANCE ===================== */
const SLEEP_SCORE={'<6':1,'6-7':2,'7-8':3,'8+':4};
function quickLogSleep(bucket){
  const k=todayKey();
  let rd=S.readiness.find(r=>r.date===k);
  if(rd){ rd.sleep=bucket; } else { S.readiness.push({date:k, sleep:bucket, sore:'', energy:'', tier:'ok'}); }
  save(); renderSleep();
}
function sleepPerfData(){
  // pair each day's sleep bucket with that day's best e1RM across logged lifts
  const out=[];
  S.readiness.forEach(r=>{
    if(!r.sleep || !SLEEP_SCORE[r.sleep]) return;
    const log=S.logs.find(l=>l.date===r.date); if(!log) return;
    let best=0;
    log.entries.forEach(e=>e.sets.forEach(s=>{ const v=epley(+s.w||0,+s.r||0); if(v>best) best=v; }));
    if(best>0) out.push({date:r.date, sleep:SLEEP_SCORE[r.sleep], bucket:r.sleep, perf:Math.round(best)});
  });
  return out;
}
function renderSleep(){
  const el=document.getElementById('sleep'); if(!el) return;
  const today=S.readiness.find(r=>r.date===todayKey());
  let h='<p class="small">Log how you slept and the app tracks whether your strength actually tracks with sleep. Sleep is logged automatically when you do a pre-session check-in too.</p>';
  h+='<div class="card"><div class="chart-h" style="margin-bottom:8px">Last night\u2019s sleep'+(today&&today.sleep?' <span class="pill" style="border-color:var(--cyan-dim);color:var(--cyan)">logged: '+esc(today.sleep)+'h</span>':'')+'</div>'+
     '<div class="sleep-btns">'+['<6','6-7','7-8','8+'].map(b=>'<button class="'+(today&&today.sleep===b?'sel':'')+'" onclick="quickLogSleep(\''+b+'\')">'+b+'h</button>').join('')+'</div></div>';
  const data=sleepPerfData();
  if(data.length<3){
    h+='<div class="card"><p class="small">Not enough overlapping data yet \u2014 keep logging sleep and training for about a week and a correlation view will appear here. ('+data.length+'/3 days so far.)</p></div>';
  } else {
    const good=data.filter(d=>d.sleep>=3), poor=data.filter(d=>d.sleep<=2);
    const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b.perf,0)/arr.length):0;
    const gAvg=avg(good), pAvg=avg(poor);
    h+='<div class="card"><div class="chart-h" style="margin-bottom:10px">Sleep vs strength output</div>';
    if(good.length && poor.length){
      const diff=gAvg-pAvg; const pct=pAvg?Math.round(diff/pAvg*100):0;
      h+='<div class="stats" style="margin-bottom:10px">'+
        '<div class="stat"><div class="v good">'+gAvg+'</div><div class="l">Avg e1RM \u00b7 7h+ sleep</div><div class="s">'+good.length+' days</div></div>'+
        '<div class="stat"><div class="v '+(pAvg<gAvg?'bad':'')+'">'+pAvg+'</div><div class="l">Avg e1RM \u00b7 under 7h</div><div class="s">'+poor.length+' days</div></div>'+
        '</div>';
      h+='<p class="small" style="color:var(--text)">'+(diff>0
        ? 'On nights you slept 7h+, your best lifts averaged <b style="color:var(--cyan)">'+pct+'% higher</b>. The pattern is real \u2014 protect your sleep like it\u2019s part of the program, because it is.'
        : 'Interestingly, no clear strength penalty from shorter sleep in your data so far. Keep logging \u2014 small samples can hide the effect, and sleep still drives recovery and growth beyond just today\u2019s numbers.')+'</p>';
    } else {
      h+='<p class="small">You\u2019ve been consistent on one side of the sleep range \u2014 once you have a mix of good and short nights logged, the comparison will populate.</p>';
    }
    // simple trend of perf points
    h+='<div style="margin-top:10px">'+lineChart(data.map(d=>({date:d.date,v:d.perf})),'#B79BFF')+'</div></div>';
  }
  el.innerHTML=h;
}

/* ===================== 1RM LIVE MODE ===================== */
function rampRestSecs(step){
  const r = step.rest||'';
  if(!r||r==='—') return 60;
  if(/^60/.test(r)) return 60;
  if(/^90/.test(r)) return 90;
  if(/2 min$/.test(r)) return 120;
  if(/2/.test(r)&&/3/.test(r)) return 150;
  if(/3/.test(r)&&/4/.test(r)) return 210;
  if(/3/.test(r)&&/5/.test(r)) return 240;
  return 120;
}
function activate1RM(i){
  if(event) event.stopPropagation();
  const ex = live.exercises[i];
  const e1 = Math.round(bestE1RM(ex.name)||0);
  const pr = (typeof actualPR==='function') ? actualPR(ex.name) : null;
  const suggested = e1 || (pr?pr.w:0) || ex.targetW || 135;
  const inp = prompt('1RM target weight (lb) — adjust if needed:', suggested);
  if(inp===null) return; // cancelled
  const target = parseInt(inp)||suggested;
  ex._1rm = true;
  ex._1rmTarget = target;
  ex._1rmRamp = oneRMRamp(target);
  ex.sets = [];
  liveDockEff = '';
  saveLiveDraft();
  renderLive();
  document.getElementById('liveex-'+i).scrollIntoView({behavior:'smooth',block:'center'});
}
function cancel1RM(i){
  if(event) event.stopPropagation();
  live.exercises[i]._1rm = false;
  live.exercises[i]._1rmRamp = null;
  live.exercises[i].sets = [];
  saveLiveDraft();
  renderLive();
}

      (step.rest&&step.rest!=='\u2014'?'<span style="font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto">'+esc(step.rest)+'</span>':'')+

    h += '</div>';

    h += '<div class="dockbtns">'+
      '<button class="btn primary" onclick="logLiveSet('+i+')">'+(isAttempt?'Log attempt':'Log set')+'</button>'+
      (curStep>=ramp.length-1?'<button class="btn" onclick="finishExercise('+i+')">Done with this lift</button>':'')+
      '</div>';
    h += '</div>';
    h += '<div id="restSlot"></div>';
  } else if(allDone && active){
    h += '<div class="livedock"><div class="dock-presc" style="color:var(--cyan)">All ramp steps logged. Move on when ready.</div>'+
      '<div class="dockbtns"><button class="btn" onclick="finishExercise('+i+')">Mark done</button></div></div>';

  h += '</div>';
  return h;

/* ===================== ENGINE DECISION CLASSIFIER ===================== */
/* Mirrors recommend()'s decision tree, returns a structured, concise decision
   for the internal system logger. One entry per exercise per session. */
function classifyDecision(ex, ready){
  const nm = exName(ex);
  const hist = historyFor(nm);
  const ff = isFormFocus(nm);
  const rm = exRepMode(nm);
  const lo = ff ? FORM_LO : rm.lo, hi = ff ? FORM_HI : rm.hi;
  if(!hist.length) return {code:'first', from:null, to:null, moved:false,
    reason:'First time logging this lift \u2014 no target set yet. Pick a weight for '+lo+'\u2013'+(lo+2)+' clean reps.'};
  const last = hist[0];
  const topW = Math.max(...last.sets.map(s=>+s.w||0));
  const topSets = last.sets.filter(s=>(+s.w||0)===topW);
  const minReps = Math.min(...topSets.map(s=>+s.r||0));
  const maxReps = Math.max(...topSets.map(s=>+s.r||0));
  const str = !ff && isStrMode(nm);
  const ceilReps = str ? maxReps : minReps;
  let inc = incForExercise(nm);
  const effs = topSets.map(s=>s.e).filter(Boolean);
  const hadFail = effs.includes('fail');
  const hadGrind = effs.includes('grind') || hadFail;
  const allEasy = effs.length===topSets.length && effs.length>0 && effs.every(e=>e==='easy');

  if(isBodyweight(nm)) return {code:'bw', from:null, to:null, moved:false,
    reason:'Bodyweight movement \u2014 progression tracked by reps and control, not load.'};

  if(ff){
    const streak = consecutiveEasyStreak(hist);
    if(hadFail){ const dw=Math.max(topW-inc,inc); return {code:'form-back', from:topW, to:dw, moved:true,
      reason:'Form Focus: a set broke down last time \u2014 stepped back '+topW+'\u2192'+dw+' lb to rebuild clean reps.'}; }
    if(streak>=FORM_STREAK_NEEDED){ const nw=topW+inc; return {code:'form-increase', from:topW, to:nw, moved:true,
      reason:'Form Focus: '+streak+' straight sessions tagged easy across all sets \u2014 control earned the bump '+topW+'\u2192'+nw+' lb.'}; }
    if(minReps<lo) return {code:'form-build', from:topW, to:topW, moved:false,
      reason:'Form Focus: last dipped below '+lo+' reps \u2014 held at '+topW+' lb to rebuild control before loading.'};
    return {code:'form-hold', from:topW, to:topW, moved:false,
      reason:'Form Focus: held at '+topW+' lb \u2014 '+streak+'/'+FORM_STREAK_NEEDED+' easy sessions logged toward the next bump.'};
  }

  let stall=false;
  if(hist.length>=3){
    const w2=Math.max(...hist[1].sets.map(s=>+s.w||0)), w3=Math.max(...hist[2].sets.map(s=>+s.w||0));
    if(w2===topW && w3===topW){
      const ts2=hist[1].sets.filter(s=>+s.w===w2);
      const ceil2 = str ? Math.max(...ts2.map(s=>+s.r||0)) : Math.min(...ts2.map(s=>+s.r||0));
      if(ceilReps<=ceil2) stall=true;
    }
  }
  if(ceilReps>=hi){
    if(isMaxed(nm)){
      // Earned a jump, but there's no heavier setting to jump to. Keep the load and let the
      // rep ceiling drift up rather than telling him to add weight that doesn't exist.
      return {code:'maxed-ceiling', from:topW, to:topW, moved:false,
        reason:'Hit the '+hi+'-rep ceiling at '+topW+' lb, but this machine is MAXED \u2014 no heavier setting. Add a rep beyond '+hi+', add a set, or slow the eccentric instead of adding load.'};
    }
    if(ready==='low') return {code:'defer', from:topW, to:topW, moved:false,
      reason:'Earned the jump (hit '+hi+' reps), but readiness was low \u2014 deferred, repeated '+topW+' lb to take the jump fresh.'};
    if(allEasy){ const nw=topW+inc*2; return {code:'double', from:topW, to:nw, moved:true,
      reason:'Hit the '+hi+'-rep ceiling AND all sets tagged easy \u2014 double jump '+topW+'\u2192'+nw+' lb.'}; }
    const nw=topW+inc; return {code:'increase', from:topW, to:nw, moved:true,
      reason:'Hit the '+hi+'-rep ceiling ('+(str?'top set':'every top set')+') \u2014 weight up '+topW+'\u2192'+nw+' lb, reps reset to '+lo+'.'+(hadGrind?' (last was a grind \u2014 expect heavy.)':'')};
  }
  if(stall && isMaxed(nm)) return {code:'maxed-hold', from:topW, to:topW, moved:false,
    reason:'Holding at '+topW+' lb \u2014 this machine is MAXED, so a flat weight here is the ceiling, not a stall. Chase reps or an extra set.'};
  if(stall) return {code:'stall', from:topW, to:topW, moved:false,
    reason:'3 sessions at '+topW+' lb with no rep progress \u2014 held to break the stall (tighten rest or drop 10% to rebuild).'};
  if(minReps>=lo){
    let r='In range but not at ceiling \u2014 held at '+topW+' lb, '+(str?'push top set to '+hi+' reps':'add a rep to your weakest set')+' before load moves.';
    if(allEasy) r='In range and all tagged easy \u2014 held at '+topW+' lb but leaving reps in the tank; take sets 1\u20132 shy of failure.';
    else if(hadFail) r='In range with a failed set \u2014 held at '+topW+' lb to win back the reps cleanly.';
    return {code:'hold', from:topW, to:topW, moved:false, reason:r};
  }
  if(hadFail){ const dw=Math.max(topW-inc,inc); return {code:'deload-back', from:topW, to:dw, moved:true,
    reason:'Below range with failure tags \u2014 stepped back '+topW+'\u2192'+dw+' lb to own the range, then climb.'}; }
  return {code:'build', from:topW, to:topW, moved:false,
    reason:'Below range \u2014 held at '+topW+' lb to climb back to '+lo+' reps per set before adding load.'};
}

/* Retro decision for logs saved without a stored decision (old/manual/screenshot).
   Compares each exercise's top weight to the previous non-deload session. */
function retroDecision(log, exercise){
  const priors = [...S.logs].filter(l=>l.date<log.date && !l.deload && l.entries.some(e=>e.exercise===exercise))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const cur = log.entries.find(e=>e.exercise===exercise);
  if(!cur) return null;
  const curTop = Math.max(...cur.sets.map(s=>+s.w||0));
  if(!priors.length) return {moved:false, reason:'First recorded session for this lift.'};
  const prev = priors[0].entries.find(e=>e.exercise===exercise);
  const prevTop = Math.max(...prev.sets.map(s=>+s.w||0));
  if(curTop>prevTop) return {moved:true, reason:'Weight moved up '+prevTop+'\u2192'+curTop+' lb vs previous session.'};
  if(curTop<prevTop) return {moved:true, reason:'Weight stepped down '+prevTop+'\u2192'+curTop+' lb vs previous session.'};
  return {moved:false, reason:'Held at '+curTop+' lb (same as previous session).'};
}

/* build deload version of an exercise: 60% of last real working weight, 2 sets */
function deloadExercise(nm){
  const hist = historyFor(nm); // already excludes prior deloads
  const rm = exRepMode(nm);
  let baseW = '';
  if(hist.length){ const topW = Math.max(...hist[0].sets.map(s=>+s.w||0)); baseW = topW; }
  const dw = baseW ? Math.max(Math.round((baseW*0.6)/5)*5, 5) : '';
  const reps = rm.lo;
  return {
    name:nm, repMode:isStrMode(nm)?'str':'hyp', formFocus:isFormFocus(nm),
    targetW:dw, lo:rm.lo, hi:rm.hi,
    recTarget:(dw?dw+' lb':'light')+' \u00d7 '+reps+' (deload)',
    recDetail:'Deload: '+(dw?'~60% of your '+baseW+' lb working weight':'go light')+', 2 easy sets at '+reps+' reps. Stay 3\u20134 reps from failure \u2014 this is active recovery, not training.',
    planned:2, _deload:true,
    sets:[], done:false,
    advW:dw, advLo:rm.lo, advHi:rm.hi, advTag:'DELOAD', advCls:'hold',
    advMsg:'Deload set \u2014 keep it light and clean, well short of failure.'
  };
}

/* ===================== IDEAL PROJECTION + DUAL LINE CHART ===================== */
function idealRateWeekly(ex){
  const nm = exName(ex);
  // compounds progress faster in absolute terms; use % of starting e1RM per week
  if(isPlateLift(nm) || isStrMode(nm) || /squat|bench|deadlift|press|row/i.test(nm)) return 0.0125;
  return 0.0075;
}
function idealSeries(ex, actualPts){
  if(!actualPts || actualPts.length<1) return [];
  const start = actualPts[0].v;
  const t0 = new Date(actualPts[0].date).getTime();
  const rate = idealRateWeekly(ex); // fraction of start per week (linear)
  return actualPts.map(p=>{
    const wks = (new Date(p.date).getTime()-t0)/(7*86400000);
    return {date:p.date, v: Math.round((start + start*rate*wks)*10)/10};
  });
}
function dualLineChart(actual, ideal){
  const W=700, H=200, P=36;
  if(!actual.length) return '<p class="small">No data yet.</p>';
  if(actual.length===1){
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><circle cx="'+(W/2)+'" cy="'+(H/2)+'" r="4" fill="var(--amber)"/><text x="'+(W/2)+'" y="'+(H/2-12)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+actual[0].v+' lb e1RM \u2014 log another session to see the trend</text></svg>';
  }
  const all = actual.concat(ideal);
  const t0=new Date(actual[0].date).getTime(), t1=new Date(actual[actual.length-1].date).getTime()||t0+1;
  const vmin=Math.min(...all.map(p=>p.v)), vmax=Math.max(...all.map(p=>p.v));
  const pad=(vmax-vmin)*0.15||5;
  const x=t=>P+((t-t0)/(t1-t0||1))*(W-2*P);
  const y=v=>H-P-((v-(vmin-pad))/((vmax+pad)-(vmin-pad)))*(H-2*P);
  const pathOf=pts=>{ let d=''; pts.forEach((p,i)=>{ d+=(i?'L':'M')+x(new Date(p.date).getTime()).toFixed(1)+' '+y(p.v).toFixed(1)+' '; }); return d; };
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  [vmin,(vmin+vmax)/2,vmax].forEach(v=>{
    svg+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/>'+
         '<text x="'+(P-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--dim)">'+Math.round(v)+'</text>';
  });
  // ideal (behind, lower opacity, dashed)
  if(ideal.length>=2){
    svg+='<path d="'+pathOf(ideal)+'" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-dasharray="5 5" opacity="0.4" stroke-linejoin="round"/>';
  }
  // actual (front, solid)
  svg+='<path d="'+pathOf(actual)+'" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round"/>';
  actual.forEach(p=>{ svg+='<circle cx="'+x(new Date(p.date).getTime())+'" cy="'+y(p.v)+'" r="3.5" fill="var(--amber)"/>'; });
  svg+='<text x="'+P+'" y="'+(H-8)+'" font-size="10" fill="var(--dim)">'+fmtDate(actual[0].date)+'</text>';
  svg+='<text x="'+(W-P)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="var(--dim)">'+fmtDate(actual[actual.length-1].date)+'</text>';
  svg+='</svg>';
  return svg;
}

      h+='<div class="stats" style="margin-top:10px">'+

/* ============================================================
   INVESTIGATION SYSTEM — diagnose, recommend, apply, resolve
   Categories: bulk | lift | split  ·  Severity: yellow < orange < red
   ============================================================ */
function invState(){
  if(!S.invest) S.invest = {flags:[], history:[], lastAuto:{}, overrides:{}};
  if(!S.invest.overrides) S.invest.overrides = {};
  if(!S.invest.history) S.invest.history = [];
  if(!S.invest.lastAuto) S.invest.lastAuto = {};
  return S.invest;
}
function invUid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const INV_SEV_RANK = {yellow:1, orange:2, red:3};
const INV_SEV_COLOR = {yellow:'#dfae36', orange:'var(--amber)', red:'var(--red)'};
const INV_SEV_LABEL = {yellow:'ADVISORY', orange:'WATCH', red:'WARNING'}; // display text only \u2014 internal severity keys (yellow/orange/red) stay as-is everywhere else
const INV_CAT_LABEL = {bulk:'BULK', lift:'STRENGTH', split:'SPLIT'};

/* -------------------- INVESTIGATORS (pure analysis) -------------------- */
/* Each returns {severity:null|'yellow'|'orange'|'red', key, title, findings:[], fix:{label, desc, type, payload}} */

function investigateBulk(){
  const sm = bodyweightSeriesSmoothed();
  const f = S.fuel||{};
  const cal = f.calTarget||3000, pro = f.proTarget||150;
  const findings = [];
  if(sm.length < 3){
    return {severity:null, key:'bulk', title:'Bulk check', findings:['Fewer than 3 weeks of bodyweight data \u2014 not enough to judge a trend yet. Keep weighing in most mornings.'], fix:null};
  }
  const recent = sm.slice(-4); // last ~4 weekly averages
  const reg = linreg(recent);
  const rate = reg ? reg.slope*7 : 0;
  const cur = sm[sm.length-1].v;
  findings.push('Trailing rate: '+(rate>=0?'+':'')+rate.toFixed(2)+' lb/week (weekly-averaged, last '+recent.length+' weeks). Current: '+cur.toFixed(1)+' lb.');
  const proFloor = Math.round(cur*0.95); // ~1g/lb guideline
  let severity=null, title='Bulk on track', fix=null;
  if(rate < -0.15){
    severity='red'; title='Losing weight mid-bulk';
    findings.push('You\u2019re in a deficit or at maintenance despite bulking intent \u2014 muscle gain is severely limited without a surplus.');
    fix={label:'Raise calorie target +300', desc:'Bump daily target '+cal+' \u2192 '+(cal+300)+' cal. Re-check in two weeks \u2014 the goal is +0.5\u20131 lb/week.', type:'cal', payload:{delta:300}};
  } else if(rate < 0.25){
    severity='orange'; title='Bulk rate too slow';
    findings.push('Under the 0.5\u20131 lb/week lean-bulk pocket \u2014 progress is being left on the table.');
    fix={label:'Raise calorie target +250', desc:'Bump daily target '+cal+' \u2192 '+(cal+250)+' cal to get into the 0.5\u20131 lb/week band.', type:'cal', payload:{delta:250}};
  } else if(rate > 1.5){
    severity='orange'; title='Bulk rate too fast';
    findings.push('Above ~1.5 lb/week \u2014 at this pace a meaningful share of the gain is fat, not muscle.');
    fix={label:'Trim calorie target \u2212200', desc:'Drop daily target '+cal+' \u2192 '+(cal-200)+' cal to settle back toward 1 lb/week.', type:'cal', payload:{delta:-200}};
  } else if(rate > 1.0){
    severity='yellow'; title='Bulk slightly hot';
    findings.push('Slightly above the 1 lb/week upper bound \u2014 fine short-term, worth watching.');
    fix=null;
  }
  if(pro < proFloor){
    findings.push('Protein target '+pro+'g is under the ~1g/lb guideline ('+proFloor+'g at your weight).');
    if(!fix && severity===null){ severity='yellow'; title='Protein target low'; }
    if(!fix) fix={label:'Raise protein to '+proFloor+'g', desc:'Set protein target '+pro+' \u2192 '+proFloor+'g/day.', type:'pro', payload:{to:proFloor}};
  }
  return {severity, key:'bulk', title, findings, fix};
}

/* Heaviest weight actually loaded in the most recent non-deload session of this lift.
   Reset targets MUST be built from this, never from e1RM. e1RM is an Epley-estimated
   one-rep max, so any fraction of it lands well above a real working set \u2014 a 225x10
   working set estimates to ~300 e1RM, and 90% of that is 270, a weight never actually
   lifted. deloadExercise() already anchors to real working weight; the investigation
   resets were the odd one out. */
function invLastWorkingWeight(nm){
  const hist = historyFor(nm); // newest first, deloads already excluded
  if(!hist.length) return 0;
  return Math.max(0, ...hist[0].sets.map(s=>+s.w||0));
}

function investigateLift(nm){
  const pts = e1rmSeries(nm, {excludeHome:true});
  const findings = [];
  if(pts.length < 4){
    return {severity:null, key:'lift:'+nm, title:nm, findings:['Only '+pts.length+' logged session'+(pts.length===1?'':'s')+' \u2014 not enough history to judge a trend.'], fix:null};
  }
  const recent = pts.slice(-6);
  const reg = linreg(recent);
  const slope = reg ? reg.slope*7 : 0;
  const cur = recent[recent.length-1].v;
  const spanWks = (new Date(recent[recent.length-1].date)-new Date(recent[0].date))/(7*86400000);
  findings.push('e1RM trend over last '+recent.length+' sessions ('+Math.round(spanWks*10)/10+' wks): '+(slope>=0?'+':'')+slope.toFixed(1)+' lb/wk. Current e1RM: '+Math.round(cur)+' lb.');
  // grind/fail density over last 6 sessions of this lift
  const hist = historyFor(nm).slice(0,6);
  let tagged=0, hard=0;
  hist.forEach(h=>h.sets.forEach(s=>{ if(s.e){tagged++; if(s.e==='grind'||s.e==='fail')hard++;} }));
  const hardPct = tagged? Math.round(100*hard/tagged) : null;
  if(hardPct!=null) findings.push('Effort mix (last '+hist.length+' sessions): '+hardPct+'% of tagged sets were grind/fail.');
  // stall length: sessions at same top weight without ceiling
  const declinePct = recent.length>=2 ? (cur - Math.max(...recent.map(p=>p.v)))/Math.max(...recent.map(p=>p.v)) : 0;

  let severity=null, title=nm+' on track', fix=null;
  const bestRecent = Math.max(...recent.map(p=>p.v));
  if(slope < -1.0 && cur < bestRecent*0.96){
    severity='red'; title=nm+' declining';
    findings.push('Clear downward trend \u2014 you\u2019re losing ground on this lift, not just plateauing.');
    const baseW = invLastWorkingWeight(nm);
    const resetW = baseW ? Math.max(Math.round((baseW*0.9)/5)*5, 5) : 0;
    fix = resetW ? {label:'Reset & rebuild at ~90%', desc:'Set next targets to ~'+resetW+' lb \u2014 about 90% of your last working weight ('+baseW+' lb) \u2014 for 2 weeks and climb back with clean reps. Momentum beats grinding a declining max. (Auto-expires after 14 days.)', type:'liftReset', payload:{name:nm, w:resetW, days:14}} : null;
  } else if(slope < -0.3){
    severity='orange'; title=nm+' trending down';
    findings.push('Mild decline over recent sessions \u2014 could be fatigue, sleep, or accumulated grinding.');
    if(hardPct!=null && hardPct>=40){
      fix={label:'Start deload week', desc:'High grind density plus a downward trend is the classic overreach signature. A deload week ('+'~60% loads) usually restores the trend within 1\u20132 weeks after.', type:'deload', payload:{}};
    } else {
      const baseW = invLastWorkingWeight(nm);
      const resetW = baseW ? Math.max(Math.round((baseW*0.92)/5)*5, 5) : 0;
      fix = resetW ? {label:'Light reset at ~92%', desc:'Take next sessions at ~'+resetW+' lb \u2014 about 92% of your last working weight ('+baseW+' lb) \u2014 and rebuild rep quality. (Auto-expires after 10 days.)', type:'liftReset', payload:{name:nm, w:resetW, days:10}} : null;
    }
  } else if(Math.abs(slope) <= 0.3 && spanWks >= 3){
    if(isMaxed(nm)){
      // No heavier setting exists on this machine, so a flat LOAD trend isn't a stall \u2014 it's
      // the equipment ceiling. e1RM is load-derived, so it will read flat by definition here.
      findings.push('Flat, but this lift is marked MAXED \u2014 there\u2019s no heavier setting on the machine, so load can\u2019t climb. Progress here shows up as more reps or sets at the same weight, not a higher e1RM. Not flagged.');
      return {severity:null, key:'lift:'+nm, title:nm+' flat (at machine ceiling)', findings, fix:null};
    }
    const _mw = (typeof mesoCurrentWeek==='function') ? mesoCurrentWeek() : null;
    if(_mw && _mw.type==='hyp'){
      // flat e1RM during a hypertrophy block is the expected outcome, not a problem
      findings.push('Flat, but you\u2019re in a hypertrophy block (week '+_mw.blockWeek+' of '+_mw.blockLen+') \u2014 holding e1RM while adding volume is expected here. Not flagged.');
      return {severity:null, key:'lift:'+nm, title:nm+' flat (expected in hypertrophy block)', findings, fix:null};
    }
    severity='yellow'; title=nm+' flat';
    findings.push('No meaningful movement in either direction for '+Math.round(spanWks)+'+ weeks.');
    if(hardPct!=null && hardPct>=50){
      fix={label:'Start deload week', desc:'Flat trend with heavy grinding \u2014 recovery is likely the limiter. Deload, then push again.', type:'deload', payload:{}};
    } else {
      findings.push('Effort tags don\u2019t show excessive grinding \u2014 this may just need more food, sleep, or patience. No forced fix recommended; the progression engine will hold weight until reps climb.');
    }
  }
  return {severity, key:'lift:'+nm, title, findings, fix};
}

function investigateSplit(){
  const {start, end} = lastCompletedWeekRange();
  const vol = weeklyVolumeByGroup(start, end);
  const trained = S.logs.some(l=>l.date>=start && l.date<=end);
  const findings = [];
  if(!trained){
    return {severity:null, key:'split', title:'Split check', findings:['No sessions logged in the last completed week \u2014 nothing to review yet.'], fix:null};
  }
  const gaps = MUSCLE_GROUPS.filter(g=>g!=='Abs').map(g=>({g, v:vol[g]})).filter(x=>x.v<10).sort((a,b)=>a.v-b.v);
  const stale = staleExercises();
  let severity=null, title='Split balanced', fix=null;
  if(gaps.length){
    const worst = gaps[0];
    severity = worst.v < 6 ? 'orange' : 'yellow';
    title = gaps.length===1 ? (worst.g+' volume light') : (gaps.length+' muscle groups under target');
    gaps.forEach(x=>findings.push(x.g+': '+(Math.round(x.v*10)/10)+' sets last week (guide: 10\u201320).'));
    const sug = invSuggestAccessory(worst.g);
    if(sug) fix={label:'Add '+sug+' to your split', desc:'Adds '+sug+' to your lightest applicable day to close the '+worst.g+' gap. Permanent split change \u2014 remove it any time in Settings.', type:'addEx', payload:{name:sug, group:worst.g}};
  }
  if(stale.length){
    stale.slice(0,3).forEach(s=>findings.push(s.name+': flat ~'+s.weeks+' wks (best e1RM '+s.bestRecent+' lb, was '+s.bestOlder+').'));
    if(!severity) { severity='yellow'; title = stale.length===1 ? (stale[0].name+' gone stale') : (stale.length+' lifts gone stale'); }
    else severity = INV_SEV_RANK[severity]>=2 ? severity : 'yellow';
    if(!fix){
      const s0 = stale[0];
      const alt = invSuggestSwap(s0.name);
      if(alt) fix={label:'Swap '+s0.name+' \u2192 '+alt, desc:'Same muscle group, fresh stimulus. Permanent split change \u2014 the old exercise\u2019s history stays saved if you ever bring it back.', type:'swapEx', payload:{from:s0.name, to:alt}};
    }
  }
  if(!findings.length) findings.push('All muscle groups hit 10+ sets last week and nothing is stale. Keep rolling.');
  return {severity, key:'split', title, findings, fix};
}

/* accessory suggestion pools per muscle group (names chosen to resolve in EX_MUSCLES/musclesFor) */
const INV_ACC_POOL = {
  Chest:['Cable Fly','Pec Fly Machine','Incline Dumbbell Press','Machine Chest Press'],
  Back:['Lat Pulldown','Seated Cable Row','Chest Supported Row','Straight Arm Pulldown'],
  Shoulders:['Cable Lateral Raise','Dumbbell Lateral Raise','Rear Delt Machine','Seated Overhead Press Machine'],
  Biceps:['Incline Dumbbell Curl','Preacher Curl Machine','Hammer Curl','Cable Curl'],
  Triceps:['JM Press','Cable Pushdown','Overhead Cable Extension','Seated DB Overhead Extension'],
  Quads:['Leg Extension','Leg Press','Hack Squat','Bulgarian Split Squat'],
  Hamstrings:['Seated Leg Curl','Lying Leg Curl','Romanian Deadlift','Reverse Leg Curl'],
  Glutes:['Hip Thrust Machine','Bulgarian Split Squat','Cable Kickback','Romanian Deadlift'],
  Abs:['Cable Crunch','Hanging Leg Raise','Abdominal Machine']
};
function invAllSplitNames(){ return new Set(Object.values(S.split).flatMap(d=>(d.exercises||[]).map(exName))); }
function invSuggestAccessory(group){
  const inSplit = invAllSplitNames();
  const pool = INV_ACC_POOL[group]||[];
  return pool.find(n=>!inSplit.has(n)) || null;
}
function invSuggestSwap(fromName){
  const m = musclesFor(fromName);
  const g = (m.p && m.p[0]) || null; if(!g) return null;
  const inSplit = invAllSplitNames();
  const pool = INV_ACC_POOL[g]||[];
  return pool.find(n=>!inSplit.has(n) && n!==fromName) || null;
}

/* -------------------- FLAG LIFECYCLE -------------------- */
function invActiveFlags(){ return invState().flags.filter(f=>f.status==='active'||f.status==='applied'); }
function invFindFlag(key){ return invActiveFlags().find(f=>f.key===key); }
function invRaise(result, source){
  if(!result || !result.severity) return null;
  const st = invState();
  const existing = invFindFlag(result.key);
  if(existing){
    // update severity/findings in place; don't duplicate
    existing.severity = result.severity; existing.title = result.title;
    existing.findings = result.findings; if(existing.status!=='applied') existing.fix = result.fix;
    existing.updated = todayKey(); save(false); return existing;
  }
  const flag = {id:invUid(), cat:result.key.startsWith('lift:')?'lift':(result.key==='bulk'?'bulk':'split'),
    key:result.key, severity:result.severity, title:result.title, findings:result.findings,
    fix:result.fix, status:'active', source:source||'auto', created:todayKey(), updated:todayKey()};
  st.flags.push(flag); save(false);
  return flag;
}
function invArchive(flag, outcome){
  flag.status = outcome; flag.closed = todayKey();
  const st = invState();
  st.flags = st.flags.filter(f=>f.id!==flag.id);
  st.history.unshift(flag);
  if(st.history.length>25) st.history.length = 25;
  save(false);
}
function invDismiss(id){
  const f = invActiveFlags().find(x=>x.id===id); if(!f) return;
  invArchive(f,'dismissed'); renderInvestigation(); invUpdateBadge();
}
function invDeleteHistory(id){
  const st = invState();
  st.history = st.history.filter(f=>f.id!==id);
  save(false); renderInvestigation();
}
function invApplyFix(id){
  const f = invActiveFlags().find(x=>x.id===id); if(!f || !f.fix) return;
  const fx = f.fix;
  if(fx.type==='cal'){
    S.fuel = S.fuel||{}; S.fuel.calTarget = (S.fuel.calTarget||3000) + fx.payload.delta;
  } else if(fx.type==='pro'){
    S.fuel = S.fuel||{}; S.fuel.proTarget = fx.payload.to;
  } else if(fx.type==='liftReset'){
    invState().overrides[fx.payload.name] = {w:fx.payload.w, until:dateKeyOf(new Date(Date.now()+fx.payload.days*86400000)), note:'Investigation reset \u2014 rebuild with clean reps, expires '+fx.payload.days+'d'};
  } else if(fx.type==='deload'){
    startDeloadWeek();
  } else if(fx.type==='addEx'){
    const dk = invLightestDayFor(fx.payload.group);
    if(dk){ S.split[dk].exercises.push({name:fx.payload.name, inc:incFor(fx.payload.name)}); }
  } else if(fx.type==='swapEx'){
    for(const dk in S.split){
      const arr = S.split[dk].exercises;
      const i = arr.findIndex(x=>exName(x)===fx.payload.from);
      if(i>=0){ arr[i] = {name:fx.payload.to, inc:incFor(fx.payload.to)}; break; }
    }
  }
  f.status='applied'; f.appliedAt=todayKey(); save();
  renderInvestigation(); invUpdateBadge();
}
function invLightestDayFor(group){
  // pick the training day whose exercises touch this group least (or any non-rest day as fallback)
  let best=null, bestScore=Infinity;
  Object.keys(S.split).forEach(dk=>{
    const names=(S.split[dk].exercises||[]).map(exName); if(!names.length) return;
    let score=0; names.forEach(n=>{ const m=musclesFor(n); if(m.p.includes(group))score+=2; if(m.s.includes(group))score+=1; });
    // prefer days already touching the group lightly (fits the day theme) over days not touching at all
    const adj = score===0 ? 100+names.length : score*10+names.length;
    if(adj<bestScore){ bestScore=adj; best=dk; }
  });
  return best;
}
function invClearExpiredOverrides(){
  const ov = invState().overrides; const t = todayKey();
  Object.keys(ov).forEach(k=>{ if(ov[k].until < t) delete ov[k]; });
}
function invOverrideFor(nm){
  invClearExpiredOverrides();
  const o = invState().overrides[nm];
  return (o && o.until >= todayKey()) ? o : null;
