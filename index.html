/* -------------------- RESOLUTION -------------------- */
function invCheckResolutions(){
  const flags = [...invActiveFlags()];
  flags.forEach(f=>{
    try{
      let resolved=false, note='';
      if(f.cat==='lift'){
        const nm = f.key.slice(5);
        const pts = e1rmSeries(nm);
        // only count sessions logged strictly AFTER the flag was raised — otherwise ordinary
        // non-monotonic noise already sitting in old history can "resolve" a flag on the very
        // next app open with zero new training in between.
        const newPts = pts.filter(p=>p.date>f.created);
        if(newPts.length>=2){
          const idx = pts.findIndex(p=>p.date===newPts[0].date);
          const baseline = idx>0 ? pts[idx-1].v : -Infinity;
          const a = newPts[newPts.length-2].v, b = newPts[newPts.length-1].v;
          if(b>a && a>baseline){ resolved=true; note='2 consecutive e1RM improvements since flagged'; }
        }
      } else if(f.cat==='bulk'){
        const sm = bodyweightSeriesSmoothed();
        const newestWeight = S.weights.length ? [...S.weights].sort((a,b)=>b.date.localeCompare(a.date))[0].date : null;
        if(sm.length>=3 && newestWeight && newestWeight>f.created){
          const reg = linreg(sm.slice(-3));
          const rate = reg? reg.slope*7 : 0;
          if(rate>=0.4 && rate<=1.2){ resolved=true; note='rate back in the 0.4\u20131.2 lb/wk band'; }
        }
      } else if(f.cat==='split'){
        const {start,end} = lastCompletedWeekRange();
        const vol = weeklyVolumeByGroup(start,end);
        const gaps = MUSCLE_GROUPS.filter(g=>g!=='Abs').filter(g=>vol[g]<10);
        const stale = staleExercises();
        const trained = S.logs.some(l=>l.date>=start&&l.date<=end);
        const hasNewSession = S.logs.some(l=>l.date>f.created);
        if(hasNewSession && trained && !gaps.length && !stale.length){ resolved=true; note='volume gaps closed and nothing stale'; }
      }
      if(resolved){ f.resolveNote=note; invArchive(f,'resolved'); }
    }catch(e){ console.warn('invCheckResolutions: skipped one flag due to error', f.key, e); }
  });
  invUpdateBadge();
}

/* -------------------- AUTO-RUN SCHEDULER -------------------- */
function invDaysSince(key){
  const la = invState().lastAuto[key];
  if(!la) return Infinity;
  return (new Date(todayKey()) - new Date(la))/86400000;
}
function invRecentlyDismissed(key, days){
  const st = invState();
  const cutoff = new Date(todayKey()); cutoff.setDate(cutoff.getDate()-days);
  return (st.history||[]).some(f=>f.key===key && f.status==='dismissed' && f.closed && new Date(f.closed) > cutoff);
}
function invAutoRun(){
  const st = invState();
  invClearExpiredOverrides();
  invCheckResolutions();
  let raised=false;
  if(invDaysSince('split')>=7){
    // the split check reads the last completed week - if that week was intentionally
    // low-volume by plan (strength/deload/rest), reduced volume is the plan, not a problem
    const _lw = (typeof mesoWeekAt==='function') ? mesoWeekAt(lastCompletedWeekRange().start) : null;
    const _planned = _lw && (_lw.type==='str' || _lw.type==='deload' || _lw.type==='rest');
    const r = investigateSplit();
    if(r.severity && !_planned && !invRecentlyDismissed(r.key,14)){ invRaise(r,'auto'); raised=true; }
    st.lastAuto.split = todayKey();
  }
  if(invDaysSince('lift')>=7){
    const names = [...invAllSplitNames()];
    const results = names.map(n=>investigateLift(n)).filter(r=>r.severity && !invRecentlyDismissed(r.key,14));
    results.sort((a,b)=>INV_SEV_RANK[b.severity]-INV_SEV_RANK[a.severity]);
    results.slice(0,3).forEach(r=>{ invRaise(r,'auto'); raised=true; }); // cap at 3 to avoid spam
    st.lastAuto.lift = todayKey();
  }
  if(invDaysSince('bulk')>=14){
    const r = investigateBulk(); if(r.severity && !invRecentlyDismissed(r.key,14)){ invRaise(r,'auto'); raised=true; }
    st.lastAuto.bulk = todayKey();
  }
  save(false);
  invUpdateBadge();
  return raised;
}

/* -------------------- BANNER + BADGE -------------------- */
function invBannerHTML(){
  const flags = invActiveFlags().filter(f=>f.status==='active');
  if(!flags.length) return '';
  const worst = flags.reduce((a,f)=>INV_SEV_RANK[f.severity]>INV_SEV_RANK[a.severity]?f:a, flags[0]);
  if(worst.severity==='yellow') return ''; // yellow lives in the tab only
  const col = INV_SEV_COLOR[worst.severity];
  // Tag reflects ONLY the flag whose title is shown \u2014 never merge other flags' categories in here,
  // that produced misleading combos like "STRENGTH \u00b7 BULK \u2014 Chest Fly Machine trending down" where
  // the BULK tag belonged to a *different* flag entirely. If others share this severity, say so plainly.
  const tiedOthers = flags.filter(f=>f.severity===worst.severity && f.id!==worst.id).length;
  const tag = INV_CAT_LABEL[worst.cat] + (tiedOthers ? ' +'+tiedOthers+' more' : '');
  return '<div class="inv-banner" style="border-color:'+col+'" onclick="setMode(\'review\');showReviewTab(\'invest\')">'+
    '<span class="inv-banner-tag" style="background:'+col+'">'+INV_SEV_LABEL[worst.severity]+'</span>'+
    '<span class="inv-banner-txt">'+esc(tag)+' \u2014 '+esc(worst.title)+'. Tap to review.</span>'+
    '<span style="margin-left:auto;color:'+col+';font-family:var(--mono)">\u2192</span></div>';
}
function invUpdateBadge(){
  const flags = invActiveFlags().filter(f=>f.status==='active');
  const worst = flags.length ? flags.reduce((a,f)=>INV_SEV_RANK[f.severity]>INV_SEV_RANK[a.severity]?f:a, flags[0]) : null;
  const dot = worst ? INV_SEV_COLOR[worst.severity] : null;
  ['snInvBadge','niInvBadge'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.style.background = dot||'transparent'; el.style.opacity = dot?1:0; }
  });
  const banner = document.getElementById('globalInvBanner');
  if(banner) banner.innerHTML = invBannerHTML();
}

function invRunManual(kind, liftName){
  let r;
  if(kind==='bulk') r = investigateBulk();
  else if(kind==='split') r = investigateSplit();
  else if(kind==='lift'){ if(!liftName) return; r = investigateLift(liftName); }
  else return;
  if(r.severity){
    const f = invRaise(r,'manual');
    _invManualResult = {clear:false, flagId:f.id};
  } else {
    _invManualResult = {clear:true, title:r.title, findings:r.findings, when:todayKey()};
    // manual all-clear also logged to history (lightweight)
    const st = invState();
    st.history.unshift({id:invUid(), cat:kind==='lift'?'lift':kind, key:r.key, severity:null, title:r.title,
      findings:r.findings, status:'clear', source:'manual', created:todayKey(), closed:todayKey()});
    if(st.history.length>25) st.history.length=25;
    save(false);
  }
  invCheckResolutions();
  renderInvestigation(); invUpdateBadge();
}

/* Today-only day override: staged plan consumed when the matching
   day's LIVE session next starts, then cleared. */
function coachDayPlanFor(dk){
  const t = todayKey();
  if(S.coachDayPlan && S.coachDayPlan.date===t && S.coachDayPlan.day===dk) return S.coachDayPlan;
  return null;
}
function clearExpiredCoachDayPlan(){

}

/* The tool schema advertised to the model. */

  const dayList = Object.keys(S.split).join(', ');
  return [
    {name:'add_exercise_permanent', description:'Permanently add an exercise to a training day in the split (applies to all future sessions on that day).',
      input_schema:{type:'object', properties:{
        day:{type:'string', description:'Day key, one of: '+dayList},
        exercise:{type:'string', description:'Exercise name'},

      }, required:['day','exercise']}},
    {name:'remove_exercise_permanent', description:'Permanently remove an exercise from a training day in the split.',
      input_schema:{type:'object', properties:{
        day:{type:'string', description:'Day key, one of: '+dayList},
        exercise:{type:'string', description:'Exercise name to remove (must currently exist on that day)'}
      }, required:['day','exercise']}},
    {name:'swap_exercise_permanent', description:'Permanently replace one exercise with another on a training day (keeps position).',
      input_schema:{type:'object', properties:{
        day:{type:'string', description:'Day key, one of: '+dayList},
        from:{type:'string', description:'Existing exercise name to replace'},
        to:{type:'string', description:'New exercise name'}
      }, required:['day','from','to']}},
    {name:'set_today_workout', description:'Stage a today-only workout override for a given day. Does NOT change the permanent split. Consumed when that day\'s LIVE session next starts today, then discarded. Use for one-off requests like "make today ab-focused".',
      input_schema:{type:'object', properties:{
        day:{type:'string', description:'Day key the override applies to, one of: '+dayList},
        exercises:{type:'array', items:{type:'string'}, description:'Full ordered list of exercise names for today\'s session'}
      }, required:['day','exercises']}},
    {name:'adjust_fuel', description:'Adjust the daily calorie and/or protein target.',
      input_schema:{type:'object', properties:{
        calories:{type:'number', description:'New daily calorie target (optional)'},
        protein:{type:'number', description:'New daily protein target in grams (optional)'}
      }}},
    {name:'start_deload', description:'Start a deload week (auto-loads ~60% weights for light sets, excluded from progression). Use only when fatigue/overreach is clearly indicated.',
      input_schema:{type:'object', properties:{}}},
    {name:'remember_note', description:'Save a durable note about the user that you should recall in every future conversation. Use for lasting facts: injuries and limitations, equipment quirks at his gym, exercise preferences and dislikes, goals with deadlines, schedule constraints. Do NOT use for things already visible in the training data (his logs, split, bodyweight, fuel targets) or for passing details from one session.',
      input_schema:{type:'object', properties:{
        note:{type:'string', description:'The fact to remember, written concisely in the third person (e.g. "Left shoulder aggravated by barbell overhead press; dumbbells are fine"). Max ~240 chars.'},
        tag:{type:'string', enum:['injury','preference','goal','schedule','equipment','general'], description:'Category for this note.'}
      }, required:['note']}}
  ];
}

/* Turn a tool_use block into a human-readable proposal for the apply-card. */
function coachDescribeAction(name, inp){
  switch(name){
    case 'add_exercise_permanent':
      return {verb:'Add exercise', scope:'Permanent · '+inp.day, detail:'Add '+inp.exercise+' to '+inp.day+' ('+(inp.position==='start'?'first':'last')+' in the day), every session going forward.'};
    case 'remove_exercise_permanent':
      return {verb:'Remove exercise', scope:'Permanent · '+inp.day, detail:'Remove '+inp.exercise+' from '+inp.day+', every session going forward.'};
    case 'swap_exercise_permanent':
      return {verb:'Swap exercise', scope:'Permanent · '+inp.day, detail:'Replace '+inp.from+' with '+inp.to+' on '+inp.day+', keeping its slot. '+inp.from+'\u2019s history stays saved.'};
    case 'set_today_workout':
      return {verb:'Set today\u2019s workout', scope:'Today only · '+inp.day, detail:'For today\u2019s '+inp.day+' session only: '+(inp.exercises||[]).join(', ')+'. Your saved split is untouched.'};
    case 'adjust_fuel':{
      const parts=[]; if(inp.calories!=null) parts.push('calories \u2192 '+inp.calories); if(inp.protein!=null) parts.push('protein \u2192 '+inp.protein+'g');
      return {verb:'Adjust fuel targets', scope:'Nutrition', detail:'Set '+(parts.join(' and ')||'(no change)')+'.'};
    }
    case 'start_deload':
      return {verb:'Start deload week', scope:'Recovery', detail:'Begin a 7-day deload \u2014 ~60% loads, light sets, excluded from progression and trend charts.'};
    case 'remember_note':
      return {verb:'Remember this', scope:'Coach memory \u00b7 '+(inp.tag||'general'), detail:'\u201c'+inp.note+'\u201d \u2014 saved permanently and included in every future coach conversation. You can delete it any time from the memory card.'};
    default:
      return {verb:name, scope:'', detail:JSON.stringify(inp)};
  }
}

/* Validate an action against current state; return {ok, error}. */
function coachValidateAction(name, inp){
  const dayOk = d => !!S.split[d];
  if(['add_exercise_permanent','remove_exercise_permanent','swap_exercise_permanent','set_today_workout'].includes(name)){
    if(!dayOk(inp.day)) return {ok:false, error:'No day "'+inp.day+'" exists in your split.'};
  }
  if(name==='remove_exercise_permanent' || name==='swap_exercise_permanent'){
    const key = name==='swap_exercise_permanent' ? inp.from : inp.exercise;
    const exists = (S.split[inp.day].exercises||[]).some(x=>exName(x).toLowerCase()===String(key).toLowerCase());
    if(!exists) return {ok:false, error:key+' isn\u2019t currently on '+inp.day+'.'};
  }
  if(name==='set_today_workout' && (!Array.isArray(inp.exercises) || !inp.exercises.length)){
    return {ok:false, error:'No exercises given for the today-only plan.'};
  }
  if(name==='adjust_fuel' && inp.calories==null && inp.protein==null){
    return {ok:false, error:'No calorie or protein value given.'};
  }
  if(name==='remember_note'){
    if(!inp.note || !String(inp.note).trim()) return {ok:false, error:'Empty note.'};
    const dupe = coachMem().some(m=>m.note.toLowerCase()===String(inp.note).trim().toLowerCase());
    if(dupe) return {ok:false, error:'Already remembered \u2014 that note is saved.'};
  }
  return {ok:true};
}

/* Execute a validated action against S. Returns a short confirmation string. */
function coachExecuteAction(name, inp){
  if(name==='add_exercise_permanent'){
    const item = {name:inp.exercise, inc:incFor(inp.exercise)};
    const arr = S.split[inp.day].exercises = S.split[inp.day].exercises||[];
    if(inp.position==='start') arr.unshift(item); else arr.push(item);
    save(); setAccent();
    return inp.exercise+' added to '+inp.day+'.';
  }
  if(name==='remove_exercise_permanent'){
    const arr = S.split[inp.day].exercises||[];
    S.split[inp.day].exercises = arr.filter(x=>exName(x).toLowerCase()!==inp.exercise.toLowerCase());
    save(); setAccent();
    return inp.exercise+' removed from '+inp.day+'.';
  }
  if(name==='swap_exercise_permanent'){
    const arr = S.split[inp.day].exercises||[];
    const i = arr.findIndex(x=>exName(x).toLowerCase()===inp.from.toLowerCase());
    if(i>=0) arr[i] = {name:inp.to, inc:incFor(inp.to)};
    save(); setAccent();
    return inp.from+' \u2192 '+inp.to+' on '+inp.day+'.';
  }
  if(name==='set_today_workout'){
    S.coachDayPlan = {date:todayKey(), day:inp.day, exercises:inp.exercises.slice()};
    // if the schedule's today isn't already this day, also set an overrideDay so LIVE opens to it
    if(currentDayKey()!==inp.day) S.overrideDay = {date:todayKey(), day:inp.day};
    save(); setAccent();
    return 'Today\u2019s '+inp.day+' is set to your custom plan.';
  }
  if(name==='adjust_fuel'){
    S.fuel = S.fuel||{};
    if(inp.calories!=null) S.fuel.calTarget = Math.round(inp.calories);
    if(inp.protein!=null) S.fuel.proTarget = Math.round(inp.protein);
    save();
    return 'Fuel targets updated.';
  }
  if(name==='start_deload'){
    startDeloadWeek();
    return 'Deload week started.';
  }
  if(name==='remember_note'){
    const rec = coachMemAdd(inp.note, inp.tag);
    return rec ? 'Saved to coach memory.' : 'Nothing to save.';
  }
  return 'Done.';
}

/* ---- tool-enabled Claude call: returns {text, actions:[{id,name,input}]} ---- */
async function callClaudeWithTools(messages, system, tools, maxTokens){
  const headers = {'Content-Type':'application/json'};
  if(S.settings.apiKey){
    headers['x-api-key'] = S.settings.apiKey;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  const body = {model:'claude-sonnet-4-6', max_tokens:maxTokens||1200, messages};
  if(system) body.system = system;
  if(tools && tools.length) body.tools = tools;
  const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error('API '+res.status+': '+t.slice(0,200)); }
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const actions = (data.content||[]).filter(b=>b.type==='tool_use').map(b=>({id:b.id, name:b.name, input:b.input||{}}));
  return {text, actions};
}

/* ---- proposal lifecycle: proposals live on the chat message they came with ---- */
function coachStageProposals(actions){
  // returns array of proposal objects with validation state
  return actions.map(a=>{
    const v = coachValidateAction(a.name, a.input);
    return {id:'p_'+Math.random().toString(36).slice(2,9), name:a.name, input:a.input,
      desc:coachDescribeAction(a.name, a.input), valid:v.ok, error:v.error||null, status:'pending'};
  });
}
function coachFindProposal(pid){
  for(const m of S.chat){ if(m.proposals){ const p=m.proposals.find(x=>x.id===pid); if(p) return {msg:m, p}; } }
  return null;
}
function coachApplyProposal(pid){
  const found = coachFindProposal(pid); if(!found) return;
  const {p} = found;
  if(!p.valid || p.status!=='pending') return;
  // re-validate at apply time (state may have changed since proposed)
  const v = coachValidateAction(p.name, p.input);
  if(!v.ok){ p.status='failed'; p.error=v.error; save(); renderCoach(); return; }
  try{
    const conf = coachExecuteAction(p.name, p.input);
    p.status='applied'; p.confirm=conf;
  }catch(e){ p.status='failed'; p.error=e.message; }
  save(); renderCoach();
  // reflect downstream UI that may have changed
  try{ if(typeof renderSettings==='function' && document.getElementById('settings')) renderSettings(); }catch(e){}
  try{ invUpdateBadge(); }catch(e){}
}
function coachDismissProposal(pid){
  const found = coachFindProposal(pid); if(!found) return;
  if(found.p.status==='pending'){ found.p.status='dismissed'; save(); renderCoach(); }
}

/* ============================================================
   PERIODIZATION — mesocycle planning
   Template -> materialized week calendar -> phase-aware behavior.
   ============================================================ */
const MESO_TYPES = {
  hyp:    {label:'Hypertrophy',   repLo:8, repHi:12, rpeLo:7, rpeHi:8, accent:'var(--cyan)',   dim:'var(--cyan-dim)',   minW:2, maxW:12, defW:8},
  str:    {label:'Strength',      repLo:3, repHi:5,  rpeLo:8, rpeHi:9, accent:'var(--amber)',  dim:'var(--amber-dim)',  minW:1, maxW:6,  defW:3},
  deload: {label:'Deload',        repLo:8, repHi:12, rpeLo:5, rpeHi:6, accent:'var(--violet)', dim:'var(--violet-dim)', minW:1, maxW:2,  defW:1},
  rest:   {label:'Rest / Travel', repLo:0, repHi:0,  rpeLo:0, rpeHi:0, accent:'var(--dim)',    dim:'var(--line2)',      minW:1, maxW:4,  defW:1},
  custom: {label:'Custom',        repLo:6, repHi:10, rpeLo:7, rpeHi:8, accent:'var(--cyan)',   dim:'var(--cyan-dim)',   minW:1, maxW:12, defW:4}
};
const MESO_TYPE_ORDER = ['hyp','str','deload','rest','custom'];

function mesoState(){
  if(!S.meso) S.meso = {template:null, active:null};
  if(!S.meso.active) S.meso.active = null;
  if(S.meso.active && !S.meso.active.splits) S.meso.active.splits = {};
  return S.meso;
}
function mesoUid(){ return 'b'+Math.random().toString(36).slice(2,9); }
function mesoDefaultTemplate(){
  return {phases:[
    {id:mesoUid(), type:'hyp',    name:'Hypertrophy', weeks:8, repLo:8, repHi:12, rpeLo:7, rpeHi:8},
    {id:mesoUid(), type:'str',    name:'Strength',    weeks:3, repLo:3, repHi:5,  rpeLo:8, rpeHi:9},
    {id:mesoUid(), type:'deload', name:'Deload',      weeks:1, repLo:8, repHi:12, rpeLo:5, rpeHi:6}
  ], repeat:true, cycles:2};
}

/* ---- date helpers (Monday-anchored weeks) ---- */
function mesoMondayOf(key){
  const d = new Date(key+'T00:00:00');
  const dow = d.getDay();               // 0=Sun .. 6=Sat
  d.setDate(d.getDate() + (dow===0 ? -6 : 1-dow));
  return dateKeyOf(d);
}
function mesoAddDays(key, n){
  const d = new Date(key+'T00:00:00'); d.setDate(d.getDate()+n); return dateKeyOf(d);
}

/* ---- materialization: expand a template into explicit week objects ---- */
function mesoMaterialize(tpl, startKey){
  const weeks = [];
  const cycles = tpl.repeat ? Math.max(1, Math.min(6, tpl.cycles||2)) : 1;
  for(let c=0; c<cycles; c++){
    (tpl.phases||[]).forEach(ph=>{
      const blockId = mesoUid();
      const n = Math.max(1, ph.weeks||1);
      for(let w=0; w<n; w++){
        weeks.push({type:ph.type, name:ph.name, blockId,
          repLo:ph.repLo, repHi:ph.repHi, rpeLo:ph.rpeLo, rpeHi:ph.rpeHi, cycle:c+1});
      }
    });
  }
  return mesoResequence(weeks, startKey);
}
/* Recompute week numbers, dates, and block position. Safe to call after any edit. */
function mesoResequence(weeks, startKey){
  const counts = {}; weeks.forEach(w=>{ counts[w.blockId]=(counts[w.blockId]||0)+1; });
  const seen = {};
  weeks.forEach((w,i)=>{
    w.n = i+1;
    w.startKey = mesoAddDays(startKey, i*7);
    w.endKey   = mesoAddDays(startKey, i*7+6);
    seen[w.blockId] = (seen[w.blockId]||0)+1;
    w.blockWeek = seen[w.blockId];
    w.blockLen  = counts[w.blockId];
  });
  return weeks;
}

/* ---- lifecycle ---- */
function mesoStart(tpl, startKey){
  const st = mesoState();
  const start = mesoMondayOf(startKey || todayKey());
  st.template = JSON.parse(JSON.stringify(tpl));
  st.active = {startedAt:todayKey(), startKey:start, weeks:mesoMaterialize(tpl, start), splits:{}};
  save();
  return st.active;
}
function mesoStop(){ const st=mesoState(); st.active=null; save(); }

/* ---- queries ---- */
function mesoActive(){ return mesoState().active; }
function mesoWeekAt(key){
  const a = mesoState().active; if(!a) return null;
  return a.weeks.find(w=>key>=w.startKey && key<=w.endKey) || null;
}
function mesoCurrentWeek(){ return mesoWeekAt(todayKey()); }
function mesoNextDeload(){
  const a = mesoState().active; if(!a) return null;
  const t = todayKey();
  return a.weeks.find(w=>w.type==='deload' && w.endKey>=t) || null;
}
function mesoWeeksUntil(w){
  if(!w) return null;
  const cur = mesoCurrentWeek();
  if(!cur) return null;
  return w.n - cur.n;
}

/* ---- the split that is actually in force right now ----
   During an approved strength block, the generated split takes over.
   Everything else falls through to the permanent S.split. */
function mesoApprovedSplitFor(w){
  const a = mesoState().active;
  if(!a || !w || w.type!=='str') return null;
  const rec = (a.splits||{})[w.blockId];
  return (rec && rec.status==='approved' && rec.split) ? rec.split : null;
}
function mesoActiveSplit(){ return mesoApprovedSplitFor(mesoCurrentWeek()); }
function activeSplitObj(){
  const ms = (typeof mesoActiveSplit==='function') ? mesoActiveSplit() : null;
  return ms || S.split;
}

/* ---- strength-block split auto-generation ----
   Consolidates heavy compounds, trims accessory volume to make room for intensity,
   and reports what it cut and why. Proposal only — nothing applies without approval. */
function mesoIsCompound(nm){
  const n = String(nm).toLowerCase();
  if(/curl|pushdown|extension|fly|lateral|raise|rear delt|crunch|abdominal|pec deck|shrug/.test(n)) return false;
  return /bench|squat|deadlift|trap bar|overhead press|ohp|press|dip|row|pulldown|pull-up|pullup|chin|hip thrust|lunge|hack/.test(n);
}
function mesoLiftScore(nm){
  let score = mesoIsCompound(nm) ? 100 : 0;
  const pts = e1rmSeries(nm);
  if(pts.length >= 3){
    score += Math.min(pts.length, 12);                      // data confidence
    const reg = linreg(pts.slice(-6));
    if(reg) score += Math.max(-20, Math.min(20, reg.slope*7*10)); // trend
    score += Math.min(30, pts[pts.length-1].v/10);          // absolute load contribution
  }
  return score;
}
function mesoGenerateStrengthSplit(){
  const src = S.split;
  const out = {}, rationale = [];
  Object.keys(src).forEach(dk=>{
    const day = src[dk];
    const scored = (day.exercises||[]).map(x=>{
      const nm = exName(x);
      return {x, nm, sc:mesoLiftScore(nm), comp:mesoIsCompound(nm)};
    }).sort((a,b)=>b.sc-a.sc);
    if(!scored.length){ out[dk] = JSON.parse(JSON.stringify(day)); return; }
    const comps = scored.filter(s=>s.comp);
    const accs  = scored.filter(s=>!s.comp);
    const keepC = comps.slice(0,2);
    const keepA = accs.slice(0, Math.max(1, 4 - keepC.length));
    const kept  = [...keepC, ...keepA];
    const cut   = scored.filter(s=>kept.indexOf(s)<0);
    out[dk] = Object.assign({}, day, {exercises: kept.map(s=>{
      const o = (typeof s.x==='object') ? JSON.parse(JSON.stringify(s.x)) : {name:s.nm, inc:incFor(s.nm)};
      if(s.comp) o.repMode = 'str';   // heavy compounds run 3-6
      return o;
    })});
    if(keepC.length) rationale.push(dk+': '+keepC.map(s=>s.nm).join(' + ')+' anchor'+(keepC.length>1?'':'s')+' the day \u2014 heaviest loads and best recent trend.');
    if(cut.length)   rationale.push(dk+': cut '+cut.map(s=>s.nm).join(', ')+' to make room for intensity.');
  });
  // coverage sanity check against the permanent split
  const cov = {}; MUSCLE_GROUPS.forEach(g=>cov[g]=0);
  Object.values(out).forEach(d=>(d.exercises||[]).forEach(x=>{
    const m = musclesFor(exName(x));
    m.p.forEach(g=>{ if(cov[g]!=null) cov[g]++; });
    m.s.forEach(g=>{ if(cov[g]!=null) cov[g]+=0.5; });
  }));
  const covBefore = {}; MUSCLE_GROUPS.forEach(g=>covBefore[g]=0);
  Object.values(src).forEach(d=>(d.exercises||[]).forEach(x=>{
    const m = musclesFor(exName(x));
    m.p.forEach(g=>{ if(covBefore[g]!=null) covBefore[g]++; });
    m.s.forEach(g=>{ if(covBefore[g]!=null) covBefore[g]+=0.5; });
  }));
  const dropped = MUSCLE_GROUPS.filter(g=>g!=='Abs' && covBefore[g]>0 && cov[g]===0);
  return {split:out, rationale, dropped};
}

/* ---- proposal lifecycle per strength block ---- */
function mesoProposeSplit(blockId){
  const a = mesoState().active; if(!a) return null;
  const gen = mesoGenerateStrengthSplit();
  a.splits[blockId] = {status:'proposed', split:gen.split, rationale:gen.rationale,
                       dropped:gen.dropped, generatedAt:todayKey()};
  save();
  return a.splits[blockId];
}
function mesoApproveSplit(blockId){
  const a = mesoState().active; if(!a || !a.splits[blockId]) return;
  a.splits[blockId].status = 'approved';
  a.splits[blockId].approvedAt = todayKey();
  save(); renderMeso();
  try{ if(typeof renderLive==='function') renderLive(); }catch(e){}
}
function mesoRegenerateSplit(blockId){
  mesoProposeSplit(blockId); renderMeso();
}
function mesoUnapproveSplit(blockId){
  const a = mesoState().active; if(!a || !a.splits[blockId]) return;
  a.splits[blockId].status = 'proposed';
  save(); renderMeso();
  try{ if(typeof renderLive==='function') renderLive(); }catch(e){}
}
/* Ensure every strength block in the calendar has a proposal ready to review. */
function mesoEnsureProposals(){
  const a = mesoState().active; if(!a) return;
  const seen = {};
  a.weeks.forEach(w=>{
    if(w.type==='str' && !seen[w.blockId]){
      seen[w.blockId] = true;
      if(!a.splits[w.blockId]) mesoProposeSplit(w.blockId);
    }
  });
}

/* ---- context handed to Coach so its advice matches the phase ---- */
function mesoCoachContext(){
  const w = (typeof mesoCurrentWeek==='function') ? mesoCurrentWeek() : null;
  if(!w) return 'PERIODIZATION: no active mesocycle \u2014 training is unstructured/day-to-day.\n\n';
  const nd = mesoNextDeload(); const ndIn = mesoWeeksUntil(nd);
  let s = 'PERIODIZATION: week '+w.n+' of the plan \u2014 '+w.name+' block (week '+w.blockWeek+' of '+w.blockLen+').\n';
  if(w.repLo>0) s += '- Phase rep target: '+w.repLo+'\u2013'+w.repHi+(w.rpeLo>0?', RPE '+w.rpeLo+'\u2013'+w.rpeHi:'')+'.\n';
  if(w.type==='hyp')    s += '- Goal this block is volume and size. e1RM holding flat here is normal and NOT a problem.\n';
  if(w.type==='str')    s += '- Goal this block is absolute strength. e1RM should climb; accessories are intentionally trimmed.\n';
  if(w.type==='deload') s += '- Deload week: loads ~60%, well shy of failure. Do not push intensity.\n';
  if(w.type==='rest')   s += '- Rest/travel week: nothing scheduled. Do not prescribe training.\n';
  if(nd && ndIn!=null) s += '- Next deload: '+(ndIn===0?'this week':'in '+ndIn+' week'+(ndIn===1?'':'s'))+'.\n';
  const ms = (typeof mesoActiveSplit==='function') ? mesoActiveSplit() : null;
  if(ms) s += '- A generated strength split is ACTIVE this block (differs from the permanent split).\n';
  return s+'\n';
}

function mesoDraft(){
  if(!_mesoDraft){

  }

}
function mesoDraftReset(){ _mesoDraft = null; renderMeso(); }
function mesoTotalWeeks(tpl){
  const cy = tpl.repeat ? Math.max(1, Math.min(6, tpl.cycles||2)) : 1;
  return (tpl.phases||[]).reduce((s,p)=>s+Math.max(1,p.weeks||1),0) * cy;
}

/* builder mutations */
function mesoAddPhase(){
  const t = mesoDraft();
  const ty = MESO_TYPES.hyp;
  t.phases.push({id:mesoUid(), type:'hyp', name:ty.label, weeks:ty.defW, repLo:ty.repLo, repHi:ty.repHi, rpeLo:ty.rpeLo, rpeHi:ty.rpeHi});

}
function mesoRemovePhase(i){
  const t = mesoDraft();
  if(t.phases.length<=1){ alert('A plan needs at least one phase.'); return; }
  t.phases.splice(i,1); renderMeso();
}
function mesoSetPhaseType(i, type){
  const t = mesoDraft(); const p = t.phases[i]; const ty = MESO_TYPES[type];
  p.type = type; p.name = ty.label;
  p.repLo = ty.repLo; p.repHi = ty.repHi; p.rpeLo = ty.rpeLo; p.rpeHi = ty.rpeHi;
  p.weeks = Math.max(ty.minW, Math.min(ty.maxW, p.weeks||ty.defW));

}
function mesoSetPhaseField(i, k, v){ mesoDraft().phases[i][k] = v; }
function mesoSetPhaseNum(i, k, v, lo, hi){
  const n = Math.max(lo, Math.min(hi, Math.round(+v||0)));
  mesoDraft().phases[i][k] = n; renderMeso();
}
function mesoSetRepeat(on){ mesoDraft().repeat = !!on; renderMeso(); }
function mesoSetCycles(v){ mesoDraft().cycles = Math.max(1, Math.min(6, Math.round(+v||1))); renderMeso(); }

/* ============================================================
   AUTO-UPDATE — polls the deployed file for a new build marker.
   No service worker: no second file, no extra cache layer to
   confuse cache-vs-code debugging, no stale-worker failure mode.
   ============================================================ */
const UPD_INTERVAL_MS = 15*60*1000;
let _updRemote = null;      // build id found on the server
let _updDismissed = null;   // build id the user dismissed this session
let _updChecking = false;
let _updLastCheck = 0;

function appBuild(){
  const m = document.querySelector('meta[name="ironhub-build"]');
  return m ? m.content : 'dev';
}
function appURL(){ return location.href.split('#')[0].split('?')[0]; }

/* Returns: 'update' | 'current' | 'offline' | 'unknown' */
async function checkForUpdate(manual){
  if(_updChecking) return 'unknown';
  if(typeof navigator!=='undefined' && navigator.onLine===false){
    if(manual) setUpdMsg('You\u2019re offline \u2014 can\u2019t check right now.', true);
    return 'offline';
  }
  _updChecking = true;
  try{
    // cache:'reload' bypasses the HTTP cache for this request AND refreshes it,
    // so a later location.reload() picks up the new file rather than the stale one.
    const res = await fetch(appURL(), {cache:'reload'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const txt = await res.text();
    const m = txt.match(/<meta name="ironhub-build" content="([^"]+)">/);
    if(!m){
      // not our file (captive portal, error page, proxy) — never act on it
      if(manual) setUpdMsg('Couldn\u2019t read a version from the server \u2014 skipped.', true);
      return 'unknown';
    }
    _updLastCheck = Date.now();
    if(m[1] === appBuild()){
      _updRemote = null; hideUpdateBar();
      if(manual) setUpdMsg('\u2713 You\u2019re on the latest build ('+appBuild()+').');
      return 'current';
    }
    _updRemote = m[1];
    if(_updDismissed !== m[1]) showUpdateBar();
    if(manual) setUpdMsg('\u2713 Update found: '+m[1]+'.');
    return 'update';
  }catch(e){
    if(manual) setUpdMsg('Check failed: '+e.message, true);
    return 'offline';
  }finally{ _updChecking = false; }
}
function showUpdateBar(){
  const el = document.getElementById('updBar'); if(!el) return;
  const t = el.querySelector('.upd-txt');
  if(t) t.textContent = liveSessionRunning()
    ? 'New version ready \u2014 reload after your session'
    : 'New version available';
  el.classList.add('show');
}
function hideUpdateBar(){
  const el = document.getElementById('updBar'); if(el) el.classList.remove('show');
}
function dismissUpdate(){
  _updDismissed = _updRemote; hideUpdateBar();
}
function liveSessionRunning(){
  try{ return !!(typeof live!=='undefined' && live && live.exercises && live.exercises.length); }
  catch(e){ return false; }
}
async function applyUpdate(){
  if(liveSessionRunning()){
    if(!confirm('You have a workout session in progress. Your sets are saved and will be restored after reloading \u2014 reload now?')) return;
  }
  try{ await fetch(appURL(), {cache:'reload'}); }catch(e){}
  location.reload();
}
function setUpdMsg(t, err){
  const el = document.getElementById('updMsg');
  if(el){ el.textContent = t; el.className = err ? 'err' : 'small ok'; }
}
function startUpdateWatcher(){
  setTimeout(()=>checkForUpdate(false), 5000);          // shortly after load
  setInterval(()=>checkForUpdate(false), UPD_INTERVAL_MS);
  document.addEventListener('visibilitychange', ()=>{   // and whenever you come back to it
    if(document.visibilityState==='visible' && Date.now()-_updLastCheck > 60000) checkForUpdate(false);
  });
  window.addEventListener('online', ()=>checkForUpdate(false));
}


/* ============================================================
   ANALYTICS — deep-dive engines. All honest-data: every view
   degrades gracefully when history is thin, nothing is invented.
   ============================================================ */
function anEffMult(e){ return e==='easy' ? 0.85 : e==='grind' ? 1.25 : e==='fail' ? 1.45 : 1; }
function anEpley(w,r){ w=+w||0; r=+r||0; if(w<=0||r<=0) return 0; return r===1 ? w : w*(1+r/30); }
function anWeekStart(key){ return mesoMondayOf(key); }
function anLastWeeks(n, includeCurrent){
  const cur = anWeekStart(todayKey());
  const out = [];
  for(let i=(includeCurrent?0:1); out.length<n; i++) out.push(mesoAddDays(cur, -7*i));
  return out.reverse();   // oldest first
}
function anSessionsFor(ex){
  return [...S.logs].filter(l=>!l.deload && l.entries.some(e=>e.exercise===ex))
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function anBigLifts(minSessions){
  const counts = {};
  S.logs.forEach(l=>{ if(l.deload) return; l.entries.forEach(e=>{ counts[e.exercise]=(counts[e.exercise]||0)+1; }); });
  return Object.keys(counts).filter(k=>counts[k]>=(minSessions||6)).sort((a,b)=>counts[b]-counts[a]);
}
function anR2(pts, reg){
  if(!reg || pts.length<3) return 0;
  const x0 = reg.x0;
  const my = pts.reduce((a,p)=>a+p.v,0)/pts.length;
  let ssRes=0, ssTot=0;
  pts.forEach(p=>{
    const x=(new Date(p.date).getTime()-x0)/86400000;
    const yhat = reg.intercept + reg.slope*x;
    ssRes += (p.v-yhat)**2; ssTot += (p.v-my)**2;
  });
  return ssTot===0 ? 0 : Math.max(0, 1 - ssRes/ssTot);
}
function anSpark(pts, w, h, color, opts){
  opts = opts||{};
  if(!pts || pts.length<2) return '<div class="small" style="color:var(--dim)">not enough points to chart</div>';
  const vs = pts.map(p=>p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if(hi===lo){ hi+=1; lo-=1; }
  const pad = (hi-lo)*0.12; lo-=pad; hi+=pad;
  const px = i => (i/(pts.length-1))*(w-8)+4;
  const py = v => h-6 - ((v-lo)/(hi-lo))*(h-12);
  const path = pts.map((p,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(p.v).toFixed(1)).join(' ');
  let extra = '';
  if(opts.band){ // reference band [lo,hi] in value space
    const y1=py(opts.band[1]), y2=py(opts.band[0]);
    extra += '<rect x="0" y="'+y1.toFixed(1)+'" width="'+w+'" height="'+(y2-y1).toFixed(1)+'" fill="'+(opts.bandColor||'rgba(70,205,186,.08)')+'"/>';
  }
  const last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">'+extra+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+px(pts.length-1).toFixed(1)+'" cy="'+py(last.v).toFixed(1)+'" r="3" fill="'+color+'"/></svg>';
}
function anBarRow(label, pct, valTxt, color){
  const p = Math.max(0, Math.min(100, pct));
  return '<div class="an-brow"><div class="an-brow-top"><span>'+esc(label)+'</span><span class="mono">'+valTxt+'</span></div>'+
    '<div class="an-bar"><div style="width:'+p.toFixed(1)+'%;background:'+color+'"></div></div></div>';
}
function anEmpty(msg){
  return '<div class="card"><p class="small" style="color:var(--dim)">'+msg+'</p></div>';
}

/* ---------------- FATIGUE MODEL ----------------
   Strain = hard sets weighted by effort tags (the honest proxy that works
   across lifts of very different absolute load). Deload sets count half.
   Fatigue ratio = last-7-days strain vs the trailing 28-day weekly average. */
function anStrainBetween(a, b){
  let s = 0;
  S.logs.filter(l=>l.date>=a && l.date<=b).forEach(l=>{
    const mult = l.deload ? 0.5 : 1;
    l.entries.forEach(e=>e.sets.forEach(st=>{ s += anEffMult(st.e)*mult; }));
  });
  return s;
}
function anStrainByWeek(n){
  return anLastWeeks(n, true).map(ws=>({date:ws, v:anStrainBetween(ws, mesoAddDays(ws,6))}));
}
function fatigueIndex(){
  const acute = anStrainBetween(mesoAddDays(todayKey(),-6), todayKey());
  const chronic = anStrainBetween(mesoAddDays(todayKey(),-33), mesoAddDays(todayKey(),-6)) / 4; // prior 28d, weekly
  if(chronic < 4) return {ok:false, reason:'Needs about a month of logged training to establish your baseline.'};
  let ratio = acute/chronic;
  // readiness modifier: a run of low-readiness days makes the same load cost more
  const last7 = S.readiness.filter(r=>r.date>=mesoAddDays(todayKey(),-6));
  const lows = last7.filter(r=>r.tier==='low').length;
  if(lows>=2) ratio += 0.12;
  const status = ratio<0.75 ? 'fresh' : ratio<=1.25 ? 'productive' : ratio<=1.5 ? 'high' : 'overreached';
  return {ok:true, acute:Math.round(acute), chronic:Math.round(chronic*10)/10, ratio:Math.round(ratio*100)/100, status, lowDays:lows};
}
const FATIGUE_COLORS = {fresh:'var(--cyan)', productive:'var(--good)', high:'var(--amber)', overreached:'var(--red)'};
const FATIGUE_LABELS = {
  fresh:'Fresh — load is well below your recent norm. Fine after a deload; if unintentional, you have room to push.',
  productive:'Productive — training load sits in the sweet spot relative to what your body is adapted to.',
  high:'High — meaningfully above your recent norm. Sustainable briefly, but watch sleep and readiness.',
  overreached:'Overreached — well above your adapted load. If this holds another week, a deload is the smart move.'};
function fatigueSuggestsDeload(){
  const fi = fatigueIndex();
  if(!fi.ok || (fi.status!=='overreached' && !(fi.status==='high' && fi.lowDays>=2))) return null;
  if(deloadActive()) return null;
  const nd = (typeof mesoNextDeload==='function') ? mesoNextDeload() : null;
  if(nd && typeof mesoWeeksUntil==='function'){ const w = mesoWeeksUntil(nd); if(w!=null && w<=1) return null; } // one is already imminent
  const dis = S.fatigueDismissed;
  if(dis && dis > mesoAddDays(todayKey(),-10)) return null;
  return fi;
}
function fatigueDismiss(){ S.fatigueDismissed = todayKey(); save(false); renderLive(); try{ renderAnFatigue(); }catch(e){} }

/* ---------------- STRENGTH CURVE ---------------- */
const AN_REP_BUCKETS = [{k:'1\u20133',lo:1,hi:3},{k:'4\u20136',lo:4,hi:6},{k:'7\u20139',lo:7,hi:9},{k:'10\u201312',lo:10,hi:12},{k:'13+',lo:13,hi:99}];
let anStrengthPick = null;
function anStrengthCurve(ex){
  const buckets = AN_REP_BUCKETS.map(b=>({...b, bestW:0, bestE1:0, sets:0}));
  anSessionsFor(ex).forEach(l=>l.entries.forEach(e=>{
    if(e.exercise!==ex) return;
    e.sets.forEach(s=>{
      const w=+s.w||0, r=+s.r||0; if(w<=0||r<=0) return;
      const b = buckets.find(x=>r>=x.lo && r<=x.hi); if(!b) return;
      b.sets++;
      if(w>b.bestW) b.bestW=w;
      const e1 = anEpley(w,r); if(e1>b.bestE1) b.bestE1=e1;
    });
  }));
  return buckets;
}
function renderAnStrength(){
  const el = document.getElementById('an_strength'); if(!el) return;
  const lifts = anBigLifts(4);
  if(!lifts.length){ el.innerHTML = anEmpty('Strength curves need at least 4 logged sessions of a lift. Keep training \u2014 this fills in on its own.'); return; }
  if(!anStrengthPick || !lifts.includes(anStrengthPick)) anStrengthPick = lifts[0];
  const buckets = anStrengthCurve(anStrengthPick).filter(b=>b.sets>0);
  let h = '<div class="card"><div class="k">Strength curve</div>'+
    '<p class="small" style="margin-bottom:10px">Where you\u2019re strongest across rep ranges \u2014 best estimated 1RM produced from sets in each bucket.</p>'+
    '<div class="field" style="max-width:280px;margin-bottom:14px"><label>Lift</label><select onchange="anStrengthPick=this.value;renderAnStrength()">'+
    lifts.map(l=>'<option'+(l===anStrengthPick?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select></div>';
  if(!buckets.length){ h += '<p class="small" style="color:var(--dim)">No usable sets for this lift yet.</p></div>'; el.innerHTML=h; return; }
  const maxE1 = Math.max(...buckets.map(b=>b.bestE1));
  const best = buckets.reduce((a,b)=>b.bestE1>a.bestE1?b:a, buckets[0]);
  buckets.forEach(b=>{
    const isBest = b===best;
    h += anBarRow(b.k+' reps'+(isBest?' \u2605':''), 100*b.bestE1/maxE1,
      Math.round(b.bestE1)+' e1RM \u00b7 best '+b.bestW+' lb \u00b7 '+b.sets+' sets',
      isBest?'var(--amber)':'var(--cyan)');
  });
  h += '<p class="small" style="margin-top:12px">Your strongest zone on '+esc(anStrengthPick)+' is <b style="color:var(--amber)">'+best.k+' reps</b>.'+
       (buckets.length<3 ? ' Log sets across more rep ranges for a fuller picture.' : '')+'</p></div>';
  el.innerHTML = h;
}

/* ---------------- RECOVERY ---------------- */
const AN_GAP_BUCKETS = [{k:'1\u20132 days',lo:1,hi:2},{k:'3\u20134 days',lo:3,hi:4},{k:'5\u20137 days',lo:5,hi:7},{k:'8+ days',lo:8,hi:99}];
function anSessionE1(ex, log){
  let best=0;
  log.entries.forEach(e=>{ if(e.exercise!==ex) return; e.sets.forEach(s=>{ const v=anEpley(s.w,s.r); if(v>best) best=v; }); });
  return best;
}
function anRecoveryFor(ex){
  const ses = anSessionsFor(ex);
  if(ses.length<5) return null;
  const gaps=[], buckets = AN_GAP_BUCKETS.map(b=>({...b, n:0, ok:0}));
  for(let i=1;i<ses.length;i++){
    const gap = Math.round((new Date(ses[i].date)-new Date(ses[i-1].date))/86400000);
    if(gap<1) continue;
    const prev = anSessionE1(ex, ses[i-1]), cur = anSessionE1(ex, ses[i]);
    if(prev<=0 || cur<=0) continue;
    gaps.push(gap);
    const b = buckets.find(x=>gap>=x.lo && gap<=x.hi); if(!b) continue;
    b.n++; if(cur >= prev*0.995) b.ok++;   // matched or beat (0.5% tolerance)
  }
  if(gaps.length<4) return null;
  gaps.sort((a,b)=>a-b);
  const median = gaps[Math.floor(gaps.length/2)];
  const scored = buckets.filter(b=>b.n>=2).map(b=>({...b, rate:b.ok/b.n}));
  const best = scored.length ? scored.reduce((a,b)=>b.rate>a.rate?b:a, scored[0]) : null;
  return {median, buckets, best, n:gaps.length};
}
function renderAnRecovery(){
  const el = document.getElementById('an_recovery'); if(!el) return;
  const lifts = anBigLifts(5);
  const rows = lifts.map(ex=>({ex, r:anRecoveryFor(ex)})).filter(x=>x.r);
  let h = '<div class="card"><div class="k">Recovery</div>'+
    '<p class="small" style="margin-bottom:4px">How your big lifts respond to different rest gaps between sessions \u2014 the share of sessions where you matched or beat your previous e1RM after each gap length.</p></div>';
  if(!rows.length){ el.innerHTML = h + anEmpty('Needs roughly 5+ sessions per lift with varied spacing. This sharpens as your log grows.'); return; }
  rows.slice(0,4).forEach(({ex, r})=>{
    h += '<div class="card"><div class="k">'+esc(ex)+'</div>';
    r.buckets.filter(b=>b.n>0).forEach(b=>{
      const rate = b.n ? Math.round(100*b.ok/b.n) : 0;
      const isBest = r.best && b.k===r.best.k;
      h += anBarRow(b.k+(isBest?' \u2605':''), rate, rate+'% held/beat \u00b7 '+b.n+'\u00d7', isBest?'var(--amber)':'var(--cyan)');
    });
    h += '<p class="small" style="margin-top:10px">Typical gap: '+r.median+' days.'+
      (r.best ? ' Best results so far after <b style="color:var(--amber)">'+r.best.k+'</b> of rest.' : '')+
      (r.n<8 ? ' <span style="color:var(--dim)">(Small sample \u2014 treat as a hint, not a rule.)</span>' : '')+'</p></div>';
  });
  el.innerHTML = h;
}

function renderAnDev(){
  const el = document.getElementById('an_dev'); if(!el) return;
  const data = anGroupWeekly(8);
  const hasAny = data.some(w=>Object.values(w.vol).some(v=>v>0));
  if(!hasAny){ el.innerHTML = anEmpty('Development tracking needs a few weeks of logged sessions.'); return; }
  const rows = MUSCLE_GROUPS.filter(g=>g!=='Abs').map(g=>{
    const pts = data.map(w=>({date:w.date, v:w.vol[g]||0}));

    const prior  = pts.slice(0,4).reduce((a,p)=>a+p.v,0)/4;

  }).filter(r=>r.recent>0.25 || r.prior>0.25);
  rows.sort((a,b)=>b.delta-a.delta);
  let h = '<div class="card"><div class="k">Development</div>'+

  rows.forEach(r=>{
    const up = r.delta>0.12, down = r.delta<-0.12;
    const col = up?'var(--cyan)':down?'var(--red)':'var(--muted)';
    const arrow = up?'\u2191':down?'\u2193':'\u2192';
    const pctTxt = (r.prior>0.5||r.recent>0.5) ? (r.delta>=0?'+':'')+Math.round(r.delta*100)+'%' : '\u2014';
    h += '<div class="card" style="padding:12px 14px"><div style="display:flex;align-items:center;gap:12px">'+

      '<b style="font-family:var(--disp);font-size:15px;letter-spacing:.03em">'+r.g+'</b>'+
      '<span class="mono" style="font-size:12px;color:'+col+'">'+arrow+' '+pctTxt+' \u00b7 '+(Math.round(r.recent*10)/10)+' sets/wk</span></div>'+
      anSpark(r.pts, 300, 34, col)+'</div></div></div>';
  });
  const lag = rows.filter(r=>r.delta<-0.25);
  if(lag.length) h += '<div class="card"><p class="small" style="color:var(--amber)">\u26a0 Falling off: '+lag.map(r=>r.g).join(', ')+'. Intentional (e.g. a strength block) is fine \u2014 unintentional drift is how weak points form.</p></div>';
  el.innerHTML = h;
}

/* ---------------- PREDICTIONS ---------------- */
function anPredictFor(ex){
  const pts = e1rmSeries(ex).slice(-10);
  if(pts.length<5) return {ex, ok:false, why:'needs 5+ sessions'};
  const spanDays = (new Date(pts[pts.length-1].date)-new Date(pts[0].date))/86400000;
  if(spanDays<28) return {ex, ok:false, why:'needs a month of history'};
  const reg = linreg(pts); if(!reg) return {ex, ok:false, why:'no trend'};
  const r2 = anR2(pts, reg);
  const perWeek = reg.slope*7;
  const cur = Math.max(...pts.map(p=>p.v));
  if(isMaxed(ex)) return {ex, ok:true, maxed:true, cur, perWeek, r2};
  if(perWeek < 0.15) return {ex, ok:true, flat:true, cur, perWeek, r2};
  // next two 5-lb milestones above current best
  const targets = [];
  let t = Math.ceil((cur+0.01)/5)*5;
  while(targets.length<2){ targets.push(t); t+=5; }
  const etas = targets.map(tv=>{
    const days = (tv-cur)/reg.slope;
    return {target:tv, days:Math.round(days), date:mesoAddDays(todayKey(), Math.round(days))};
  }).filter(e=>e.days<=182);
  return {ex, ok:true, flat:false, cur, perWeek, r2, etas};
}
/* ---- ensemble model: percentile bands built from YOUR OWN residual noise ----
   The center line is the same least-squares trend used above (median case). The spread
   isn't invented \u2014 it's the actual scatter of your historical e1RM points around that
   trend line (residual std dev), fanned out with sqrt(time) the way a real random-walk
   confidence interval grows, then scaled per percentile via a standard-normal quantile
   approximation. Faster/slower percentiles are read as "if your week-to-week variance
   keeps looking like it has so far, this is roughly where the fast/slow edge of that
   variance would land you" \u2014 not a claim about training methodology. */
const AN_ENS_PCTS = [
  {p:10, z:-1.2816, label:'Slower (p10)',  col:'var(--dim)'},
  {p:50, z:0,        label:'Expected (p50)', col:'var(--amber)'},
  {p:90, z:1.2816,   label:'Faster (p90)',  col:'var(--cyan)'}
];
function anResidualStd(pts, reg){
  if(!reg || pts.length<3) return 0;
  const x0 = reg.x0;
  const resid = pts.map(p=>{
    const x = (new Date(p.date).getTime()-x0)/86400000;
    const fit = reg.intercept + reg.slope*x;
    return p.v - fit;
  });
  const mean = resid.reduce((a,b)=>a+b,0)/resid.length;
  const variance = resid.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(1,resid.length-1);
  return Math.sqrt(variance);
}
function anEnsembleFor(ex, horizonDays){
  const pts = e1rmSeries(ex);
  if(pts.length<5) return {ok:false, why:'Needs 5+ logged sessions on '+ex+' to build a trend.'};
  const spanDays = (new Date(pts[pts.length-1].date)-new Date(pts[0].date))/86400000;
  if(spanDays<28) return {ok:false, why:'Needs about a month of history on '+ex+' \u2014 keep logging it.'};
  const reg = linreg(pts); if(!reg) return {ok:false, why:'No usable trend yet.'};
  const r2 = anR2(pts, reg);
  const sd = anResidualStd(pts, reg);
  const cur = Math.max(...pts.map(p=>p.v));
  const todayX = (new Date(todayKey()+'T00:00:00').getTime()-reg.x0)/86400000;
  const startDay = Math.round(todayX);
  const steps = 14; // sample points across the horizon for a smooth-ish path
  const series = {};
  AN_ENS_PCTS.forEach(pc=>{ series[pc.p] = []; });
  for(let i=0;i<=steps;i++){
    const day = startDay + Math.round((horizonDays/steps)*i);
    const fit = reg.intercept + reg.slope*day;
    // uncertainty grows with sqrt(elapsed) beyond "now" \u2014 a standard random-walk property,
    // and is anchored so every band passes through the actual current e1RM at day 0.
    const daysOut = Math.max(0, day - startDay);
    const spread = sd * Math.sqrt(1 + daysOut/14);
    AN_ENS_PCTS.forEach(pc=>{
      const v = pc.p===50 ? fit : fit + pc.z*spread;
      series[pc.p].push({date: mesoAddDays(todayKey(), day-startDay), v: Math.max(0, Math.round(v*10)/10)});
    });
  }
  // re-anchor every band's first point to the real current e1RM so lines visibly start together
  AN_ENS_PCTS.forEach(pc=>{ if(series[pc.p].length) series[pc.p][0].v = cur; });
  return {ok:true, ex, cur, r2, sd, perWeek:reg.slope*7, series,
    conf: r2>0.7?'steady trend':r2>0.4?'noisy trend':'very noisy trend'};
}
const AN_ENS_RANGES = [
  {days:28,  label:'4 weeks'},
  {days:84,  label:'12 weeks'},
  {days:182, label:'6 months'},
  {days:365, label:'1 year'}
];
let anEnsembleEx = null, anEnsembleRange = 84;
function anEnsembleChangeEx(v){ anEnsembleEx = v||null; renderAnPred(); }
function anEnsembleChangeRange(v){ anEnsembleRange = +v||84; renderAnPred(); }
function anEnsembleChartSVG(res, w, h){
  const all = res.series[10].concat(res.series[50], res.series[90]);
  const vs = all.map(p=>p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if(hi===lo){ hi+=1; lo-=1; }
  const pad = (hi-lo)*0.10; lo = Math.max(0, lo-pad); hi += pad;
  const n = res.series[50].length;
  const px = i => (i/(n-1))*(w-44)+38;
  const py = v => h-24 - ((v-lo)/(hi-lo))*(h-40);
  const pathFor = arr => arr.map((p,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(p.v).toFixed(1)).join(' ');
  const bandTop = res.series[90].map((p,i)=>px(i).toFixed(1)+','+py(p.v).toFixed(1)).join(' ');
  const bandBot = res.series[10].slice().reverse().map((p,i)=>px(n-1-i).toFixed(1)+','+py(res.series[10][n-1-i].v).toFixed(1)).join(' ');
  let s = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">';
  // shaded p10\u2013p90 envelope
  s += '<polygon points="'+bandTop+' '+bandBot+'" fill="rgba(246,134,47,.08)"/>';
  // y gridlines at lo/hi
  s += '<text x="4" y="'+(py(hi)+4).toFixed(1)+'" class="mono" font-size="10" fill="var(--dim)">'+Math.round(hi)+'</text>';
  s += '<text x="4" y="'+(py(lo)+4).toFixed(1)+'" class="mono" font-size="10" fill="var(--dim)">'+Math.round(lo)+'</text>';
  AN_ENS_PCTS.forEach(pc=>{
    const dash = pc.p===50 ? '' : ' stroke-dasharray="4 3"';
    s += '<path d="'+pathFor(res.series[pc.p])+'" fill="none" stroke="'+pc.col+'" stroke-width="'+(pc.p===50?2.5:1.5)+'" stroke-linejoin="round" stroke-linecap="round"'+dash+'/>';
    const last = res.series[pc.p][n-1];
    s += '<circle cx="'+px(n-1).toFixed(1)+'" cy="'+py(last.v).toFixed(1)+'" r="'+(pc.p===50?3.5:2.5)+'" fill="'+pc.col+'"/>';
  });
  // x-axis start/end date labels
  s += '<text x="'+px(0).toFixed(1)+'" y="'+(h-6)+'" text-anchor="start" class="mono" font-size="10" fill="var(--dim)">'+fmtDate(res.series[50][0].date)+'</text>';
  s += '<text x="'+px(n-1).toFixed(1)+'" y="'+(h-6)+'" text-anchor="end" class="mono" font-size="10" fill="var(--dim)">'+fmtDate(res.series[50][n-1].date)+'</text>';
  s += '</svg>';
  return s;
}
function anEnsembleCardHTML(){
  const lifts = anBigLifts(5);
  if(!lifts.length) return anEmpty('Ensemble projection needs at least 5 sessions on a lift.');
  if(!anEnsembleEx || lifts.indexOf(anEnsembleEx)<0) anEnsembleEx = lifts[0];
  let h = '<div class="card">';
  h += '<div class="k">Ensemble projection</div>';
  h += '<p class="small">Percentile range built from the actual noise in your own e1RM history \u2014 p50 is the straight-line trend, p10/p90 fan out from how much your real data has bounced around that trend so far. Wider = less consistent lift.</p>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">';
  h += '<select onchange="anEnsembleChangeEx(this.value)" style="flex:1;min-width:160px">'+
    lifts.map(l=>'<option value="'+esc(l)+'"'+(l===anEnsembleEx?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';
  h += '<select onchange="anEnsembleChangeRange(this.value)" style="flex:none;width:auto">'+
    AN_ENS_RANGES.map(r=>'<option value="'+r.days+'"'+(r.days===anEnsembleRange?' selected':'')+'>'+r.label+'</option>').join('')+'</select>';
  h += '</div>';
  const res = anEnsembleFor(anEnsembleEx, anEnsembleRange);
  if(!res.ok){ h += '<p class="small" style="color:var(--dim)">'+esc(res.why)+'</p></div>'; return h; }
  h += anEnsembleChartSVG(res, 640, 220);
  h += '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">';
  AN_ENS_PCTS.forEach(pc=>{
    const last = res.series[pc.p][res.series[pc.p].length-1];
    h += '<div style="display:flex;align-items:center;gap:6px">'+
      '<span style="width:9px;height:9px;border-radius:50%;background:'+pc.col+';display:inline-block"></span>'+
      '<span class="small">'+pc.label+': <span class="mono" style="color:'+pc.col+'">'+Math.round(last.v)+' lb</span></span></div>';
  });
  h += '</div>';
  h += '<p class="small" style="margin-top:10px;color:var(--dim)">Trend confidence: '+res.conf+' \u00b7 currently '+
    (res.perWeek<0.15?'holding flat':('+'+(Math.round(res.perWeek*10)/10)+' lb/wk on the median line'))+
    '. Bands widen the further out you look \u2014 that\u2019s honest, not a bug: nobody\u2019s lifts are actually a straight line for a full year.</p>';
  h += '</div>';
  return h;
}
function renderAnPred(){
  const el = document.getElementById('an_pred'); if(!el) return;
  const lifts = anBigLifts(5).slice(0,6);
  if(!lifts.length){ el.innerHTML = anEmpty('Predictions need at least 5 sessions per lift spanning a month or more.'); return; }
  let h = '<div class="card"><div class="k">Predictions</div>'+
    '<p class="small">Straight-line projection of your recent e1RM trend. Useful as a target date, not a promise \u2014 progress is never actually linear, and anything past ~6 months is guesswork (so it isn\u2019t shown).</p></div>';
  h += anEnsembleCardHTML();
  let shown = 0;
  lifts.forEach(ex=>{
    const p = anPredictFor(ex);
    if(!p.ok){ return; }
    shown++;
    const conf = p.r2>0.7?'steady trend':p.r2>0.4?'noisy trend':'very noisy trend';
    h += '<div class="card"><div class="k">'+esc(ex)+'</div>'+
      '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">'+
      '<span style="font-family:var(--disp);font-size:30px;font-weight:700;color:var(--text)">'+Math.round(p.cur)+'</span>'+
      '<span class="small">current e1RM</span>'+
      '<span class="mono" style="margin-left:auto;font-size:12px;color:'+(p.maxed?'var(--amber)':(p.flat?'var(--dim)':'var(--cyan)'))+'">'+
      (p.maxed?'at machine ceiling':(p.flat?'holding steady':'+'+(Math.round(p.perWeek*10)/10)+' lb/wk'))+'</span></div>';
    if(p.maxed){
      h += '<p class="small">Marked MAXED \u2014 there\u2019s no heavier setting on this machine, so there\u2019s no weight ETA to project. Progress here is more reps or sets at '+Math.round(p.cur)+' lb.</p>';
    } else if(p.flat){
      h += '<p class="small">Trend is flat right now \u2014 no ETA to give honestly.'+
        ((typeof mesoCurrentWeek==='function' && (mesoCurrentWeek()||{}).type==='hyp') ? ' You\u2019re in a hypertrophy block, so that\u2019s the expected shape.' : '')+'</p>';
    } else if(p.etas && p.etas.length){
      p.etas.forEach(e=>{
        h += '<div class="an-eta"><span class="mono" style="color:var(--amber);font-size:15px;font-weight:600">'+e.target+' lb</span>'+
             '<span class="small">\u2248 '+fmtDate(e.date)+' <span style="color:var(--dim)">('+Math.round(e.days/7)+' wks \u00b7 '+conf+')</span></span></div>';
      });
    } else {
      h += '<p class="small">Next milestone is more than ~6 months out at the current rate \u2014 too far to forecast honestly.</p>';
    }
    h += '</div>';
  });
  if(!shown) h += anEmpty('No lift has enough history for a projection yet \u2014 needs 5+ sessions across a month.');
  el.innerHTML = h;
}

/* ---------------- OVERVIEW (annual review + milestones) ---------------- */
function renderAnOverview(){
  const el = document.getElementById('an_over'); if(!el) return;
  const year = todayKey().slice(0,4);
  const logs = S.logs.filter(l=>l.date.startsWith(year));
  if(!logs.length){ el.innerHTML = anEmpty('Nothing logged in '+year+' yet.'); return; }
  let sets=0, vol=0; const exSet = new Set(); const monthCount = {};
  logs.forEach(l=>{
    monthCount[l.date.slice(0,7)] = (monthCount[l.date.slice(0,7)]||0)+1;
    l.entries.forEach(e=>{ exSet.add(e.exercise); sets+=e.sets.length; e.sets.forEach(s=>{ vol += (+s.w||0)*(+s.r||0); }); });
  });
  const bigMonth = Object.entries(monthCount).sort((a,b)=>b[1]-a[1])[0];
  const monthName = m => new Date(m+'-02T00:00:00').toLocaleString('en-US',{month:'long'});
  // e1RM gains this year for top lifts
  const gains = anBigLifts(4).slice(0,5).map(ex=>{
    const pts = e1rmSeries(ex).filter(p=>p.date.startsWith(year));
    if(pts.length<2) return null;
    const first = pts[0].v, best = Math.max(...pts.map(p=>p.v));
    return {ex, first, best, gain:best-first};
  }).filter(g=>g && g.gain>0.5).sort((a,b)=>b.gain-a.gain);
  // bodyweight change this year
  const bw = [...S.weights].filter(w=>w.date.startsWith(year)).sort((a,b)=>a.date.localeCompare(b.date));
  // actual-weight PRs set this year
  const prs = [];
  anBigLifts(3).forEach(ex=>{
    const p = actualPR(ex);
    if(p && p.date.startsWith(year)) prs.push({ex, w:p.w, r:p.r, date:p.date});
  });
  prs.sort((a,b)=>b.date.localeCompare(a.date));

  let h = '<div class="card"><div class="k">'+year+' so far</div>'+
    '<div class="an-stats">'+
    '<div class="an-stat"><span class="an-stat-n">'+logs.length+'</span><span class="an-stat-l">sessions</span></div>'+
    '<div class="an-stat"><span class="an-stat-n">'+sets+'</span><span class="an-stat-l">sets</span></div>'+
    '<div class="an-stat"><span class="an-stat-n">'+(vol>=1000000 ? (vol/1000000).toFixed(1)+'M' : Math.round(vol/1000)+'k')+'</span><span class="an-stat-l">lb moved</span></div>'+
    '<div class="an-stat"><span class="an-stat-n">'+exSet.size+'</span><span class="an-stat-l">exercises</span></div>'+
    '</div>'+
    (bigMonth ? '<p class="small" style="margin-top:10px;color:var(--dim)">Biggest month: '+monthName(bigMonth[0])+' ('+bigMonth[1]+' sessions)'+
      (bw.length>=2 ? ' \u00b7 bodyweight '+bw[0].lbs+' \u2192 '+bw[bw.length-1].lbs+' lb' : '')+'</p>' : '')+
    '</div>';
  if(gains.length){
    h += '<div class="card"><div class="k">Strength gained this year</div>';
    const maxG = gains[0].gain;
    gains.forEach(g=>{ h += anBarRow(g.ex, 100*g.gain/maxG, '+'+Math.round(g.gain)+' lb e1RM ('+Math.round(g.first)+' \u2192 '+Math.round(g.best)+')', 'var(--amber)'); });
    h += '</div>';
  }
  if(prs.length){
    h += '<div class="card"><div class="k">PRs set in '+year+'</div>';
    prs.slice(0,8).forEach(p=>{
      h += '<div class="an-pr"><span class="mono" style="color:var(--amber)">'+p.w+'\u00d7'+p.r+'</span>'+
        '<span style="flex:1;min-width:0">'+esc(p.ex)+'</span>'+
        '<span class="small" style="color:var(--dim)">'+fmtDate(p.date)+'</span></div>';
    });
    h += '</div>';
  }
  h += '<div class="card"><p class="small" style="color:var(--dim)">Dig deeper in the other Analytics views \u2014 strength curve, fatigue, recovery, development, and predictions each cut this data a different way.</p></div>';
  el.innerHTML = h;
}

/* ============================================================
   READINESS CHECK-IN V3 — runs at session start, five quick taps.
   Low readiness triggers an ACTIVE choice (trim volume / keep plan),
   never a silent change.
   ============================================================ */
const RD_STRESS_OPTS = ['calm','normal','wired'];
const RD_MOTIV_OPTS  = ['meh','ready','fired up'];
let _rdV3 = {};
let _rdPendingDay = null;
let liveTrimVol = false;

function readinessTierV3(r){
  let sc = (RD_SLEEP[r.sleep]||0)+(RD_SORE[r.sore]||0)+(RD_ENERGY[r.energy]||0);
  if(r.stress==='wired') sc -= 1; else if(r.stress==='calm') sc += 0.5;
  if(r.motiv==='meh')  sc -= 0.5; else if(r.motiv==='fired up') sc += 1;
  return sc<=2 ? 'low' : sc<=5 ? 'ok' : 'high';
}
function openReadyCheck(dk){
  _rdPendingDay = dk; _rdV3 = {};
  const grp = (label,key,opts)=>'<div class="rd3-group"><span class="rd3-gl">'+label+'</span><div class="rd3-pills">'+
    opts.map(o=>'<button class="rd3-pill" data-k="'+key+'" data-v="'+o+'" onclick="rd3Pick(this)">'+o+'</button>').join('')+'</div></div>';
  document.getElementById('readyBody').innerHTML =
    '<p class="small" style="margin-bottom:14px">Ten seconds \u2014 this tunes today\u2019s targets to how recovered you actually are.</p>'+
    grp('Sleep','sleep',['<6','6-7','7-8','8+'])+
    grp('Soreness','sore',['fresh','mild','beat up'])+
    grp('Energy','energy',['low','ok','high'])+
    grp('Stress','stress',RD_STRESS_OPTS)+
    grp('Motivation','motiv',RD_MOTIV_OPTS)+
    '<div style="display:flex;gap:8px;margin-top:16px;align-items:center">'+
    '<button class="btn primary" style="flex:1;padding:13px" onclick="rd3Lock()">Start session</button>'+
    '<button class="btn ghost sm" onclick="rd3Skip()">Skip</button></div>'+
    '<p class="small err" id="rd3Msg" style="margin-top:8px"></p>';
  document.getElementById('readyOverlay').classList.add('show');
}
function rd3Pick(btn){
  const k = btn.dataset.k;
  _rdV3[k] = btn.dataset.v;
  document.querySelectorAll('.rd3-pill[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on', b===btn));
}
function rd3Skip(){
  S.readySkipDate = todayKey(); save(false);
  closeReadyOverlay(); _startLiveNow(_rdPendingDay, false);
}
function closeReadyOverlay(){ const el=document.getElementById('readyOverlay'); if(el) el.classList.remove('show'); }
function rd3Lock(){
  if(!_rdV3.sleep || !_rdV3.sore || !_rdV3.energy || !_rdV3.stress || !_rdV3.motiv){
    document.getElementById('rd3Msg').textContent = 'Tap one option in each row (or Skip).'; return;
  }
  const entry = {date:todayKey(), sleep:_rdV3.sleep, sore:_rdV3.sore, energy:_rdV3.energy, stress:_rdV3.stress, motiv:_rdV3.motiv};
  entry.tier = readinessTierV3(entry);
  S.readiness = S.readiness.filter(x=>x.date!==todayKey());
  S.readiness.push(entry); save();
  if(entry.tier==='low'){ rd3ShowTrimPrompt(entry); return; }   // active choice, never silent
  closeReadyOverlay(); _startLiveNow(_rdPendingDay, false);
}
function rd3ShowTrimPrompt(entry){
  document.getElementById('readyBody').innerHTML =
    '<div style="border-left:3px solid var(--red);padding-left:12px;margin-bottom:14px">'+
    '<b style="color:var(--red);text-transform:uppercase;letter-spacing:.08em;font-size:13px">Readiness: low</b>'+
    '<p class="small" style="margin-top:5px">'+esc(entry.sleep)+'h sleep \u00b7 '+esc(entry.sore)+' \u00b7 '+esc(entry.energy)+' energy \u00b7 '+esc(entry.stress)+' \u00b7 '+esc(entry.motiv)+'</p></div>'+
    '<p style="font-size:14px;line-height:1.55;margin-bottom:6px">Rough recovery day. Want to trim today\u2019s volume?</p>'+
    '<p class="small" style="margin-bottom:14px;color:var(--dim)">Trim = one fewer working set per exercise, and weight targets soften automatically. Showing up beats skipping; trimming beats grinding through junk sets.</p>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+
    '<button class="btn primary" style="padding:13px" onclick="rd3Start(true)">Trim volume today</button>'+

/* ============================================================
   OPERATIONS \u2014 multi-agent layer (CHARLIE / DELTA / ECHO / ZULU)
   ------------------------------------------------------------
   ZULU is the former Coach. It deliberately reuses S.chat and
   S.coachMem rather than copying them into new keys: relabelling
   in the UI is a zero-risk migration, whereas moving the data
   risks losing notes on a half-completed write or a sync race.
   ============================================================ */
const AGENTS = {
  zulu:    {name:'ZULU',    lead:true, col:'#dfae36',
            role:'Lead \u2014 oversight, coaching and cross-domain synthesis'},
  charlie: {name:'CHARLIE', col:'#46CDBA',
            role:'App logistics, data health and workout schedule'},
  delta:   {name:'DELTA',   col:'#F6862F',
            role:'Workouts, splits and progressive overload'},
  echo:    {name:'ECHO',    col:'#B79BFF',
            role:'Bulk, fuel and bodyweight trend'}
};
const AG_ORDER = ['charlie','delta','echo'];
const AG_PROP_TTL = 7; // days before a pending proposal auto-expires

function agState(){
  if(!S.agents) S.agents = {};
  const a = S.agents;
  if(!a.proposals) a.proposals = [];
  if(!a.log) a.log = [];
  if(!a.chats) a.chats = {};
  AG_ORDER.forEach(k=>{ if(!a.chats[k]) a.chats[k] = []; });
  if(!a.status) a.status = {};
  if(a.autoRun===undefined) a.autoRun = true;
  if(!a.lastRun) a.lastRun = '';
  // v4c and earlier persisted the in-flight flag onto S. Nothing reads it now, but it would
  // otherwise ride along in every gist push forever \u2014 drop it on first touch.
  if('_running' in a) delete a._running;
  return a;
}
function agUid(){ return 'ag'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
/* Cheap fingerprint of everything OPERATIONS renders. Used to skip pointless timer repaints.
   The trailing 5-minute bucket lets relative timestamps refresh without repainting every tick. */
let _opsSig = '';
function opsSignature(){
  const a = agState();
  return [
    a.proposals.length, a.log.length, a.lastRunAt||'',
    (S.chat||[]).length,
    AG_ORDER.map(k=>(a.chats[k]||[]).length).join(','),
    Object.keys(a.status||{}).map(k=>k+':'+(a.status[k].at||'')).join(','),
    _agRunning?1:0, a.autoRun?1:0,
    agActiveChat, agChatTall?1:0, agThinkingFor||'', agChatErr?agChatErr.id:'',
    Math.floor(Date.now()/300000)
  ].join('|');
}
function agPending(){ return agState().proposals.filter(p=>p.status==='pending'); }
function agPendingFor(id){ return agPending().filter(p=>p.agent===id); }

function agLog(agent, text){
  const a = agState();
  a.log.unshift({id:agUid(), agent, text, at:new Date().toISOString()});
  if(a.log.length > 120) a.log.length = 120; // bounded \u2014 this syncs to the gist
}

/* ---- expiry sweep: pending proposals die after 7 days ---- */
function agSweepExpired(){
  const a = agState(); let n=0;
  const today = new Date(todayKey());
  a.proposals.forEach(p=>{
    if(p.status!=='pending') return;
    if(new Date(p.expires) < today){ p.status='expired'; n++; }
  });
  return n;
}

/* ---- fix validation: never trust model output straight into state ---- */
const AG_FIX_TYPES = ['cal','pro','liftReset','deload','addEx','swapEx','schedule','cycleSchedule'];
function agValidateFix(fx){
  if(!fx || !fx.type) return null;
  if(AG_FIX_TYPES.indexOf(fx.type) < 0) return null;
  const p = fx.payload || {};
  if(fx.type==='cal'){
    const d = Math.round(+p.delta||0);
    if(!d || Math.abs(d) > 500) return null;      // clamp: no wild swings
    return {type:'cal', payload:{delta:d}};
  }
  if(fx.type==='pro'){
    const to = Math.round(+p.to||0);
    if(to < 80 || to > 300) return null;
    return {type:'pro', payload:{to}};
  }
  if(fx.type==='liftReset'){
    const w = Math.round(+p.w||0), days = Math.round(+p.days||0);
    if(!p.name || w<=0 || days<1 || days>30) return null;
    return {type:'liftReset', payload:{name:String(p.name), w, days}};
  }
  if(fx.type==='deload') return {type:'deload', payload:{}};
  if(fx.type==='addEx'){
    if(!p.name || !p.day || !S.split[p.day]) return null;
    return {type:'addEx', payload:{name:String(p.name), day:String(p.day)}};
  }
  if(fx.type==='swapEx'){
    if(!p.from || !p.to) return null;
    return {type:'swapEx', payload:{from:String(p.from), to:String(p.to)}};
  }
  if(fx.type==='schedule'){
    // A day-of-week map is meaningless once a rotating cycle is active \u2014 currentDayKey()
    // ignores S.schedule entirely in cycle mode, so silently accepting this would let an
    // agent "successfully" apply a change that has zero effect. Reject it outright instead
    // of applying something inert; cycle-mode schedule edits go through cycleSchedule below.
    if(scheduleMode()==='cycle') return null;
    const m = p.map||{}; const out = {};
    for(let d=0; d<7; d++){
      const v = m[d] !== undefined ? m[d] : m[String(d)];
      if(v===undefined) return null;             // must be a complete week
      const s = String(v);
      if(s!=='REST' && !S.split[s]) return null; // must reference a real day
      out[d] = s;
    }
    return {type:'schedule', payload:{map:out}};
  }
  if(fx.type==='cycleSchedule'){
    // Mirror image of the check above: this fix is only meaningful while cycle mode is
    // active, since dow mode never reads S.cycleSchedule at all.
    if(scheduleMode()!=='cycle') return null;
    const arr = p.pattern;
    if(!Array.isArray(arr) || arr.length<1 || arr.length>14) return null; // sane cycle length
    const out = [];
    for(const v of arr){
      const s = String(v);
      if(s!=='REST' && !S.split[s]) return null; // must reference a real split day
      out.push(s);
    }
    if(!out.some(d=>d!=='REST')) return null; // an all-rest cycle is never a legitimate proposal
    // Deliberately NOT letting the agent touch the anchor date: shifting it silently changes
    // what TODAY resolves to (today could flip from a lifting day to REST with no visible
    // cause). That's a bigger, more confusing change than reordering the pattern and stays
    // manual-only, via Settings.
    return {type:'cycleSchedule', payload:{pattern: out}};
  }
  return null;
}
function agFixSummary(fx){
  if(!fx) return 'Advisory only \u2014 nothing changes if you approve.';
  const p = fx.payload||{};
  if(fx.type==='cal')      return 'calories '+(p.delta>0?'+':'')+p.delta+'/day';
  if(fx.type==='pro')      return 'protein target \u2192 '+p.to+'g/day';
  if(fx.type==='liftReset')return p.name+' \u2192 '+p.w+' lb for '+p.days+'d';
  if(fx.type==='deload')   return 'start a deload week';
  if(fx.type==='addEx')    return 'add '+p.name+' to '+p.day;
  if(fx.type==='swapEx')   return p.from+' \u2192 '+p.to;
  if(fx.type==='schedule') return 'reschedule the training week';
  if(fx.type==='cycleSchedule') return 'rotating cycle \u2192 '+p.pattern.join(' \u2192 ');
  return fx.type;
}
/* ---- the only place an agent proposal is allowed to touch state ---- */
function agApplyFix(fx){
  const p = fx.payload||{};
  if(fx.type==='cal'){ S.fuel = S.fuel||{}; S.fuel.calTarget = (S.fuel.calTarget||3000) + p.delta; return true; }
  if(fx.type==='pro'){ S.fuel = S.fuel||{}; S.fuel.proTarget = p.to; return true; }
  if(fx.type==='liftReset'){
    invState().overrides[p.name] = {w:p.w, until:dateKeyOf(new Date(Date.now()+p.days*86400000)),
      note:'Agent reset \u2014 rebuild with clean reps, expires '+p.days+'d'};
    return true;
  }
  if(fx.type==='deload'){ startDeloadWeek(); return true; }
  if(fx.type==='addEx'){
    if(!S.split[p.day]) return false;
    S.split[p.day].exercises.push({name:p.name, inc:incFor(p.name)});
    return true;
  }
  if(fx.type==='swapEx'){
    for(const dk in S.split){
      const arr = S.split[dk].exercises;
      const i = arr.findIndex(x=>exName(x)===p.from);
      if(i>=0){ arr[i] = {name:p.to, inc:incFor(p.to)}; return true; }
    }
    return false;
  }
  if(fx.type==='schedule'){ S.schedule = Object.assign({}, p.map); return true; }
  if(fx.type==='cycleSchedule'){ scheduleInit(); S.cycleSchedule.pattern = p.pattern.slice(); return true; }
  return false;
}
function agApprove(pid){
  const p = agState().proposals.find(x=>x.id===pid);
  if(!p || p.status!=='pending') return;
  let ok = true;
  if(p.fix){ try{ ok = agApplyFix(p.fix); }catch(e){ ok = false; p.error = e.message; } }
  p.status = ok ? 'approved' : 'failed';
  p.closed = todayKey();
  agLog(p.agent, ok ? 'You approved \u201c'+p.title+'\u201d. '+(p.fix?'Applied: '+agFixSummary(p.fix)+'.':'Noted.')
                    : 'Tried to apply \u201c'+p.title+'\u201d but it did not land'+(p.error?' ('+p.error+')':'')+'. Nothing changed.');
  save(); setAccent(); renderOps();
}
function agReject(pid){
  const p = agState().proposals.find(x=>x.id===pid);
  if(!p || p.status!=='pending') return;
  p.status='rejected'; p.closed = todayKey();
  agLog(p.agent, 'You turned down \u201c'+p.title+'\u201d. I won\u2019t raise it again unless the picture changes.');
  save(); renderOps();
}

  const recentRejects = agState().proposals.filter(p=>p.status==='rejected').slice(-6)
    .map(p=>p.agent.toUpperCase()+': '+p.title).join('; ') || 'none';
  return '\nCURRENT SCHEDULE: '+sc+
