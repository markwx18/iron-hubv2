<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Hub">
<meta name="ironhub-build" content="2026-08-26-v3">
<title>Iron Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#0E1217; --base2:#0A0D11; --panel:#161B22; --panel2:#1B212A;
    --line:#262E38; --line2:#37414E;
    --amber:#F6862F; --amber-soft:#FFB877; --amber-dim:#5e4127;
    --cyan:#46CDBA; --cyan-dim:#2c5e54;
    --red:#E15842; --red-dim:#5e2c27;
    --violet:#B79BFF; --violet-dim:#4b3f78;
    --text:#EAEFF4; --muted:#8B94A1; --dim:#59626E;
    --good:#46CDBA; --warn:#F6862F; --bad:#E15842;
    /* Progress-status ladder. One token per tier so the verdict label, the step bar and the
       next-level card can never drift apart the way the two colour maps here used to. */
    --tier-none:#d23b3b; --tier-slow:#dfae36; --tier-prog:#3da25f;
    --tier-accel:#2f6fd0; --tier-rapid:var(--violet);
    --glow:rgba(246,134,47,.20);
    --disp:'Saira Condensed',sans-serif; --body:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
    --accent:var(--amber); --d1:#d23b3b; --d2:#2f6fd0; --d3:#dfae36; --d4:#3da25f; --d5:#e9e7e2; --d6:#9aa0ab;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:
      radial-gradient(900px 480px at 18% -8%, rgba(246,134,47,.05), transparent 60%),
      radial-gradient(760px 560px at 112% 8%, rgba(70,205,186,.045), transparent 55%),
      var(--base2);
    color:var(--text); font-family:var(--body); min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.55;}
  ::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:var(--body);}
  b,strong{font-weight:600;}
  h2{font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:18px 2px 9px;}
  .mono{font-family:var(--mono);}
  .small{font-size:12.5px; color:var(--muted); line-height:1.5;}
  .dim{color:var(--dim);} .up{color:var(--cyan);} .dn{color:var(--red);} .fl{color:var(--muted);} .ok{color:var(--cyan);} .err{color:var(--red);}

  .app-shell{max-width:780px; margin:0 auto; min-height:100vh; padding:0 0 96px; position:relative;}

  .topbar{position:sticky; top:0; z-index:40; backdrop-filter:blur(12px);
    background:linear-gradient(180deg,rgba(10,13,17,.92),rgba(10,13,17,.72)); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:12px;}
  .logo-mark{width:18px; height:18px; border:2px solid var(--amber); border-radius:4px; position:relative; transform:rotate(45deg); flex:none;}
  .logo-mark::after{content:""; position:absolute; inset:3.5px; background:var(--amber); border-radius:1px;}
  .brand-txt{font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:.03em; text-transform:uppercase; line-height:1; position:relative; top:1px;}
  .topbar .spacer{flex:1;}

  .modeswitch{display:flex; gap:0; background:var(--base); border:1px solid var(--line2); border-radius:4px; overflow:hidden; flex:none;}
  .modeswitch button{font-family:var(--disp); font-weight:600; font-size:14px; letter-spacing:.08em; text-transform:uppercase; padding:8px 16px; background:none; border:none; color:var(--dim); position:relative; transition:.15s;}
  .modeswitch button .pdot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px;vertical-align:middle;}
  .modeswitch button.on.live{color:#1a0e02; background:var(--amber);}
  .modeswitch button.on.review{color:var(--base); background:var(--cyan);}

  .welcome{margin:16px; padding:18px 18px 16px; border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:4px; background:linear-gradient(180deg,rgba(246,134,47,.06),transparent 70%),var(--panel);}
  .welcome .greet{font-family:var(--disp); font-weight:700; font-size:25px; line-height:1.02; text-transform:uppercase; letter-spacing:.01em;}
  .welcome .greet .accent{color:var(--amber);}
  .welcome .submsg{font-size:13.5px; color:var(--muted); margin-top:7px; line-height:1.5;}
  .welcome .wcta{margin-top:13px; display:flex; gap:9px; flex-wrap:wrap;}

  .pad{padding:0 16px;}
  .card{margin:12px 16px; padding:15px 16px; background:var(--panel); border:1px solid var(--line); border-radius:4px;}
  .card.flat{background:none; border:none; padding:0; margin:12px 16px;}
  .pad .card,.live-body .card,.review-body .card{margin-left:0; margin-right:0;}

  .btn{font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.05em; text-transform:uppercase; padding:11px 16px; border-radius:3px; border:1px solid var(--line2); background:var(--panel2); color:var(--text); transition:.14s; display:inline-flex; align-items:center; justify-content:center; gap:7px;}
  .btn:hover{border-color:var(--amber);} .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--amber); color:#1a0e02; border-color:var(--amber);} .btn.primary:hover{filter:brightness(1.07);}
  .btn.cyan{background:var(--cyan); color:var(--base); border-color:var(--cyan);}
  .btn.ghost{background:none;} .btn.sm{font-size:13px; padding:7px 12px;}
  .btn.block{width:100%;} .btn:disabled{opacity:.4; cursor:not-allowed;}

  .pill{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:3px 9px; border-radius:2px; border:1px solid var(--line2); color:var(--muted); margin:2px;}

  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%; background:var(--base); border:1px solid var(--line2); border-radius:3px; color:var(--text); padding:10px 11px; font-size:14px; font-family:var(--mono);}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--amber);}
  label{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:5px;}
  .row{display:flex; gap:10px; flex-wrap:wrap;} .row>div{flex:1; min-width:90px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:9px;}
  .stat{background:var(--base); border:1px solid var(--line); border-radius:3px; padding:11px 12px;}
  .stat .v{font-family:var(--mono); font-size:20px; font-weight:600;}
  .stat .v.good{color:var(--cyan);} .stat .v.warn{color:var(--amber);} .stat .v.bad{color:var(--red);}
  .stat .l{font-family:var(--mono); font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin-top:3px;}
  .stat .s{font-size:11px; color:var(--muted); margin-top:2px;}

  .ex{margin:10px 0; border:1px solid var(--line); border-radius:4px; background:var(--panel); overflow:hidden;}
  .ex-head{padding:13px 14px 11px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .ex-name{font-family:var(--disp); font-weight:600; font-size:18px; letter-spacing:.01em; text-transform:uppercase;}
  .ex-rec{font-family:var(--mono); font-size:13px; color:var(--amber); width:100%; margin-top:3px;}
  .ex-note{font-size:11.5px; color:var(--muted); width:100%; line-height:1.45;}
  .editex{margin-left:auto; background:none; border:1px solid var(--line2); color:var(--muted); width:30px; height:30px; border-radius:3px; font-size:13px;}
  .editex:hover{border-color:var(--amber); color:var(--amber);}
  .sets{padding:0 14px; display:flex; flex-direction:column; gap:7px;}
  .setrow{display:flex; align-items:center; gap:8px;}
  .setrow .sn{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--dim); width:34px; text-transform:uppercase;}
  .setrow input{width:74px; text-align:center; padding:8px;}
  .setrow .eff{font-family:var(--mono); font-size:11px; padding:7px 9px; border:1px solid var(--line2); border-radius:3px; background:var(--base); color:var(--muted); min-width:30px;}
  .setrow .rm{background:none; border:none; color:var(--dim); font-size:16px; padding:4px 8px;}

  .hm{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px;}
  .hm-cell{border:1px solid var(--line); border-radius:3px; padding:9px 10px; background:var(--base);}
  .hm-cell .g{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
  .hm-cell .n{font-family:var(--mono); font-size:19px; font-weight:600; margin-top:2px;}
  .hm-cell .l{font-size:10px; margin-top:1px;}
  .hm-bar{height:4px; border-radius:2px; background:var(--line); margin-top:6px; overflow:hidden;}
  .hm-bar i{display:block; height:100%;}

  .goal-card{margin:12px 0; border:1px solid var(--line); border-radius:4px; background:var(--panel); padding:15px;}
  .goal-head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;}
  .goal-name{font-family:var(--disp); font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:.02em;}
  .goal-tgt{font-family:var(--mono); font-size:12px; color:var(--muted);}
  .del,.xx{background:none; border:1px solid var(--line2); color:var(--dim); border-radius:3px; padding:3px 9px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;}
  .del:hover,.xx:hover{border-color:var(--red); color:var(--red);}

  .chat-box{display:flex; flex-direction:column; gap:9px; max-height:440px; overflow-y:auto; padding:4px;}
  .msg{padding:10px 13px; border-radius:6px; font-size:13.5px; line-height:1.5; max-width:88%;}
  .msg.me{align-self:flex-end; background:var(--amber); color:#1a0e02;}
  .msg.ai{align-self:flex-start; background:var(--panel2); border:1px solid var(--line); color:var(--text);}
  .msg.sys{align-self:center; color:var(--dim); font-size:11px; font-family:var(--mono);}
  .chat-in{display:flex; gap:8px; margin-top:10px;}
  .chat-in textarea{flex:1; resize:none; height:44px;}

  .prop-card{margin:12px 0; padding:14px; border:1px solid var(--amber-dim); border-left:3px solid var(--amber); border-radius:4px; background:linear-gradient(180deg,rgba(246,134,47,.05),transparent),var(--panel);}
  .prop-card .pt{font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--amber);}
  .prop-act{display:flex; gap:8px; margin-top:8px;}

  .sd-day{margin:10px 0; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .sd-dhead{padding:11px 13px; background:var(--panel2); display:flex; align-items:center; gap:9px; cursor:pointer;}
  .sd-body{padding:11px 13px; display:none;} .sd-body.open{display:block;}
  .sd-ex{display:flex; align-items:center; gap:6px; padding:6px 0; flex-wrap:wrap; border-top:1px solid var(--line);}
  .sd-ex .nm{flex:1; min-width:120px;}
  .inc-presets{display:flex; gap:3px;} .inc-presets button{font-family:var(--mono); font-size:10px; padding:4px 7px; border:1px solid var(--line2); background:var(--base); color:var(--muted); border-radius:2px;}
  .inc-presets button.sel{border-color:var(--amber); color:var(--amber);}
  .sd-ex-home{display:none; gap:6px; padding:0 0 8px 22px; flex-wrap:wrap;}
  .sd-ex-home.open{display:flex;}
  .sd-ex-home select,.sd-ex-home input{font-family:var(--mono); font-size:11px; padding:4px 7px; border:1px solid var(--line2); background:var(--base); color:var(--text); border-radius:2px;}
  .sd-ex-home input{flex:1; min-width:120px;}
  .ord{background:none; border:1px solid var(--line2); color:var(--muted); border-radius:2px; padding:4px 8px; font-size:11px; font-family:var(--mono);}

  .hist{border:1px solid var(--line); border-radius:4px; margin:8px 0; overflow:hidden;}
  .fh{padding:11px 13px; background:var(--panel2); cursor:pointer; display:flex; align-items:center; gap:9px;}
  .fm{padding:11px 13px; display:none;} .hist.open .fm{display:block;}
  .h-ex{font-size:13px; padding:3px 0;}

  /* Intake buckets. Tapping a range beats typing four digits mid-day, and the colour is the
     verdict -- he sees "way under" before he commits, not after. Tier colours are the same
     --bad/--warn/--good/--violet ladder the rest of the app uses for severity. */
  .nut-grp{margin-top:11px;}
  .nut-gl{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:6px;}
  /* Grid, not flex-wrap: columns are sized once for the whole ladder, so every pill is the same
     width and a last-row orphan stays pill-sized instead of stretching across the card. */
  .nut-pills{display:grid; grid-template-columns:repeat(auto-fit,minmax(74px,1fr)); gap:6px;}
  .nut-pill{font-family:var(--mono); font-size:11.5px; padding:8px 4px; border:1px solid var(--line2); border-radius:3px; background:var(--base); color:var(--muted); white-space:nowrap;}
  .nut-pill .nt{display:block; font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; margin-top:2px; opacity:.75;}
  .nut-pill.t-way{border-color:var(--red-dim); color:var(--bad);}
  .nut-pill.t-slight{border-color:var(--amber-dim); color:var(--warn);}
  .nut-pill.t-on{border-color:var(--cyan-dim); color:var(--good);}
  .nut-pill.t-over{border-color:var(--violet-dim); color:var(--violet);}
  .nut-pill.sel{font-weight:700; color:var(--base);}
  .nut-pill.sel.t-way{background:var(--bad); border-color:var(--bad); color:#fff;}
  .nut-pill.sel.t-slight{background:var(--warn); border-color:var(--warn);}
  .nut-pill.sel.t-on{background:var(--good); border-color:var(--good);}
  .nut-pill.sel.t-over{background:var(--violet); border-color:var(--violet);}
  .nut-badge{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; padding:1px 6px; border-radius:2px; margin-left:4px; white-space:nowrap;}
  /* The row is inline text that wraps; a flex container would fight the wrap. Keeping the badge
     unbreakable is enough to stop "way under" splitting across two lines mid-badge. */
  .h-ex .nut-badge{display:inline-block;}

  .fuel-slot{margin:10px 0; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .fuel-shead{padding:11px 13px; background:var(--panel2); display:flex; align-items:center; gap:9px;}
  .fopt{padding:9px 13px; border-top:1px solid var(--line); font-size:13px;}
  .fn{font-weight:600;} .fopt .mono{color:var(--amber); font-size:11px;}

  .daychip{display:inline-block; padding:3px 10px; border-radius:3px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#0c0f13; font-weight:600;}

  .review-body{padding:0 16px;}
  .rnav{position:sticky; top:54px; z-index:30; display:flex; gap:6px; overflow-x:auto; padding:12px 0 10px; background:linear-gradient(180deg,var(--base2) 70%,transparent); -ms-overflow-style:none; scrollbar-width:none;}
  .rnav::-webkit-scrollbar{display:none;}
  .rnav button{font-family:var(--disp); font-weight:600; font-size:14px; letter-spacing:.05em; text-transform:uppercase; padding:8px 14px; border:1px solid var(--line); border-radius:3px; background:var(--panel); color:var(--muted); white-space:nowrap; flex:none;}
  .rnav button.on{background:var(--cyan); color:var(--base); border-color:var(--cyan);}
  main section{display:none;} main section.on{display:block;}

  .bodymap-card{margin:12px 16px; padding:15px 16px; background:var(--panel); border:1px solid var(--line); border-radius:4px;}
  .live-body .bodymap-card,.review-body .bodymap-card{margin-left:0;margin-right:0;}
  .bm-modes{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .bm-modes button{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 11px; border:1px solid var(--line2); border-radius:2px; background:var(--base); color:var(--muted);}
  .bm-modes button.on{border-color:var(--amber); color:var(--amber);}
  .bm-bodies{display:flex; gap:18px; justify-content:center; align-items:flex-start;}
  .bm-bwrap{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .bm-blabel{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);}
  .bm-mgrp{cursor:pointer; transition:filter .15s;}
  .bm-tip{font-size:12px; color:var(--muted); min-height:17px; text-align:center; margin-top:11px;}
  .bm-legend{display:flex; gap:13px; flex-wrap:wrap; justify-content:center; margin-top:10px; font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);}
  .bm-legend span{display:flex; align-items:center; gap:5px;} .bm-sw{width:10px; height:10px; border-radius:2px;}
  .bm-excard{margin-top:12px; border:1px solid var(--line2); border-radius:4px; padding:12px 14px; background:var(--base); display:none;}
  .bm-excard.show{display:block;}
  .bm-excard .t{font-family:var(--disp); font-weight:600; font-size:16px; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center;}
  .bm-exitem{display:flex; align-items:center; gap:9px; font-size:13px; padding:4px 0; color:var(--muted);}
  .bm-exitem .r{font-family:var(--mono); font-size:10px; width:17px; height:17px; border-radius:50%; background:var(--panel2); display:flex; align-items:center; justify-content:center; color:var(--dim); flex:none;}
  .bm-exitem b{color:var(--text); font-weight:500;}

  .live-body{padding:0 16px;}
  .live-empty{margin:18px 0; text-align:center; padding:30px 18px; border:1px dashed var(--line2); border-radius:6px;}
  .live-empty .le-day{font-family:var(--disp); font-weight:700; font-size:30px; text-transform:uppercase; line-height:1;}
  .live-empty .le-sub{color:var(--muted); font-size:13.5px; margin:10px 0 18px;}

  .sessionbar{position:sticky; top:54px; z-index:20; display:flex; align-items:center; gap:10px; padding:11px 0; background:linear-gradient(180deg,var(--base2) 75%,transparent);}
  .sessionbar .sb-day{font-family:var(--disp); font-weight:700; font-size:18px; text-transform:uppercase;}
  .sessionbar .sb-clock{font-family:var(--mono); font-size:12px; color:var(--cyan); margin-left:auto;}
  .sessionbar .sb-prog{font-family:var(--mono); font-size:11px; color:var(--dim);}

  .liveex{margin:12px 0; border:1px solid var(--line); border-radius:5px; background:var(--panel); overflow:hidden; opacity:.5; transition:opacity .25s;}
  .liveex.active{opacity:1; border-color:var(--line2);}
  .liveex.done{opacity:.66;}
  .liveex-head{position:relative; padding:11px 13px 10px;}
  .liveex.active .liveex-head::before{content:""; position:absolute; top:-1px; left:-1px; width:15px; height:15px; border:2px solid var(--amber); border-right:none; border-bottom:none;}
  .liveex.active .liveex-head::after{content:""; position:absolute; top:-1px; right:-1px; width:15px; height:15px; border:2px solid var(--amber); border-left:none; border-bottom:none;}
  .liveex-name{font-family:var(--disp); font-weight:700; font-size:22px; text-transform:uppercase; letter-spacing:.01em; line-height:1;}
  .liveex-chips{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center;}
  .liveex-sets{padding:0 13px 7px; display:flex; flex-direction:column; gap:5px;}
  .lset{display:flex; align-items:center; gap:7px; padding:6px 9px; border:1px solid var(--line); border-radius:3px; background:var(--base);}
  .lset.logged{border-color:var(--cyan-dim);}
  .lset .lsn{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--dim); width:42px; text-transform:uppercase;}
  .lset .lval{font-family:var(--mono); font-size:14px;} .lset .lval .x{color:var(--dim); margin:0 2px;}
  .lset.logged .lchk{color:var(--cyan);} .lchk{color:var(--dim);}
  .lset .leff{margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.08em; padding:2px 7px; border-radius:2px; border:1px solid var(--line2); color:var(--muted);}
  .lset.logged .leff.e-easy{color:var(--cyan); border-color:var(--cyan-dim);} .leff.e-grind{color:var(--amber); border-color:var(--amber-dim);} .leff.e-fail{color:var(--red); border-color:var(--red-dim);}

  .livedock{padding:10px 13px; border-top:1px solid var(--line); background:var(--panel2);}
  .livedock .dock-presc{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.04em; margin-bottom:6px;}
  .dockrow{display:flex; gap:8px; align-items:stretch;}
  .dockrow .field{flex:1;}
  .dockrow .field label{margin-bottom:4px;}
  .dockrow input{text-align:center; font-size:15px; padding:9px 6px; font-weight:600; min-width:0;}
  /* The lever. Presets stay because a slider alone is bad one-handed mid-set: the presets
     are the fast path, the slider is there when the set was genuinely between two of them. */
  /* ---- progress photos ---- */
  .ph-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; margin-top:10px;}
  .ph-cell{position:relative; border:1px solid var(--line2); border-radius:4px; overflow:hidden; background:var(--base);}
  .ph-cell img{display:block; width:100%; height:auto; aspect-ratio:3/4; object-fit:cover;}
  .ph-when{position:absolute; left:0; right:0; bottom:0; padding:3px 6px; font-family:var(--mono); font-size:9px;
           letter-spacing:.05em; color:#fff; background:linear-gradient(transparent,rgba(0,0,0,.75));}
  .ph-x{position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; border:none;
        background:rgba(0,0,0,.6); color:#fff; font-size:12px; line-height:20px; cursor:pointer; padding:0;}
  .ph-empty{color:var(--muted); font-size:12px; line-height:1.5;}
  .ph-cmp{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
  .ph-cmp figure{margin:0;}
  .ph-cmp img{display:block; width:100%; border:1px solid var(--line2); border-radius:4px;}
  .ph-cmp figcaption{font-family:var(--mono); font-size:9px; letter-spacing:.06em; color:var(--dim); margin-top:4px; text-transform:uppercase;}

  /* ---- status strip ---- */
  .sstrip{display:flex; align-items:center; gap:0; border-bottom:1px solid var(--line); background:var(--panel);
          font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; overflow-x:auto;}
  .sstrip-cell{display:flex; align-items:baseline; gap:5px; padding:7px 12px; border-right:1px solid var(--line); white-space:nowrap; flex:0 0 auto;}
  .sstrip-cell:last-child{border-right:none;}
  .sstrip-l{color:var(--dim);}
  .sstrip-v{color:var(--text); font-weight:700; font-size:11px;}
  .sstrip-src{color:var(--dim); font-size:9px; text-transform:none; letter-spacing:0;}
  .sstrip-cell.tap{cursor:pointer;}

  /* ---- dashboard ---- */
  .dash-hero{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px; margin-bottom:14px;}
  .dash-tile{border:1px solid var(--line2); border-radius:4px; padding:12px 13px; background:var(--panel);}
  .dash-tile .dt-l{font-family:var(--mono); font-size:9px; letter-spacing:.09em; text-transform:uppercase; color:var(--dim);}
  .dash-tile .dt-v{font-size:23px; font-weight:800; line-height:1.15; margin-top:3px;}
  .dash-tile .dt-s{font-size:11px; color:var(--muted); margin-top:3px; line-height:1.4;}
  .dash-sec{margin:16px 0 8px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);}
  .dash-quiet{color:var(--muted); font-size:12px; line-height:1.5;}
  .dash-jump{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}

  /* ---- notification centre ---- */
  .notif-btn{position:relative; background:transparent; border:1px solid var(--line2); border-radius:4px;
             color:var(--muted); width:32px; height:30px; cursor:pointer; margin-right:8px; flex:0 0 auto;}
  .notif-btn .notif-ic{font-size:12px; line-height:1;}
  .notif-btn.has{color:var(--amber); border-color:var(--amber-dim);}
  .notif-badge{position:absolute; top:-5px; right:-5px; min-width:15px; height:15px; border-radius:8px;
               background:var(--amber); color:#1a0e02; font-family:var(--mono); font-size:9px; font-weight:800;
               line-height:15px; padding:0 4px; display:none;}
  .notif-badge.on{display:block;}
  .notif-panel{display:none; position:fixed; top:52px; right:10px; width:min(380px,calc(100vw - 20px));
               max-height:min(70vh,560px); overflow-y:auto; z-index:70;
               background:var(--panel); border:1px solid var(--line2); border-radius:5px;
               box-shadow:0 10px 34px rgba(0,0,0,.55);}
  .notif-panel.open{display:block;}
  .notif-head{display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line);
              font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim);}
  .notif-item{padding:10px 12px; border-bottom:1px solid var(--line); border-left:2px solid transparent;}
  .notif-item:last-child{border-bottom:none;}
  .notif-t{font-size:12px; color:var(--text); font-weight:600;}
  .notif-b{font-size:11px; color:var(--muted); margin-top:3px; line-height:1.45;}
  .notif-when{font-family:var(--mono); font-size:9px; color:var(--dim); margin-top:4px;}
  .notif-empty{padding:16px 12px; font-size:12px; color:var(--muted); line-height:1.5;}
  .pain-btn{border:1px solid var(--line2); background:transparent; color:var(--muted); font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:2px; cursor:pointer;}
  .pain-btn.on{color:var(--red); border-color:var(--red-dim);}
  .pain-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px solid var(--line);}
  .pain-lv{display:flex; gap:4px;}
  .pain-lv button{font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; padding:5px 8px; border:1px solid var(--line2); border-radius:2px; background:var(--base); color:var(--muted); cursor:pointer;}
  .pain-lv button.sel{background:var(--red); border-color:var(--red); color:#fff;}
  .pain-note{flex:1; min-width:120px;}
  .pain-flagged{display:flex; align-items:center; gap:6px; margin-top:8px; padding:6px 8px; border-left:2px solid var(--red); background:rgba(220,80,70,.07); font-size:11px; color:var(--muted);}
  .efflv{margin-top:9px;}
  .efflv-top{display:flex; align-items:baseline; justify-content:space-between; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);}
  .efflv-val{font-size:12px; font-weight:700;}
  .efflv input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:26px; background:transparent; margin:2px 0 0;}
  .efflv input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px;
    background:linear-gradient(90deg,var(--red) 0%,var(--amber) 33%,var(--muted) 62%,var(--cyan) 100%);}
  .efflv input[type=range]::-moz-range-track{height:4px; border-radius:2px;
    background:linear-gradient(90deg,var(--red) 0%,var(--amber) 33%,var(--muted) 62%,var(--cyan) 100%);}
  /* 26px thumb: this is tapped one-handed, sweaty, between sets. Smaller is not usable. */
  .efflv input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:26px; height:26px; margin-top:-11px; border-radius:50%; background:var(--text); border:2px solid var(--base); box-shadow:0 1px 4px rgba(0,0,0,.5);}
  .efflv input[type=range]::-moz-range-thumb{width:26px; height:26px; border-radius:50%; background:var(--text); border:2px solid var(--base); box-shadow:0 1px 4px rgba(0,0,0,.5);}
  .efflv-ends{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin-top:-2px;}
  .efftog{display:flex; gap:4px; margin-top:7px;}
  .efftog button{flex:1; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; padding:6px 4px; border:1px solid var(--line2); border-radius:2px; background:var(--base); color:var(--muted);}
  .efftog button.sel{color:#1a0e02;}
  .efftog button.sel.e-easy{background:var(--cyan); border-color:var(--cyan);}
  .efftog button.sel.e-solid{background:var(--muted); border-color:var(--muted);}
  .efftog button.sel.e-grind{background:var(--amber); border-color:var(--amber);}
  .efftog button.sel.e-fail{background:var(--red); border-color:var(--red); color:#fff;}
  .dockbtns{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:8px;}

  .resttimer{margin:12px 0; border:1px solid var(--line2); border-radius:5px; padding:15px; background:radial-gradient(120% 90% at 50% 0%,rgba(246,134,47,.07),transparent 70%),var(--panel2); text-align:center;}
  .rt-arcwrap{position:relative; width:158px; height:158px; margin:6px auto 2px;}
  .rt-arcwrap svg{transform:rotate(-90deg);}
  .rt-bg{fill:none; stroke:var(--line); stroke-width:7;}
  .rt-fg{fill:none; stroke:var(--amber); stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset .9s linear;}
  .rt-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .rt-time{font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:.02em;}
  .rt-label{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:2px;}
  .rt-btns{display:flex; gap:8px; justify-content:center; margin-top:12px;}
  .rt-btns button{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:7px 14px; border:1px solid var(--line2); border-radius:3px; background:var(--base); color:var(--muted);}

  .overlay{position:fixed; inset:0; z-index:100; background:rgba(8,11,15,.95); backdrop-filter:blur(4px); display:none; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center; overflow-y:auto;}
  .overlay.show{display:flex; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .pr-eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--amber);}
  .pr-big{font-family:var(--disp); font-weight:700; font-size:46px; text-transform:uppercase; line-height:1; margin-top:10px;}
  .pr-sub{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:10px; letter-spacing:.05em;}
  .pr-tap{margin-top:26px; font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);}

  .summary{max-width:440px; width:100%;}
  .summary .s-h{font-family:var(--disp); font-weight:700; font-size:38px; text-transform:uppercase; line-height:1; color:var(--cyan);}
  .summary .s-sub{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:8px;}
  .summary .s-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:22px;}
  .summary .s-cell{border:1px solid var(--line); border-radius:4px; padding:13px 8px; background:var(--panel);}
  .summary .s-cell .n{font-family:var(--mono); font-weight:600; font-size:21px;}
  .summary .s-cell .l{font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-top:4px;}
  .summary .s-prs{margin-top:18px; display:flex; flex-direction:column; gap:7px;}
  .summary .s-pr{font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--amber); border:1px solid var(--amber-dim); padding:9px 14px; border-radius:3px;}
  .summary .s-note{font-size:13px; color:var(--text); margin-top:18px; line-height:1.5;}
  .summary .s-btns{margin-top:22px; display:flex; gap:10px; justify-content:center;}

  .botnav{position:fixed; bottom:0; left:0; right:0; z-index:50; display:flex; justify-content:space-around;
    padding:9px 6px calc(env(safe-area-inset-bottom) + 12px); background:linear-gradient(0deg,var(--base2) 78%,transparent); border-top:1px solid var(--line); backdrop-filter:blur(10px);}
  .botnav .ni{display:flex; flex-direction:column; align-items:center; gap:3px; font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); background:none; border:none; padding:4px 10px;}
  .botnav .ni.on{color:var(--amber);}
  .botnav .ni .ic{font-size:19px; line-height:1;}
  .botnav .ni.review-tint.on{color:var(--cyan);}

  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} .summary .s-grid{gap:7px;} }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
  .hidden{display:none !important;}

  /* ---- fuel: missing V1 classes ---- */
  .rank{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--dim); display:inline-block; min-width:20px; margin-right:4px; vertical-align:middle;}
  .fopt .fm{display:inline-block !important; font-family:var(--mono); font-size:11px; color:var(--amber); margin-left:8px; vertical-align:middle; padding:0;}
  .fopt .fh{padding:5px 0 0; background:none; cursor:default; display:block; font-size:12px; color:var(--muted); font-style:italic; width:100%; border:none; gap:0;}
  .fuel-shead .sn{font-family:var(--disp); font-weight:600; font-size:16px; text-transform:uppercase; letter-spacing:.04em;}

  /* ===== PHASE 2 ===== */
  /* collapsible subsections */
  .sub{margin:12px 0; border:1px solid var(--line); border-radius:4px; overflow:hidden; background:var(--panel);}
  .sub-head{padding:12px 14px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.04em; text-transform:uppercase; color:var(--text);}
  .sub-head .chev{transition:transform .2s; color:var(--muted); font-size:13px;}
  .sub.open .sub-head .chev{transform:rotate(180deg);}
  .sub-body{display:none; padding:0 14px 14px;}
  .sub.open .sub-body{display:block;}
  .chev{display:inline-block;}

  /* charts */
  .chart-h{font-family:var(--disp); font-weight:600; font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; display:flex; align-items:baseline; gap:8px;}
  .chart-sub{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--dim); text-transform:none;}
  .goal-chart .chart-h{margin-bottom:4px;}

  /* exercise info button + modal */
  .ex-info-btn{background:none; border:none; color:var(--amber); font-size:16px; margin-left:8px; padding:0 2px; vertical-align:middle; cursor:pointer; opacity:.85;}
  .ex-info-btn:hover{opacity:1;}
  .exinfo-modal{max-width:440px; width:100%; background:var(--panel); border:1px solid var(--line2); border-radius:6px; padding:0; text-align:left; max-height:84vh; overflow-y:auto;}
  .exinfo-top{position:sticky; top:0; background:var(--panel2); border-bottom:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; justify-content:space-between;}
  .exinfo-title{font-family:var(--disp); font-weight:700; font-size:20px; text-transform:uppercase; letter-spacing:.01em; line-height:1.05;}
  .exinfo-x{background:none; border:none; color:var(--muted); font-size:24px; cursor:pointer; line-height:1; padding:0 4px;}
  #exInfoBody{padding:16px;}
  .exinfo-muscles{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px;}
  .exinfo-sec{margin-bottom:14px;}
  .exinfo-h{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin-bottom:7px;}
  .exinfo-cue{display:flex; gap:9px; font-size:13.5px; color:var(--text); padding:4px 0; line-height:1.45; align-items:flex-start;}
  .exinfo-cue span{color:var(--cyan); flex:none; font-size:12px; margin-top:2px;}
  .exinfo-cue.bad span{color:var(--red);}
  .exinfo-gear{display:flex; flex-wrap:wrap; gap:6px 16px;}
  .gear-item{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12px; letter-spacing:.03em; color:var(--text);}
  .gear-item span{color:var(--cyan); font-size:12px; line-height:1;}
  .gear-item.no{color:var(--dim);}
  .gear-item.no span{color:var(--red);}

  /* dock last-session + deltas */
  .dock-last{font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:6px; padding:5px 8px; background:var(--base); border:1px solid var(--line); border-radius:3px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dock-last .dl-tag{color:var(--dim); letter-spacing:.06em; text-transform:uppercase; font-size:9px; margin-right:7px;}
  .delta{font-family:var(--mono); font-size:10px; letter-spacing:.03em; padding:1px 6px; border-radius:2px; margin-left:2px;}
  .delta.up{color:var(--cyan); border:1px solid var(--cyan-dim);}
  .delta.down{color:var(--red); border:1px solid var(--red-dim);}
  .delta.same{color:var(--dim); border:1px solid var(--line2);}

  /* 1RM lab */
  .rm-step{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line);}
  .rm-step:last-child{border-bottom:none;}
  .rm-step.attempt{background:linear-gradient(90deg,rgba(246,134,47,.08),transparent);}
  .rm-w{font-family:var(--mono); font-weight:600; font-size:18px; min-width:74px;}
  .rm-w .rm-lb{font-size:10px; color:var(--dim); margin-left:2px;}
  .rm-mid{flex:1; min-width:0;}
  .rm-label{font-family:var(--disp); font-weight:600; font-size:13px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted);}
  .rm-step.attempt .rm-label{color:var(--amber);}
  .rm-note{font-size:11px; color:var(--dim);}
  .rm-reps{font-family:var(--mono); font-size:14px; color:var(--text); min-width:36px; text-align:right;}
  .rm-rest{font-family:var(--mono); font-size:10px; color:var(--dim); min-width:54px; text-align:right;}

  /* sleep */
  .sleep-btns{display:flex; gap:7px;}
  .sleep-btns button{flex:1; font-family:var(--mono); font-size:13px; padding:11px 4px; border:1px solid var(--line2); border-radius:3px; background:var(--base); color:var(--muted);}
  .sleep-btns button.sel{background:var(--cyan); color:var(--base); border-color:var(--cyan);}

  /* library */
  .lib-day{margin:12px 0;}
  .lib-dh{font-family:var(--disp); font-weight:700; font-size:15px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:7px;}
  .lib-ex{width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; padding:13px 14px; margin-bottom:6px; border:1px solid var(--line); border-radius:4px; background:var(--panel); color:var(--text); font-family:var(--disp); font-weight:600; font-size:16px; text-transform:uppercase; letter-spacing:.01em;}
  .lib-ex:hover{border-color:var(--amber);}
  .lib-arrow{font-family:var(--mono); font-size:11px; font-weight:400; color:var(--amber); text-transform:none; letter-spacing:.04em;}

  /* drag-drop split editor */
  .drag-h{cursor:grab; color:var(--dim); font-size:15px; padding:0 4px; flex:none; touch-action:none;}
  .sd-ex.dragging{opacity:.4;}
  .sd-ex.dragover{border-top:2px solid var(--amber);}

  /* ===== PHASE 3 ===== */
  /* engine log in Log tab */
  .elog-toggle{margin-top:10px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); cursor:pointer; display:flex; align-items:center; gap:6px; padding:6px 0;}
  .elog-toggle:hover{color:var(--amber);}
  .elog-toggle .et-chev{transition:transform .2s; font-size:11px;}
  .elog-toggle .et-chev.open{transform:rotate(180deg);}
  .elog-wrap{display:none; margin-top:4px;}
  .elog-wrap.open{display:block;}
  .elog{background:var(--base); border:1px solid var(--line); border-radius:4px; padding:10px 12px;}
  .elog-src{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:8px;}
  .elog-row{display:flex; gap:9px; padding:6px 0; border-top:1px solid var(--line); align-items:flex-start;}
  .elog-row:first-of-type{border-top:none;}
  .elog-dot{width:7px; height:7px; border-radius:50%; margin-top:5px; flex:none;}
  .elog-ex{font-family:var(--disp); font-weight:600; font-size:13px; letter-spacing:.02em; color:var(--text);}
  .elog-reason{font-size:12px; color:var(--muted); line-height:1.45; margin-top:1px;}

  /* library expandable detail */
  .lib-ex-wrap{margin-bottom:6px;}
  .lib-ex .lib-meta{font-family:var(--mono); font-size:10px; font-weight:400; color:var(--dim); text-transform:none; letter-spacing:.03em; display:flex; align-items:center; gap:7px;}
  .lib-chev{display:inline-block; transition:transform .2s; font-size:12px; color:var(--muted);}
  .lib-detail{background:var(--panel); border:1px solid var(--line); border-top:none; border-radius:0 0 4px 4px; padding:14px; margin-top:-6px;}
  .lib-legend{display:flex; gap:16px; margin-top:8px; font-family:var(--mono); font-size:10px; color:var(--muted);}
  .lib-legend span{display:flex; align-items:center; gap:5px;}
  .lib-legend i{width:14px; height:3px; border-radius:2px; display:inline-block;}
  .stat .v.good{color:var(--cyan);} .stat .v.bad{color:var(--red);}

  /* ===== INVESTIGATION ===== */
  #globalInvBanner:not(:empty){ padding:0 16px; }
  .inv-banner{display:flex; align-items:center; gap:10px; margin:10px 0; padding:11px 13px; background:var(--panel); border:1px solid; border-radius:4px; cursor:pointer;}
  .inv-banner-tag{font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--base); padding:3px 8px; border-radius:2px; flex:none;}
  .inv-banner-txt{font-size:13px; color:var(--text); line-height:1.35;}
  .inv-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-left:5px; position:relative; top:-1px;}
  .inv-card{margin-bottom:12px;}
  .inv-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .inv-head .pill{margin:0; padding:2px 8px; font-size:10px;}
  .inv-title{font-family:var(--disp); font-size:15px; letter-spacing:.02em;}
  .inv-date{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--dim);}
  .inv-findings{margin:6px 0;}
  .inv-finding{font-size:12.5px; color:var(--muted); line-height:1.5; padding:2px 0;}
  .inv-fix{background:var(--base); border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin:8px 0;}
  .inv-fix-h{font-family:var(--mono); font-size:9px; letter-spacing:.12em; color:var(--dim); margin-bottom:4px;}
  .inv-fix b{font-size:13.5px; color:var(--amber);}
  .inv-applied{font-size:12px; color:var(--cyan); background:rgba(70,205,186,0.06); border:1px solid var(--cyan-dim); border-radius:4px; padding:9px 11px; margin:8px 0; line-height:1.5;}
  .inv-acts{display:flex; gap:8px; margin-top:8px;}
  .inv-trigger-row{display:flex; gap:8px; align-items:stretch;}
  .inv-trigger-row select{background:var(--base); border:1px solid var(--line2); color:var(--text); border-radius:3px; padding:8px 10px; font-family:var(--body); font-size:13px;}
  .inv-hist-row{display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--line); font-size:12px;}
  .inv-hist-row:first-child{border-top:none;}
  .inv-hist-t{color:var(--text); font-weight:600;}
  .inv-hist-o{color:var(--muted); font-family:var(--mono); font-size:10.5px;}
  .inv-hist-d{margin-left:auto; color:var(--dim); font-family:var(--mono); font-size:10px; flex:none;}

  /* ===== COACH ACTIONS ===== */
  .cprop-wrap{display:flex; flex-direction:column; gap:8px; margin:2px 0 10px; padding:0 2px;}
  .cprop{background:var(--panel2); border:1px solid var(--line2); border-left:2px solid var(--violet); border-radius:0 4px 4px 0; padding:11px 13px;}
  .cprop.done{opacity:.85;}
  .cprop-top{display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap;}
  .cprop-verb{font-family:var(--disp); font-size:14px; font-weight:600; letter-spacing:.01em; color:var(--violet);}
  .cprop-scope{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--dim); border:1px solid var(--line2); padding:2px 7px; border-radius:2px; text-transform:uppercase;}
  .cprop-detail{font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:9px;}
  .cprop-acts{display:flex; gap:8px;}
  .cprop-done{font-size:12px; color:var(--cyan); display:flex; align-items:center; gap:6px;}
  .cprop-done span{font-weight:700;}
  .cprop-dismissed{font-size:12px; color:var(--dim);}
  .cprop-failed{font-size:12px; color:var(--red); display:flex; align-items:center; gap:6px;}
  .cprop-failed span{font-weight:700;}
  .coach-plan-banner{display:flex; align-items:center; gap:9px; margin:10px 0 4px; padding:9px 11px; background:var(--panel); border:1px solid var(--violet-dim); border-radius:4px;}
  .cpb-tag{font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.1em; color:var(--violet); border:1px solid var(--violet-dim); padding:3px 7px; border-radius:2px; flex:none;}
  .cpb-txt{font-size:12.5px; color:var(--text); line-height:1.4;}
  .cpb-x{margin-left:auto; background:none; border:none; color:var(--dim); font-size:20px; line-height:1; cursor:pointer; padding:0 2px; flex:none;}
  .cpb-x:hover{color:var(--red);}

  /* ===== PERIODIZATION ===== */
  .meso-phases{display:flex; flex-direction:column; gap:10px;}
  .meso-prow{background:var(--panel2); border:1px solid var(--line); border-left:2px solid var(--cyan); border-radius:0 4px 4px 0; padding:11px 12px;}
  .meso-prow-top{display:flex; gap:8px; align-items:center; margin-bottom:9px;}
  .meso-prow-top select{flex:none; width:auto; min-width:118px;}
  .meso-prow-top .meso-name{flex:1; min-width:0;}
  .meso-prow-grid{display:grid; grid-template-columns:auto 1fr 1fr; gap:10px;}
  .meso-prow-grid .field{margin:0;}
  .meso-prow-grid input{width:100%;}
  .meso-pair{display:flex; align-items:center; gap:5px;}
  .meso-pair span{color:var(--dim); font-family:var(--mono); font-size:12px;}
  .meso-x{background:none; border:none; color:var(--dim); font-size:19px; line-height:1; cursor:pointer; padding:0 3px; flex:none;}
  .meso-x:hover{color:var(--red);}
  .meso-check{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text); cursor:pointer;}
  .meso-check input{width:auto; margin:0;}

  .meso-now-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:4px;}
  .meso-now-name{font-family:var(--disp); font-size:19px; font-weight:700; letter-spacing:.02em;}
  .meso-now-sub{font-family:var(--mono); font-size:11px; color:var(--dim); margin-bottom:10px;}
  .meso-now-meta{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.5;}
  .meso-bar{height:6px; background:var(--base2); border:1px solid var(--line); border-radius:3px; overflow:hidden;}
  .meso-bar-fill{height:100%;}

  .meso-cal{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:9px;}
  .meso-wk{background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--cyan); border-radius:0 4px 4px 0; padding:9px 10px; cursor:pointer; transition:.12s;}
  .meso-wk:hover{border-color:var(--line2); transform:translateY(-1px);}
  .meso-wk.past{opacity:.45;}
  .meso-wk.now{background:var(--panel); box-shadow:0 0 0 1px var(--line2);}
  .meso-wk-top{display:flex; align-items:center; gap:6px; margin-bottom:3px; flex-wrap:wrap;}
  .meso-wk-n{font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:.06em;}
  .meso-wk-now{font-family:var(--mono); font-size:8.5px; font-weight:600; letter-spacing:.1em; background:var(--amber); color:#1a0e02; padding:1px 5px; border-radius:2px;}
  .meso-wk-name{font-family:var(--disp); font-size:13.5px; font-weight:600; letter-spacing:.02em;}
  .meso-wk-date{font-family:var(--mono); font-size:9.5px; color:var(--dim); margin-bottom:5px;}
  .meso-wk-meta{font-size:11.5px; color:var(--muted); margin-bottom:6px; line-height:1.4;}
  .meso-wk-bar{height:3px; background:var(--base2); border-radius:2px; overflow:hidden; margin-bottom:3px;}
  .meso-wk-bar div{height:100%;}
  .meso-wk-blk{font-family:var(--mono); font-size:9px; color:var(--dim); letter-spacing:.04em;}

  .meso-prop{background:var(--panel2); border:1px solid var(--line); border-left:2px solid var(--amber); border-radius:0 4px 4px 0; padding:12px 13px; margin-bottom:11px;}
  .meso-prop.ok{border-left-color:var(--cyan);}
  .meso-prop-top{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:9px;}
  .meso-prop-t{font-family:var(--disp); font-size:14.5px; font-weight:600;}
  .meso-prop-split{display:flex; flex-direction:column; gap:6px; margin-bottom:9px;}
  .meso-prop-day{display:flex; gap:8px; align-items:flex-start;}
  .meso-prop-dk{font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:.08em; padding-top:4px; flex:none; width:64px;}
  .meso-prop-dk i{display:block; font-style:normal; font-size:9px; color:var(--line2); letter-spacing:.05em;}
  .warmup{border-left:3px solid var(--line2); padding:0;}
  .warmup.heavy{border-left-color:var(--amber);}
  .warmup-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 15px; cursor:pointer;}
  .warmup-t{font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.04em; text-transform:uppercase;}
  .warmup-t .pill{margin-left:7px; font-size:9px; padding:1px 6px; vertical-align:middle;}
  .warmup-head .chev{color:var(--dim); font-size:12px;}
  .warmup-sum{padding:0 15px 13px; margin:0;}
  .warmup-body{padding:0 15px 15px;}
  .warmup-steps{border:1px solid var(--line); border-radius:3px; overflow:hidden; margin-top:7px;}
  .warmup-gear{margin-top:10px; font-size:12px; color:var(--muted); line-height:1.5; border-top:1px solid var(--line); padding-top:9px;}
  .meso-rot{display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-bottom:10px;}
  .meso-rot-d{font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--amber); border:1px solid var(--amber-dim); border-radius:2px; padding:3px 7px;}
  .meso-rot-d.off{color:var(--dim); border-color:var(--line);}
  .meso-rot-note{font-size:10.5px; color:var(--dim); margin-left:2px;}
  /* the 64px day gutter leaves too little for the exercise chips on a small phone */
  @media (max-width:380px){
    .meso-prop-day{flex-direction:column; gap:3px;}
    .meso-prop-dk{width:auto; padding-top:0;}
    .meso-prop-dk i{display:inline; margin-left:6px;}
  }
  .meso-prop-exs{display:flex; flex-wrap:wrap; gap:4px;}
  .meso-ex{font-size:11.5px; color:var(--muted); background:var(--base2); border:1px solid var(--line); border-radius:2px; padding:2px 7px;}
  .meso-ex.heavy{color:var(--amber-soft); border-color:var(--amber-dim);}
  .meso-ex b{font-family:var(--mono); font-size:9.5px;}
  .meso-why{border-top:1px solid var(--line); padding-top:8px; margin-bottom:9px; font-size:11.5px; color:var(--dim); line-height:1.6;}
  .meso-warn{font-size:11.5px; color:var(--amber); background:rgba(246,134,47,.07); border:1px solid var(--amber-dim); border-radius:3px; padding:7px 9px; margin-bottom:9px; line-height:1.45;}
  .meso-prop-acts{display:flex; gap:7px; flex-wrap:wrap;}

  .meso-ed-day{border:1px solid var(--line); border-radius:4px; padding:9px 10px; margin-bottom:9px; text-align:left;}
  .meso-ed-dk{font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:.08em; margin-bottom:7px;}
  .meso-ed-ex{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 0; font-size:13px; border-bottom:1px solid var(--line);}
  .meso-ed-ex:last-of-type{border-bottom:none;}
  .meso-ed-add{display:flex; gap:6px; margin-top:7px;}
  .meso-ed-add input{flex:1; min-width:0;}

  /* ===== UPDATE BANNER ===== */
  .upd-bar{position:fixed; left:0; right:0; bottom:0; z-index:60; display:none; align-items:center; gap:9px;
    padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
    background:var(--panel); border-top:1px solid var(--cyan-dim); box-shadow:0 -6px 22px rgba(0,0,0,.5);}
  .upd-bar.show{display:flex; animation:fade .3s ease;}
  .upd-dot{width:7px; height:7px; border-radius:50%; background:var(--cyan); flex:none; animation:updpulse 2s ease-in-out infinite;}
  @keyframes updpulse{0%,100%{opacity:1}50%{opacity:.35}}
  .upd-txt{flex:1; min-width:0; font-size:13px; color:var(--text);}
  .upd-x{background:none; border:none; color:var(--dim); font-size:19px; line-height:1; padding:0 4px; flex:none;}
  .upd-x:hover{color:var(--text);}

  /* ===== V3 NAVIGATION ===== */
  .sidenav{display:none;}
  .subnav{display:none;}
  .subnav.has{display:flex; gap:6px; overflow-x:auto; padding:12px 0 10px; position:sticky; top:54px; z-index:30;
    background:linear-gradient(180deg,var(--base2) 70%,transparent); -ms-overflow-style:none; scrollbar-width:none;}
  .subnav::-webkit-scrollbar{display:none;}
  .subnav button{font-family:var(--disp); font-weight:600; font-size:13.5px; letter-spacing:.05em; text-transform:uppercase;
    padding:8px 14px; border:1px solid var(--line); border-radius:3px; background:var(--panel); color:var(--muted);
    white-space:nowrap; flex:none; transition:border-color .12s, color .12s, transform .12s;}
  .subnav button:active{transform:scale(.97);}
  .subnav button.on{background:var(--cyan); color:var(--base); border-color:var(--cyan);}
  .ni{position:relative;}
  .ni-badge{position:absolute; top:-2px; right:-5px; width:7px; height:7px; border-radius:50%; opacity:0; transition:.2s;}

  @media(min-width:900px){
    .sidenav{display:flex; flex-direction:column; gap:2px; position:fixed; left:0; top:0; bottom:0; width:212px;
      background:var(--base); border-right:1px solid var(--line); padding:18px 12px calc(env(safe-area-inset-bottom) + 14px);
      overflow-y:auto; z-index:70;}
    .sn-brand{font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:.12em; color:var(--text);
      padding:2px 10px 14px;}
    .sn-brand span{color:var(--amber);}
    .sn-item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
      border-left:3px solid transparent; border-radius:0 4px 4px 0; padding:10px 12px; font-family:var(--disp);
      font-weight:600; font-size:14.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
      cursor:pointer; transition:color .12s, background .12s, border-color .12s; position:relative;}
    .sn-item:hover{color:var(--text); background:var(--panel);}
    .sn-item.on{color:var(--cyan); background:var(--panel); border-left-color:var(--cyan);}
    .sn-item.sn-live{color:var(--amber);}
    .sn-item.sn-live:hover{background:rgba(246,134,47,.08);}
    .sn-item.sn-live.on{background:rgba(246,134,47,.10); border-left-color:var(--amber); color:var(--amber);}
    .sn-ic{font-size:16px; width:20px; text-align:center; flex:none;}
    .sn-sep{height:1px; background:var(--line); margin:8px 10px;}
    .sn-badge{width:7px; height:7px; border-radius:50%; margin-left:auto; opacity:0; transition:.2s;}
    .sn-subs{display:flex; flex-direction:column; gap:1px; margin:2px 0 6px; animation:fade .18s ease;}
    .sn-sub{display:block; width:100%; text-align:left; background:none; border:none; border-left:1px solid var(--line);
      margin-left:22px; padding:7px 12px; font-size:12.5px; letter-spacing:.03em; color:var(--dim); cursor:pointer;
      transition:color .12s, border-color .12s;}
    .sn-sub:hover{color:var(--muted);}
    .sn-sub.on{color:var(--cyan); border-left-color:var(--cyan);}
    /* the shell stops being a 780px phone column and becomes a real desktop layout:
       sidebar owns the left rail, everything else lives in the remaining space. */
    .app-shell{max-width:none; margin:0; padding:0 0 40px 212px;}
    .topbar{padding-left:26px; padding-right:26px;}
    .live-body, .review-body{max-width:1180px; margin:0 auto; padding:0 26px;}
    .botnav{display:none !important;}
    .subnav.has{top:0; padding-top:16px;}
  }
  @media(max-width:899px){
    .botnav .ni{padding:4px 4px; min-width:0; flex:1;}
    .botnav .ni .ic{font-size:17px;}
    .botnav{padding:8px 2px calc(env(safe-area-inset-bottom) + 10px);}
    .botnav .ni{font-size:8px; letter-spacing:.05em;}
  }

  /* ===== ANALYTICS ===== */
  .an-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .an-stat{background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:12px 6px; text-align:center;}
  .an-stat-n{display:block; font-family:var(--disp); font-size:26px; font-weight:700; color:var(--text); line-height:1.1;}
  .an-stat-l{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-top:3px;}
  .an-brow{margin-bottom:11px;}
  .an-brow:last-child{margin-bottom:0;}
  .an-brow-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:10px;}
  .an-brow-top span:first-child{font-size:13px; color:var(--text);}
  .an-brow-top .mono{font-size:11px; color:var(--muted); text-align:right;}
  .an-bar{height:7px; background:var(--base2); border:1px solid var(--line); border-radius:3px; overflow:hidden;}
  .an-bar div{height:100%; transition:width .4s ease;}
  .an-eta{display:flex; align-items:baseline; gap:12px; padding:7px 0; border-top:1px solid var(--line);}
  .an-eta:first-of-type{border-top:none;}

  /* replacement tier list (LIVE swap sheet + split editor) */
  .swap-list{display:flex; flex-direction:column; gap:6px;}
  .swap-row{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--panel2); border:1px solid var(--line); border-radius:4px; padding:8px 10px; color:var(--text);}
  .swap-row:active{border-color:var(--cyan);}
  .swap-tier{font-family:var(--disp); font-weight:700; font-size:14px; line-height:1;
    border:1px solid; border-radius:3px; width:24px; height:24px; flex:none;
    display:flex; align-items:center; justify-content:center;}
  .swap-body{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1;}
  .swap-nm{font-size:13.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .swap-meta{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .swap-score{font-size:11px; color:var(--dim); flex:none;}
  @media(max-width:360px){ .swap-score{display:none;} }

  /* progress status tier ladder */
  .ptier-bar{display:flex; align-items:flex-end; gap:4px; height:12px; margin:11px 0 3px;}
  .ptier-seg{flex:1; height:6px; border-radius:2px; background:var(--line);}
  /* The current step is the one the eye has to land on, so it carries height and a glow as
     well as colour — read one-handed at arm's length mid-set, colour alone does not carry. */
  .ptier-seg.cur{height:12px; box-shadow:0 0 9px -1px currentColor;}
  .ptier-cap{font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--dim);}

  /* overload status tab */
  .ol-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line);}
  .ol-row:first-of-type{border-top:none;}
  .ol-dir{font-family:var(--mono); font-size:15px; width:16px; flex:none; text-align:center;}
  /* flex column, not a plain block: .ol-nm/.ol-sig are spans, and text-overflow:ellipsis
     does nothing on an inline box — so a long lift name pushed the row wide at 320px
     instead of truncating. Same structure .swap-body already uses. */
  .ol-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .ol-nm{font-size:13.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ol-sig{font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ol-verdict{font-family:var(--mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
    border:1px solid; border-radius:2px; padding:3px 7px; flex:none; white-space:nowrap;}
  .ol-tip{font-size:12.5px; color:var(--muted); line-height:1.45; margin:2px 0 4px 26px;
    padding-left:9px; border-left:2px solid var(--line2);}
  .an-pr{display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .an-pr:last-child{border-bottom:none;}
  .an-pr .mono{flex:none; font-size:12px; min-width:56px;}

  /* ===== LIVE V3 ===== */
  .liveex.lv3{opacity:1; border-color:var(--line2);}
  .lv3-head{padding:13px 15px 10px;}
  .lv3-eyebrow{display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:7px;}
  .lv3-hero{display:flex; align-items:center; gap:10px; padding:6px 15px 10px;}
  .lv3-hero-cell{display:flex; flex-direction:column; align-items:center; background:var(--base); border:1px solid var(--line); border-radius:5px; padding:10px 14px; flex:1;}
  .lv3-hero-n{font-family:var(--disp); font-size:30px; font-weight:700; color:var(--text); line-height:1;}
  .lv3-hero-l{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-top:4px;}
  .lv3-hero-x{color:var(--dim); font-size:18px; flex:none;}
  .lv3-hero-set{display:flex; flex-direction:column; align-items:center; border-left:1px solid var(--line); padding-left:12px; flex:none;}
  .lv3-set-big{font-family:var(--disp); font-size:19px; font-weight:700; color:var(--amber); line-height:1.1;}
  .lv3-presc{padding:0 15px 8px; font-size:12.5px; color:var(--muted); line-height:1.5;}
  .lset.ghost{opacity:.45; border-style:dashed;}
  .lset.lv3-next{border-color:var(--amber-dim); background:rgba(246,134,47,.04);}
  .lset.lv3-tap{cursor:pointer; transition:border-color .12s;}
  .lset.lv3-tap:active{border-color:var(--cyan);}
  .lv3-edithint{color:var(--dim); font-size:11px; margin-left:4px; flex:none;}
  .lset.lv3-edit{display:block; border-color:var(--cyan-dim); background:var(--panel2); padding:10px;}
  .lv3-edit-row{display:flex; align-items:center; gap:8px;}
  .lv3-edit-in{width:74px; font-family:var(--mono); font-size:17px; text-align:center; padding:9px 6px; background:var(--base); border:1px solid var(--line2); border-radius:4px; color:var(--text);}
  .lv3-dock{padding-top:10px;}
  .lv3-in{font-family:var(--mono); font-size:19px !important; padding:13px 12px !important; text-align:center;}
  .lv3-eff button{padding:12px 4px; font-size:12px;}
  .lv3-btns{display:flex; gap:9px; margin-top:10px;}
  .lv3-log{flex:2; padding:15px; font-size:15px;}
  .lv3-done{flex:1; padding:15px; font-size:15px;}
  .lv3-restnote{font-family:var(--mono); font-size:10px; letter-spacing:.05em; color:var(--dim); margin-top:8px; text-transform:uppercase;}
  .liveex.lv3-row{opacity:.62; cursor:pointer; transition:opacity .15s, border-color .15s;}
  .liveex.lv3-row:active{opacity:1; border-color:var(--line2);}
  .liveex.done.lv3-row{opacity:.72;}
  .lv3-row-in{display:flex; align-items:center; gap:12px; padding:12px 14px;}
  .lv3-row-n{font-family:var(--mono); font-size:13px; color:var(--dim); flex:none; width:18px; text-align:center;}
  .lv3-row-mid{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .lv3-row-mid b{font-family:var(--disp); font-size:16px; font-weight:600; letter-spacing:.02em; text-transform:uppercase;}
  .lv3-row-tag{font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); flex:none;}

  /* ===== READINESS V3 ===== */
  .rd3-group{margin-bottom:13px;}
  .rd3-gl{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:6px;}
  .rd3-pills{display:flex; gap:6px; flex-wrap:wrap;}
  .rd3-pill{flex:1; min-width:60px; padding:11px 6px; background:var(--panel2); border:1px solid var(--line); border-radius:4px; color:var(--muted); font-size:12.5px; transition:.12s; cursor:pointer;}
  .rd3-pill:active{transform:scale(.97);}
  .rd3-pill.on{border-color:var(--cyan); color:var(--cyan); background:rgba(70,205,186,.07);}

  /* ===== COACH MEMORY + BUBBLES ===== */
  .cmem-card{margin:0 0 12px; padding:12px 14px; background:var(--panel); border:1px solid var(--line);
    border-left:3px solid var(--violet); border-radius:4px;}
  .cmem-top{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .cmem-title{font-family:var(--disp); font-weight:700; font-size:13px; letter-spacing:.09em; text-transform:uppercase; color:var(--violet);}
  .cmem-count{font-family:var(--mono); font-size:10px; color:var(--dim);}
  .cmem-clear{margin-left:auto; background:none; border:none; font-family:var(--mono); font-size:10px;
    letter-spacing:.06em; color:var(--dim); cursor:pointer; text-transform:uppercase; transition:color .12s;}
  .cmem-clear:hover{color:var(--red);}
  .cmem-list{display:flex; flex-direction:column; gap:6px;}
  .cmem-item{display:flex; align-items:flex-start; gap:8px; padding:7px 9px; background:var(--base);
    border:1px solid var(--line); border-radius:3px;}
  .cmem-tag{font-family:var(--mono); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--violet); border:1px solid var(--violet-dim); border-radius:2px; padding:2px 5px; flex:none; margin-top:1px;}
  .cmem-note{flex:1; min-width:0; font-size:12.5px; line-height:1.45; color:var(--text);}
  .cmem-x{background:none; border:none; color:var(--dim); font-size:15px; line-height:1; cursor:pointer;
    padding:0 2px; flex:none; transition:color .12s;}
  .cmem-x:hover{color:var(--red);}

  .msg{animation:msgIn .22s ease both;}
  @keyframes msgIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .msg.me{border-radius:12px 12px 3px 12px;}
  .msg.ai{border-radius:12px 12px 12px 3px;}
  .chat-in textarea{border-radius:8px; transition:border-color .12s;}
  .chat-in textarea:focus{border-color:var(--cyan); outline:none;}

  /* ============================================================
     V3 VISUAL REFRESH — type scale, card structure, interactions.
     Appended last so it layers over the base sheet.
     ============================================================ */

  /* card header kicker — .k was used throughout Plan/Analytics but never defined */
  .card .k{font-family:var(--disp); font-weight:700; font-size:14px; letter-spacing:.09em;
    text-transform:uppercase; margin:0 0 9px; display:flex; align-items:center; gap:8px;}
  .card .k::before{content:""; width:5px; height:5px; background:currentColor; border-radius:1px; flex:none; opacity:.85;}
  .card .k{color:var(--amber);}

  /* consistent structure: every card carries a steel left edge unless it declares its own */
  .card{border-left:3px solid var(--line2); padding:15px 16px;}
  .card.flat{border-left:none;}

  /* bigger, louder stat numbers */
  .stat{padding:12px 13px;}
  .stat .v{font-size:25px; line-height:1.05; letter-spacing:-.01em;}
  .stat .l{font-size:9px; margin-top:5px;}
  .stats{gap:10px;}

  /* button micro-interactions */
  .btn{transition:border-color .12s, background .12s, filter .12s, transform .12s;}
  .btn:active{transform:scale(.975);}
  .btn.primary:active, .btn.cyan:active{filter:brightness(.95);}

  /* focus states — cyan means "you're editing this" app-wide */
  input:focus,select:focus,textarea:focus{border-color:var(--cyan); box-shadow:0 0 0 2px rgba(70,205,186,.13);}

  /* pills and rows settle into the same rhythm */
  .pill{padding:3px 9px;}
  .an-stat{transition:border-color .12s;}
  .an-stat:hover{border-color:var(--line2);}

  /* ============================================================
     WIDE DESKTOP — card-list views flow into two columns instead of
     one tall ribbon, so the screen fills horizontally and you scroll less.
     ============================================================ */
  @media(min-width:1240px){
    #an_over.on, #an_strength.on, #an_dev.on, #an_recovery.on, #an_pred.on, #an_overload.on{
      column-count:2; column-gap:16px;}
    #an_over .card, #an_strength .card, #an_dev .card, #an_recovery .card, #an_pred .card, #an_overload .card{
      break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
      margin-top:0; margin-bottom:16px; display:inline-block; width:100%;}
    /* Investigate is a control rail + findings feed, not a text flow — a naive
       column split orphans the "Active flags" heading away from its own cards. */
    #invest.on{display:grid; grid-template-columns:330px minmax(0,1fr); gap:18px; align-items:start;}
    .inv-left{position:sticky; top:14px;}
    .inv-left .card{margin-top:0;}
    .inv-right > .card:first-child, .inv-right > .sub:first-child{margin-top:0;}
    /* the fatigue readout stays one column — it reads as a single instrument panel */
    #an_fatigue .an-stats{grid-template-columns:repeat(4,1fr);}
  }
  @media(min-width:900px){
    /* LIVE welcome breathes instead of stretching edge to edge */
    .welcome{padding:22px 24px;}
    .an-stats{gap:12px;}
    /* the rail and the topbar were both showing the brand side by side; topbar keeps it */
    .sn-brand{display:none;}
    .sidenav{padding-top:14px;}
    /* the pill strip duplicates the sidebar's sub-items on desktop — reclaim the 59px */
    .subnav, .subnav.has{display:none;}
    main{padding-top:14px;}
  }

  /* Investigate: the section heading must never separate from the cards it labels */
  .inv-h2{margin:0 2px 9px; font-family:var(--disp); font-weight:600; font-size:15px;
    letter-spacing:.05em; text-transform:uppercase; color:var(--muted);}
  .inv-right > .inv-h2 ~ .inv-h2{margin-top:20px;}
  @media(max-width:1239px){
    .inv-left{position:static;}
    .inv-right{margin-top:6px;}
  }

  /* ============================================================
     Untyped inputs were never themed: the base rule is
     input[type=text],input[type=number],... which is an ATTRIBUTE
     selector, so <input inputmode="decimal"> (no type=) never matched.
     Those inputs fell back to white browser defaults at their intrinsic
     width, which overflowed the viewport on phones.
     :where() holds specificity at 0 so every existing override
     (.setrow input, .dockrow input, .lv3-in, inline styles) still wins.
     ============================================================ */
  input:where(:not([type])){
    width:100%; background:var(--base); border:1px solid var(--line2); border-radius:3px;
    color:var(--text); padding:10px 11px; font-size:14px; font-family:var(--mono);}
  input:where(:not([type]))::placeholder{color:var(--dim);}

  /* Narrow phones (SE-class, 320px): the brand + mode switch together exceeded
     the viewport by a few px, giving the whole app a horizontal jiggle. */
  @media(max-width:360px){
    .topbar{gap:8px; padding-left:12px; padding-right:12px;}
    .brand-txt{font-size:17px; min-width:0;}
    .modeswitch button{padding:8px 10px; font-size:13px;}
  }
  /* ===== OPERATIONS / AGENTS ===== */
  .ag-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .ag-bar .ag-when{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .ag-lead{border:1px solid var(--line2);border-radius:12px;padding:12px;margin-bottom:12px;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
  .ag-card{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:10px;padding:11px 12px;margin-bottom:9px;background:var(--card)}
  .ag-card.lead{border-left-width:4px}
  .ag-kids{margin-left:14px;padding-left:12px;border-left:1px dashed var(--line2)}
  .ag-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ag-nm{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em}
  .ag-dot{width:7px;height:7px;border-radius:50%;flex:none}
  .ag-st{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .ag-role{font-size:11.5px;color:var(--muted);margin:3px 0 0}
  .ag-sum{font-size:12.5px;color:var(--text);margin:7px 0 0;line-height:1.5}
  .ag-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .ag-prop{border:1px solid var(--line2);border-radius:10px;padding:11px 12px;margin-bottom:9px}
  .ag-prop-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .ag-prop-t{font-weight:700;font-size:13.5px}
  .ag-prop-r{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 9px}
  .ag-prop-fx{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:9px}
  .ag-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;padding:2px 6px;border-radius:4px;border:1px solid}
  .ag-log{max-height:420px;overflow-y:auto}
  .ag-le{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
  .ag-le:first-child{border-top:none}
  .ag-le-b{flex:1;min-width:0}
  .ag-le-h{font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:3px}
  .ag-le-t{font-size:12.5px;line-height:1.5;color:var(--muted)}
  .ag-chat{border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden}
  .ag-chat-box{max-height:340px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
  .ag-chat-in{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
  .ag-chat-in textarea{flex:1;min-height:38px;max-height:110px;resize:vertical}
  .ag-pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .ag-pill{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer}
  .ag-pill.on{color:var(--bg);font-weight:700}
  .ag-empty{font-size:12.5px;color:var(--dim);margin:0;padding:6px 0}
  /* ---- chat polish ---- */
  @keyframes agMsgIn{ from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none} }
  .ag-chat-box .msg.ag-new{animation:agMsgIn .28s cubic-bezier(.2,.7,.3,1) both}
  .ag-chat-box .msg{max-width:88%; line-height:1.55; word-break:break-word; overflow-wrap:anywhere}
  .ag-chat-box .msg.me{align-self:flex-end}
  .ag-chat-box .msg.ai,.ag-chat-box .msg.sys{align-self:flex-start}
  .ag-chat-box.tall{max-height:min(72vh,720px)}
  .ag-chat-head{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}
  .ag-chat-head .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
  /* typing indicator */
  .ag-typing{display:inline-flex;align-items:center;gap:4px}
  .ag-typing i{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block;animation:agBlink 1.25s infinite ease-in-out}
  .ag-typing i:nth-child(2){animation-delay:.18s}
  .ag-typing i:nth-child(3){animation-delay:.36s}
  @keyframes agBlink{0%,60%,100%{opacity:.25;transform:translateY(0)} 30%{opacity:1;transform:translateY(-2px)}}
  /* Nested cards stack four levels of padding at 320px (shell + lead + kids indent + card).
     Collapse the indent on small phones so the innermost text still has usable width. */
  @media(max-width:400px){
    .ag-lead{padding:9px}
    .ag-kids{margin-left:0;padding-left:8px}
    .ag-card{padding:10px 9px}
    .ag-prop{padding:10px 9px}
    .ag-st{font-size:9.5px}
  }

  /* ---------- 3D muscle viewer (Progress tab only) ---------- */
  .bm3d{
    position:relative; margin:2px 0 0; border:1px solid var(--line); border-radius:4px;
    background:var(--base); overflow:hidden; height:300px;
    /* holds its box before three.js arrives so the card never jumps on load */
    /* on a wide screen a full-width stage strands the figure in empty space */
    max-width:460px; margin-inline:auto;
  }
  .bm3d canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab;}
  .bm3d canvas:active{cursor:grabbing;}
  .bm3d::before{
    content:"Loading viewer\2026"; position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center;
    font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--dim); pointer-events:none;
  }
  .bm3d.ready::before{content:none;}
  .bm3d-badge,.bm3d-hint{
    position:absolute; font-family:var(--mono); font-size:9px; letter-spacing:.12em;
    text-transform:uppercase; pointer-events:none; opacity:0; transition:opacity .3s;
  }
  .bm3d.ready .bm3d-badge,.bm3d.ready .bm3d-hint{opacity:1;}
  .bm3d-badge{right:9px; top:9px; color:var(--amber); border:1px solid var(--amber-dim); padding:2px 7px; border-radius:3px;}
  .bm3d-hint{left:10px; bottom:9px; color:var(--dim);}
  @media(max-width:400px){ .bm3d{height:270px;} }

  /* ---------- narrow-screen (320px) fixes ---------- */
  /* Two 150px bodies plus an 18px gap need 318px; a 320px phone offers about
     256px inside the card, so the page scrolled sideways on the LIVE idle
     screen. Let them shrink instead of forcing the width. */
  .bm-bodies{gap:12px;}
  .bm-bwrap{flex:0 1 150px; min-width:0;}
  .bm-bodies svg{width:100%; height:auto; display:block;}

  /* Grid items default to min-width:auto, so a 4-up stat row refuses to
     shrink below its content and pushes the page wider than the viewport. */
  .an-stat{min-width:0;}
  @media(max-width:360px){ .an-stats{grid-template-columns:repeat(2,1fr);} }

  /* The screenshot-import file input was never styled, so it sat at the UA's
     intrinsic width and pushed the Log tab past the viewport on a small phone. */
  input[type=file]{width:100%; max-width:100%; min-width:0; font-size:12px; color:var(--muted);}
</style>
















</head>
<body>

<div class="app-shell">

  <nav class="sidenav" id="sidenav"></nav>

  <div class="topbar">
    <span class="logo-mark"></span>
    <div class="brand-txt">Iron Hub</div>
    <div class="spacer"></div>
    <button class="notif-btn" id="notifBtn" onclick="notifToggle()" title="Notifications" aria-label="Notifications">
      <span class="notif-ic">◉</span><span class="notif-badge" id="notifBadge"></span>
    </button>
    <div class="modeswitch">
      <button id="mLive" class="live on" onclick="setMode('live')"><span class="pdot"></span>Live</button>
      <button id="mReview" class="review" onclick="setMode('review')">Review</button>
    </div>
  </div>
  <div class="notif-panel" id="notifPanel"></div>
  <div id="globalInvBanner"></div>
  <!-- Slim always-on pulse check. Rendered on every review tab and NEVER during LIVE:
       that screen is deliberately uncluttered while actually training. -->
  <div id="statusStrip"></div>

  <div id="liveMode">
    <div class="live-body" id="liveBody"></div>
  </div>

  <div id="reviewMode" class="hidden">
    <div class="review-body">
      <main>
        <div class="subnav" id="subnav"></div>
        <section id="home"></section>
        <section id="progress" class="on"></section>
        <section id="road"></section>
        <section id="bulk"></section>
        <section id="fuel"></section>
        <section id="library"></section>
        <section id="coach"></section>
        <section id="ops"></section>
        <section id="invest"></section>
        <section id="meso"></section>
        <section id="log"></section>
        <section id="settings"></section>
        <section id="an_over"></section>
        <section id="an_strength"></section>
        <section id="an_fatigue"></section>
        <section id="an_recovery"></section>
        <section id="an_dev"></section>
        <section id="an_pred"></section>
        <section id="an_overload"></section>
        <section id="today" style="display:none"></section>
      </main>
    </div>
  </div>

  <div class="upd-bar" id="updBar">
