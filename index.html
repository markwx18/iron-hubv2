/* ---------------- READINESS vs OUTCOME ----------------
   The pre-session check-in is logged every session; effort tags are logged every set.
   Joining them answers the question the old rest-gap Recovery view never could on a
   fixed rotation: do the days you show up under-recovered actually produce more
   grinding and failed sets, and does taking the volume trim change anything. */
const AN_RD_MIN_TAGGED   = 5;   // effort-tagged sets before one session's grind rate means anything
const AN_RD_MIN_SESSIONS = 4;   // sessions per side before a comparison is shown at all
const AN_RD_MIN_TRIM     = 3;   // trimmed / kept-full low sessions before that split is shown
function anReadinessRows(){
  const byDate = {};
  (S.readiness||[]).forEach(r=>{ if(r && r.date && r.tier) byDate[r.date] = r; });
  const rows = [];
  S.logs.forEach(l=>{
    if(l.deload) return;                       // deload sets are supposed to feel easy
    const rd = byDate[l.date]; if(!rd) return;
    let sets=0, tagged=0, hard=0;
    l.entries.forEach(e=>e.sets.forEach(s=>{
      sets++;
      // An untagged set is unknown, not clean. Counting it as clean would drag every
      // partially-tagged session's grind rate toward zero and wash the comparison out.
      if(!s.e) return;
      tagged++;
      const _b = effBucket(s); if(_b==='grind' || _b==='fail') hard++;
    }));
    if(tagged < AN_RD_MIN_TAGGED) return;
    rows.push({date:l.date, tier:rd.tier, sets, tagged, hard,
               trimmed: (typeof l.trimmed==='boolean') ? l.trimmed : null});
  });
  return rows.sort((a,b)=>a.date.localeCompare(b.date));
}
/* Pooled rate (total hard sets / total tagged sets) rather than the mean of per-session
   rates — a 3-set session shouldn't weigh the same as a 20-set one. */
function anRdGroup(rows){
  const tagged = rows.reduce((a,r)=>a+r.tagged,0);
  const hard   = rows.reduce((a,r)=>a+r.hard,0);
  const sets   = rows.reduce((a,r)=>a+r.sets,0);
  return {n:rows.length, tagged, hard, sets,
          rate: tagged ? hard/tagged : 0,
          setsPer: rows.length ? sets/rows.length : 0};
}
function anReadinessTrim(lowRows){
  const t = lowRows.filter(r=>r.trimmed===true), k = lowRows.filter(r=>r.trimmed===false);
  const base = {trimmed:t.length, kept:k.length, need:AN_RD_MIN_TRIM};
  if(t.length<AN_RD_MIN_TRIM || k.length<AN_RD_MIN_TRIM) return Object.assign({ok:false}, base);
  const tg = anRdGroup(t), kg = anRdGroup(k);
  return Object.assign({ok:true, trimRate:tg.rate, keptRate:kg.rate,
                        trimSets:tg.setsPer, keptSets:kg.setsPer}, base);
}
function anReadinessOutcome(){
  const rows = anReadinessRows();
  const low  = rows.filter(r=>r.tier==='low');
  const rest = rows.filter(r=>r.tier!=='low');
  const groups = {low:anRdGroup(low), rest:anRdGroup(rest),
                  ok:anRdGroup(rows.filter(r=>r.tier==='ok')),
                  high:anRdGroup(rows.filter(r=>r.tier==='high'))};
  const enough = low.length>=AN_RD_MIN_SESSIONS && rest.length>=AN_RD_MIN_SESSIONS;
  return {ok:enough, rows, groups, need:AN_RD_MIN_SESSIONS,
          diff: enough ? groups.low.rate - groups.rest.rate : null,
          trim: anReadinessTrim(low)};
}
function anRdPct(v){ return Math.round(v*100); }
function renderAnReadiness(){
  const el = document.getElementById('an_recovery'); if(!el) return;
  const r = anReadinessOutcome();
  let h = '<div class="card"><div class="k">Readiness vs outcome</div>'+
    '<p class="small">Whether the days you check in under-recovered actually cost you — the share of '+
    'effort-tagged sets that came back <b>grind</b> or <b>fail</b>, split by that morning’s check-in. '+
    'Only sessions with '+AN_RD_MIN_TAGGED+'+ tagged sets count; an untagged set is unknown, not clean.</p></div>';
  if(!r.ok){
    const g0 = r.groups;
    el.innerHTML = h + anEmpty('Not enough data yet — '+g0.low.n+' low-readiness and '+g0.rest.n+
      ' ok/high session'+(g0.rest.n===1?'':'s')+' on record, and this needs '+r.need+' of each before it can say anything real. '+
      'Lock in the check-in and tag your sets’ effort — it fills in on its own.');
    return;
  }
  const g = r.groups;
  const worse = r.diff > 0.02, better = r.diff < -0.02;
  const headCol = worse ? 'var(--red)' : better ? 'var(--cyan)' : 'var(--muted)';
  const pts = Math.abs(anRdPct(g.low.rate) - anRdPct(g.rest.rate));
  h += '<div class="card">'+
    anBarRow('Low readiness', anRdPct(g.low.rate),
      anRdPct(g.low.rate)+'% grind/fail · '+g.low.n+' sessions', 'var(--red)')+
    anBarRow('Ok / high readiness', anRdPct(g.rest.rate),
      anRdPct(g.rest.rate)+'% grind/fail · '+g.rest.n+' sessions', 'var(--cyan)')+
    '<p class="small" style="margin-top:12px;color:'+headCol+'">'+
    (worse   ? 'Low-readiness days do cost you — '+pts+' points more of your sets come back grind or fail.'
     : better? 'Low-readiness days aren’t grinding more — '+pts+' points fewer, in fact. Either the trim is absorbing it, or you rate yourself harshly on days that turn out fine.'
     :         'No meaningful difference so far — low-readiness days grind at about the same rate as the rest.')+'</p>'+
    '<p class="small" style="color:var(--dim);margin-top:4px">Descriptive, not a significance test — sets inside one session rise and fall together, '+
    'so a few points either way is noise.'+
    ((g.low.n<8 || g.rest.n<8) ? ' Sample is still small ('+g.low.n+' vs '+g.rest.n+' sessions).' : '')+'</p></div>';
  // Secondary read: a grind rate is easy to hold down by simply doing less work.
  const maxSets = Math.max(g.low.setsPer, g.rest.setsPer) || 1;
  h += '<div class="card"><div class="k">Work done</div>'+
    anBarRow('Low readiness', 100*g.low.setsPer/maxSets,
      (Math.round(g.low.setsPer*10)/10)+' sets/session', 'var(--red)')+
    anBarRow('Ok / high readiness', 100*g.rest.setsPer/maxSets,
      (Math.round(g.rest.setsPer*10)/10)+' sets/session', 'var(--cyan)')+
    '<p class="small" style="margin-top:10px">How much work actually gets done on each kind of day — read the grind rate above against this, not on its own.</p></div>';
  // Per-tier detail, only for tiers carrying enough sessions to deserve a number.
  const tiers = [['high',g.high,'var(--cyan)'],['ok',g.ok,'var(--muted)'],['low',g.low,'var(--red)']]
    .filter(t=>t[1].n>=AN_RD_MIN_SESSIONS);
  if(tiers.length>=2){
    h += '<div class="card"><div class="k">By tier</div>';
    tiers.forEach(t=>{ h += anBarRow(t[0], anRdPct(t[1].rate), anRdPct(t[1].rate)+'% · '+t[1].n+' sessions', t[2]); });
    h += '</div>';
  }
  const t = r.trim;
  h += '<div class="card"><div class="k">Is the volume trim working?</div>';
  if(t.ok){
    const gap = anRdPct(t.keptRate) - anRdPct(t.trimRate);
    h += anBarRow('Trimmed', anRdPct(t.trimRate), anRdPct(t.trimRate)+'% grind/fail · '+t.trimmed+' sessions', 'var(--cyan)')+
         anBarRow('Kept full plan', anRdPct(t.keptRate), anRdPct(t.keptRate)+'% grind/fail · '+t.kept+' sessions', 'var(--amber)')+
         '<p class="small" style="margin-top:12px">'+
         (gap>2   ? 'Trimming is doing real work — '+gap+' points less grinding than the low days you pushed through, at '+
                    (Math.round(t.trimSets*10)/10)+' vs '+(Math.round(t.keptSets*10)/10)+' sets/session.'
          : gap<-2? 'Trimmed days are grinding <b>more</b>, not less — worth a look. The likeliest reason is selection: you accept the trim on the days that were already the worst.'
          :         'No clear difference yet between trimming and pushing through on a low day.')+'</p>';
  } else {
    h += '<p class="small" style="color:var(--dim)">Not enough data yet — '+t.trimmed+' trimmed and '+t.kept+
         ' kept-full low-readiness session'+(t.kept===1?'':'s')+' on record, and this needs '+t.need+' of each. '+
         'Sessions logged before this comparison existed never recorded which choice you made, so they sit out rather than get guessed at.</p>';
  }
  h += '</div>';
  el.innerHTML = h;
}

/* ---------------- BULK QUALITY ----------------
   The Weekly Volume Heatmap already covers per-muscle-group volume, which is all the old
   Development view did on a different window. What nothing else answers: over the same
   stretch of time, is strength climbing faster than the scale, or are you just heavier?
   Bodyweight comes from the weekly-averaged series (daily weigh-ins are too noisy to fit
   a trend to) and strength from the e1RM trend on whatever you've actually been training. */
const AN_BQ_WINDOWS = [8, 12, 24];
let anBqWeeks = 12;
/* Per-lift trend inside the window. Change is read off the fitted line rather than
   first-vs-last points, so one bad session at either end can't define the whole verdict. */
function anBqLifts(startKey){
  const counts = {};
  S.logs.forEach(l=>{
    if(l.deload || l.date < startKey) return;
    l.entries.forEach(e=>{ counts[e.exercise] = (counts[e.exercise]||0)+1; });
  });
  return Object.keys(counts).map(ex=>{
    const pts = e1rmSeries(ex).filter(p=>p.date>=startKey);
    if(pts.length < 4) return null;
    const span = (new Date(pts[pts.length-1].date)-new Date(pts[0].date))/86400000;
    if(span < 21) return null;                       // a week of data can't carry a trend
    const reg = linreg(pts); if(!reg) return null;
    const start = reg.intercept, end = reg.intercept + reg.slope*span;
    if(start <= 0) return null;
    return {ex, pts, n:pts.length, span, start, end,
            pct: 100*(end-start)/start, perWeek: reg.slope*7};
  }).filter(Boolean).sort((a,b)=>b.n-a.n).slice(0,5);
}
function anBqWeekGrid(startKey){
  const out = [];
  const last = anWeekStart(todayKey());
  let ws = anWeekStart(startKey), guard = 0;
  while(ws <= last && guard++ < 60){ out.push(mesoAddDays(ws,6)); ws = mesoAddDays(ws,7); }
  return out;
}
/* Both lines as percent change from their own window start, so a 190 lb bodyweight and a
   225 lb bench can share one axis. Each week takes the most recent value at or before it —
   bodyweight and lifts are logged on different days, and neither should leave gaps. */
function anBqSeries(startKey, lifts){
  const grid = anBqWeekGrid(startKey);
  const bwPts = bodyweightSeriesSmoothed().filter(p=>p.date>=startKey);
  const bw0 = bwPts.length ? bwPts[0].v : 0;
  const bwLine = [], stLine = [];
  grid.forEach(end=>{
    const b = bwPts.filter(p=>p.date<=end).pop();
    if(b && bw0>0) bwLine.push({date:end, v:100*(b.v-bw0)/bw0});
    const vals = [];
    lifts.forEach(L=>{
      const p = L.pts.filter(x=>x.date<=end).pop();
      if(p && L.pts[0].v>0) vals.push(100*(p.v-L.pts[0].v)/L.pts[0].v);
    });
    if(vals.length) stLine.push({date:end, v:vals.reduce((a,c)=>a+c,0)/vals.length});
  });
  return {bwLine, stLine};
}
const AN_BQ_VERDICTS = {
  strong:{col:'var(--cyan)',  label:'Strength is outpacing the scale'},
  good:  {col:'var(--cyan)',  label:'Strength is ahead of the scale'},
  even:  {col:'var(--amber)', label:'Gaining roughly in proportion'},
  weak:  {col:'var(--red)',   label:'The scale is moving faster than the bar'},
  flat:  {col:'var(--muted)', label:'Bodyweight is flat'},
  losing:{col:'var(--muted)', label:'Bodyweight is falling'}
};
function anBulkQuality(weeks){
  weeks = weeks || anBqWeeks;
  const startKey = mesoAddDays(todayKey(), -7*weeks);
  const bw = bodyweightSeriesSmoothed().filter(p=>p.date>=startKey);
  if(bw.length < 3)
    return {ok:false, weeks, why:'Needs at least 3 weeks of bodyweight entries inside this window. Weigh in most mornings and it fills in on its own.'};
  const lifts = anBqLifts(startKey);
  if(!lifts.length)
    return {ok:false, weeks, why:'Needs at least one lift with 4+ logged sessions spanning 3+ weeks inside this window. Try a longer window.'};
  const reg = linreg(bw);
  if(!reg || reg.intercept <= 0)
    return {ok:false, weeks, why:'Not enough spread in the bodyweight entries here to fit a trend.'};
  const span = (new Date(bw[bw.length-1].date)-new Date(bw[0].date))/86400000;
  const bwStart = reg.intercept, bwEnd = reg.intercept + reg.slope*span;
  const bwLb = bwEnd - bwStart, bwPct = 100*bwLb/bwStart, bwPerWeek = reg.slope*7;
  const stPct = lifts.reduce((a,l)=>a+l.pct,0)/lifts.length;
  // A ratio against a bodyweight change of roughly zero is meaningless, so those windows
  // get their own branch instead of a number that would divide by noise.
  const flat = Math.abs(bwPct) < 0.2, losing = bwPct <= -0.2;
  const ratio = (!flat && !losing) ? stPct/bwPct : null;
  const key = flat ? 'flat' : losing ? 'losing'
            : ratio >= 2   ? 'strong'
            : ratio >= 1   ? 'good'
            : ratio >= 0.5 ? 'even' : 'weak';
  return Object.assign({ok:true, weeks, startKey, lifts, bw, bwLb, bwPct, bwPerWeek, bwStart, bwEnd,
                        stPct, ratio, flat, losing, key},
                       anBqSeries(startKey, lifts));
}
/* Two series on one normalized axis. x is mapped by date, not by index, so the lines stay
   aligned even when bodyweight and lifting cover different numbers of weeks. */
function anDualSpark(a, b, w, h, colA, colB){
  if(!a || !b || a.length < 2 || b.length < 2)
    return '<div class="small" style="color:var(--dim)">not enough points to chart</div>';
  const all = a.concat(b);
  const ts = all.map(p=>+new Date(p.date));
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  let lo = Math.min(...all.map(p=>p.v)), hi = Math.max(...all.map(p=>p.v));
  if(hi === lo){ hi += 1; lo -= 1; }
  const pad = (hi-lo)*0.15; lo -= pad; hi += pad;
  const px = d => ((+new Date(d)-t0)/Math.max(1, t1-t0))*(w-8)+4;
  const py = v => h-6 - ((v-lo)/(hi-lo))*(h-12);
  const line = (pts, col) =>
    '<path d="'+pts.map((p,i)=>(i?'L':'M')+px(p.date).toFixed(1)+' '+py(p.v).toFixed(1)).join(' ')+
    '" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+px(pts[pts.length-1].date).toFixed(1)+'" cy="'+py(pts[pts.length-1].v).toFixed(1)+'" r="3" fill="'+col+'"/>';
  const zero = (lo < 0 && hi > 0)
    ? '<line x1="0" y1="'+py(0).toFixed(1)+'" x2="'+w+'" y2="'+py(0).toFixed(1)+'" stroke="var(--line2)" stroke-width="1" stroke-dasharray="3 3"/>' : '';
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">'+
    zero + line(a, colA) + line(b, colB) + '</svg>';
}
function anBqSetWindow(n){ anBqWeeks = +n || 12; renderAnBulkQuality(); }
function renderAnBulkQuality(){
  const el = document.getElementById('an_dev'); if(!el) return;
  const picker = '<div style="display:flex;gap:8px;margin-top:10px">'+
    AN_BQ_WINDOWS.map(n=>'<button class="btn sm'+(n===anBqWeeks?' primary':' ghost')+'" onclick="anBqSetWindow('+n+')">'+n+' wk</button>').join('')+
    '</div>';
  const r = anBulkQuality(anBqWeeks);
  let h = '<div class="card"><div class="k">Bulk quality</div>'+
    '<p class="small">Bodyweight against strength over the same window — whether you’re getting proportionally '+
    'stronger as you gain, or just heavier. Both read as percent change so they share one scale.</p>'+picker+'</div>';
  if(!r.ok){ el.innerHTML = h + anEmpty(r.why); return; }
  const v = AN_BQ_VERDICTS[r.key];
  const sign = n => (n>=0?'+':'')+(Math.round(n*10)/10);
  h += '<div class="card" style="border-left:4px solid '+v.col+'">'+
    '<b style="color:'+v.col+';text-transform:uppercase;letter-spacing:.1em;font-size:12px">'+v.label+'</b>'+
    '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px">'+
      '<div><div class="small" style="color:var(--dim)">Bodyweight</div>'+
        '<div class="mono" style="font-size:17px;color:var(--violet)">'+sign(r.bwLb)+' lb</div>'+
        '<div class="small mono" style="color:var(--muted)">'+sign(r.bwPct)+'%</div></div>'+
      '<div><div class="small" style="color:var(--dim)">Strength (e1RM)</div>'+
        '<div class="mono" style="font-size:17px;color:var(--amber)">'+sign(r.stPct)+'%</div>'+
        '<div class="small mono" style="color:var(--muted)">'+r.lifts.length+' lift'+(r.lifts.length===1?'':'s')+'</div></div>'+
      (r.ratio!=null ? '<div><div class="small" style="color:var(--dim)">Ratio</div>'+
        '<div class="mono" style="font-size:17px;color:'+v.col+'">'+(Math.round(r.ratio*100)/100)+'×</div>'+
        '<div class="small mono" style="color:var(--muted)">per 1% bw</div></div>' : '')+
    '</div>'+
    '<p class="small" style="margin-top:10px">'+
    (r.key==='strong' ? 'Strength is climbing about '+(Math.round(r.ratio*10)/10)+'× faster than bodyweight in percentage terms. The surplus is going somewhere useful.'
     : r.key==='good' ? 'Strength is gaining faster than the scale. That’s the shape a lean bulk is supposed to have.'
     : r.key==='even' ? 'Strength and bodyweight are climbing at roughly the same rate. Not a problem on its own, but worth watching — you want the bar moving faster than the scale.'
     : r.key==='weak' ? 'Bodyweight is rising faster than strength over this window. That can be a stall, a bad stretch of sleep, or a rate of gain running ahead of what you can use — check the Bulk tab and Investigate before changing anything.'
     : r.key==='flat' ? 'Bodyweight is essentially flat here, so there’s no bulk to judge — this window reads as maintenance. The strength number still stands on its own.'
     :                  'Bodyweight is falling over this window. Holding or gaining strength while it does is a good outcome; losing both is worth a look at the Bulk tab.')+
    '</p></div>';
  // chart
  h += '<div class="card"><div class="k">Same window, both lines</div>'+
    anDualSpark(r.bwLine, r.stLine, 300, 74, 'var(--violet)', 'var(--amber)')+
    '<div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">'+
      '<span class="small mono" style="color:var(--violet)">— bodyweight</span>'+
      '<span class="small mono" style="color:var(--amber)">— strength index</span>'+
    '</div>'+
    '<p class="small" style="margin-top:8px;color:var(--dim)">Percent change from the start of the window. The strength index is the average of the lifts below.</p></div>';
  // per-lift breakdown, so the aggregate above is auditable rather than a black box
  h += '<div class="card"><div class="k">Lifts in the index</div>';
  const mag = Math.max(...r.lifts.map(l=>Math.abs(l.pct)), 1);
  r.lifts.forEach(l=>{
    h += anBarRow(l.ex, 100*Math.abs(l.pct)/mag,
      sign(l.pct)+'% · '+sign(l.perWeek)+' lb/wk · '+l.n+' sessions',
      l.pct>=0 ? 'var(--amber)' : 'var(--red)');
  });
  h += '<p class="small" style="margin-top:10px;color:var(--dim)">Trend fitted across the window, not first-vs-last, so one bad session can’t define the number. Deload weeks are excluded.</p></div>';
  // rate of gain against the band the Bulk investigator already uses — context, not a prescription
  h += '<div class="card"><div class="k">Rate of gain</div>'+
    '<p class="small"><span class="mono" style="color:var(--violet);font-size:15px">'+sign(r.bwPerWeek)+' lb/week</span> '+
    'over this window, against the 0.5–1 lb/week lean-bulk band. '+
    (r.bwPerWeek > 1.5 ? 'Running hot.' : r.bwPerWeek < 0.25 ? 'Running slow.' : 'Inside the band.')+
    ' Calorie changes live in Investigate and ECHO — this view only reports what the trend is doing.</p></div>';

}

/* ---------------- PREDICTIONS ----------------
   anPredictFor() used to live here and drive a stack of per-lift milestone cards below the
   chart. It was removed with them: the tab shows the selected lift and nothing else, and
   the milestone maths it did now runs off the same projection the chart draws
   (anFanMilestones), so there is only one trend model on this screen instead of two that
   could disagree. */
/* ---- ensemble model: percentile bands built from YOUR OWN residual noise ----
   The center line is a least-squares trend (median case). The spread
   isn't invented \u2014 it's the actual scatter of your historical e1RM points around that
   trend line (residual std dev), fanned out with sqrt(time) the way a real random-walk
   confidence interval grows, then scaled per percentile via a standard-normal quantile
   approximation. Faster/slower percentiles are read as "if your week-to-week variance
   keeps looking like it has so far, this is roughly where the fast/slow edge of that
   variance would land you" \u2014 not a claim about training methodology. */
const AN_ENS_PCTS = [
  {p:10, z:-1.2816, label:'Slower (p10)',  col:'var(--dim)'},
  {p:50, z:0,        label:'Expected (p50)', col:'var(--amber)'},
  {p:90, z:1.2816,   label:'Faster (p90)',  col:'var(--cyan)'}
];
function anResidualStd(pts, reg){
  if(!reg || pts.length<3) return 0;
  const x0 = reg.x0;
  const resid = pts.map(p=>{
    const x = (new Date(p.date).getTime()-x0)/86400000;
    const fit = reg.intercept + reg.slope*x;
    return p.v - fit;
  });
  const mean = resid.reduce((a,b)=>a+b,0)/resid.length;
  const variance = resid.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(1,resid.length-1);
  return Math.sqrt(variance);
}
/* Shared fan-projection core. The lift ensemble and the bodyweight projection both run
   through this, so the two charts are literally the same model pointed at different series
   rather than two hand-rolled approximations that drift apart as one gets tuned. Options
   only cover what genuinely differs: how much history is enough, and what "today's value"
   means (best-ever for a lift, latest reading for a scale). */
function anFanProject(pts, horizonDays, opts){
  opts = opts || {};
  const minPts = opts.minPts || 5, minSpan = opts.minSpan || 28;
  if(pts.length < minPts) return {ok:false, why: opts.whyPoints || ('Needs '+minPts+'+ data points to build a trend.')};
  const spanDays = (new Date(pts[pts.length-1].date)-new Date(pts[0].date))/86400000;
  if(spanDays < minSpan) return {ok:false, why: opts.whySpan || ('Needs about '+Math.round(minSpan/7)+' weeks of history.')};
  const reg = linreg(pts); if(!reg) return {ok:false, why:'No usable trend yet.'};
  const r2 = anR2(pts, reg);
  const sd = anResidualStd(pts, reg);
  const cur = opts.anchorV != null ? opts.anchorV
            : opts.curFrom === 'last' ? pts[pts.length-1].v
            : Math.max(...pts.map(p=>p.v));
  const todayX = (new Date(todayKey()+'T00:00:00').getTime()-reg.x0)/86400000;
  const startDay = Math.round(todayX);
  const steps = 14; // sample points across the horizon for a smooth-ish path
  const series = {};
  AN_ENS_PCTS.forEach(pc=>{ series[pc.p] = []; });
  for(let i=0;i<=steps;i++){
    const day = startDay + Math.round((horizonDays/steps)*i);
    const fit = reg.intercept + reg.slope*day;
    // uncertainty grows with sqrt(elapsed) beyond "now" \u2014 a standard random-walk property,
    // and is anchored so every band passes through the actual current value at day 0.
    const daysOut = Math.max(0, day - startDay);
    const spread = sd * Math.sqrt(1 + daysOut/14);
    AN_ENS_PCTS.forEach(pc=>{
      const v = pc.p===50 ? fit : fit + pc.z*spread;
      series[pc.p].push({date: mesoAddDays(todayKey(), day-startDay), v: Math.max(0, Math.round(v*10)/10)});
    });
  }
  // re-anchor every band's first point to the real current value so lines visibly start together
  AN_ENS_PCTS.forEach(pc=>{ if(series[pc.p].length) series[pc.p][0].v = cur; });
  return {ok:true, cur, r2, sd, reg, perWeek:reg.slope*7, series, hist:pts,
    conf: r2>0.7?'steady trend':r2>0.4?'noisy trend':'very noisy trend'};
}
function anEnsembleFor(ex, horizonDays){
  const res = anFanProject(e1rmSeries(ex), horizonDays, {
    minPts:5, minSpan:28,
    whyPoints:'Needs 5+ logged sessions on '+ex+' to build a trend.',
    whySpan:'Needs about a month of history on '+ex+' \u2014 keep logging it.'
  });
  if(res.ok) res.ex = ex;
  return res;
}
/* Milestone ETAs for ONE lift, clipped to the horizon actually on screen. The old
   Predictions tab printed these for up to six lifts regardless of the dropdown; they now
   belong to the selected lift and nothing else. */
function anFanMilestones(res, horizonDays){
  if(!res.ok || !res.reg || res.reg.slope <= 0) return [];
  const out = [];
  let t = Math.ceil((res.cur+0.01)/5)*5;
  while(out.length < 3){
    const days = Math.round((t-res.cur)/res.reg.slope);
    if(days > horizonDays) break;
    out.push({target:t, days, date:mesoAddDays(todayKey(), days)});
    t += 5;
  }
  return out;
}
const AN_ENS_RANGES = [
  {days:28,  label:'4 weeks'},
  {days:84,  label:'12 weeks'},
  {days:182, label:'6 months'},
  {days:365, label:'1 year'}
];
let anEnsembleEx = null, anEnsembleRange = 84;
function anEnsembleChangeEx(v){ anEnsembleEx = v||null; renderAnPred(); }
function anEnsembleChangeRange(v){ anEnsembleRange = +v||84; renderAnPred(); }
function anDayMs(k){ return new Date(k+'T00:00:00').getTime(); }
/* Confidence, as three discrete steps. The number the app already computes is r\u00b2; this is
   the only place it becomes a shape rather than a sentence. */
function anConfLevel(r2){
  return r2>0.7 ? {n:3, col:'var(--cyan)'} : r2>0.4 ? {n:2, col:'var(--amber)'} : {n:1, col:'var(--red)'};
}
/* Fan chart: real history on the left of a "today" divider, projection fan on the right.
   Time-scaled on x rather than index-scaled, because the historical points have to sit at
   their true spacing relative to the projection or the two halves lie about each other. */
function anFanChartSVG(res, w, h, opts){
  opts = opts || {};
  const s50 = res.series[50], n = s50.length;
  const projEnd = s50[n-1].date;
  const horizonDays = Math.max(1, Math.round((anDayMs(projEnd)-anDayMs(s50[0].date))/86400000));
  // Show a history window roughly the size of the horizon so neither half is crushed, but
  // never fewer than 6 real points \u2014 a projection floating over nothing is exactly what
  // this chart was rebuilt to stop doing.
  const cutoff = mesoAddDays(todayKey(), -Math.round(horizonDays*0.9));
  let hist = (res.hist||[]).filter(p=>p.date>=cutoff);
  if(hist.length < 6) hist = (res.hist||[]).slice(-6);

  const vs = res.series[10].concat(res.series[50], res.series[90], hist).map(p=>p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if(hi===lo){ hi+=1; lo-=1; }
  const pad = (hi-lo)*0.10; lo = Math.max(0, lo-pad); hi += pad;

  const t0 = Math.min(anDayMs(hist.length?hist[0].date:todayKey()), anDayMs(todayKey()));
  const t1 = anDayMs(projEnd);
  const L = 38, R = w-8, span = Math.max(1, t1-t0);
  const px = k => L + ((anDayMs(k)-t0)/span)*(R-L);
  const py = v => h-24 - ((v-lo)/(hi-lo))*(h-42);
  const pathFor = arr => arr.map((p,i)=>(i?'L':'M')+px(p.date).toFixed(1)+' '+py(p.v).toFixed(1)).join(' ');

  let s = '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">';
  // shaded p10\u2013p90 envelope
  s += '<polygon points="'+
    res.series[90].map(p=>px(p.date).toFixed(1)+','+py(p.v).toFixed(1)).join(' ')+' '+
    res.series[10].slice().reverse().map(p=>px(p.date).toFixed(1)+','+py(p.v).toFixed(1)).join(' ')+
    '" fill="'+(opts.bandFill||'rgba(246,134,47,.08)')+'"/>';
  // y labels
  s += '<text x="4" y="'+(py(hi)+4).toFixed(1)+'" class="mono" font-size="10" fill="var(--dim)">'+Math.round(hi)+'</text>';
  s += '<text x="4" y="'+(py(lo)+4).toFixed(1)+'" class="mono" font-size="10" fill="var(--dim)">'+Math.round(lo)+'</text>';

  if(hist.length){
    // The fitted trend line, drawn back across the real points. Confidence stops being an
    // adjective here: you can see how tightly the dots actually hug the line the forecast
    // is extrapolating from.
    const conf = anConfLevel(res.r2);
    if(res.reg){
      const fitAt = k => res.reg.intercept + res.reg.slope*((new Date(k).getTime()-res.reg.x0)/86400000);
      s += '<path d="M'+px(hist[0].date).toFixed(1)+' '+py(fitAt(hist[0].date)).toFixed(1)+
           'L'+px(todayKey()).toFixed(1)+' '+py(fitAt(todayKey())).toFixed(1)+
           '" fill="none" stroke="'+conf.col+'" stroke-width="1.2" stroke-dasharray="5 4" opacity=".55"/>';
    }
    s += '<path d="'+pathFor(hist)+'" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>';
    hist.forEach(p=>{
      s += '<circle cx="'+px(p.date).toFixed(1)+'" cy="'+py(p.v).toFixed(1)+'" r="2.4" fill="var(--muted)"/>';
    });
    // divider between what happened and what is guessed
    s += '<line x1="'+px(todayKey()).toFixed(1)+'" y1="10" x2="'+px(todayKey()).toFixed(1)+'" y2="'+(h-22)+
         '" stroke="var(--line2)" stroke-width="1" stroke-dasharray="2 3"/>';
  }

  AN_ENS_PCTS.forEach(pc=>{
    const dash = pc.p===50 ? '' : ' stroke-dasharray="4 3"';
    s += '<path d="'+pathFor(res.series[pc.p])+'" fill="none" stroke="'+pc.col+'" stroke-width="'+(pc.p===50?2.5:1.5)+'" stroke-linejoin="round" stroke-linecap="round"'+dash+'/>';
    const last = res.series[pc.p][n-1];
    s += '<circle cx="'+px(last.date).toFixed(1)+'" cy="'+py(last.v).toFixed(1)+'" r="'+(pc.p===50?3.5:2.5)+'" fill="'+pc.col+'"/>';
  });

  // confidence meter, on the chart itself
  const cf = anConfLevel(res.r2);
  const mx = L+4, my = 12;
  for(let i=0;i<3;i++){
    s += '<rect x="'+(mx+i*9)+'" y="'+my+'" width="7" height="6" rx="1" fill="'+
      (i<cf.n?cf.col:'var(--line2)')+'"'+(i<cf.n?'':' opacity=".7"')+'/>';
  }
  s += '<text x="'+(mx+32)+'" y="'+(my+6)+'" class="mono" font-size="9.5" fill="var(--dim)">R\u00b2 '+
       res.r2.toFixed(2)+' \u00b7 '+res.conf+'</text>';

  // x-axis labels: window start, today, horizon end
  if(hist.length) s += '<text x="'+px(hist[0].date).toFixed(1)+'" y="'+(h-6)+'" text-anchor="start" class="mono" font-size="10" fill="var(--dim)">'+fmtDate(hist[0].date)+'</text>';
  s += '<text x="'+px(todayKey()).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" class="mono" font-size="10" fill="var(--muted)">today</text>';
  s += '<text x="'+px(projEnd).toFixed(1)+'" y="'+(h-6)+'" text-anchor="end" class="mono" font-size="10" fill="var(--dim)">'+fmtDate(projEnd)+'</text>';
  s += '</svg>';
  return s;
}
/* kept as the lift-flavoured entry point so existing callers/tests keep their name */
function anEnsembleChartSVG(res, w, h){ return anFanChartSVG(res, w, h); }

function renderAnPred(){

/* ============================================================
   OVERLOAD STATUS — one consolidated, always-current read per tracked lift.

   Every number on this tab comes from a signal the app already produces: the same
   least-squares trend and r² the Predictions chart draws, the MAXED equipment-ceiling flag,
   active Investigation flags, and grind/fail density off the effort tags. Nothing here is a
   new way of judging progress, and nothing here is a second opinion that can drift out of
   step with Investigate.

   The agents refresh the verdict wording and the tip each night, but they are a LAYER, not
   the source. olSignals() and olBaselineVerdict() run on every render, so the tab is fully
   populated and correct if the agents have never run, failed last night, or came back with
   nonsense. Worst case is missing commentary, never an empty or wrong tab.

   Informational only: nothing here writes training state, so it does not belong in the
   proposal queue — approving it would be a no-op. The stored report is the same class of
   agent write as agLog(): the agents' own words about what they saw, not a change to what
   the app will prescribe.
   ============================================================ */
const OL_MIN_SESSIONS = 4;
const OL_VERDICTS = {
  'on-track':  {label:'On track',        col:'var(--cyan)'},
  'stalling':  {label:'Stalling',        col:'var(--amber)'},
  'attention': {label:'Needs attention', col:'var(--red)'}
};
const OL_SEV = {'on-track':0, 'stalling':1, 'attention':2};
const OL_DIR_MARK = {up:'↗', flat:'→', down:'↘'};
const OL_DIR_COL  = {up:'var(--cyan)', flat:'var(--muted)', down:'var(--red)'};
const OL_STALE_DAYS = 7;     // past this, the agent layer is shown as stale rather than current
const OL_MAX_TIP = 200;
/* Flat band, in lb/week. Matched to investigateLift()'s |slope| <= 0.3 rather than the
   Predictions tab's 0.15, because this tab produces a SEVERITY judgement and that is the
   threshold the app already raises flags on. A tighter band called a 0.2 lb/wk drift on an
   ab machine "needs attention", which would put this tab at odds with Investigate. */
const OL_FLAT_BAND = 0.3;
function olBaselineVerdict(s){
  // A red/orange Investigation flag already IS the app saying this needs attention. Deferring
  // to it keeps this tab from quietly disagreeing with the flag sitting in Investigate.
  if(s.flag && (s.flag.severity==='red' || s.flag.severity==='orange')) return 'attention';
  if(s.dir==='down') return 'attention';
  // No heavier setting exists, so a flat LOAD trend is the equipment ceiling, not a stall —
  // the same carve-out investigateLift() and the Predictions tab already make.
  if(s.maxed) return 'on-track';
  if(s.hardPct!=null && s.hardPct>=50 && s.dir!=='up') return 'attention';
  // Flat e1RM through a hypertrophy block is the expected shape, not a stall. Same reasoning
  // investigateLift() uses before it declines to raise a flag.
  if(s.dir==='flat' && s.hypBlock) return 'on-track';
  if(s.dir==='flat') return 'stalling';
  return 'on-track';
}
function olSignals(){
  const flags = invActiveFlags();
  const mw = (typeof mesoCurrentWeek==='function') ? mesoCurrentWeek() : null;
  const hypBlock = !!(mw && mw.type==='hyp');
  const rows = anBigLifts(OL_MIN_SESSIONS).map(nm=>{
    const pts = e1rmSeries(nm);
    const recent = pts.slice(-10);
    const reg = recent.length>=2 ? linreg(recent) : null;
    const perWeek = reg ? reg.slope*7 : 0;
    const maxed = isMaxed(nm);
    // grind/fail density over this lift's last 6 sessions — the same measure investigateLift uses
    let tagged=0, hard=0;
    historyFor(nm).slice(0,6).forEach(h=>h.sets.forEach(st=>{ const b=effBucket(st); if(b){ tagged++; if(b==='grind'||b==='fail') hard++; } }));
    const f = flags.find(x=>x.key === 'lift:'+nm) || null;
    const s = {
      lift:nm, sessions:pts.length, cur: pts.length ? Math.max(...pts.map(p=>p.v)) : 0,
      perWeek, r2: reg ? anR2(recent, reg) : 0, maxed, hypBlock,
      dir: maxed ? 'flat' : perWeek > OL_FLAT_BAND ? 'up' : perWeek < -OL_FLAT_BAND ? 'down' : 'flat',
      hardPct: tagged ? Math.round(100*hard/tagged) : null,
      flag: f ? {severity:f.severity, title:f.title} : null,
      lastDate: pts.length ? pts[pts.length-1].date : null
    };
    s.verdict = olBaselineVerdict(s);
    return s;
  });
  // worst first — the point of a consolidated view is that problems surface without scrolling
  return rows.sort((a,b)=> OL_SEV[b.verdict]-OL_SEV[a.verdict] || a.perWeek-b.perWeek || a.lift.localeCompare(b.lift));
}
/* The sanity gate. Never let a bad night reach the screen. */
function olValidateReport(raw, signals){
  if(!raw || !Array.isArray(raw.lifts)) return null;
  const byNorm = {};
  (signals||[]).forEach(s=>{ byNorm[invNormName(s.lift)] = s; });
  const seen = {}, out = [];
  raw.lifts.forEach(row=>{
    if(!row || !row.lift) return;
    const sig = byNorm[invNormName(row.lift)];
    if(!sig) return;                                        // not a lift this tab tracks
    if(seen[sig.lift]) return;                              // one row per lift
    const dir = String(row.direction||'').toLowerCase();
    // Direction is arithmetic, not opinion. If the model says a lift is climbing while the
    // regression says it is falling, the row is discarded — a confident wrong verdict on
    // this tab is worse than no verdict at all.
    if(dir !== sig.dir) return;
    const verdict = String(row.verdict||'').toLowerCase().trim().replace(/\s+/g,'-');
    if(!OL_VERDICTS[verdict]) return;
    // The agents see context the rules don't (block type, what he said in chat), so they may
    // soften or sharpen by one step. They may never invert: a lift the data calls "needs
    // attention" cannot come back as "on track".
    if(Math.abs(OL_SEV[verdict] - OL_SEV[sig.verdict]) > 1) return;
    let tip = row.tip==null ? '' : String(row.tip).trim();
    if(tip.length > OL_MAX_TIP) tip = tip.slice(0, OL_MAX_TIP).replace(/\s+\S*$/,'')+'…';
    seen[sig.lift] = 1;
    out.push({lift:sig.lift, direction:dir, verdict, tip});
  });
  if(!out.length) return null;
  return {at:new Date().toISOString(), day:todayKey(), lifts:out.slice(0,12)};
}
function olReport(){
  const r = agState().overload;
  return (r && Array.isArray(r.lifts) && r.lifts.length) ? r : null;
}
function olReportFresh(r){
  // daysBetween, not invDaysSince — the latter looks a key up in invest.lastAuto and would
  // report Infinity for a plain date string, marking every report stale forever.
  return !!(r && r.day && daysBetween(r.day, todayKey()) <= OL_STALE_DAYS);
}
/* Compact numeric brief handed to the agents so their verdicts are written against the same
   arithmetic the tab renders, rather than re-derived from raw logs and drifting. */
function olAgentContext(){
  const sigs = olSignals();
  if(!sigs.length) return '\nOVERLOAD STATUS: no lift has '+OL_MIN_SESSIONS+'+ logged sessions yet.\n';
  return '\nOVERLOAD STATUS (app-computed — your verdicts must agree with these directions):\n'+
    sigs.map(s=>'- '+s.lift+': dir='+s.dir+', '+(s.perWeek>=0?'+':'')+s.perWeek.toFixed(2)+
      ' lb/wk, R2='+s.r2.toFixed(2)+', best e1RM '+Math.round(s.cur)+' lb, '+s.sessions+' sessions'+
      (s.maxed?', MAXED (at machine ceiling — flat load is expected)':'')+
      (s.hardPct!=null?', '+s.hardPct+'% of tagged sets grind/fail':'')+
      (s.flag?', investigation flag ['+s.flag.severity+'] '+s.flag.title:'')+
      ', app verdict='+s.verdict).join('\n')+'\n';
}
function olRowHTML(s, note){
  const v = OL_VERDICTS[(note && note.verdict) || s.verdict];
  const bits = [
    (s.perWeek>=0?'+':'')+s.perWeek.toFixed(2)+' lb/wk',
    'R² '+s.r2.toFixed(2),
    Math.round(s.cur)+' lb best',
    s.sessions+' sessions'
  ];
  if(s.maxed) bits.push('at ceiling');
  if(s.hardPct!=null) bits.push(s.hardPct+'% grind/fail');
  if(s.flag) bits.push('flagged: '+s.flag.severity);
  let h = '<div class="ol-row">'+
    '<span class="ol-dir" style="color:'+OL_DIR_COL[s.dir]+'">'+OL_DIR_MARK[s.dir]+'</span>'+
    '<span class="ol-body"><span class="ol-nm">'+esc(s.lift)+'</span>'+
    '<span class="ol-sig">'+esc(bits.join(' · '))+'</span></span>'+
    '<span class="ol-verdict" style="color:'+v.col+';border-color:'+v.col+'">'+v.label+'</span></div>';
  if(note && note.tip) h += '<div class="ol-tip">'+esc(note.tip)+'</div>';
  return h;
}
function renderAnOverload(){
  const el = document.getElementById('an_overload'); if(!el) return;
  const sigs = olSignals();
  if(!sigs.length){
    el.innerHTML = anEmpty('Overload status needs at least '+OL_MIN_SESSIONS+' logged sessions on a lift before it can read a direction.');
    return;
  }
  const rep = olReport(), fresh = olReportFresh(rep);
  const notes = {};
  if(rep && fresh) rep.lifts.forEach(r=>{ notes[r.lift] = r; });
  let h = '<div class="card"><div class="k">Overload status</div>'+
    '<p class="small">Every lift with '+OL_MIN_SESSIONS+'+ logged sessions, worst first. Direction and the numbers behind it are computed live from your e1RM trend, the MAXED flag, active investigation flags and your grind/fail tags — the agents refresh the verdict and the tips on their nightly cycle.</p></div>';
  h += '<div class="card">' + sigs.map(s=>olRowHTML(s, notes[s.lift])).join('') + '</div>';
  const stamp = rep && rep.day ? fmtDate(rep.day) : null;
  h += '<div class="card"><p class="small" style="color:var(--dim);margin:0">'+
    (!rep ? 'The agents haven’t written a review of these lifts yet — the readings above are computed live, so they’re current regardless. Tips appear after the next cycle.'
     : !fresh ? 'Agent notes from '+stamp+' are more than '+OL_STALE_DAYS+' days old, so they’re held back rather than shown next to fresher numbers. The readings above are still computed live.'
     : 'Agent notes last refreshed '+stamp+'. Anything that didn’t agree with the computed direction was discarded rather than displayed.')+
    '</p></div>';
  el.innerHTML = h;
}
