    '\n\nFUEL TARGETS: '+(S.fuel&&S.fuel.calTarget||'?')+' cal / '+(S.fuel&&S.fuel.proTarget||'?')+'g protein per day.'+
    '\nAvoids: '+((S.fuel&&S.fuel.dislikes)||'\u2014')+
    '\n\nACTIVE LIFT OVERRIDES: '+ovTxt+
    '\nMAXED OUT (at machine ceiling): '+mxTxt+
    '\nINVESTIGATION FLAGS: '+flags+
    '\n\nPROPOSALS HE HAS ALREADY REJECTED (do not repeat these): '+recentRejects+'\n';
}
function agSharedBrief(){
  return 'You are the agent team inside Iron Hub, a training app built by and for Mark (18, lean bulking, '+
    'trains 5\u20136x/week, interested in a federal law-enforcement career). Four agents:\n'+
    '- CHARLIE: app logistics, data hygiene and the weekly training SCHEDULE (which day falls on which weekday, rest-day placement).\n'+
    '- DELTA: exercise selection, volume, rep ranges and progressive overload.\n'+
    '- ECHO: bodyweight trend, rate of gain, calorie and protein targets.\n'+
    '- ZULU: lead \u2014 oversight, coaching, and cross-domain synthesis.\n\n'+
    'Be specific and numeric. Cite the actual figures from his data rather than generalities. '+
    'Never invent data you were not given. If an agent has nothing worth saying this cycle, it says so plainly '+
    'and proposes nothing \u2014 silence is better than filler. Do not propose anything he has already rejected. '+
    'If two agents would pull in opposite directions, say so inside the proposal and give him the options.\n';
}

/* ---- the daily run: all four agents, one call ---- */
let _agRunning = false;   // module-scoped ON PURPOSE: see note in agRunAll
async function agRunAll(manual){
  const a = agState();
  if(!S.settings.apiKey){
    if(manual) alert('Add your API key in Settings first \u2014 the agents need it to run.');
    return;
  }
  // The in-flight guard must NOT live on S. S is replaced wholesale by applyPulled(), so a
  // background sync landing mid-cycle would wipe the flag and let a second cycle start on top
  // of the first; and because S persists, a crash mid-cycle would leave a stale `true` on disk
  // that blocks every future run. A module-level flag has neither problem.
  if(_agRunning) return;
  _agRunning = true; renderOps();
  const sys = agSharedBrief()+
    '\nRespond with ONLY valid JSON \u2014 no markdown fences, no commentary before or after the JSON:\n'+
    '{"charlie":{"summary":"...","proposals":[]},"delta":{...},"echo":{...},"zulu":{...}}\n'+
    'summary = 1\u20133 sentences, first person, addressed to Mark, describing what you found this cycle. '+
    'This is where observations, things worth watching, and "no action needed but here\u2019s why" belong.\n'+
    'proposals = ONLY things with a concrete fix attached. If you have nothing worth actually applying, '+
    'return an empty array \u2014 do not add a proposal just to have said something; say it in summary instead. '+
    'A proposal with fix:null is a contradiction: if there is nothing to apply, it is not a proposal, it is '+
    'part of your summary. Every entry in proposals MUST have a non-null fix from the list below.\n'+
    'Each proposal = {"title":"short imperative","reasoning":"why, citing his actual numbers","fix":<one of the shapes below>}\n'+
    'Allowed fix shapes (anything else, including null, is discarded \u2014 so don\u2019t submit it as a proposal):\n'+
    '  {"type":"cal","payload":{"delta":-500..500}}\n'+
    '  {"type":"pro","payload":{"to":80..300}}\n'+
    '  {"type":"liftReset","payload":{"name":"<exact exercise name>","w":<lb, a REAL working weight not an e1RM>,"days":1..30}}\n'+
    '  {"type":"deload","payload":{}}\n'+
    '  {"type":"addEx","payload":{"name":"...","day":"D1".."D6"}}\n'+
    '  {"type":"swapEx","payload":{"from":"...","to":"..."}}\n'+
    '  {"type":"schedule","payload":{"map":{"0":"REST","1":"D1","2":"D2","3":"D3","4":"D4","5":"D5","6":"REST"}}}  \u2014 ONLY valid if CURRENT SCHEDULE below is day-of-week mode; discarded otherwise\n'+
    '  {"type":"cycleSchedule","payload":{"pattern":["D1","D2","D3","REST","D4","D5","D6","REST"]}}  \u2014 ONLY valid if CURRENT SCHEDULE below is a rotating cycle; discarded otherwise. Full replacement pattern, 1\u201314 entries, at least one non-REST day. The anchor date cannot be changed this way \u2014 only day content/order/count.\n'+
    'ZULU should rarely have a fix of its own; its job is the brief and flagging conflicts between the others, '+
    'almost always via summary rather than proposals.\n'+
    'Cap: at most 2 proposals per agent. Fewer is better \u2014 most nights, most agents should have zero. '+
    'Keep summaries tight so the JSON stays complete.\n\n'+
    coachMemContext()+trainingContext()+agContext();
  try{
    const {text} = await callClaudeWithTools(
      [{role:'user', content:'Run the '+(manual?'on-demand':'daily')+' cycle for '+todayKey()+'.'}],
      sys, null, 4000);
    // CRITICAL: re-resolve state AFTER the await. applyPulled() replaces S wholesale, so if a
    // background sync lands during the ~60s API call, any reference captured before the await
    // now points at an orphaned object that save() will never serialize. That is exactly why
    // log entries survived (agLog re-resolves on every call) while status/lastRun/lastRunAt
    // silently vanished (they were written through the stale reference) \u2014 the cycle looked like
    // it ran, but the day never got stamped, so the next boot ran it all over again.
    const a2 = agState();
    const parsed = parseLooseJSON(text);
    let raised = 0;
    ['zulu'].concat(AG_ORDER).forEach(id=>{
      const blk = parsed && parsed[id]; if(!blk) return;
      if(blk.summary){
        a2.status[id] = {summary:String(blk.summary), at:new Date().toISOString()};
        agLog(id, String(blk.summary));
      }
      (blk.proposals||[]).slice(0,2).forEach(pr=>{
        if(!pr || !pr.title) return;
        const fix = agValidateFix(pr.fix);
        // Advisory-only entries (no fix, or one that failed validation) don't belong in the
        // approval queue \u2014 there's nothing for Approve to actually apply, so it was just a
        // no-op button next to text you'd already read in the summary above. Fold whatever the
        // model wanted to say into the log instead of silently dropping it, but never queue it.
        if(!fix){
          if(!pr.fix) agLog(id, pr.title+(pr.reasoning?' \u2014 '+pr.reasoning:''));
          return;
        }
        a2.proposals.unshift({
          id:agUid(), agent:id, title:String(pr.title),
          reasoning:String(pr.reasoning||''), fix,
          created:todayKey(),
          expires:dateKeyOf(new Date(Date.now()+AG_PROP_TTL*86400000)),
          status:'pending'
        });
        raised++;
      });
    });
    if(!raised) agLog('zulu','Cycle complete \u2014 nothing needed your attention today.');
  }catch(e){
    agLog('zulu','Cycle failed: '+e.message+' \u2014 no retry today; use Run cycle now if you want another attempt.');
  }finally{
    // Stamp the day even on failure, and again resolve fresh \u2014 the pull may have landed
    // between the try body and here. Previously this lived at the end of the try, so a thrown
    // parse left lastRun untouched, the "already ran today" gate stayed open, and the next
    // trigger fired a fresh cycle minutes later.
    const a3 = agState();
    a3.lastRun = todayKey(); a3.lastRunAt = new Date().toISOString();
    _agRunning = false; save(); renderOps();
  }
}

/* ---- per-agent chat (ZULU routes to the existing coach engine) ---- */
let agActiveChat = 'zulu';
function agSelectChat(id){ agActiveChat = id; renderOps(); }
async function agSendChat(id){
  const el = document.getElementById('agChatIn'); if(!el) return;
  const q = (el.value||'').trim(); if(!q) return;
  el.value='';
  const a = agState();
  agChatErr = null;
  a.chats[id].push({role:'user', content:q});
  save(); agThinkingFor = id; renderOps();
  try{
    const sys = agSharedBrief()+
      '\nYou are '+AGENTS[id].name+'. Answer only within your own domain ('+AGENTS[id].role+'). '+
      'If the question belongs to another agent, say which one and give a short answer anyway if you can. '+
      'You cannot change app state from this chat \u2014 structural changes come from the daily cycle or from ZULU. '+
      'If you think something should change, say so and tell him to run a cycle.\n\n'+
      coachMemContext()+trainingContext()+agContext();
    const msgs = a.chats[id].slice(-14).map(m=>({role:m.role, content:m.content}));
    const {text} = await callClaudeWithTools(msgs, sys, null, 1100);
    // re-resolve: a sync pull during the await may have replaced S (see note in agRunAll)
    agState().chats[id].push({role:'assistant', content:text||'\u2014'});
    save(); agThinkingFor = null; renderOps();
  }catch(e){
    agThinkingFor = null;
    agChatErr = {id, msg:AGENTS[id].name+' unavailable: '+e.message};
    renderOps();
  }
}

/* ---- rendering ---- */
function agTimeAgo(iso){
  if(!iso) return 'never';
  const mins = Math.round((Date.now()-new Date(iso))/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const h = Math.round(mins/60); if(h < 24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}
function agCardHTML(id){
  const A = AGENTS[id], a = agState();
  const st = a.status[id]||{};
  const pend = agPendingFor(id).length;
  const running = _agRunning;
  const state = running ? 'analyzing' : (pend ? pend+' pending' : (st.summary?'healthy':'idle'));
  let h = '<div class="ag-card'+(A.lead?' lead':'')+'" style="border-left-color:'+A.col+'">'+
    '<div class="ag-top"><span class="ag-dot" style="background:'+(running?'var(--amber)':A.col)+'"></span>'+
    '<span class="ag-nm" style="color:'+A.col+'">'+A.name+'</span>'+
    (A.lead?'<span class="ag-tag" style="border-color:'+A.col+';color:'+A.col+'">LEAD</span>':'')+
    '<span class="ag-st" style="margin-left:auto">'+state+' \u00b7 '+agTimeAgo(st.at)+'</span></div>'+
    '<p class="ag-role">'+esc(A.role)+'</p>';
  h += st.summary ? '<p class="ag-sum">'+esc(st.summary)+'</p>'
                  : '<p class="ag-empty">No cycle run yet.</p>';
  h += '<div class="ag-acts"><button class="btn ghost sm" onclick="agSelectChat(\''+id+'\')">Chat with '+A.name+'</button></div>';
  return h+'</div>';
}
function agPropHTML(p){
  const A = AGENTS[p.agent]||{name:p.agent, col:'var(--muted)'};
  return '<div class="ag-prop" style="border-left:3px solid '+A.col+'">'+
    '<div class="ag-prop-h"><span class="ag-tag" style="border-color:'+A.col+';color:'+A.col+'">'+A.name+'</span>'+
    '<span class="ag-prop-t">'+esc(p.title)+'</span>'+
    '<span class="ag-st" style="margin-left:auto">expires '+fmtDate(p.expires)+'</span></div>'+
    (p.reasoning?'<p class="ag-prop-r">'+esc(p.reasoning)+'</p>':'')+
    '<div class="ag-prop-fx">\u25b8 '+esc(agFixSummary(p.fix))+'</div>'+
    '<div class="ag-acts">'+
      '<button class="btn sm" onclick="agApprove(\''+p.id+'\')">Approve</button>'+
      '<button class="btn ghost sm" onclick="agReject(\''+p.id+'\')">Reject</button>'+
    '</div></div>';
}
/* Animation bookkeeping: only messages the user hasn't seen rendered before get the entrance
   animation. Without this, every live-refresh repaint would re-animate the whole transcript.
   A chat opened for the first time is treated as fully seen so history doesn't cascade in. */
const agSeen = {};
let agChatTall = false;
let agThinkingFor = null;   // agent id currently awaiting a reply
let agChatErr = null;       // {id, msg} \u2014 surfaced in-box instead of via DOM poking
function agChatToggleTall(){ agChatTall = !agChatTall; renderOps(); }
function agChatHTML(){
  const id = agActiveChat, A = AGENTS[id];
  const isZulu = id==='zulu';
  const msgs = isZulu ? S.chat : agState().chats[id];
  let h = '<div class="ag-pill-row">';
  ['zulu'].concat(AG_ORDER).forEach(k=>{
    const on = k===id;
    h += '<button class="ag-pill'+(on?' on':'')+'" style="'+(on?'background:'+AGENTS[k].col+';border-color:'+AGENTS[k].col:'')+'" onclick="agSelectChat(\''+k+'\')">'+AGENTS[k].name+'</button>';
  });
  h += '</div>';
  if(isZulu) h += coachMemCardHTML();
  // first time this chat is shown, treat existing history as already seen
  if(agSeen[id] === undefined) agSeen[id] = msgs.length;
  const firstNew = agSeen[id];
  h += '<div class="ag-chat">';
  h += '<div class="ag-chat-head"><span class="ag-dot" style="background:'+A.col+'"></span>'+
    '<span class="t" style="color:'+A.col+'">'+esc(A.name)+'</span>'+
    '<button class="btn ghost sm" style="margin-left:auto" onclick="agChatToggleTall()">'+
    (agChatTall?'Shrink':'Expand')+'</button></div>';
  h += '<div class="ag-chat-box'+(agChatTall?' tall':'')+'" id="agChatBox">';
  if(!msgs.length){
    h += '<div class="msg sys">'+esc(A.name)+' \u2014 '+esc(A.role)+'. '+
      (isZulu ? 'Carries everything Coach knew, including its memory and your full chat history.'
              : 'Ask about its domain; it reads your full training data.')+'</div>';
  }
  msgs.forEach((m,i)=>{
    const isNew = i >= firstNew;
    const body = m.role==='user' ? esc(m.content) : renderMarkdown(m.content);
    if(m.content) h += '<div class="msg '+(m.role==='user'?'me':'ai')+(isNew?' ag-new':'')+'">'+body+'</div>';
    if(isZulu && m.proposals && m.proposals.length){
      h += '<div class="cprop-wrap'+(isNew?' ag-new':'')+'">'+m.proposals.map(p=>coachProposalHTML(p)).join('')+'</div>';
    }
  });
  if(agThinkingFor === id){
    h += '<div class="msg ai ag-new" style="color:'+A.col+'"><span class="ag-typing">'+
      '<i></i><i></i><i></i></span></div>';
  }
  if(agChatErr && agChatErr.id === id){
    h += '<div class="msg sys" style="color:var(--amber)">'+esc(agChatErr.msg)+'</div>';
  }
  agSeen[id] = msgs.length;
  h += '</div>'+
    '<div class="ag-chat-in">'+
    '<textarea id="agChatIn" placeholder="Ask '+esc(A.name)+'\u2026" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();'+
      (isZulu?'sendChat()':'agSendChat(\''+id+'\')')+';}"></textarea>'+
    '<button class="btn" onclick="'+(isZulu?'sendChat()':'agSendChat(\''+id+'\')')+'">Send</button></div></div>';
  if(msgs.length){
    h += '<div style="margin-top:6px"><button class="btn ghost sm" onclick="agClearChat(\''+id+'\')">Clear '+esc(A.name)+' chat</button></div>';
  }
  return h;
}
function agClearChat(id){
  if(!confirm('Clear '+AGENTS[id].name+'\u2019s chat history? '+(id==='zulu'?'Its memory is kept separately and stays.':'')+' This only clears the conversation, not proposals or the activity log.')) return;
  if(id==='zulu'){ S.chat = []; } else { agState().chats[id] = []; }
  save(); renderOps();
}
function renderOps(){
  const el = document.getElementById('ops'); if(!el) return;
  // Capture chat scroll BEFORE the repaint. Previously this function unconditionally slammed
  // scrollTop to the bottom on every render \u2014 fine when you'd just sent a message, but the
  // 30s live-refresh repaint then yanked you back down mid-read if you'd scrolled up. Now the
  // jump to bottom only happens when you were already near the bottom (or a message arrived).
  const oldBox = document.getElementById('agChatBox');
  let prevTop = null, wasAtBottom = true;
  if(oldBox){
    prevTop = oldBox.scrollTop;
    wasAtBottom = (oldBox.scrollHeight - oldBox.scrollTop - oldBox.clientHeight) < 60;
  }
  const a = agState();
  const msgCountBefore = agSeen[agActiveChat];
  agSweepExpired();
  const pend = agPending();
  let h = '<h2>Operations</h2>';
  h += '<div class="ag-bar">'+
    '<button class="btn sm" onclick="agRunAll(true)"'+(_agRunning?' disabled':'')+'>'+(_agRunning?'Running\u2026':'Run cycle now')+'</button>'+
    '<label class="ag-when" style="display:flex;align-items:center;gap:6px;cursor:pointer">'+
      '<input type="checkbox" '+(a.autoRun?'checked':'')+' onchange="agState().autoRun=this.checked;save();renderOps()" style="width:auto"> auto-run daily at 9 PM</label>'+
    '<span class="ag-when" style="margin-left:auto">last cycle: '+(a.lastRunAt?agTimeAgo(a.lastRunAt):'never')+'</span></div>';

  // hierarchy: ZULU on top, the three reports nested beneath
  h += '<div class="ag-lead">'+agCardHTML('zulu')+
       '<div class="ag-kids">'+AG_ORDER.map(agCardHTML).join('')+'</div></div>';

  h += '<h2>Pending proposals'+(pend.length?' ('+pend.length+')':'')+'</h2>';
  h += pend.length ? pend.map(agPropHTML).join('')
                   : '<div class="card"><p class="ag-empty">Nothing awaiting your approval.</p></div>';

  h += '<h2>Agent chat</h2>'+agChatHTML();

  h += '<h2>Activity log</h2><div class="card"><div class="ag-log">';
  if(!a.log.length){
    h += '<p class="ag-empty">No activity yet. Run a cycle to get started.</p>';
  } else {
    h += a.log.slice(0,40).map(e=>{
      const A = AGENTS[e.agent]||{name:e.agent, col:'var(--muted)'};
      return '<div class="ag-le"><span class="ag-dot" style="background:'+A.col+';margin-top:6px"></span>'+
        '<div class="ag-le-b"><div class="ag-le-h" style="color:'+A.col+'">'+A.name+' \u00b7 '+
        new Date(e.at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</div>'+
        '<div class="ag-le-t">'+esc(e.text)+'</div></div></div>';
    }).join('');
  }
  h += '</div>'+(a.log.length?'<div style="margin-top:8px"><button class="btn ghost sm" onclick="if(confirm(\'Clear the activity log? Proposals and memory are kept.\')){agState().log=[];save();renderOps();}">Clear log</button></div>':'')+'</div>';

  el.innerHTML = h;
  const box = document.getElementById('agChatBox');
  if(box){
    const grew = msgCountBefore !== undefined && agSeen[agActiveChat] > msgCountBefore;
    if(wasAtBottom || grew || agThinkingFor) box.scrollTop = box.scrollHeight;
    else if(prevTop != null) box.scrollTop = prevTop;
  }
  _opsSig = opsSignature();
}
REVIEW_RENDER.ops = renderOps;
/* Coach is gone as a tab; anything that still calls renderCoach now repaints OPERATIONS.
   Declared last so hoisting makes this the live definition. */
function renderCoach(){ renderOps(); }

/* ---- 9 PM daily scheduler ---- */
function agMaybeAutoRun(){
  const a = agState();
  if(!a.autoRun || _agRunning) return;
  if(!S.settings.apiKey) return;
  if(a.lastRun === todayKey()) return;
  if(new Date().getHours() < 21) return;
  agRunAll(false);
}

/* ============================================================
   LIVE REFRESH \u2014 keep the open page current without a manual reload
   ============================================================ */
/* Repainting the DOM under someone's fingers is worse than slightly stale data, so this
   deliberately refuses to redraw in two cases: while a field has focus (it would blow away
   half-typed input), and during an active LIVE session (the dock can hold a weight/reps the
   user has typed but not yet logged \u2014 losing that mid-workout is unacceptable). */
function refreshBlocked(){
  const el = document.activeElement;
  if(el){
    const tag = (el.tagName||'').toLowerCase();
    if(tag==='input' || tag==='textarea' || tag==='select' || el.isContentEditable) return true;
  }
  if(MODE==='live' && live) return true;
  return false;
}
function rerenderActive(){
  try{ invUpdateBadge(); }catch(e){}   // badge is cheap and safe to update regardless
  if(refreshBlocked()) return;
  try{
    if(MODE==='live'){ renderLive(); return; }
    const sub = navMemory[activeMainTab] || activeReviewTab;
    const fn = REVIEW_RENDER[sub];
    // Operations holds a live chat transcript. Repainting it on a timer when nothing has
    // actually changed destroys text selection and is visible churn for no benefit, so skip
    // unless the signature moved. The signature includes a 5-minute bucket so relative
    // timestamps ("2m ago") still refresh periodically without thrashing the chat every 30s.
    if(fn === renderOps && opsSignature() === _opsSig) return;
    if(typeof fn === 'function') fn();
  }catch(e){ console.warn('rerenderActive failed', e); }
}
let _bgPulling = false;
async function bgSyncTick(){
  if(_bgPulling) return;
  if(document.visibilityState !== 'visible') return;   // don't burn API calls in the background
  if(!syncReady() || S.settings.autoSync === false) return;
  _bgPulling = true;
  try{
    const p = await fetchGistData();
    if(p.exportedAt > (S.meta ? S.meta.changedAt : 0)){
      applyPulled(p.data);
      setAccent(); renderHeader();
      rerenderActive();
    }
  }catch(e){ /* transient network/rate-limit \u2014 silent, next tick retries */ }
  _bgPulling = false;
}
function startLiveRefresh(){
  setInterval(bgSyncTick, 60000);          // pull other devices' changes while the tab is open
  setInterval(rerenderActive, 30000);      // repaint so relative timestamps + local state stay current
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible'){ bgSyncTick(); rerenderActive(); }
  });
  window.addEventListener('online', bgSyncTick);
}

/* ===================== BOOT ===================== */
setAccent();
setupPWA();
buildBotNav();
// resume an in-progress session if one exists for today
const _draft = loadLiveDraft();
if(_draft){ live=_draft; liveActiveIdx = live.exercises.findIndex(e=>!e.done); if(liveActiveIdx<0) liveActiveIdx=0; }
try{ invAutoRun(); }catch(e){ console.warn('invAutoRun failed', e); }
renderLive();
// session clock ticker
setInterval(()=>{ if(live && MODE==='live') updateSessionBar(); }, 1000);
// review nav wiring
try{ renderSidenav(); }catch(e){}
// background sync + weekly audit (no-ops gracefully in sandbox)
// The initial pull is awaited before the agent scheduler's first check on purpose: running the
// cycle concurrently with a pull means the pull can swap S mid-flight. The stale-reference guards
// inside agRunAll make that survivable, but not racing at all is better than surviving the race.
// .catch keeps a failed/absent sync from blocking the agents entirely.
const _bootPull = (async()=>{ try{ await autoPullOnLoad(); }catch(e){} })();
try{ startUpdateWatcher(); }catch(e){}
try{ maybeRunAudit().then(()=>{ if(MODE==='review' && activeReviewTab==='progress') renderProgressV2(); }); }catch(e){}
// agents: expire stale proposals on load, then poll for the 9 PM window
try{ if(agSweepExpired()) save(false); }catch(e){}
_bootPull.then(()=>{
  try{ agMaybeAutoRun(); }catch(e){}
  try{ setInterval(agMaybeAutoRun, 15*60*1000); }catch(e){}
});
try{ startLiveRefresh(); }catch(e){}
</script>
