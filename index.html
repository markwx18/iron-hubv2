    <span class="upd-dot"></span>
    <span class="upd-txt">New version available</span>
    <button class="btn sm cyan" onclick="applyUpdate()">Reload</button>
    <button class="upd-x" onclick="dismissUpdate()" title="Dismiss">&times;</button>
  </div>
  <div class="botnav" id="botnav"></div>
</div>

<div class="overlay" id="readyOverlay">
  <div class="exinfo-modal" style="max-width:440px">
    <div class="exinfo-top"><span class="exinfo-title">Pre-session check-in</span><button onclick="rd3Skip()" class="exinfo-x">&times;</button></div>
    <div id="readyBody" style="padding:16px"></div>
  </div>
</div>
<div class="overlay" id="mesoOverlay" onclick="if(event.target===this)closeMesoOv()">
  <div class="exinfo-modal" style="max-width:520px">
    <div class="exinfo-top"><span class="exinfo-title" id="mesoOvTitle">Week</span><button onclick="closeMesoOv()" class="exinfo-x">&times;</button></div>
    <div id="mesoOvBody" style="padding:16px"></div>
  </div>
</div>
<div class="overlay" id="liveEditOverlay" onclick="if(event.target===this)closeLiveExEdit()">
  <div class="exinfo-modal" style="max-width:460px">
    <div class="exinfo-top"><span class="exinfo-title" id="liveEditTitle">Edit exercise</span><button onclick="closeLiveExEdit()" class="exinfo-x">&times;</button></div>
    <div id="liveEditBody" style="padding:16px"></div>
  </div>
</div>

<div class="overlay" id="editSessionOverlay" onclick="if(event.target===this)closeEditSession()">
  <div class="exinfo-modal" style="max-width:520px">
    <div class="exinfo-top"><span class="exinfo-title" id="editSessionTitle">Edit Session</span><button onclick="closeEditSession()" class="exinfo-x">&times;</button></div>
    <div id="editSessionBody" style="padding:16px"></div>
  </div>
</div>

<div class="overlay" id="swapOverlay" onclick="if(event.target===this)closeSplitSwap()">
  <div class="exinfo-modal" style="max-width:480px">
    <div class="exinfo-top"><span class="exinfo-title" id="swapTitle">Replace exercise</span><button onclick="closeSplitSwap()" class="exinfo-x">&times;</button></div>
    <div id="swapBody" style="padding:16px"></div>
  </div>
</div>

<div class="overlay" id="exInfoOverlay" onclick="if(event.target===this)closeExInfo()">
  <div class="exinfo-modal">
    <div class="exinfo-top"><span class="exinfo-title" id="exInfoTitle">Exercise</span><button onclick="closeExInfo()" class="exinfo-x">×</button></div>
    <div id="exInfoBody"></div>
  </div>
</div>

<div class="overlay" id="prOverlay" onclick="this.classList.remove('show')">
  <div class="pr-eyebrow">★ New Personal Record</div>
  <div class="pr-big" id="prBig">—</div>
  <div class="pr-sub" id="prSub"></div>
  <div class="pr-tap">Tap anywhere to dismiss</div>

function parseLooseJSON(raw){

      if(ch==='\\'){ escd=true; continue; }
      if(ch==='"'){ inStr=!inStr; continue; }
      if(inStr) continue;
      if(ch===openCh) depth++;

    return null; // never balanced \u2014 likely truncated, fall through to the repair path

    if(ch==='\\'){ esc2=true; continue; }

  if(!list || !list.length) return target;

  if(target >= sorted[sorted.length-1]) return sorted[sorted.length-1];

function sessionAllEasy(session){

function consecutiveEasyStreak(hist){
  let c=0;
  for(const h of hist){ if(sessionAllEasy(h)) c++; else break; }

function isBodyweight(name){ return /hanging leg raise/i.test(name); }

/* last sessions containing an exercise, newest first */
function historyFor(ex){
  const out = [];
  const sorted = [...S.logs].sort((a,b)=> b.date.localeCompare(a.date));
  for(const lg of sorted){
    if(lg.deload) continue; // deload sessions never drive the next target
    const e = lg.entries.find(en => en.exercise===ex);
    if(e && e.sets.length) out.push({date:lg.date, sets:e.sets});
  }
  return out;
}

/* ================= RECOMMENDATION ENGINE ================= */
function recommend(ex, ready){
  const hist = historyFor(ex);
  const ff = isFormFocus(ex);
  const {lo: _lo, hi: _hi} = exRepMode(ex);
  const lo = ff ? FORM_LO : _lo;
  const hi = ff ? FORM_HI : _hi;
  if(!hist.length){
    const ffNote = ff ? ' This is in Form Focus mode \u2014 target '+lo+'\u2013'+hi+' clean, controlled reps. Weight only moves once 3 sessions in a row come back tagged Easy across every set, so tag honestly.' : '';
    return {target:'Find your weight', detail:'First logged session \u2014 pick a weight you can move for '+lo+'\u2013'+(lo+2)+' clean reps, leaving 1\u20132 in the tank.'+ffNote, sets:[{w:'',r:''},{w:'',r:''},{w:'',r:''}]};
  }
  const last = hist[0];
  const topW = Math.max(...last.sets.map(s=>+s.w||0));
  const topSets = last.sets.filter(s=>(+s.w||0)===topW);
  const minReps = Math.min(...topSets.map(s=>+s.r||0));
  const maxReps = Math.max(...topSets.map(s=>+s.r||0));
  // STR mode: weight moves when the top set hits the ceiling (one great set earns the jump).
  // HYP mode: weight moves when ALL top sets hit the ceiling (stricter — appropriate for accessory hypertrophy work).
  const str = !ff && isStrMode(ex);
  const ceilReps = str ? maxReps : minReps;
  let inc = incForExercise(ex);
  // effort tags from last session's top sets
  const effs = topSets.map(effBucket).filter(Boolean);
  const hadFail   = effs.includes('fail');
  const hadGrind  = effs.includes('grind') || hadFail;
  /* The double jump used to require EVERY top set bucketed 'easy'. With a real lever we can
     ask the better question -- how easy was the session on average -- so four sets at 95 and
     one at 78 no longer read the same as four at 95 and one at 42. Falls back to the old
     all-easy rule for sessions logged before the lever existed, so historical behaviour is
     unchanged. */
  const _mean    = effMean(topSets);
  const allEasy   = (_mean !== null && effs.length===topSets.length)
                    ? _mean >= 85
                    : (effs.length===topSets.length && effs.length>0 && effs.every(e=>e==='easy'));
  const pushNote  = ready==='high' ? ' Readiness is green \u2014 good day to push.' : '';

  if(isBodyweight(ex)){
    return {target:(minReps>=hi? 'Add reps or slow tempo':'Beat '+minReps+' reps'), detail:'Last: '+summ(last.sets)+'. Bodyweight movement \u2014 progress by reps and control.', sets:last.sets.map(s=>({w:s.w,r:''}))};
  }

  /* ---- FORM FOCUS branch: weight only moves on a 3-session easy streak ---- */
  if(ff){
    const streak = consecutiveEasyStreak(hist);
    if(hadFail){
      const dw = Math.max(topW - inc, inc);
      return {target:dw+' lb \u00d7 '+lo+'+', detail:'Form Focus, but a set broke down ('+summ(last.sets)+'). Step back to '+dw+' lb and rebuild clean reps \u2014 control over load here.', sets:[{w:dw,r:''},{w:dw,r:''},{w:dw,r:''}]};
    }
    if(streak >= FORM_STREAK_NEEDED){
      const nw = topW + inc;
      return {target:nw+' lb \u00d7 '+lo+'+', detail:'Form Focus: '+streak+' sessions in a row tagged easy across the board ('+summ(last.sets)+'). Your control has outpaced the weight \u2014 bump to '+nw+' lb, reps reset to '+lo+'.', sets:[{w:nw,r:''},{w:nw,r:''},{w:nw,r:''}]};
    }
    if(minReps < lo){
      return {target:topW+' lb \u00d7 build to '+lo, detail:'Form Focus: last session dipped below '+lo+' ('+summ(last.sets)+'). Hold '+topW+' lb \u2014 the goal here is control, not load.', sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
    }
    const streakTxt = streak>0 ? streak+'/'+FORM_STREAK_NEEDED+' easy sessions logged toward the next bump.' : 'Tag sets honestly \u2014 once '+FORM_STREAK_NEEDED+' sessions in a row come back fully easy, the weight moves.';
    return {target:topW+' lb \u00d7 '+lo+'\u2013'+hi, detail:'Form Focus: last '+summ(last.sets)+'. Hold '+topW+' lb, chase clean reps in the '+lo+'\u2013'+hi+' range with strict form. '+streakTxt+pushNote, sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
  }

  // stall detection: 3+ sessions same weight, no improvement in the rep metric used for ceiling check
  let stall = false;
  if(hist.length>=3){
    const w2=Math.max(...hist[1].sets.map(s=>+s.w||0)), w3=Math.max(...hist[2].sets.map(s=>+s.w||0));
    if(w2===topW && w3===topW){
      const ts2=hist[1].sets.filter(s=>+s.w===w2), ts3=hist[2].sets.filter(s=>+s.w===w3);
      const ceil2 = str ? Math.max(...ts2.map(s=>+s.r||0)) : Math.min(...ts2.map(s=>+s.r||0));
      if(ceilReps<=ceil2) stall = true;
    }
  }
  if(ceilReps>=hi){
    if(allEasy) inc = inc*2;
    const nw = topW+inc;
    if(ready==='low'){
      return {target:topW+' lb \u00d7 '+hi+' (bump deferred)', detail:'You earned the jump to '+nw+' lb ('+summ(last.sets)+'), but readiness is low today. Repeat '+topW+' lb, keep it crisp, and take the jump next session at full strength.', sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
    }
    const hitTxt = str ? 'Your top set hit '+hi+' reps ('+summ(last.sets)+').' : 'You hit '+hi+'+ on every top set ('+summ(last.sets)+').';
    return {target:nw+' lb \u00d7 '+lo+'+', detail:hitTxt+(allEasy?' All tagged easy \u2014 taking a double jump of '+inc+' lb.':' Load goes up '+inc+' lb \u2014 reps reset to the bottom of the range.')+(hadGrind?' Last bump was a grind, so expect this to feel heavy \u2014 that\u2019s normal.':'')+pushNote, sets:[{w:nw,r:''},{w:nw,r:''},{w:nw,r:''}]};
  }
  if(stall){
    return {target:topW+' lb \u2014 break the stall', detail:'Three sessions at '+topW+' lb without rep progress ('+summ(last.sets)+'). Options: tighten rest to 2\u20133 min and push the first set hard, or drop ~10% for one session and rebuild.', sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
  }
  if(minReps>=lo){
    let d = 'Last: '+summ(last.sets)+'. Same load \u2014 '+(str?'push your top set to '+hi+' reps before the weight moves.':'add at least 1 rep to your weakest set before the weight moves.');
    if(allEasy) d = 'Last: '+summ(last.sets)+', all tagged easy. You\u2019re leaving too much in the tank \u2014 take every set to 1\u20132 reps shy of failure today.';
    else if(hadFail) d = 'Last: '+summ(last.sets)+' with a failed set. Hold '+topW+' lb, stop each set 1 rep before breakdown, and win back the reps.';
    if(ready==='low') d += ' Low readiness: matching last session counts as a win today.';
    return {target:topW+' lb \u00d7 beat '+maxReps, detail:d+pushNote, sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
  }
  if(hadFail){
    const dw = Math.max(topW - inc, inc);
    return {target:dw+' lb \u00d7 '+lo+'+', detail:'Below range with failure tags ('+summ(last.sets)+'). Step back '+inc+' lb, own the rep range, then climb \u2014 backing up to speed up.', sets:[{w:dw,r:''},{w:dw,r:''},{w:dw,r:''}]};
  }
  return {target:topW+' lb \u00d7 build to '+lo, detail:'Last session dipped below range ('+summ(last.sets)+'). Hold '+topW+' lb and climb back to '+lo+' reps per set before adding load.'+(ready==='low'?' Low readiness \u2014 no heroics today.':''), sets:[{w:topW,r:''},{w:topW,r:''},{w:topW,r:''}]};
}
function summ(sets){ return sets.map(function(s){ const b = effBucket(s); return s.w+'×'+s.r+(b?(EFF_MARK[b]||''):''); }).join(', '); }

function plateCalc(total){
  const BAR = 45;
  let per = (total - BAR) / 2;
  if(per < 0) return null;
  if(per === 0) return {plates:[], txt:'empty bar (45)'};
  const out = [];
  [45,35,25,10,5,2.5].forEach(pl=>{ while(per >= pl-0.001){ out.push(pl); per -= pl; } });
  return {plates:out, txt:out.join(' + ') + (per>0.01 ? ' (+'+per.toFixed(1)+' short)' : '')};
}

function musclesFor(ex){
  if(EX_MUSCLES[ex]) return EX_MUSCLES[ex];
  const n = ex.toLowerCase(); // fallback keyword inference for custom exercises
  if(/trap bar|trap-bar/.test(n)) return {p:['Glutes','Hamstrings'],s:['Back']};
  if(/deadlift|rdl|romanian/.test(n)) return {p:['Hamstrings','Glutes'],s:['Back']};
  if(/squat|leg press|lunge|hack/.test(n)) return {p:['Quads','Glutes'],s:['Hamstrings']};
  if(/leg curl|rdl|romanian|hamstring/.test(n)) return {p:['Hamstrings'],s:[]};
  if(/extension/.test(n) && /leg/.test(n)) return {p:['Quads'],s:[]};
  if(/hip thrust|glute|abductor|adductor/.test(n)) return {p:['Glutes'],s:[]};
  if(/curl/.test(n)) return {p:['Biceps'],s:[]};
  if(/pushdown|tricep|jm|skull|dip/.test(n)) return {p:['Triceps'],s:[]};
  if(/lateral|delt|shoulder|overhead press|ohp/.test(n)) return {p:['Shoulders'],s:[]};
  // Short tokens MUST be anchored here, same trap mesoPattern() documents for "chin" inside
  // "maCHINe": unanchored /lat/ matches "PLATe", so "Plate Loaded Chest Press" was being
  // classified as Back — miscounting his chest volume on D5 and making it rank as a
  // replacement for Lat Pulldown. Unanchored /ab/ matches "cABle" and "ABductor" the same way.
  if(/\brows?\b|pulldown|pull-?ups?|chin-?ups?|\blats?\b/.test(n)) return {p:['Back'],s:['Biceps']};
  if(/bench|chest|fly|\bpec\b|press/.test(n)) return {p:['Chest'],s:['Triceps']};
  if(/\babs?\b|abdominal|crunch|leg raise|core/.test(n)) return {p:['Abs'],s:[]};
  return {p:[],s:[]};
}
const MUSCLE_GROUPS = ['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Abs'];
function dateKeyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekStartKey(){
  if(scheduleMode()==='cycle'){
    // The "training week" boundary is the start of the current pass through the pattern
    // (position 0), not each individual rest day. With two rest days in an 8-day cycle,
    // resetting on every rest day would split one pass through the split across two
    // partial windows and misrepresent per-muscle-group coverage. Position 0 is exactly
    // "the day after the LAST rest day in the pattern" \u2014 the second one in D1-D2-D3-
    // REST-D4-D5-D6-REST \u2014 which is what actually marks a full rotation.
    return mesoAddDays(todayKey(), -cyclePosition(todayKey()));
  }
  // Training week starts the day AFTER the most recent scheduled rest day.
  const restDays = Object.keys(S.schedule).filter(k=>S.schedule[k]==='REST').map(Number);
  if(restDays.length){
    for(let i=1;i<=7;i++){
      const d = new Date(); d.setDate(d.getDate()-i);
      if(restDays.includes(d.getDay())){
        const s = new Date(d); s.setDate(s.getDate()+1);
        return dateKeyOf(s);
      }
    }
  }
  // no rest day in schedule — fall back to rolling 7 days
  const c = new Date(); c.setDate(c.getDate()-6);
  return dateKeyOf(c);
}
function heatmapHTML(){
  const cutKey = weekStartKey();
  const vol = {}; MUSCLE_GROUPS.forEach(g=>vol[g]=0);
  S.logs.filter(l=>l.date>=cutKey).forEach(l=>l.entries.forEach(e=>{
    const m = musclesFor(e.exercise);
    const n = e.sets.length;
    m.p.forEach(g=>{ if(vol[g]!=null) vol[g]+=n; });
    m.s.forEach(g=>{ if(vol[g]!=null) vol[g]+=n*0.5; });
  }));
  const resetLabel = scheduleMode()==='cycle' ? 'resets after full cycle' : 'resets after rest day';
  let html = '<h2>Weekly Volume Heatmap <span style="font-weight:400;letter-spacing:0;text-transform:none">(this training week \u00b7 since '+fmtDate(cutKey)+' \u00b7 '+resetLabel+' \u00b7 secondary muscles count half)</span></h2><div class="hm">';
  MUSCLE_GROUPS.forEach(g=>{
    const v = Math.round(vol[g]*10)/10;
    let col, tag;
    if(v===0){ col='#3a3d45'; tag='untouched'; }
    else if(v<6){ col='#dfae36'; tag='low'; }
    else if(v<=20){ col='#3da25f'; tag='solid'; }
    else { col='#d23b3b'; tag='very high'; }
    const pct = Math.min(100, v/20*100);
    html += '<div class="hm-cell"><div class="g">'+g+'</div><div class="n">'+v+'</div>'+
      '<div class="t" style="color:'+col+'">'+tag+'</div>'+
      '<div class="hm-bar"><i style="width:'+pct+'%;background:'+col+'"></i></div></div>';
  });
  html += '</div><p class="small" style="margin-top:8px">Rough hypertrophy guide: 10\u201320 hard sets per muscle per week. Yellow = room to add, red = watch recovery.</p>';
  return html;
}

/* ================= PR CELEBRATION ================= */
function bestE1RM(ex){ const pts = e1rmSeries(ex); return pts.length ? Math.max(...pts.map(p=>p.v)) : 0; }
/* The literal heaviest weight ever lifted for an exercise (any rep count), tie-broken
   by higher reps at that same weight. This is the "realistic" PR — no formula, no
   extrapolation, just the actual heaviest plate you've put up. */
/* The PR equivalent of e1rmSeries: at each logged session, the heaviest weight
   ever lifted for that exercise UP TO that point (a monotonic step series). This
   is what the Road now tracks \u2014 chunkier than e1RM since it only moves when a
   real heavier weight is touched, but never inflated by a formula. */
function prSeries(ex){
  const sorted = [...S.logs].filter(l=>!l.deload && l.entries.some(e=>e.exercise===ex)).sort((a,b)=>a.date.localeCompare(b.date));
  const out = [];
  let runningMax = 0;
  sorted.forEach(l=>{
    const e = l.entries.find(en=>en.exercise===ex);
    if(!e) return;
    e.sets.forEach(s=>{ const w = +s.w||0; if(w>runningMax) runningMax = w; });
    out.push({date:l.date, v:runningMax});
  });
  return out;
}
function actualPR(ex){
  let best = null;
  [...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    l.entries.forEach(e=>{
      if(e.exercise !== ex) return;
      e.sets.forEach(s=>{
        const w = +s.w||0, r = +s.r||0;
        if(w<=0) return;
        if(!best || w>best.w || (w===best.w && r>=best.r)) best = {w, r, date:l.date};
      });
    });
  });
  return best;
}
function prWatchList(){ return [...new Set([...Object.keys(PR_LIFTS), ...S.road.map(g=>g.exercise)])]; }
const PR_HISTORY_MAX = 500;
/* Best e1RM for EVERY exercise in the log, in a single pass.
   PR History records all lifts, not just the watch list, so the old shape (a full
   bestE1RM() log scan per watched lift) would have become one scan per exercise.
   One walk over S.logs instead — cheaper than what it replaces. */
function snapshotPRs(){
  const m = {};
  S.logs.forEach(l=>{
    if(l.deload) return;           // deload weeks are excluded from the e1RM trend, so they can't set PRs
    l.entries.forEach(e=>e.sets.forEach(s=>{
      const w = +s.w||0, r = +s.r||0;
      // r>0 guard: epley() returns w unchanged for r<=1, so a stray 0-rep set would
      // otherwise register as a full PR at that weight on every exercise we now watch.
      if(w<=0 || r<=0) return;
      const v = epley(w,r);
      if(v>0 && (!(e.exercise in m) || v>m[e.exercise])) m[e.exercise] = v;
    }));
  });
  return m;
}
/* The set that actually produced the current best e1RM. Earliest one wins a tie —
   PR History is a record of the first time a number went up, not the last. */
function prBestSetFor(ex){
  let best = null;
  [...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    if(l.deload) return;
    l.entries.forEach(e=>{
      if(e.exercise!==ex) return;
      e.sets.forEach(s=>{
        const w = +s.w||0, r = +s.r||0;
        if(w<=0 || r<=0) return;
        const v = epley(w,r);
        if(v>0 && (!best || v>best.v)) best = {w, r, v, date:l.date};
      });
    });
  });
  return best;
}
/* Record one PR row. Returns true only if it was actually written — a repeat call with
   the same `before` snapshot, or a second device replaying the same save through gist
   sync, must not double-log the same lift/date/e1RM. */
function prAppend(ex, now, prev){
  const bs = prBestSetFor(ex);
  if(!bs) return false;
  const e1 = Math.round(now*10)/10;
  if(!Array.isArray(S.prHistory)) S.prHistory = [];
  if(S.prHistory.some(p=>p.exercise===ex && p.date===bs.date && Math.abs(p.e1rm-e1)<0.05)) return false;
  S.prHistory.push({exercise:ex, weight:bs.w, reps:bs.r, e1rm:e1,
                    prev:Math.round(prev*10)/10, gain:Math.round((now-prev)*10)/10, date:bs.date});
  if(S.prHistory.length > PR_HISTORY_MAX) S.prHistory = S.prHistory.slice(-PR_HISTORY_MAX);
  return true;
}
function checkPRs(before){
  const after = snapshotPRs();
  const watch = prWatchList();
  let top = null, added = 0;
  Object.keys(after).forEach(ex=>{
    const prev = before[ex] || 0, now = after[ex];
    if(!(prev > 0) || !(now > prev + 0.01)) return;   // a lift's first-ever entry is a baseline, not a PR
    if(prAppend(ex, now, prev)) added++;
    // The celebration stays scoped to the watch list. Recording every lift's history must
    // not turn a five-pound bump on a cable machine into a full-screen popup mid-session.
    if(watch.includes(ex) && (!top || (now-prev) > top.gain)) top = {ex, now, prev, gain:now-prev};
  });
  if(added) save();
  if(top) celebrate(top);
}
/* Replay the existing log into prHistory. Every row is a real logged set, and the running
   max is computed exactly the way checkPRs() computes it live, so a backfilled row and a
   live-detected row mean the same thing. */
function prBackfill(){
  const logs = [...S.logs].filter(l=>!l.deload).sort((a,b)=>a.date.localeCompare(b.date));
  const best = {}, out = [];
  logs.forEach(l=>{
    // Reduce to the session's best set per exercise first. Comparing set-by-set would emit
    // two "PRs" on one date for the ordinary warm-up-then-top-set pattern.
    const sess = {};
    l.entries.forEach(e=>e.sets.forEach(s=>{
      const w = +s.w||0, r = +s.r||0;
      if(w<=0 || r<=0) return;
      const v = epley(w,r);
      if(v>0 && (!sess[e.exercise] || v>sess[e.exercise].v)) sess[e.exercise] = {w, r, v};
    }));
    Object.keys(sess).forEach(ex=>{
      const cur = sess[ex], prev = best[ex] || 0;
      if(prev > 0 && cur.v > prev + 0.01){
        out.push({exercise:ex, weight:cur.w, reps:cur.r, e1rm:Math.round(cur.v*10)/10,
                  prev:Math.round(prev*10)/10, gain:Math.round((cur.v-prev)*10)/10, date:l.date});
      }
      if(cur.v > prev) best[ex] = cur.v;
    });
  });
  return out;
}
/* Lazy, once. Deliberately not run at boot: autoPullOnLoad() can replace S wholesale a
   moment later, which would throw the work away and re-run it next launch. The PR History
   tab is the only consumer, so it backfills on first paint instead. */
function prBackfillOnce(){
  if(S.prBackfilled) return false;
  if(!Array.isArray(S.prHistory)) S.prHistory = [];
  const seen = {};
  S.prHistory.forEach(p=>{ seen[p.exercise+'|'+p.date+'|'+p.e1rm] = 1; });
  prBackfill().forEach(r=>{
    const k = r.exercise+'|'+r.date+'|'+r.e1rm;
    if(!seen[k]){ seen[k]=1; S.prHistory.push(r); }
  });
  S.prHistory.sort((a,b)=>a.date.localeCompare(b.date));
  if(S.prHistory.length > PR_HISTORY_MAX) S.prHistory = S.prHistory.slice(-PR_HISTORY_MAX);
  S.prBackfilled = true;
  save();
  return true;
}

const EFF_ORDER = ['', 'easy', 'solid', 'grind', 'fail'];
const EFF_LABEL = {'':'\u2013', easy:'E', solid:'S', grind:'G', fail:'F'};
const EFF_MARK  = {easy:'\u1d49', solid:'', grind:'\u1d4d', fail:'\u02e3'};
/* ---- monthly progress photos ----
   Stored in a SEPARATE gist, not in S, and deliberately so. Everything in S is JSON-encoded
   into localStorage on every save and pushed into the sync gist on every change; a year of
   portraits is comfortably over a megabyte, which would mean re-uploading all of it every
   time a set is logged, on cellular, mid-workout. It would also eat a large share of the
   ~5MB localStorage budget with no quota guard anywhere in save() to catch the overflow.

   So: photos live in their own gist, fetched only when the card is actually opened, and S
   keeps nothing but the index. Images are downscaled through a canvas before they are ever
   encoded -- a phone portrait is several megabytes and none of that resolution survives
   being looked at in a 104px grid cell. */
const PHOTO_MAX_EDGE = 640;      // long edge, px
const PHOTO_QUALITY = 0.72;      // JPEG quality after downscale
const PHOTO_GIST_FILE = 'ironhub_photos.json';

function photoState(){
  if(!S.photos) S.photos = {gistId:'', index:[]};   // index: [{id, date, w, h, bytes}]
  if(!S.photos.index) S.photos.index = [];
  return S.photos;
}
function photoMonthKey(dateKey){ return String(dateKey||todayKey()).slice(0,7); }
function photoForMonth(mk){
  return photoState().index.find(function(p){ return photoMonthKey(p.date) === mk; }) || null;
}
/* Downscale to a data URL. Returns a promise; rejects only on a genuinely unreadable file. */
function photoDownscale(file){
  return new Promise(function(resolve, reject){
    const fr = new FileReader();
    fr.onerror = function(){ reject(new Error('Could not read that file.')); };
    fr.onload = function(){
      const img = new Image();
      img.onerror = function(){ reject(new Error('That does not look like an image.')); };
      img.onload = function(){
        const scale = Math.min(1, PHOTO_MAX_EDGE / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        try{
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve({dataUrl: c.toDataURL('image/jpeg', PHOTO_QUALITY), w:w, h:h});
        }catch(e){ reject(new Error('Could not process that image.')); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* The photo blobs, fetched on demand. Module-scoped rather than stored: they are large and
   there is no reason for them to survive a reload in memory. */
let _photoBlobs = null;
async function photoLoadAll(force){
  if(_photoBlobs && !force) return _photoBlobs;
  const st = photoState();
  if(!st.gistId || !S.settings.ghToken){ _photoBlobs = {}; return _photoBlobs; }
  try{
    const res = await fetch('https://api.github.com/gists/'+st.gistId, {headers:ghHeaders()});
    if(!res.ok) throw new Error('photo gist read failed ('+res.status+')');
    const g = await res.json();
    const f = g.files && g.files[PHOTO_GIST_FILE];
    let content = f && f.content;
    if(f && f.truncated) content = await (await fetch(f.raw_url)).text();
    _photoBlobs = content ? (JSON.parse(content).photos || {}) : {};
  }catch(e){
    _photoBlobs = {};
    throw e;
  }
  return _photoBlobs;
}
async function photoSaveAll(blobs){
  const st = photoState();
  if(!S.settings.ghToken) throw new Error('Connect cloud sync first \u2014 photos need somewhere to live.');
  const body = JSON.stringify({app:'ironhub-photos', v:1, savedAt:new Date().toISOString(), photos:blobs});
  if(!st.gistId){
    const c = await fetch('https://api.github.com/gists',{method:'POST',headers:ghHeaders(),
      body:JSON.stringify({description:'Iron Hub progress photos', public:false,
                           files:{[PHOTO_GIST_FILE]:{content:body}}})});
    if(!c.ok) throw new Error('Could not create the photo gist ('+c.status+')');
    st.gistId = (await c.json()).id;
    save();
    return;
  }
  const r = await fetch('https://api.github.com/gists/'+st.gistId,{method:'PATCH',headers:ghHeaders(),
    body:JSON.stringify({files:{[PHOTO_GIST_FILE]:{content:body}}})});
  if(!r.ok) throw new Error('Could not save the photo ('+r.status+')');
}

async function photoAdd(input){
  const file = input && input.files && input.files[0];
  if(!file) return;
  photoBusy = 'Processing\u2026'; renderProgressV2();
  try{
    const img = await photoDownscale(file);
    const blobs = await photoLoadAll();
    const st = photoState();
    const mk = photoMonthKey(todayKey());
    const existing = photoForMonth(mk);
    // One per month, replaced rather than accumulated: this is a monthly tracker, and two
    // photos from the same week are not a progress comparison.
    if(existing){ delete blobs[existing.id]; st.index = st.index.filter(function(p){ return p.id !== existing.id; }); }
    const id = 'ph'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    blobs[id] = img.dataUrl;
    st.index.push({id:id, date:todayKey(), w:img.w, h:img.h, bytes:img.dataUrl.length});
    await photoSaveAll(blobs);
    save();
    photoBusy = '';
  }catch(e){
    photoBusy = e.message || 'That did not work.';
  }
  if(input) input.value = '';
  renderProgressV2();
}
async function photoDelete(id){
  const p = photoState().index.find(function(x){ return x.id === id; });
  if(!p) return;
  if(!confirm('Delete the photo from '+fmtDate(p.date)+'? This cannot be undone.')) return;
  photoBusy = 'Deleting\u2026'; renderProgressV2();
  try{
    const blobs = await photoLoadAll();
    delete blobs[id];
    photoState().index = photoState().index.filter(function(x){ return x.id !== id; });
    await photoSaveAll(blobs);
    save();
    photoBusy = '';
  }catch(e){ photoBusy = e.message || 'Could not delete that.'; }
  renderProgressV2();
}

/* ---- pain / injury flags ----
   Recorded against an exercise and a date, from the LIVE screen, in one tap plus an optional
   note. Deliberately RECORDING, not diagnosis: nothing here decides whether he should train
   through it, and nothing auto-changes a weight. What it does is make the thing visible --
   to him on the lift, and to the agents in their context, so DELTA stops cheerfully
   proposing more volume on a joint he flagged three sessions running.

   Anything prescriptive about an actual injury is a conversation with a physio, not an app. */
function painState(){
  if(!S.pain) S.pain = [];
  return S.pain;
}
const PAIN_LEVELS = [
  {v:1, label:'niggle',   desc:'noticed it, finished the set normally'},
  {v:2, label:'sore',     desc:'uncomfortable, changed how I moved'},
  {v:3, label:'sharp',    desc:'had to stop the set'}
];
function painAdd(exercise, level, note){
  const lv = Math.max(1, Math.min(3, Math.round(+level||1)));
  const rec = {id:'pn'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
               date:todayKey(), exercise:String(exercise||'').slice(0,80),
               level:lv, note:String(note||'').slice(0,200)};
  painState().unshift(rec);
  if(S.pain.length > 200) S.pain.length = 200;   // bounded: this syncs to the gist
  save();
  return rec;
}
function painRemove(id){
  S.pain = painState().filter(function(p){ return p.id !== id; });
  save();
}
/* Flags in the last N days for one exercise, newest first. */
function painFor(exercise, days){
  const cut = mesoAddDays(todayKey(), -(days||30));
  return painState().filter(function(p){ return p.exercise===exercise && p.date >= cut; });
}
function painRecent(days){
  const cut = mesoAddDays(todayKey(), -(days||30));
  return painState().filter(function(p){ return p.date >= cut; });
}
/* What the agents are told. Recurrence is the signal worth surfacing: one niggle is noise,
   the same joint three sessions running is not. */
function painContext(){
  const recent = painRecent(30);
  if(!recent.length) return '';
  const byEx = {};
  recent.forEach(function(p){ (byEx[p.exercise] = byEx[p.exercise] || []).push(p); });
  const lines = Object.keys(byEx).map(function(nm){
    const list = byEx[nm];
    const worst = Math.max.apply(null, list.map(function(p){ return p.level; }));
    const lab = (PAIN_LEVELS.find(function(x){ return x.v===worst; })||{}).label || '?';
    const notes = list.filter(function(p){ return p.note; }).slice(0,2)
                      .map(function(p){ return p.date+': "'+p.note+'"'; }).join('; ');
    return '  '+nm+' \u2014 '+list.length+' flag'+(list.length===1?'':'s')+' in 30 days, worst = '+lab+
           (notes? ' ('+notes+')' : '');
  });
  return '\n\nPAIN / INJURY FLAGS Mark has raised during sessions (last 30 days):\n'+lines.join('\n')+
    '\nTreat these as reported facts, not as a diagnosis, and do NOT give medical advice. You may ' +
    'factor a repeatedly flagged lift into exercise selection \u2014 proposing a swap to a friendlier ' +
    'variation is reasonable and useful. Never propose adding load or volume to a lift flagged at ' +
    '"sharp" in the last 14 days. If something looks persistent or is getting worse, say plainly ' +
    'that it is worth a professional look rather than trying to work out what it is.\n';
}

/* ---- effort lever ----
   Effort used to be four buttons: easy / solid / grind / fail. It is now a continuous
   0-100 lever, 0 = went to failure, 100 = easy completion. Two reasons that is better than
   four buckets: "solid" was doing an enormous amount of work (anything from 1 rep in
   reserve to 4), and a bucket boundary made the difference between a double jump and no
   jump at all, which is a big consequence for a coarse input.

   Everything that reasons about effort goes through effBucket(), which reads the lever when
   there is one and falls back to the old tag when there is not. That is what lets seven
   months of already-logged sessions keep working untouched: there is no migration pass and
   no rewrite of historical data, because old sets simply keep answering through s.e.
   EFF_ANCHOR is the reverse map, used when a set logged the old way needs a number. */
const EFF_ANCHOR = {fail:0, grind:25, solid:60, easy:90};
/* Bucket edges. Deliberately NOT evenly spaced: the interesting distinctions live at the
   hard end (a grind and a failure are different training events), while everything from
   "a couple left in the tank" upward behaves the same way to the progression engine. */
function effBucketFromLever(v){
  const n = +v;
  if(!isFinite(n)) return null;
  if(n <= 15) return 'fail';
  if(n <= 40) return 'grind';
  if(n <= 75) return 'solid';
  return 'easy';
}
/* THE accessor. Every read of a set's effort goes through here. */
function effBucket(set){
  if(!set) return null;
  if(set.ef !== undefined && set.ef !== null && set.ef !== ''){
    const b = effBucketFromLever(set.ef);
    if(b) return b;
  }
  return set.e || null;
}
/* The lever value for a set, inferring one from an old tag when the set predates the lever.
   Returns null when the set carries no effort information at all. */
function effLever(set){
  if(!set) return null;
  if(set.ef !== undefined && set.ef !== null && set.ef !== ''){
    const n = +set.ef;
    if(isFinite(n)) return Math.max(0, Math.min(100, n));
  }
  return (set.e && EFF_ANCHOR[set.e] !== undefined) ? EFF_ANCHOR[set.e] : null;
}
/* Mean lever across a group of sets, ignoring untagged ones. null if none are tagged.
   This is the finer signal the lever buys: "every set was easy" used to be the only way to
   earn a double jump, so four sets at 95 and one at 78 looked identical to four at 95 and
   one at 42. */
function effMean(sets){
  const vals = (sets||[]).map(effLever).filter(function(v){ return v !== null; });
  if(!vals.length) return null;
  return vals.reduce(function(t,v){ return t+v; }, 0) / vals.length;
}
function cycleEff(btn){
  const cur = btn.dataset.e || '';
  const next = EFF_ORDER[(EFF_ORDER.indexOf(cur)+1) % EFF_ORDER.length];
  btn.dataset.e = next;
  btn.textContent = EFF_LABEL[next];
  btn.title = 'Effort: ' + (next || 'untagged') + ' (tap to cycle: easy \u2192 solid \u2192 grind \u2192 fail)';
}
function effBtnHTML(e){
  e = e || '';
  return '<button class="eff" data-e="'+e+'" title="Effort: tap to cycle (easy/solid/grind/fail)" onclick="cycleEff(this)">'+EFF_LABEL[e]+'</button>';
}

/* ================= PROGRESS TAB ================= */
const PR_LIFTS = {
  'Barbell Bench Press': {milestones:[95,115,135,155,185,205,225,245], capPerWeek:1.75},
  'Barbell Back Squat':  {milestones:[135,185,225,275,315,365], capPerWeek:2.5}
};
function e1rmSeries(ex, opts){
  const excludeHome = opts && opts.excludeHome;
  const pts = [];
  [...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
    if(l.deload) return; // exclude deload weeks from strength trend
    if(excludeHome && l.home) return; // HOME sessions run lighter/shorter by design — opt-in exclusion for Investigation
    const e = l.entries.find(en=>en.exercise===ex);
    if(!e) return;
    let best = 0;
    e.sets.forEach(s=>{ const v = epley(+s.w||0, +s.r||0); if(v>best) best=v; });
    if(best>0) pts.push({date:l.date, v:Math.round(best*10)/10});
  });
  return pts;
}
function linreg(pts){
  // x in days since first point
  if(pts.length<2) return null;
  const x0 = new Date(pts[0].date).getTime();
  const xs = pts.map(p=>(new Date(p.date).getTime()-x0)/86400000);
  const ys = pts.map(p=>p.v);
  const n = xs.length;
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)**2; }
  if(den===0) return null;
  return {slope:num/den, intercept:my-(num/den)*mx, x0};
}
/* ================= PROGRESS STATUS (rule-based composite) ================= */
/* The ladder, low to high. This array is the single source of truth for tier order, labels
   and colours — TIER_ORDER/TIER_LABELS/TIER_COLS below are derived from it. They used to be
   hand-maintained duplicates and had already drifted (accel was blue in one and violet in
   the other), which a step bar drawn from one map beside a label drawn from the other would
   have put side by side in the same card. */
const PSTATUS_TIERS = [
  {key:'none',   label:'Not Making Progress',  col:'var(--tier-none)'},
  {key:'slow',   label:'Slow Progress',        col:'var(--tier-slow)'},
  {key:'prog',   label:'Steady Progress',      col:'var(--tier-prog)'},
  {key:'accel',  label:'Accelerated Progress', col:'var(--tier-accel)'},
  {key:'rapid',  label:'RAPID PROGRESS',       col:'var(--tier-rapid)'}
];
function strengthScore(){
  const scores = []; const notes = []; const ratios = [];
  for(const lift in PR_LIFTS){
    const cfg = PR_LIFTS[lift];
    const pts = e1rmSeries(lift);
    if(pts.length < 2) continue;
    const reg = linreg(pts.slice(-12));
    if(!reg){ continue; }
    let slopeWk = reg.slope*7;
    const ratio = slopeWk / cfg.capPerWeek; // negative/zero if flat or declining
    // Kept raw as well as bucketed: the 0-3 bucket cannot tell "just reached the cap" from
    // "well past it", and that distinction is exactly what rapidProgressGate() needs.
    ratios.push({lift, ratio, perWeek:slopeWk, cap:cfg.capPerWeek});
    let pts3;
    if(ratio <= 0)      { pts3 = 0; notes.push(lift.split(' ').slice(-1)[0]+' flat/declining'); }
    else if(ratio < 0.3){ pts3 = 1; notes.push(lift.split(' ').slice(-1)[0]+' creeping up slowly'); }
    else if(ratio < 0.9){ pts3 = 2; notes.push(lift.split(' ').slice(-1)[0]+' climbing steadily'); }
    else                { pts3 = 3; notes.push(lift.split(' ').slice(-1)[0]+' climbing fast'); }
    scores.push(pts3);
  }
  if(!scores.length) return {available:false, ratios};
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  return {available:true, score:avg/3, notes, ratios}; // normalize 0-1
}
function consistencyScore(){
  const scheduled = Object.values(S.schedule).filter(v=>v!=='REST').length; // out of 7 weekday slots
  if(scheduled===0) return {available:false};
  const expectedPerWeek = scheduled; // distinct weekdays trained, scaled to a week
  const cut = new Date(Date.now()-6*86400000);
  const cutKey = dateKeyOf(cut);
  const distinctDays = new Set(S.logs.filter(l=>l.date>=cutKey).map(l=>l.date)).size;
  const ratio = Math.min(1, distinctDays/expectedPerWeek);
  let note;
  if(ratio>=0.9) note='right on schedule';
  else if(ratio>=0.6) note='mostly on schedule';
  else if(ratio>=0.3) note='missing sessions';
  else note='largely inactive this week';
  return {available:true, score:ratio, note, distinctDays, expectedPerWeek};
}
/* ONE bodyweight rate — see bulkRate(). This used to run its own raw first-vs-last weigh-in
   over 28 days, which is exactly the fourth estimator bulkRate() was written to retire: the
   Progress verdict read +0.35 lb/wk off the same weigh-ins that had the Bulk tab reading
   0.00 on the same day. The bands come from bulkBand() for the same reason — a 0.3 lb/wk
   week must not be "right in the lean-bulk range" here and "under the pocket, add calories"
   two tabs over. */
function bulkScore(){
  const br = bulkRate(4);
  if(!br) return {available:false};
  const rate = br.rate;
  let score, note;
  switch(bulkBand(rate)){
    case 'losing': score=0;   note='scale is dropping'; break;
    case 'flat':   score=0;   note='scale is flat'; break;
    case 'under':  score=0.4; note='gaining, but under the 0.5–1 lb/wk pocket'; break;
    case 'pocket': score=1;   note='right in the lean-bulk pocket'; break;
    // bulkBand() stops at 'hot'; the blend still separates "a bit fast" from "quite fast".
    default:       if(rate<=1.6){ score=0.7; note='gaining faster than ideal'; }
                   else { score=0.4; note='gaining quite fast — likely some fat with it'; }
  }
  return {available:true, score, note, rate, weeks: br.weeks};
}
/* ---- the RAPID gate ----
   RAPID is not "a higher blended score", and it cannot be. Every component here caps at 1.0
   by design — bulkScore() actually scores *down* past 1.0 lb/wk — so the blend physically
   cannot climb above what Accelerated already reaches. The top tier is therefore a separate
   gate, checked only once the blend has already earned Accelerated, and read from signals
   the 0-1 buckets throw away plus two the composite never looked at at all. That is what
   makes it mean "provably outperforming" rather than "scored well on three averages".

   Every check is evidence of a thing having happened, not of a number looking good:
   a lift measurably past its cap rate, gain that is going to the bar rather than the scale,
   a PR that actually landed, and nothing the app itself is already flagging.

   Returns the unmet checks alongside the verdict — the Accelerated card lists them, so the
   top tier is never a locked door with no handle on it. */
const RAPID_OUTPERFORM = 1.15;  // share of a lift's capPerWeek that counts as beating it, not merely meeting it
const RAPID_PR_DAYS = 21;
function rapidProgressGate(st){
  const unmet = [];
  // 1. A main lift genuinely past its cap rate. strengthScore() buckets everything from 0.9x
  //    upward into the same top score, so "just reached the cap" and "well past it" are
  //    invisible to the blend; this reads the raw ratio back out.
  const ratios = (st && st.ratios) || [];
  const best = ratios.reduce((a,r)=> (!a || r.ratio > a.ratio) ? r : a, null);
  if(!best || best.ratio < RAPID_OUTPERFORM){
    unmet.push('No main lift is past its cap rate yet'+
      (best && best.ratio > 0
        ? ' \u2014 best is '+best.lift+' at '+Math.round(best.ratio*100)+'% of cap, and RAPID wants '+Math.round(RAPID_OUTPERFORM*100)+'%'
        : '')+'.');
  }
  // 2. Bulk *quality*, not just an acceptable scale rate. bulkScore() only asks whether the
  //    scale is moving at a sane speed; this asks where the gain is going. A try/catch because
  //    anBulkQuality() fits regressions over the whole log — if it ever throws, RAPID is
  //    withheld (the cautious direction) rather than the tab breaking.
  let bq = null;
  try { bq = (typeof anBulkQuality==='function') ? anBulkQuality() : null; } catch(e){ bq = null; }
  if(!bq || !bq.ok){
    unmet.push('Not enough bodyweight and lift history in the window to judge bulk quality yet.');
  } else if(bq.key!=='strong' && bq.key!=='good'){
    const lab = (typeof AN_BQ_VERDICTS!=='undefined' && AN_BQ_VERDICTS[bq.key]) ? AN_BQ_VERDICTS[bq.key].label.toLowerCase() : bq.key;
    unmet.push('Bulk quality over the last '+bq.weeks+' weeks: '+lab+'. RAPID wants strength climbing faster than the scale.');
  }
  // 3. A PR that actually landed. A favourable regression slope can be produced by a run of
  //    good-but-not-best sessions; a PR row cannot be.
  const prCut = dateKeyOf(new Date(Date.now()-RAPID_PR_DAYS*86400000));
  if(!(Array.isArray(S.prHistory) && S.prHistory.some(p=>p && p.date >= prCut)))
    unmet.push('No PR on any lift in the last '+RAPID_PR_DAYS+' days.');
  // 4. Nothing the app is already calling out. Strong averages must not paper over a lift
  //    Overload Status has flagged, or this tab would contradict that one.
  let flagged = [];
  try { if(typeof olSignals==='function') flagged = olSignals().filter(x=>x.verdict==='attention'); } catch(e){ flagged = [{lift:'\u2014'}]; }
  if(flagged.length)
    unmet.push(flagged.length+' lift'+(flagged.length>1?'s':'')+' still needing attention in Overload Status: '+
      flagged.slice(0,3).map(x=>x.lift).join(', ')+'.');
  return {pass: unmet.length===0, unmet, best, bq};
}
function computeProgressStatus(){
  if(S.logs.length===0 && S.weights.length===0) return {tier:null, st:{available:false}, co:{available:false}, bu:{available:false}};
  const st = strengthScore(), co = consistencyScore(), bu = bulkScore();
  const parts = [];
  if(st.available) parts.push({w:0.5, s:st.score});
  if(co.available) parts.push({w:0.3, s:co.score});
  if(bu.available) parts.push({w:0.2, s:bu.score});
  if(!parts.length) return {tier:null, st, co, bu};

function projectMetric(pts, capPerWeek, horizonWeeks){
  if(pts.length < 3) return null;
  let recent = pts.slice(-12);
  // outlier guard: drop points that deviate wildly from their neighbors (likely data-entry errors)
  if(recent.length >= 4){
    const vals = recent.map(p=>p.v);
    const med = [...vals].sort((a,b)=>a-b)[Math.floor(vals.length/2)];
    const devs = vals.map(v=>Math.abs(v-med));
    const madSorted = [...devs].sort((a,b)=>a-b);
    const mad = madSorted[Math.floor(madSorted.length/2)] || 1;
    recent = recent.filter(p => Math.abs(p.v-med) <= Math.max(mad*5, med*0.4));
    if(recent.length < 3) recent = pts.slice(-12); // fallback if filter was too aggressive
  }
  const reg = linreg(recent);
  if(!reg) return null;
  let slopeWk = reg.slope*7;
  if(capPerWeek!=null && slopeWk > capPerWeek) slopeWk = capPerWeek;
  const lastV = recent[recent.length-1].v;
  let proj = lastV + slopeWk*horizonWeeks;
  const x0 = new Date(recent[0].date).getTime();
  const resid = recent.map(p=>{
    const x = (new Date(p.date).getTime()-x0)/86400000;
    return p.v - (reg.intercept + reg.slope*x);
  });
  const sd = Math.sqrt(resid.reduce((a,r)=>a+r*r,0)/Math.max(1,resid.length-1)) || 0;
  const band = (sd*1.5) + Math.abs(slopeWk)*horizonWeeks*0.35;
  // sanity floor: a projection can never be negative or absurdly below current value
  const floor = lastV*0.5;
  proj = Math.max(proj, floor);
  const lo = Math.max(proj-band, floor*0.7, 0);
  const hi = Math.max(proj+band, lo+1);
  return {value:Math.round(proj), lo:Math.round(lo), hi:Math.round(hi), slopeWk};
}
function bodyweightSeries(){
  return [...S.weights].sort((a,b)=>a.date.localeCompare(b.date)).map(w=>({date:w.date, v:w.lbs}));
}
// weekly-averaged version: daily bodyweight is noisy (water, food timing, bathroom),
// so raw-point regression can read as flat/negative from noise alone. Averaging by week
// before fitting the trend gives a far more stable signal for projections.
function bodyweightSeriesSmoothed(){
  const raw = bodyweightSeries();
  if(raw.length<2) return raw;
  const byWeek = {};
  raw.forEach(p=>{
    const wk = weekKeyOf(p.date);
    if(!byWeek[wk]) byWeek[wk] = {sum:0, n:0, lastDate:p.date};
    byWeek[wk].sum += p.v; byWeek[wk].n++;
    if(p.date > byWeek[wk].lastDate) byWeek[wk].lastDate = p.date;
  });
  return Object.keys(byWeek).sort().map(wk=>({date:byWeek[wk].lastDate, v:Math.round((byWeek[wk].sum/byWeek[wk].n)*10)/10}));
}
/* THE bodyweight rate. Three tabs used to compute this three different ways and then
   disagree with each other in front of him:
     - renderBulk() took raw first-vs-last weigh-in over 28 days (the noisiest possible
       estimator: two odd weigh-in mornings could swing it by half a pound a week),
     - investigateBulk() ran linreg() over the last 4 weekly averages,
     - the projection card used anFanProject()'s measured pace.
   They now all come through here. Regression over WEEKLY AVERAGES, which the projection and
   Investigation already treated as truth -- so this moves renderBulk() up onto the accurate
   method rather than dragging the accurate ones down to it.
   Returns null when there genuinely is not enough history to say. */
function bulkRate(weeks){
  const sm = bodyweightSeriesSmoothed();
  if(sm.length < 3) return null;
  const win = sm.slice(-Math.max(2, weeks||4));
  const reg = linreg(win);
  if(!reg) return null;
  return {rate: reg.slope*7, weeks: win.length, cur: sm[sm.length-1].v};
}
/* The lean-bulk bands, in one place. The old renderBulk() verdict called everything from

const BULK_LO = 0.5, BULK_HI = 1.0;
function bulkBand(rate){
  if(rate < 0)        return 'losing';
  if(rate < 0.15)     return 'flat';
  if(rate < BULK_LO)  return 'under';
  if(rate <= BULK_HI) return 'pocket';
  return 'hot';
}

function milestoneBarGraphic(cur, milestones){
  const W=700, H=78;
  const trackX1=20, trackX2=W-20, trackY=38, trackH=14;
  const maxM = milestones[milestones.length-1];
  const scaleX = v => trackX1 + Math.max(0,Math.min(1, v/maxM)) * (trackX2-trackX1);
  const fillX2 = scaleX(Math.min(cur, maxM));
  const reached = milestones.filter(m=>m<=cur).length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Milestone progress bar" style="width:100%;height:auto">`;
  // background track
  svg += `<rect x="${trackX1}" y="${trackY}" width="${trackX2-trackX1}" height="${trackH}" rx="7" fill="#23262d" stroke="#2a2d35"/>`;
  // filled progress
  if(fillX2 > trackX1+2){
    svg += `<rect x="${trackX1}" y="${trackY}" width="${fillX2-trackX1}" height="${trackH}" rx="7" fill="var(--accent)" opacity="0.85"/>`;
  }
  // tick marks + numbers at each milestone
  milestones.forEach(m=>{
    const x = scaleX(m), hit = m<=cur;
    svg += `<line x1="${x}" x2="${x}" y1="${trackY-4}" y2="${trackY+trackH+4}" stroke="${hit?'#101114':'#5b5e68'}" stroke-width="2" opacity="${hit?0.55:1}"/>`;
    svg += `<text x="${x}" y="${trackY+trackH+18}" text-anchor="middle" font-size="10.5" font-weight="${hit?800:400}" fill="${hit?'#e9e7e2':'#5b5e68'}">${m}</text>`;
  });
  // current value marker (small arrow + label) above the bar
  const cx = scaleX(Math.min(cur,maxM));
  svg += `<polygon points="${cx-5},${trackY-6} ${cx+5},${trackY-6} ${cx},${trackY+1}" fill="#e9e7e2"/>`;
  svg += `<text x="${cx}" y="${trackY-10}" text-anchor="middle" font-size="11" font-weight="800" fill="#e9e7e2">${Math.round(cur)}</text>`;
  svg += `<text x="${trackX1}" y="14" font-size="10.5" fill="#8d909a">Milestones reached: <tspan font-weight="800" fill="#e9e7e2">${reached}/${milestones.length}</tspan></text>`;
  svg += '</svg>';
  return `<div class="bar-wrap">${svg}</div>`;
}
function lineChart(pts, color){
  const W=700, H=200, P=36;
  if(pts.length===1){
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><circle cx="'+(W/2)+'" cy="'+(H/2)+'" r="4" fill="'+color+'"/><text x="'+(W/2)+'" y="'+(H/2-12)+'" text-anchor="middle" font-size="12" fill="#8d909a">'+pts[0].v+' lb — one point so far</text></svg>';
  }
  const t0=new Date(pts[0].date).getTime(), t1=new Date(pts[pts.length-1].date).getTime()||t0+1;
  const vmin=Math.min(...pts.map(p=>p.v)), vmax=Math.max(...pts.map(p=>p.v));
  const pad=(vmax-vmin)*0.15||5;
  const x=t=>P+( (t-t0)/(t1-t0||1) )*(W-2*P);
  const y=v=>H-P-((v-(vmin-pad))/((vmax+pad)-(vmin-pad)))*(H-2*P);
  let path='';
  pts.forEach((p,i)=>{ path += (i?'L':'M')+x(new Date(p.date).getTime()).toFixed(1)+' '+y(p.v).toFixed(1)+' '; });
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  [vmin, (vmin+vmax)/2, vmax].forEach(v=>{
    svg+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#2a2d35" stroke-width="1"/>'+
         '<text x="'+(P-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="#5b5e68">'+Math.round(v)+'</text>';
  });
  svg+='<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(p=>{ svg+='<circle cx="'+x(new Date(p.date).getTime())+'" cy="'+y(p.v)+'" r="3.5" fill="'+color+'"/>'; });
  svg+='<text x="'+P+'" y="'+(H-8)+'" font-size="10" fill="#5b5e68">'+fmtDate(pts[0].date)+'</text>';
  svg+='<text x="'+(W-P)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="#5b5e68">'+fmtDate(pts[pts.length-1].date)+'</text>';
  svg+='</svg>';
  return svg;
}

function goalCard(g){
  const prPts = prSeries(g.exercise);
  const cur = prPts.length ? prPts[prPts.length-1].v : 0;
  const seedStart = prPts.length ? prPts[0].v : 0;
  // migrate any goal created before the road switched from e1RM to PR \u2014 a start
  // seeded above your current PR is impossible under the new basis, so reseed it.
  if(!g.start || g.start > cur){ g.start = seedStart; save(false); }
  const start = g.start || 0;
  const span = Math.max(g.target - start, 1);
  const pct = Math.max(0, Math.min(100, (cur-start)/span*100));
  const done = cur >= g.target;
  // trend — now computed on the PR step series, so expect chunkier, less frequent movement
  const reg = prPts.length>=2 ? linreg(prPts.slice(-12)) : null;
  const cap = PR_LIFTS[g.exercise] ? PR_LIFTS[g.exercise].capPerWeek : 2.0;
  let slopeWk = reg ? Math.min(reg.slope*7, cap) : 0;
  let projTxt = 'log more sessions to project';

      '<div class="stat"><div class="v" style="color:var(--dim);font-size:15px">'+(e1cur?Math.round(e1cur):'\u2014')+'</div><div class="l">est. 1rm (reference only)</div></div>'+
      '<div class="stat"><div class="v">'+g.target+'</div><div class="l">target</div></div>'+

      '<div class="stat"><div class="v" style="font-size:13px;line-height:2.1">'+esc(projTxt)+'</div><div class="l">projection</div></div></div>'+

/* ================= API =================
   The model lives in exactly one place now. It used to be a literal inside each of the two
   request builders below, which is two places to miss when it changes. */
const AI_MODEL = 'claude-sonnet-5';
/* Effort controls how hard the model thinks before answering, and thinking tokens bill as
   OUTPUT. Sonnet 5 thinks adaptively by default, so leaving this unset would roughly double
   the output cost of every call for reasoning a fitness log mostly does not need. 'medium'
   is the deliberate default; agRunAll() raises it, because the nightly cycle is the one call
   where careful reasoning is actually worth paying for. */
const AI_EFFORT_DEFAULT = 'medium';
const AI_ENDPOINT = 'https://api.anthropic.com/v1/messages';
function aiHeaders(){
  const h = {'Content-Type':'application/json'};
  if(S.settings.apiKey){
    h['x-api-key'] = S.settings.apiKey;
    h['anthropic-version'] = '2023-06-01';
    // Required for a browser to call the API directly. There is no server here to proxy
    // through, and the key never leaves the device — syncPayload() strips it.
    h['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  return h;
}
/* Shared request body. opts: {effort, format} */
function aiBody(messages, system, maxTokens, opts){
  // maxRounds is a local loop control, not an API field. It is read in callClaudeWithData
  // and deliberately never copied onto the body.
  const o = opts || {};
  const body = {model:AI_MODEL, max_tokens:maxTokens||1000, messages};
  if(system) body.system = system;
  const oc = {effort: o.effort || AI_EFFORT_DEFAULT};
  if(o.format) oc.format = o.format;
  body.output_config = oc;
  return body;
}
async function callClaude(messages, system, maxTokens, opts){
  const res = await fetch(AI_ENDPOINT,{method:'POST',headers:aiHeaders(),
    body:JSON.stringify(aiBody(messages, system, maxTokens, opts))});
  if(!res.ok){ const t=await res.text(); throw new Error('API '+res.status+': '+t.slice(0,200)); }
  const data = await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}

function whoopContext(){

async function sendChat(){

  // Operations and still looked up the old Coach IDs (#chatIn/#chatBox) \u2014 those elements no
  // longer exist, so `inp.value` threw a TypeError on every send and the button looked dead.
  // Fall back to the legacy IDs so this stays correct if the markup is ever reused.

  if(!inp) return;
  const txt = (inp.value||'').trim();
  if(!txt) return;
  inp.value = '';
  agChatErr = null;
  S.chat.push({role:'user', content:txt}); save();
  agThinkingFor = 'zulu'; renderCoach();
  try{
    const system = 'You are ZULU, the lead agent in Mark\u2019s Iron Hub app and an evidence-based strength coach '+
      'for a motivated 18-year-old natural lifter on a bulk. You oversee three specialist agents \u2014 CHARLIE '+
      '(app logistics, data health, training schedule), DELTA (workouts, splits, progressive overload) and '+
      'ECHO (bulk, fuel, bodyweight trend). Speak as ZULU. If a question sits squarely in one of their domains '+
      'you can note that, but still answer it yourself \u2014 don\u2019t deflect. '+
      'Be direct and concrete: give specific weights, reps, set counts, and food amounts when relevant. '+
      'No fluff, no over-hedging. Keep answers tight (under ~250 words unless asked for a program). '+
      'Never recommend steroids, SARMs, or other PEDs; if asked, explain briefly why not at his age and move on. '+
      'Encourage adequate recovery and realistic rate-of-gain (~0.5-1 lb/week on a lean bulk).\n\n'+
      'You can propose changes to the app using the provided tools: adding/removing/swapping exercises in the split (permanent), '+
      'setting a today-only workout override, adjusting fuel targets, or starting a deload. '+
      'When the user clearly asks you to change something, call the appropriate tool. The user must tap Apply before anything '+
      'actually changes, so propose confidently but still briefly explain what you\'re proposing in your text. '+
      'Prefer set_today_workout for one-off "just for today" requests and the permanent tools for lasting changes. '+
      'Only call a tool when the user is asking for a change \u2014 for pure questions or advice, just answer.\n\n'+
      'You have a durable memory. When he tells you something lasting about himself that you would want in future conversations '+
      '(an injury, a limitation, a preference, a deadline, a gym equipment quirk), call remember_note \u2014 he taps to confirm before it saves. '+
      'Don\'t remember things already in the training data below, and don\'t narrate your memory unprompted. '+
      'Everything under WHAT YOU REMEMBER is something he previously confirmed \u2014 treat it as fact and factor it into your advice.\n\n'+
      coachMemContext()+'\n'+trainingContext();
    const msgs = S.chat.slice(-16).map(m=>{
      let content = m.content;
      // Proposal outcomes (applied/failed/dismissed) previously lived only in UI state and never
      // reached the model, so it had no way to know a prior remember_note/etc had already resolved
      // and would keep re-proposing it every turn regardless of what the user actually asked next.
      if(m.proposals && m.proposals.length){
        const notes = m.proposals.map(p=>{
          if(p.status==='applied') return '[Action \u201c'+p.desc.verb+'\u201d was applied: '+(p.confirm||'done')+']';
          if(p.status==='failed') return '[Action \u201c'+p.desc.verb+'\u201d failed: '+(p.error||'error')+' \u2014 do not retry unless the user asks again]';
          if(p.status==='dismissed') return '[Action \u201c'+p.desc.verb+'\u201d was dismissed by the user \u2014 do not re-propose it]';
          return '[Action \u201c'+p.desc.verb+'\u201d is still pending user confirmation]';
        }).join(' ');
        content = (content||'') + '\n' + notes;
      }

    });

    if(actions.length) msg.proposals = coachStageProposals(actions);

  }catch(e){
    agThinkingFor = null;
    agChatErr = {id:'zulu', msg:'ZULU unavailable: '+e.message+' \u2014 check your API key in Settings.'};
    renderCoach();
  }
}
