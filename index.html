/* Today-only day override: staged plan consumed when the matching
   day's LIVE session next starts, then cleared. */
function coachDayPlanFor(dk){
  const t = todayKey();
  if(S.coachDayPlan && S.coachDayPlan.date===t && S.coachDayPlan.day===dk) return S.coachDayPlan;
  return null;
}
function clearExpiredCoachDayPlan(){
  if(S.coachDayPlan && S.coachDayPlan.date !== todayKey()) S.coachDayPlan = null;
}

/* The tool schema advertised to the model. */
function coachToolDefs(){
  const dayList = Object.keys(S.split).join(', ');
  return [
    {name:'add_exercise_permanent', description:'Permanently add an exercise to a training day in the split (applies to all future sessions on that day).',
      input_schema:{type:'object', properties:{
        day:{type:'string', description:'Day key, one of: '+dayList},
        exercise:{type:'string', description:'Exercise name'},
        position:{type:'string', enum:['end','start'], description:'Where in the day to add it. Default end.'}
      }, required:['day','exercise']}},
    {name:'remove_exercise_permanent', description:'Permanently remove an exercise from a training day in the split.',
      input_schema:{type:'object', properties:{
        day:{type:'string', description:'Day key, one of: '+dayList},
        exercise:{type:'string', description:'Exercise name to remove (must currently exist on that day)'}
      }, required:['day','exercise']}},
    {name:'swap_exercise_permanent', description:'Permanently replace one exercise with another on a training day (keeps position).',
      input_schema:{type:'object', properties:{
        day:{type:'string', description:'Day key, one of: '+dayList},
        from:{type:'string', description:'Existing exercise name to replace'},
        to:{type:'string', description:'New exercise name'}
      }, required:['day','from','to']}},
    {name:'set_today_workout', description:'Stage a today-only workout override for a given day. Does NOT change the permanent split. Consumed when that day\'s LIVE session next starts today, then discarded. Use for one-off requests like "make today ab-focused".',
      input_schema:{type:'object', properties:{
        day:{type:'string', description:'Day key the override applies to, one of: '+dayList},
        exercises:{type:'array', items:{type:'string'}, description:'Full ordered list of exercise names for today\'s session'}
      }, required:['day','exercises']}},
    {name:'adjust_fuel', description:'Adjust the daily calorie and/or protein target.',
      input_schema:{type:'object', properties:{
        calories:{type:'number', description:'New daily calorie target (optional)'},
        protein:{type:'number', description:'New daily protein target in grams (optional)'}
      }}},
    {name:'start_deload', description:'Start a deload week (auto-loads ~60% weights for light sets, excluded from progression). Use only when fatigue/overreach is clearly indicated.',
      input_schema:{type:'object', properties:{}}},
    {name:'remember_note', description:'Save a durable note about the user that you should recall in every future conversation. Use for lasting facts: injuries and limitations, equipment quirks at his gym, exercise preferences and dislikes, goals with deadlines, schedule constraints. Do NOT use for things already visible in the training data (his logs, split, bodyweight, fuel targets) or for passing details from one session.',
      input_schema:{type:'object', properties:{
        note:{type:'string', description:'The fact to remember, written concisely in the third person (e.g. "Left shoulder aggravated by barbell overhead press; dumbbells are fine"). Max ~240 chars.'},
        tag:{type:'string', enum:['injury','preference','goal','schedule','equipment','general'], description:'Category for this note.'}
      }, required:['note']}}
  ];
}

/* Turn a tool_use block into a human-readable proposal for the apply-card. */
function coachDescribeAction(name, inp){
  switch(name){
    case 'add_exercise_permanent':
      return {verb:'Add exercise', scope:'Permanent · '+inp.day, detail:'Add '+inp.exercise+' to '+inp.day+' ('+(inp.position==='start'?'first':'last')+' in the day), every session going forward.'};
    case 'remove_exercise_permanent':
      return {verb:'Remove exercise', scope:'Permanent · '+inp.day, detail:'Remove '+inp.exercise+' from '+inp.day+', every session going forward.'};
    case 'swap_exercise_permanent':
      return {verb:'Swap exercise', scope:'Permanent · '+inp.day, detail:'Replace '+inp.from+' with '+inp.to+' on '+inp.day+', keeping its slot. '+inp.from+'\u2019s history stays saved.'};
    case 'set_today_workout':
      return {verb:'Set today\u2019s workout', scope:'Today only · '+inp.day, detail:'For today\u2019s '+inp.day+' session only: '+(inp.exercises||[]).join(', ')+'. Your saved split is untouched.'};
    case 'adjust_fuel':{
      const parts=[]; if(inp.calories!=null) parts.push('calories \u2192 '+inp.calories); if(inp.protein!=null) parts.push('protein \u2192 '+inp.protein+'g');
      return {verb:'Adjust fuel targets', scope:'Nutrition', detail:'Set '+(parts.join(' and ')||'(no change)')+'.'};
    }
    case 'start_deload':
      return {verb:'Start deload week', scope:'Recovery', detail:'Begin a 7-day deload \u2014 ~60% loads, light sets, excluded from progression and trend charts.'};
    case 'remember_note':
      return {verb:'Remember this', scope:'Coach memory \u00b7 '+(inp.tag||'general'), detail:'\u201c'+inp.note+'\u201d \u2014 saved permanently and included in every future coach conversation. You can delete it any time from the memory card.'};
    default:
      return {verb:name, scope:'', detail:JSON.stringify(inp)};
  }
}

/* Validate an action against current state; return {ok, error}. */
function coachValidateAction(name, inp){
  const dayOk = d => !!S.split[d];
  if(['add_exercise_permanent','remove_exercise_permanent','swap_exercise_permanent','set_today_workout'].includes(name)){
    if(!dayOk(inp.day)) return {ok:false, error:'No day "'+inp.day+'" exists in your split.'};
  }
  if(name==='remove_exercise_permanent' || name==='swap_exercise_permanent'){
    const key = name==='swap_exercise_permanent' ? inp.from : inp.exercise;
    const exists = (S.split[inp.day].exercises||[]).some(x=>exName(x).toLowerCase()===String(key).toLowerCase());
    if(!exists) return {ok:false, error:key+' isn\u2019t currently on '+inp.day+'.'};
  }
  if(name==='set_today_workout' && (!Array.isArray(inp.exercises) || !inp.exercises.length)){
    return {ok:false, error:'No exercises given for the today-only plan.'};
  }
  if(name==='adjust_fuel' && inp.calories==null && inp.protein==null){
    return {ok:false, error:'No calorie or protein value given.'};
  }
  if(name==='remember_note'){
    if(!inp.note || !String(inp.note).trim()) return {ok:false, error:'Empty note.'};
    const dupe = coachMem().some(m=>m.note.toLowerCase()===String(inp.note).trim().toLowerCase());
    if(dupe) return {ok:false, error:'Already remembered \u2014 that note is saved.'};
  }
  return {ok:true};
}

/* Execute a validated action against S. Returns a short confirmation string. */
function coachExecuteAction(name, inp){
  if(name==='add_exercise_permanent'){
    const item = {name:inp.exercise, inc:incFor(inp.exercise)};
    const arr = S.split[inp.day].exercises = S.split[inp.day].exercises||[];
    if(inp.position==='start') arr.unshift(item); else arr.push(item);
    save(); setAccent();
    return inp.exercise+' added to '+inp.day+'.';
  }
  if(name==='remove_exercise_permanent'){
    const arr = S.split[inp.day].exercises||[];
    S.split[inp.day].exercises = arr.filter(x=>exName(x).toLowerCase()!==inp.exercise.toLowerCase());
    save(); setAccent();
    return inp.exercise+' removed from '+inp.day+'.';
  }
  if(name==='swap_exercise_permanent'){
    const arr = S.split[inp.day].exercises||[];
    const i = arr.findIndex(x=>exName(x).toLowerCase()===inp.from.toLowerCase());
    if(i>=0) arr[i] = {name:inp.to, inc:incFor(inp.to)};
    save(); setAccent();
    return inp.from+' \u2192 '+inp.to+' on '+inp.day+'.';
  }
  if(name==='set_today_workout'){
    S.coachDayPlan = {date:todayKey(), day:inp.day, exercises:inp.exercises.slice()};
    // if the schedule's today isn't already this day, also set an overrideDay so LIVE opens to it
    if(currentDayKey()!==inp.day) S.overrideDay = {date:todayKey(), day:inp.day};
    save(); setAccent();
    return 'Today\u2019s '+inp.day+' is set to your custom plan.';
  }
  if(name==='adjust_fuel'){
    S.fuel = S.fuel||{};
    if(inp.calories!=null) S.fuel.calTarget = Math.round(inp.calories);
    if(inp.protein!=null) S.fuel.proTarget = Math.round(inp.protein);
    save();
    return 'Fuel targets updated.';
  }
  if(name==='start_deload'){
    startDeloadWeek();
    return 'Deload week started.';
  }
  if(name==='remember_note'){
    const rec = coachMemAdd(inp.note, inp.tag);
    return rec ? 'Saved to coach memory.' : 'Nothing to save.';
  }
  return 'Done.';
}

/* ---- tool-enabled Claude call: returns {text, actions:[{id,name,input}]} ---- */
async function callClaudeWithTools(messages, system, tools, maxTokens, opts){
  const body = aiBody(messages, system, maxTokens||1200, opts);
  if(tools && tools.length) body.tools = tools;
  const res = await fetch(AI_ENDPOINT,{method:'POST',headers:aiHeaders(),body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error('API '+res.status+': '+t.slice(0,200)); }
  const data = await res.json();
  // Filtering by type already drops Sonnet 5's thinking blocks: they are not answer text,
  // and this filter predates them, so nothing here needed to change for the model swap.
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const actions = (data.content||[]).filter(b=>b.type==='tool_use').map(b=>({id:b.id, name:b.name, input:b.input||{}}));
  return {text, actions};
}

/* ============================================================
   READ-ONLY DATA TOOLS
   The agents' context used to be a fixed dump: the last 12 sessions, 10 weigh-ins, 7
   nutrition days and 5 check-ins. Everything older was invisible, which is why they could
   give confident answers that did not match his actual history -- ask DELTA about a lift he
   trains every 9 days and it was reasoning from two data points.
   Rather than paste seven months of everything into every call (expensive, and most of it
   irrelevant to any one question), the agents can now ASK for what they need.

   These tools READ. There is no write tool here and there must never be one: state changes
   go through the proposal queue and agApplyFix(), which is the only place a proposal may
   touch state. That boundary is the whole safety model of the agent layer.
   ============================================================ */
const AI_TOOL_ROUNDS = 6;        // hard ceiling on tool round-trips per call, so a confused
                                 // model cannot loop up an unbounded bill unattended at 9 PM
const AI_TOOL_MAXCHARS = 6000;   // per-result cap, so one greedy query cannot flood context

function agDataToolDefs(){
  return [
    {name:'list_lifts', description:'Every exercise he actually trains (split slots plus anything logged), with how many sessions each has and when it was last trained. Call this before any tool that takes an exercise name.',
      input_schema:{type:'object', properties:{}}},
    {name:'get_lift_history', description:'Every logged session for one exercise, newest first: date, weights, reps and effort tags. Use this instead of inferring from the recent-sessions summary, which only covers the last 12 sessions overall.',
      input_schema:{type:'object', properties:{
        exercise:{type:'string', description:'Exact exercise name. Call list_lifts first if unsure.'},
        limit:{type:'number', description:'How many sessions back, newest first. Default 30.'}
      }, required:['exercise']}},
    {name:'get_e1rm_series', description:'Estimated 1RM over time for one exercise, oldest first. The right tool for "is this lift actually progressing".',
      input_schema:{type:'object', properties:{
        exercise:{type:'string', description:'Exact exercise name'}
      }, required:['exercise']}},
    {name:'get_bodyweight', description:'Bodyweight history as weekly averages (the same smoothed series every other surface uses), plus the current measured rate in lb/week and which lean-bulk band that falls in.',
      input_schema:{type:'object', properties:{
        weeks:{type:'number', description:'How many weekly averages, oldest first. Default 16.'}
      }}},
    {name:'get_nutrition', description:'Logged daily calories and protein, with the average over the window.',
      input_schema:{type:'object', properties:{
        days:{type:'number', description:'How many days back. Default 30.'}
      }}},
    {name:'get_readiness', description:'Readiness check-ins: sleep hours, soreness, energy, stress, motivation and the resulting tier.',
      input_schema:{type:'object', properties:{
        days:{type:'number', description:'How many days back. Default 30.'}
      }}},
    {name:'get_weekly_volume', description:'Hard sets per muscle group for a completed week. Use for volume-balance questions rather than counting sets by hand.',
      input_schema:{type:'object', properties:{
        weeksAgo:{type:'number', description:'0 = last completed week, 1 = the week before, and so on. Default 0.'}
      }}}
  ];
}

/* Execute one read-only data tool. Always returns a string, never writes, never throws. */
function agRunDataTool(name, inp){
  const p = inp || {};
  try{
    if(name==='list_lifts'){
      const names = agTrainedExNames();
      if(!names.length) return 'No exercises on record yet.';
      return names.map(function(nm){
        const h = historyFor(nm);
        return nm+' - '+h.length+' session'+(h.length===1?'':'s')+(h.length?', last '+h[0].date:', never logged');
      }).join('\n');
    }
    if(name==='get_lift_history'){
      const nm = agResolveExName(p.exercise);
      if(!nm) return 'No exercise called "'+String(p.exercise).slice(0,60)+'". Call list_lifts for the real names.';
      const lim = Math.max(1, Math.min(200, Math.round(+p.limit||30)));
      const h = historyFor(nm).slice(0, lim);
      if(!h.length) return nm+' has never been logged.';
      return nm+' - '+h.length+' session'+(h.length===1?'':'s')+' (newest first):'+'\n'+
        h.map(function(sn){ return '  '+sn.date+': '+summ(sn.sets); }).join('\n')+
        '\n'+'Effort tags: e=easy, g=grind, x=failed.';
    }
    if(name==='get_e1rm_series'){
      const nm = agResolveExName(p.exercise);
      if(!nm) return 'No exercise called "'+String(p.exercise).slice(0,60)+'". Call list_lifts for the real names.';
      const pts = e1rmSeries(nm);
      if(!pts.length) return nm+' has no sessions to estimate from.';
      return nm+' estimated 1RM (oldest first):'+'\n'+
        pts.map(function(x){ return '  '+x.date+': '+Math.round(x.v)+' lb'; }).join('\n');
    }
    if(name==='get_bodyweight'){
      const n = Math.max(2, Math.min(104, Math.round(+p.weeks||16)));
      const sm = bodyweightSeriesSmoothed().slice(-n);
      if(!sm.length) return 'No bodyweight logged yet.';
      const br = bulkRate(4);
      return 'Weekly-average bodyweight (oldest first):'+'\n'+
        sm.map(function(x){ return '  week ending '+x.date+': '+x.v+' lb'; }).join('\n')+'\n'+
        (br ? 'Measured rate over the last '+br.weeks+' weeks: '+(br.rate>=0?'+':'')+br.rate.toFixed(2)+
              ' lb/week ('+bulkBand(br.rate)+' relative to the 0.5-1 lb/week lean-bulk pocket).'
            : 'Not enough weeks yet to state a rate.');
    }
    if(name==='get_nutrition'){
      const n = Math.max(1, Math.min(365, Math.round(+p.days||30)));
      const cut = mesoAddDays(todayKey(), -n);
      const rows = S.nutrition.filter(function(x){ return x.date >= cut; })
                              .sort(function(a,b){ return a.date.localeCompare(b.date); });
      if(!rows.length) return 'No intake logged in that window.';
      const avgC = Math.round(rows.reduce(function(t,x){ return t+(+x.cals||0); },0)/rows.length);
      const avgP = Math.round(rows.reduce(function(t,x){ return t+(+x.protein||0); },0)/rows.length);
      return rows.length+' days logged. Average '+avgC+' cal / '+avgP+'g protein.'+'\n'+
        rows.map(function(x){ return '  '+x.date+': '+x.cals+' cal, '+x.protein+'g'; }).join('\n');
    }
    if(name==='get_readiness'){
      const n = Math.max(1, Math.min(365, Math.round(+p.days||30)));
      const cut = mesoAddDays(todayKey(), -n);
      const rows = S.readiness.filter(function(x){ return x.date >= cut; })
                              .sort(function(a,b){ return b.date.localeCompare(a.date); });
      if(!rows.length) return 'No readiness check-ins in that window.';
      return rows.map(function(r){
        return '  '+r.date+': '+r.tier+' ('+r.sleep+'h sleep, '+r.sore+' soreness, '+r.energy+' energy'+
               (r.stress?', '+r.stress+' stress':'')+(r.motiv?', '+r.motiv+' motivation':'')+')';
      }).join('\n');
    }
    if(name==='get_weekly_volume'){
      const back = Math.max(0, Math.min(52, Math.round(+p.weeksAgo||0)));
      const r = lastCompletedWeekRange();
      const start = mesoAddDays(r.start, -7*back), end = mesoAddDays(r.end, -7*back);
      const vol = weeklyVolumeByGroup(start, end);
      const keys = Object.keys(vol);
      if(!keys.length) return 'No volume recorded for that week.';
      return 'Hard sets per muscle group, '+start+' to '+end+':'+'\n'+
        keys.map(function(g){ return '  '+g+': '+vol[g]; }).join('\n');
    }
    return 'Unknown tool: '+name;
  }catch(e){
    // A tool that throws must not take the whole cycle down with it -- hand the model the
    // error and let it carry on with what it already has.
    return 'That lookup failed: '+(e && e.message ? e.message : 'unknown error');
  }
}

/* One raw request. Returns the parsed response so callers can see stop_reason and the full
   content array, which the two wrappers above deliberately discard. */
async function aiRequest(messages, system, tools, maxTokens, opts){
  const body = aiBody(messages, system, maxTokens, opts);
  if(tools && tools.length) body.tools = tools;
  const res = await fetch(AI_ENDPOINT,{method:'POST',headers:aiHeaders(),body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error('API '+res.status+': '+t.slice(0,200)); }
  return await res.json();
}

/* Agentic loop over the READ-ONLY data tools. Bounded by AI_TOOL_ROUNDS, because without a
   ceiling a model that keeps asking questions is an open-ended bill and this runs unattended.
   onTool, if given, is called with each tool name so callers can log what was consulted. */
async function callClaudeWithData(messages, system, maxTokens, opts, onTool){
  const msgs = messages.slice();
  const tools = agDataToolDefs();
  // Mid-workout DELTA passes a smaller cap: every round is another few seconds standing
  // at the rack, and one lookup then an answer is the right shape there.
  const rounds = Math.max(1, Math.min(AI_TOOL_ROUNDS, (opts && opts.maxRounds) || AI_TOOL_ROUNDS));
  let used = 0;
  const textOf = function(content){
    return (content||[]).filter(function(b){ return b.type==='text'; })
                        .map(function(b){ return b.text; }).join('\n');
  };
  for(let round=0; round<rounds; round++){
    const data = await aiRequest(msgs, system, tools, maxTokens, opts);
    const content = data.content || [];
    const calls = content.filter(function(b){ return b.type==='tool_use'; });
    if(!calls.length) return {text:textOf(content), toolsUsed:used};
    // Echo the assistant turn back verbatim, thinking blocks included -- they are part of
    // that turn and dropping them corrupts the conversation on the next request.
    msgs.push({role:'assistant', content:content});
    msgs.push({role:'user', content: calls.map(function(c){
      used++;
      if(onTool){ try{ onTool(c.name, c.input||{}); }catch(e){} }
      let out = agRunDataTool(c.name, c.input||{});
      if(out.length > AI_TOOL_MAXCHARS) out = out.slice(0, AI_TOOL_MAXCHARS)+'\n'+'... (truncated)';
      return {type:'tool_result', tool_use_id:c.id, content:out};
    })});
  }
  // Ceiling hit. Ask once more with no tools at all, so it has to answer from what it has
  // rather than returning nothing after all that work.
  const finalData = await aiRequest(msgs, system, null, maxTokens, opts);
  return {text:textOf(finalData.content), toolsUsed:used};
}

/* ---- proposal lifecycle: proposals live on the chat message they came with ---- */
function coachStageProposals(actions){
  // returns array of proposal objects with validation state
  return actions.map(a=>{
    const v = coachValidateAction(a.name, a.input);
    return {id:'p_'+Math.random().toString(36).slice(2,9), name:a.name, input:a.input,
      desc:coachDescribeAction(a.name, a.input), valid:v.ok, error:v.error||null, status:'pending'};
  });
}
function coachFindProposal(pid){
  for(const m of S.chat){ if(m.proposals){ const p=m.proposals.find(x=>x.id===pid); if(p) return {msg:m, p}; } }
  return null;
}
function coachApplyProposal(pid){
  const found = coachFindProposal(pid); if(!found) return;
  const {p} = found;
  if(!p.valid || p.status!=='pending') return;
  // re-validate at apply time (state may have changed since proposed)
  const v = coachValidateAction(p.name, p.input);
  if(!v.ok){ p.status='failed'; p.error=v.error; save(); renderCoach(); return; }
  try{
    const conf = coachExecuteAction(p.name, p.input);
    p.status='applied'; p.confirm=conf;
  }catch(e){ p.status='failed'; p.error=e.message; }
  save(); renderCoach();
  // reflect downstream UI that may have changed
  try{ if(typeof renderSettings==='function' && document.getElementById('settings')) renderSettings(); }catch(e){}
  try{ invUpdateBadge(); }catch(e){}
}
function coachDismissProposal(pid){
  const found = coachFindProposal(pid); if(!found) return;
  if(found.p.status==='pending'){ found.p.status='dismissed'; save(); renderCoach(); }
}

/* ---- proposal card renderer (in-chat) ---- */
function coachProposalHTML(p){
  const statusRow = {
    applied:'<div class="cprop-done"><span>\u2713</span>'+esc(p.confirm||'Applied')+'</div>',
    dismissed:'<div class="cprop-dismissed">Dismissed</div>',
    failed:'<div class="cprop-failed"><span>\u2717</span>'+esc(p.error||'Could not apply')+'</div>'
  }[p.status];
  let h = '<div class="cprop '+(p.status!=='pending'?'done':'')+'">';
  h += '<div class="cprop-top"><span class="cprop-verb">'+esc(p.desc.verb)+'</span>'+
       (p.desc.scope?'<span class="cprop-scope">'+esc(p.desc.scope)+'</span>':'')+'</div>';
  h += '<div class="cprop-detail">'+esc(p.desc.detail)+'</div>';
  if(p.status==='pending'){
    if(p.valid){
      h += '<div class="cprop-acts">'+
        '<button class="btn sm" onclick="coachApplyProposal(\''+p.id+'\')">Apply</button>'+
        '<button class="btn ghost sm" onclick="coachDismissProposal(\''+p.id+'\')">Dismiss</button></div>';
    } else {
      h += '<div class="cprop-failed"><span>\u2717</span>'+esc(p.error||'Invalid')+'</div>';
    }
  } else {
    h += statusRow||'';
  }
  h += '</div>';
  return h;
}


/* ============================================================
   PERIODIZATION — mesocycle planning
   Template -> materialized week calendar -> phase-aware behavior.
   ============================================================ */
const MESO_TYPES = {
  hyp:    {label:'Hypertrophy',   repLo:8, repHi:12, rpeLo:7, rpeHi:8, accent:'var(--cyan)',   dim:'var(--cyan-dim)',   minW:2, maxW:12, defW:8},
  str:    {label:'Strength',      repLo:3, repHi:5,  rpeLo:8, rpeHi:9, accent:'var(--amber)',  dim:'var(--amber-dim)',  minW:1, maxW:6,  defW:3},
  deload: {label:'Deload',        repLo:8, repHi:12, rpeLo:5, rpeHi:6, accent:'var(--violet)', dim:'var(--violet-dim)', minW:1, maxW:2,  defW:1},
  rest:   {label:'Rest / Travel', repLo:0, repHi:0,  rpeLo:0, rpeHi:0, accent:'var(--dim)',    dim:'var(--line2)',      minW:1, maxW:4,  defW:1},
  custom: {label:'Custom',        repLo:6, repHi:10, rpeLo:7, rpeHi:8, accent:'var(--cyan)',   dim:'var(--cyan-dim)',   minW:1, maxW:12, defW:4}
};
const MESO_TYPE_ORDER = ['hyp','str','deload','rest','custom'];

function mesoState(){
  if(!S.meso) S.meso = {template:null, active:null};
  if(!S.meso.active) S.meso.active = null;
  if(S.meso.active && !S.meso.active.splits) S.meso.active.splits = {};
  return S.meso;
}
function mesoUid(){ return 'b'+Math.random().toString(36).slice(2,9); }
function mesoDefaultTemplate(){
  return {phases:[
    {id:mesoUid(), type:'hyp',    name:'Hypertrophy', weeks:8, repLo:8, repHi:12, rpeLo:7, rpeHi:8},
    {id:mesoUid(), type:'str',    name:'Strength',    weeks:3, repLo:3, repHi:5,  rpeLo:8, rpeHi:9},
    {id:mesoUid(), type:'deload', name:'Deload',      weeks:1, repLo:8, repHi:12, rpeLo:5, rpeHi:6}
  ], repeat:true, cycles:2};
}

/* ---- date helpers (Monday-anchored weeks) ---- */
function mesoMondayOf(key){
  const d = new Date(key+'T00:00:00');
  const dow = d.getDay();               // 0=Sun .. 6=Sat
  d.setDate(d.getDate() + (dow===0 ? -6 : 1-dow));
  return dateKeyOf(d);
}
function mesoAddDays(key, n){
  const d = new Date(key+'T00:00:00'); d.setDate(d.getDate()+n); return dateKeyOf(d);
}

/* ---- materialization: expand a template into explicit week objects ---- */
/* ---- materialization ----
   A phase is measured in WEEKS or in DAYS. Hypertrophy is naturally weekly -- seven weeks of
   the same thing -- and stays one segment per week so week numbering, the deload-week
   concept and every existing reader behave exactly as before. Strength and deload are not
   weekly at all: an S1-S3 rotation is three days, then a rest day, then three deload days,
   then reset, and forcing that onto a 7-day grid meant the plan on screen never matched the
   plan being run.

   Every segment keeps the same shape either way (type, name, blockId, rep/rpe range, n,
   startKey, endKey, blockWeek, blockLen), which is what lets the seventeen callers of
   mesoCurrentWeek() carry on untouched -- they read fields, not lengths. `days` is the only
   new field, and it defaults to 7 so a plan saved before this change materializes
   identically. */
function mesoPhaseUnit(ph){ return (ph && ph.unit === 'days') ? 'days' : 'weeks'; }
function mesoPhaseLen(ph){
  return mesoPhaseUnit(ph) === 'days'
    ? Math.max(1, Math.min(60, Math.round(ph.days || 3)))
    : Math.max(1, Math.min(52, Math.round(ph.weeks || 1)));
}
function mesoMaterialize(tpl, startKey){
  const segs = [];
  const cycles = tpl.repeat ? Math.max(1, Math.min(6, tpl.cycles||2)) : 1;
  for(let c=0; c<cycles; c++){
    (tpl.phases||[]).forEach(ph=>{
      const blockId = mesoUid();
      const len = mesoPhaseLen(ph);
      const base = {type:ph.type, name:ph.name, blockId,
        repLo:ph.repLo, repHi:ph.repHi, rpeLo:ph.rpeLo, rpeHi:ph.rpeHi, cycle:c+1};
      if(mesoPhaseUnit(ph) === 'days'){
        // ONE segment covering the whole run of days, not one per day: a 3-day strength
        // block is a single block of training, not three separate blocks.
        segs.push(Object.assign({}, base, {days:len}));
      } else {
        for(let w=0; w<len; w++) segs.push(Object.assign({}, base, {days:7}));
      }
    });
  }
  return mesoResequence(segs, startKey);
}
/* Recompute numbering, dates and block position. Safe to call after any edit. */
function mesoResequence(weeks, startKey){
  const counts = {}; weeks.forEach(w=>{ counts[w.blockId]=(counts[w.blockId]||0)+1; });
  const seen = {};
  let off = 0;   // running day offset: segments are no longer all the same length
  weeks.forEach((w,i)=>{
    const len = Math.max(1, Math.round(w.days || 7));
    w.days = len;
    w.n = i+1;
    w.startKey = mesoAddDays(startKey, off);
    w.endKey   = mesoAddDays(startKey, off + len - 1);
    off += len;
    seen[w.blockId] = (seen[w.blockId]||0)+1;
    w.blockWeek = seen[w.blockId];
    w.blockLen  = counts[w.blockId];
  });
  return weeks;
}
/* Days from today until a segment starts. mesoWeeksUntil() used to subtract segment indices,
   which was the same thing only while every segment was exactly a week long. */
function mesoDaysUntil(w){
  if(!w) return null;
  return Math.round((new Date(w.startKey+'T00:00:00') - new Date(todayKey()+'T00:00:00'))/86400000);
}

/* ---- lifecycle ---- */
function mesoStart(tpl, startKey){
  const st = mesoState();
  const start = mesoMondayOf(startKey || todayKey());
  st.template = JSON.parse(JSON.stringify(tpl));
  st.active = {startedAt:todayKey(), startKey:start, weeks:mesoMaterialize(tpl, start), splits:{}};
  save();
  return st.active;
}
function mesoStop(){ const st=mesoState(); st.active=null; save(); }

/* ---- queries ---- */
function mesoActive(){ return mesoState().active; }
function mesoWeekAt(key){
  const a = mesoState().active; if(!a) return null;
  return a.weeks.find(w=>key>=w.startKey && key<=w.endKey) || null;
}
function mesoCurrentWeek(){ return mesoWeekAt(todayKey()); }
function mesoNextDeload(){
  const a = mesoState().active; if(!a) return null;
  const t = todayKey();
  return a.weeks.find(w=>w.type==='deload' && w.endKey>=t) || null;
}
function mesoWeeksUntil(w){
  if(!w) return null;
  const cur = mesoCurrentWeek();
  if(!cur) return null;
  // Segment index differences stopped meaning "weeks" the moment segments could be 3 days
  // long. Measure real elapsed time and convert.
  const d = mesoDaysUntil(w);
  return d === null ? null : Math.round(d/7);
}

/* ---- the split that is actually in force right now ----
   During an approved strength block, the generated split takes over.
   Everything else falls through to the permanent S.split. */
function mesoApprovedSplitFor(w){
  const a = mesoState().active;
  if(!a || !w || w.type!=='str') return null;
  const rec = (a.splits||{})[w.blockId];
  return (rec && rec.status==='approved' && rec.split) ? rec.split : null;
}
function mesoActiveSplit(){ return mesoApprovedSplitFor(mesoCurrentWeek()); }
function activeSplitObj(){
  const ms = (typeof mesoActiveSplit==='function') ? mesoActiveSplit() : null;
  if(ms) return ms;
  return S.split;
}
/* blockId of the meso strength block actually in force today, or null. */
function mesoActiveStrBlockId(){
  const w = mesoCurrentWeek();
  return mesoApprovedSplitFor(w) ? w.blockId : null;
}
/* The one place that writes a rep-mode flag into a meso block's split — mesoEdToggleRepMode()
   (Ops-tab overlay) goes through here rather than reaching into a.splits itself. */
function mesoSplitToggleRepMode(blockId, dk, i){
  const a = mesoState().active; const rec = a && (a.splits||{})[blockId]; if(!rec) return false;
  const list = rec.split[dk].exercises || (rec.split[dk].exercises = []);
  if(typeof list[i] !== 'object') list[i] = {name:list[i], inc:incFor(list[i])};
  const x = list[i];
  x.repMode = (x.repMode==='str') ? null : 'str';
  save();
  return true;
}

/* ---- block-scoped rotation ----
   A strength block runs its own repeating rotation (3 on / 2 off by default) anchored to
   the block's first day, NOT to the calendar week. A 5-day rotation can't be expressed as
   a weekday map, and it must not leak outside the block — so this is resolved ahead of the
   normal dow/cycle path and returns null the moment the block isn't in force, at which
   point your permanent schedule takes over again with nothing to undo.
   Gated on approval, exactly like the split itself: an unapproved block changes nothing. */
const MESO_DEFAULT_ROTATION = ['S1','S2','S3','REST','REST'];
function mesoBlockFirstWeek(blockId){
  const a = mesoState().active; if(!a) return null;
  return a.weeks.find(w=>w.blockId===blockId) || null;
}
function mesoRotationFor(w){
  const a = mesoState().active;
  if(!a || !w || w.type!=='str') return null;
  const rec = (a.splits||{})[w.blockId];
  if(!rec || rec.status!=='approved') return null;
  const pat = (rec.rotation && rec.rotation.length) ? rec.rotation : MESO_DEFAULT_ROTATION;
  return {pat, first:mesoBlockFirstWeek(w.blockId)};
}
function mesoRotationDayFor(dateKey){
  const r = mesoRotationFor(mesoWeekAt(dateKey));
  if(!r || !r.first) return null;
  const len = r.pat.length || 1;
  const i = ((daysBetween(r.first.startKey, dateKey) % len) + len) % len;
  return r.pat[i] || 'REST';
}
/* Day n of the rotation for a date, 1-based — display only. */
function mesoRotationPos(dateKey){
  const r = mesoRotationFor(mesoWeekAt(dateKey));
  if(!r || !r.first) return null;
  const len = r.pat.length || 1;
  return {n: ((daysBetween(r.first.startKey, dateKey) % len) + len) % len + 1, len};
}

/* ---- strength-block split auto-generation ----
   Consolidates heavy compounds, trims accessory volume to make room for intensity,
   and reports what it cut and why. Proposal only — nothing applies without approval. */
function mesoIsCompound(nm){
  const n = String(nm).toLowerCase();
  if(/curl|pushdown|extension|fly|lateral|raise|rear delt|crunch|abdominal|pec deck|shrug/.test(n)) return false;
  return /bench|squat|deadlift|trap bar|overhead press|ohp|press|dip|row|pulldown|pull-up|pullup|chin|hip thrust|lunge|hack/.test(n);
}
function mesoLiftScore(nm){
  let score = mesoIsCompound(nm) ? 100 : 0;
  const pts = e1rmSeries(nm);
  if(pts.length >= 3){
    score += Math.min(pts.length, 12);                      // data confidence
    const reg = linreg(pts.slice(-6));
    if(reg) score += Math.max(-20, Math.min(20, reg.slope*7*10)); // trend
    score += Math.min(30, pts[pts.length-1].v/10);          // absolute load contribution
  }
  return score;
}
/* Movement pattern, used to keep consecutive rotation days from loading the same pattern
   heavy. Ordered so the more specific tests win: "hack squat" is a squat, not a hinge. */
function mesoPattern(nm){
  const n = ' '+String(nm).toLowerCase()+' ';
  if(/squat|leg press|hack|lunge|split squat|bulgarian|step.?up|leg extension/.test(n)) return 'squat';
  if(/deadlift|romanian|\brdl\b|stiff.?leg|good ?morning|rack pull|hip thrust|leg curl|back extension|hyperextension/.test(n)) return 'hinge';
  // "chin" unanchored matches inside "maCHINe" — every machine press read as a pull.
  // Anchor it (and every other short token) or the anchors come out scrambled.
  if(/row|pulldown|pull-?ups?|chin-?ups?|face pull|pullover|shrug|rear delt/.test(n)) return 'pull';
  if(/bench|chest press|incline|decline|overhead press|shoulder press|military|\bohp\b|\bdips?\b|push.?up|jm press|floor press|landmine|arnold|press/.test(n)) return 'push';
  return null;
}
/* The three days a strength block collapses to. One heavy anchor pattern each, so a
   3-on/2-off run never stacks two heavy days of the same pattern back to back \u2014 the
   whole reason the rotation is safe to run three days consecutively.
   `hex` is the day's colour *data* (same field the permanent split uses); token
   references resolve wherever dayColor() lands, so no raw hex enters the UI. */
const MESO_STR_DAYS = [
  {key:'S1', name:'Squat',        hex:'var(--amber)',  anchor:'squat'},
  {key:'S2', name:'Press',        hex:'var(--cyan)',   anchor:'push'},
  {key:'S3', name:'Hinge + Pull', hex:'var(--violet)', anchor:'hinge'}
];
const MESO_STR_PER_DAY = 5;   // 2 heavy compounds + 3 accessories

function mesoGenerateStrengthSplit(){
  const src = S.split;
  const rationale = [];
  // Pool every lift across the whole permanent split, de-duplicated, best-scoring first.
  // Day-by-day trimming can't work here: six days have to become three, so selection has
  // to see the entire roster at once.
  const seenNm = {}; const pool = [];
  Object.keys(src).forEach(dk=>(src[dk].exercises||[]).forEach(x=>{
    const nm = exName(x);
    if(!nm || seenNm[nm]) return;
    seenNm[nm] = true;
    pool.push({x, nm, sc:mesoLiftScore(nm), comp:mesoIsCompound(nm), pat:mesoPattern(nm)});
  }));
  pool.sort((a,b)=>b.sc-a.sc);

  const used = {};
  const take = pred => {
    const f = pool.find(s=>!used[s.nm] && pred(s));
    if(f) used[f.nm] = true;
    return f || null;
  };
  const picks = {}; MESO_STR_DAYS.forEach(d=>picks[d.key] = []);

  // 1. anchors \u2014 one movement pattern per day
  MESO_STR_DAYS.forEach(d=>{
    const a = take(s=>s.comp && s.pat===d.anchor) || take(s=>s.comp);
    if(!a) return;
    picks[d.key].push(a);
    rationale.push(d.key+' ('+d.name+'): '+a.nm+' anchors the day'+
      (a.pat===d.anchor ? ' \u2014 best '+d.anchor+' pattern by load and recent trend.'
                        : ' \u2014 no '+d.anchor+' compound in your split, so the next-best compound took the slot.'));
  });
  // 2. one secondary compound per day. The anchors already guarantee the *heaviest* lift
  //    differs each day; the secondary has to respect the same rule or it re-introduces
  //    the collision through the back door (a heavy incline press the day before heavy
  //    bench). It may not share a pattern with this day's anchor or with an ADJACENT
  //    training day's anchor — adjacency is linear, since two rest days separate the last
  //    day from the next first day.
  //    Pull is deliberately exempt. Squat/hinge/push are the three anchors, so barring
  //    pull too would leave the secondaries with only each other's anchors to choose from
  //    — you'd get heavy squat AND heavy hinge in one session, which is far worse for a
  //    spine than two heavy pulling days in a row. Pulling recovers fast and competes with
  //    nothing here, which is exactly why it's the right secondary on all three days.
  MESO_STR_DAYS.forEach((d,i)=>{
    const banned = [d.anchor];
    if(i>0) banned.push(MESO_STR_DAYS[i-1].anchor);
    if(i<MESO_STR_DAYS.length-1) banned.push(MESO_STR_DAYS[i+1].anchor);
    const allowed = s => s.pat==='pull' || banned.indexOf(s.pat)<0;
    let sec = take(s=>s.comp && s.pat && allowed(s));
    if(!sec) sec = take(s=>s.comp && s.pat!==d.anchor) || take(s=>s.comp);
    if(sec) picks[d.key].push(sec);
  });
  // 3. accessories dealt to whichever day covers that muscle least, so the three days
  //    end up complementary rather than three copies of the same shopping list
  const dayCov = {}; MESO_STR_DAYS.forEach(d=>{
    dayCov[d.key] = {};
    picks[d.key].forEach(s=>(musclesFor(s.nm).p||[]).forEach(g=>dayCov[d.key][g] = (dayCov[d.key][g]||0)+1));
  });
  pool.filter(s=>!used[s.nm] && !s.comp).forEach(s=>{
    const open = MESO_STR_DAYS.filter(d=>picks[d.key].length < MESO_STR_PER_DAY);
    if(!open.length) return;
    const prim = (musclesFor(s.nm).p||[])[0] || '';
    open.sort((a,b)=> (dayCov[a.key][prim]||0)-(dayCov[b.key][prim]||0) || picks[a.key].length-picks[b.key].length);
    const d = open[0];
    picks[d.key].push(s); used[s.nm] = true;
    (musclesFor(s.nm).p||[]).forEach(g=>dayCov[d.key][g] = (dayCov[d.key][g]||0)+1);
  });
  // 4. top up any short day with the best remaining lift of any kind
  MESO_STR_DAYS.forEach(d=>{
    while(picks[d.key].length < MESO_STR_PER_DAY){
      const f = take(()=>true);
      if(!f) break;
      picks[d.key].push(f);
    }
  });

  const out = {};
  MESO_STR_DAYS.forEach(d=>{
    out[d.key] = {name:d.name, hex:d.hex, exercises: picks[d.key].map((s, idx)=>{
      const o = (typeof s.x==='object') ? JSON.parse(JSON.stringify(s.x)) : {name:s.nm, inc:incFor(s.nm)};
      // only the first two exercises (anchor + secondary) run 3-6, even if the secondary is a compound
      // accessories use the global rep range, so strip any per-exercise override
      if(idx < 2 && s.comp) o.repMode = 'str';
      else delete o.repMode;
      return o;
    })};
    const heavy = picks[d.key].slice(0, 2).filter(s=>s.comp).map(s=>s.nm);
    if(heavy.length>1) rationale.push(d.key+': '+heavy.join(' + ')+' run heavy; the rest is accessory work at your normal rep range.');
  });
  const cut = pool.filter(s=>!used[s.nm]).map(s=>s.nm);
  if(cut.length) rationale.push('Cut for the block: '+cut.join(', ')+' \u2014 six days of accessories don\u2019t fit in three, and intensity is the point here.');

  // coverage sanity check against the permanent split
  const cov = {}; MUSCLE_GROUPS.forEach(g=>cov[g]=0);
  Object.values(out).forEach(d=>(d.exercises||[]).forEach(x=>{
    const m = musclesFor(exName(x));
    m.p.forEach(g=>{ if(cov[g]!=null) cov[g]++; });
    m.s.forEach(g=>{ if(cov[g]!=null) cov[g]+=0.5; });
  }));
  const covBefore = {}; MUSCLE_GROUPS.forEach(g=>covBefore[g]=0);
  Object.values(src).forEach(d=>(d.exercises||[]).forEach(x=>{
    const m = musclesFor(exName(x));
    m.p.forEach(g=>{ if(covBefore[g]!=null) covBefore[g]++; });
    m.s.forEach(g=>{ if(covBefore[g]!=null) covBefore[g]+=0.5; });
  }));
  const dropped = MUSCLE_GROUPS.filter(g=>g!=='Abs' && covBefore[g]>0 && cov[g]===0);
  return {split:out, rationale, dropped};
}

/* ---- proposal lifecycle per strength block ---- */
function mesoProposeSplit(blockId){
  const a = mesoState().active; if(!a) return null;
  const gen = mesoGenerateStrengthSplit();
  a.splits[blockId] = {status:'proposed', split:gen.split, rotation:MESO_DEFAULT_ROTATION.slice(),
                       rationale:gen.rationale, dropped:gen.dropped, generatedAt:todayKey()};
  save();
  return a.splits[blockId];
}
function mesoApproveSplit(blockId){
  const a = mesoState().active; if(!a || !a.splits[blockId]) return;
  a.splits[blockId].status = 'approved';
  a.splits[blockId].approvedAt = todayKey();
  save(); renderMeso(); afterScheduleChange();
}
/* Approving or dropping a block split changes which day today resolves to, not just which
   exercises it holds — the header, accent, and Today tab are all stale until they repaint. */
function afterScheduleChange(){
  try{ setAccent(); renderHeader(); }catch(e){}
  try{ if(typeof renderToday==='function') renderToday(); }catch(e){}
  try{ if(typeof renderLive==='function') renderLive(); }catch(e){}
}
function mesoRegenerateSplit(blockId){
  mesoProposeSplit(blockId); renderMeso();
}
function mesoUnapproveSplit(blockId){
  const a = mesoState().active; if(!a || !a.splits[blockId]) return;
  a.splits[blockId].status = 'proposed';
  save(); renderMeso(); afterScheduleChange();
}
/* Ensure every strength block in the calendar has a proposal ready to review. */
function mesoEnsureProposals(){
  const a = mesoState().active; if(!a) return;
  const seen = {};
  a.weeks.forEach(w=>{
    if(w.type==='str' && !seen[w.blockId]){
      seen[w.blockId] = true;
      if(!a.splits[w.blockId]) mesoProposeSplit(w.blockId);
    }
  });
}

/* ---- context handed to Coach so its advice matches the phase ---- */
function mesoCoachContext(){
  const w = (typeof mesoCurrentWeek==='function') ? mesoCurrentWeek() : null;
  if(!w) return 'PERIODIZATION: no active mesocycle \u2014 training is unstructured/day-to-day.\n\n';
  const nd = mesoNextDeload(); const ndIn = mesoWeeksUntil(nd);
  let s = 'PERIODIZATION: week '+w.n+' of the plan \u2014 '+w.name+' block (week '+w.blockWeek+' of '+w.blockLen+').\n';
  if(w.repLo>0) s += '- Phase rep target: '+w.repLo+'\u2013'+w.repHi+(w.rpeLo>0?', RPE '+w.rpeLo+'\u2013'+w.rpeHi:'')+'.\n';
  if(w.type==='hyp')    s += '- Goal this block is volume and size. e1RM holding flat here is normal and NOT a problem.\n';
  if(w.type==='str')    s += '- Goal this block is absolute strength. e1RM should climb; accessories are intentionally trimmed.\n';
  if(w.type==='deload') s += '- Deload week: loads ~60%, well shy of failure. Do not push intensity.\n';
  if(w.type==='rest')   s += '- Rest/travel week: nothing scheduled. Do not prescribe training.\n';
  if(nd && ndIn!=null) s += '- Next deload: '+(ndIn===0?'this week':'in '+ndIn+' week'+(ndIn===1?'':'s'))+'.\n';
  const ms = (typeof mesoActiveSplit==='function') ? mesoActiveSplit() : null;
  if(ms) s += '- A generated strength split is ACTIVE this block (differs from the permanent split).\n';
  return s+'\n';
}

/* ================= PERIODIZATION UI ================= */
let _mesoDraft = null;
function mesoDraft(){
  if(!_mesoDraft){
    const t = mesoState().template;
    _mesoDraft = t ? JSON.parse(JSON.stringify(t)) : mesoDefaultTemplate();
  }
  return _mesoDraft;
}
function mesoDraftReset(){ _mesoDraft = null; renderMeso(); }
function mesoTotalDays(tpl){
  const cy = tpl.repeat ? Math.max(1, Math.min(6, tpl.cycles||2)) : 1;
  return (tpl.phases||[]).reduce(function(t,p){
    return t + (mesoPhaseUnit(p)==='days' ? mesoPhaseLen(p) : mesoPhaseLen(p)*7);
  }, 0) * cy;
}
/* Kept in weeks because that is how the summary line reads, but derived from the real day
   count now -- summing phase.weeks ignored day-mode phases entirely and under-reported the
   plan length by however long they were. */
function mesoTotalWeeks(tpl){
  return Math.round(mesoTotalDays(tpl)/7);
}

  h += '<div class="meso-phases">';
  (t.phases||[]).forEach((p,i)=>{ h += mesoPhaseRowHTML(p,i); });
  h += '</div>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+
       '<button class="btn sm" onclick="mesoAddPhase()">+ Add phase</button>'+
       '<button class="btn sm ghost" onclick="mesoDraftReset()">Reset to default</button></div>';
  h += '</div>';

  h += '<div class="card"><div class="k">Repeat</div>'+
    '<label class="meso-check"><input type="checkbox" id="mesoRepeat" '+(t.repeat?'checked':'')+' onchange="mesoSetRepeat(this.checked)"> Repeat this pattern</label>';

    h += '<div class="field" style="margin-top:10px;max-width:160px"><label>How many cycles</label>'+

  }

  h += '</div>';

  h += '<div class="card"><div class="k">Start</div>'+
    '<p class="small" style="margin-bottom:10px">Weeks run Monday\u2013Sunday. Starting today anchors week 1 to this week\u2019s Monday ('+fmtDate(mesoMondayOf(todayKey()))+').</p>'+
    '<div class="field" style="max-width:220px;margin-bottom:12px"><label>First week begins</label>'+
    '<input type="date" id="mesoStartDate" value="'+todayKey()+'"></div>'+

}

  h += '<div class="meso-prow-top">'+
       '<select onchange="mesoSetPhaseType('+i+',this.value)">'+
         MESO_TYPE_ORDER.map(k=>'<option value="'+k+'"'+(k===p.type?' selected':'')+'>'+MESO_TYPES[k].label+'</option>').join('')+
       '</select>'+
       '<input class="meso-name" value="'+esc(p.name)+'" onchange="mesoSetPhaseField('+i+',\'name\',this.value)" placeholder="Phase name">'+
       '<button class="meso-x" onclick="mesoRemovePhase('+i+')" title="Remove phase">&times;</button>'+
       '</div>';
  h += '<div class="meso-prow-grid">'+
       '<div class="field"><label>Length</label><div class="meso-pair">'+
         '<input type="number" min="1" max="'+(mesoPhaseUnit(p)==='days'?60:ty.maxW)+'" value="'+mesoPhaseLen(p)+'" '+
           'onchange="mesoSetPhaseLen('+i+',this.value)">'+
         '<select onchange="mesoSetPhaseUnit('+i+',this.value)" style="width:auto">'+
           '<option value="weeks"'+(mesoPhaseUnit(p)==='weeks'?' selected':'')+'>weeks</option>'+
           '<option value="days"'+(mesoPhaseUnit(p)==='days'?' selected':'')+'>days</option>'+
         '</select></div></div>'+
       '<div class="field"><label>Reps</label><div class="meso-pair"><input type="number" min="1" max="30" value="'+p.repLo+'" onchange="mesoSetPhaseNum('+i+',\'repLo\',this.value,0,30)"><span>\u2013</span><input type="number" min="1" max="30" value="'+p.repHi+'" onchange="mesoSetPhaseNum('+i+',\'repHi\',this.value,0,30)"></div></div>'+
       '<div class="field"><label>RPE</label><div class="meso-pair"><input type="number" min="0" max="10" step="0.5" value="'+p.rpeLo+'" onchange="mesoSetPhaseNum('+i+',\'rpeLo\',this.value,0,10)"><span>\u2013</span><input type="number" min="0" max="10" step="0.5" value="'+p.rpeHi+'" onchange="mesoSetPhaseNum('+i+',\'rpeHi\',this.value,0,10)"></div></div>'+
       '</div>';
  if(mesoPhaseUnit(p)==='days') h += '<p class="small" style="margin-top:6px;color:var(--dim)">Measured in days, so this block runs '+mesoPhaseLen(p)+' day'+(mesoPhaseLen(p)===1?'':'s')+' and then hands over \u2014 it does not get rounded up to a whole week.</p>';
  if(p.type==='rest') h += '<p class="small" style="margin-top:6px;color:var(--dim)">Rest carries no rep target \u2014 nothing is scheduled and nothing counts toward progression.</p>';
  if(p.type==='deload') h += '<p class="small" style="margin-top:6px;color:var(--violet)">Deload weeks auto-lighten loads to ~60% and are excluded from progression and trend charts.</p>';
  h += '</div>';
  return h;
}
/* builder mutations */
function mesoAddPhase(){
  const t = mesoDraft();
  const ty = MESO_TYPES.hyp;
  t.phases.push({id:mesoUid(), type:'hyp', name:ty.label, weeks:ty.defW, repLo:ty.repLo, repHi:ty.repHi, rpeLo:ty.rpeLo, rpeHi:ty.rpeHi});
  renderMeso();
}
function mesoSetPhaseLen(i, v){
  const p = mesoDraft().phases[i]; if(!p) return;
  const unit = mesoPhaseUnit(p);
  const max = unit==='days' ? 60 : 52;
  const n = Math.max(1, Math.min(max, Math.round(+v||1)));
  if(unit==='days') p.days = n; else p.weeks = n;
  renderMeso();
}
function mesoSetPhaseUnit(i, u){
  const p = mesoDraft().phases[i]; if(!p) return;
  const wasLen = mesoPhaseLen(p);
  p.unit = (u==='days') ? 'days' : 'weeks';
  // Carry the number across rather than resetting it: switching a 3-week block to days
  // almost always means "3 weeks was wrong", not "start again from 1". Clamped to the new
  // unit's range so a 12-week phase does not become an illegal 12-day one.
  if(p.unit==='days') p.days = Math.max(1, Math.min(60, wasLen));
  else                p.weeks = Math.max(1, Math.min(52, wasLen));
  renderMeso();
}
function mesoRemovePhase(i){
  const t = mesoDraft();
  if(t.phases.length<=1){ alert('A plan needs at least one phase.'); return; }
  t.phases.splice(i,1); renderMeso();
}
function mesoSetPhaseType(i, type){
  const t = mesoDraft(); const p = t.phases[i]; const ty = MESO_TYPES[type];
  p.type = type; p.name = ty.label;
  p.repLo = ty.repLo; p.repHi = ty.repHi; p.rpeLo = ty.rpeLo; p.rpeHi = ty.rpeHi;
  // Only re-clamp the unit actually in use. Writing p.weeks on a days-mode phase left the
  // number on screen unchanged while silently resetting the field the plan is built from.
  if(mesoPhaseUnit(p)==='days') p.days = Math.max(1, Math.min(60, p.days||3));
  else p.weeks = Math.max(ty.minW, Math.min(ty.maxW, p.weeks||ty.defW));
  renderMeso();
}
function mesoSetPhaseField(i, k, v){ mesoDraft().phases[i][k] = v; }
function mesoSetPhaseNum(i, k, v, lo, hi){
  const n = Math.max(lo, Math.min(hi, Math.round(+v||0)));
  mesoDraft().phases[i][k] = n; renderMeso();
}
function mesoSetRepeat(on){ mesoDraft().repeat = !!on; renderMeso(); }
function mesoSetCycles(v){ mesoDraft().cycles = Math.max(1, Math.min(6, Math.round(+v||1))); renderMeso(); }
function mesoStartFromBuilder(){
  const t = mesoDraft();
  if(!t.phases || !t.phases.length){ alert('Add at least one phase first.'); return; }
  const el = document.getElementById('mesoStartDate');
  const sd = (el && el.value) ? el.value : todayKey();
  mesoStart(t, sd);
  mesoEnsureProposals();
  _mesoDraft = null;
  renderMeso(); invUpdateBadge();
  try{ if(typeof renderLive==='function') renderLive(); }catch(e){}
}

  const a = mesoActive(); const w = mesoCurrentWeek();
  if(!w){
    const first = a.weeks[0], last = a.weeks[a.weeks.length-1];
    const done = todayKey() > last.endKey;

        ? 'This mesocycle ran '+fmtDate(first.startKey)+' \u2013 '+fmtDate(last.endKey)+'. Build a new one below or stop the plan to clear it.'
        : 'Week 1 begins '+fmtDate(first.startKey)+'. Your normal split runs until then.')+'</p></div>';
  }
  const ty = MESO_TYPES[w.type] || MESO_TYPES.custom;
  const pct = Math.round(100*w.blockWeek/w.blockLen);
  const nd = mesoNextDeload(); const ndIn = mesoWeeksUntil(nd);
  let h = '<div class="card meso-now" style="border-left:3px solid '+ty.accent+'">';
  h += '<div class="meso-now-top"><span class="pill" style="border-color:'+ty.accent+';color:'+ty.accent+'">Week '+w.n+' \u00b7 Now</span>'+
       '<span class="meso-now-name" style="color:'+ty.accent+'">'+esc(w.name)+'</span></div>';
  h += '<div class="meso-now-sub">'+fmtDate(w.startKey)+' \u2013 '+fmtDate(w.endKey)+'</div>';
  h += '<div class="meso-bar"><div class="meso-bar-fill" style="width:'+pct+'%;background:'+ty.accent+'"></div></div>';
  h += '<div class="meso-now-meta">Week '+w.blockWeek+' of '+w.blockLen+' in this block'+
       (w.repLo>0 ? ' \u00b7 '+w.repLo+'\u2013'+w.repHi+' reps' : ' \u00b7 no rep target')+
       (w.rpeLo>0 ? ' \u00b7 RPE '+w.rpeLo+'\u2013'+w.rpeHi : '')+'</div>';
  if(nd && ndIn!=null){
    h += '<div class="meso-now-meta" style="color:var(--violet)">'+
      (ndIn===0 ? 'Deload is this week.' : 'Next deload in '+ndIn+' week'+(ndIn===1?'':'s')+' ('+fmtDate(nd.startKey)+').')+'</div>';
  }
  if(w.type==='str'){
    const rec = (a.splits||{})[w.blockId];
    if(rec && rec.status==='approved'){
      h += '<div class="meso-now-meta" style="color:var(--cyan)">\u2713 Strength split active for this block.</div>';
      const pos = mesoRotationPos(todayKey());
      const dk  = currentDayKey();
      if(pos) h += '<div class="meso-now-meta">Rotation day '+pos.n+' of '+pos.len+' \u2014 today is '+

/* ============================================================
   AUTO-UPDATE — polls the deployed file for a new build marker.
   No service worker: no second file, no extra cache layer to
   confuse cache-vs-code debugging, no stale-worker failure mode.
   ============================================================ */
const UPD_INTERVAL_MS = 15*60*1000;
let _updRemote = null;      // build id found on the server
let _updDismissed = null;   // build id the user dismissed this session
let _updChecking = false;
let _updLastCheck = 0;

function appBuild(){
  const m = document.querySelector('meta[name="ironhub-build"]');
  return m ? m.content : 'dev';
}
function appURL(){ return location.href.split('#')[0].split('?')[0]; }

/* Returns: 'update' | 'current' | 'offline' | 'unknown' */
async function checkForUpdate(manual){
  if(_updChecking) return 'unknown';
  if(typeof navigator!=='undefined' && navigator.onLine===false){
    if(manual) setUpdMsg('You\u2019re offline \u2014 can\u2019t check right now.', true);
    return 'offline';
  }
  _updChecking = true;
  try{
    // cache:'reload' bypasses the HTTP cache for this request AND refreshes it,
    // so a later location.reload() picks up the new file rather than the stale one.
    const res = await fetch(appURL(), {cache:'reload'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const txt = await res.text();
    const m = txt.match(/<meta name="ironhub-build" content="([^"]+)">/);
    if(!m){
      // not our file (captive portal, error page, proxy) — never act on it
      if(manual) setUpdMsg('Couldn\u2019t read a version from the server \u2014 skipped.', true);
      return 'unknown';
    }
    _updLastCheck = Date.now();
    if(m[1] === appBuild()){
      _updRemote = null; hideUpdateBar();
      if(manual) setUpdMsg('\u2713 You\u2019re on the latest build ('+appBuild()+').');
      return 'current';
    }
    _updRemote = m[1];
    if(_updDismissed !== m[1]) showUpdateBar();
    if(manual) setUpdMsg('\u2713 Update found: '+m[1]+'.');
    return 'update';
  }catch(e){
    if(manual) setUpdMsg('Check failed: '+e.message, true);
    return 'offline';
  }finally{ _updChecking = false; }
}
function showUpdateBar(){
  const el = document.getElementById('updBar'); if(!el) return;
  const t = el.querySelector('.upd-txt');
  if(t) t.textContent = liveSessionRunning()
    ? 'New version ready \u2014 reload after your session'
    : 'New version available';
  el.classList.add('show');
}
function hideUpdateBar(){
  const el = document.getElementById('updBar'); if(el) el.classList.remove('show');
}
function dismissUpdate(){
  _updDismissed = _updRemote; hideUpdateBar();
}
function liveSessionRunning(){
  try{ return !!(typeof live!=='undefined' && live && live.exercises && live.exercises.length); }
  catch(e){ return false; }
}
async function applyUpdate(){
  if(liveSessionRunning()){
    if(!confirm('You have a workout session in progress. Your sets are saved and will be restored after reloading \u2014 reload now?')) return;
  }
  try{ await fetch(appURL(), {cache:'reload'}); }catch(e){}
  location.reload();
}
function setUpdMsg(t, err){
  const el = document.getElementById('updMsg');
  if(el){ el.textContent = t; el.className = err ? 'err' : 'small ok'; }
}
function startUpdateWatcher(){
  setTimeout(()=>checkForUpdate(false), 5000);          // shortly after load
  setInterval(()=>checkForUpdate(false), UPD_INTERVAL_MS);
  document.addEventListener('visibilitychange', ()=>{   // and whenever you come back to it
    if(document.visibilityState==='visible' && Date.now()-_updLastCheck > 60000) checkForUpdate(false);
  });
  window.addEventListener('online', ()=>checkForUpdate(false));
}


/* ============================================================
   ANALYTICS — deep-dive engines. All honest-data: every view
   degrades gracefully when history is thin, nothing is invented.
   ============================================================ */
function anEffMult(e){ return e==='easy' ? 0.85 : e==='grind' ? 1.25 : e==='fail' ? 1.45 : 1; }
function anWeekStart(key){ return mesoMondayOf(key); }
function anLastWeeks(n, includeCurrent){
  const cur = anWeekStart(todayKey());
  const out = [];
  for(let i=(includeCurrent?0:1); out.length<n; i++) out.push(mesoAddDays(cur, -7*i));
  return out.reverse();   // oldest first
}
function anBigLifts(minSessions){
  const counts = {};
  S.logs.forEach(l=>{ if(l.deload) return; l.entries.forEach(e=>{ counts[e.exercise]=(counts[e.exercise]||0)+1; }); });
  return Object.keys(counts).filter(k=>counts[k]>=(minSessions||6)).sort((a,b)=>counts[b]-counts[a]);
}
function anR2(pts, reg){
  if(!reg || pts.length<3) return 0;
  const x0 = reg.x0;
  const my = pts.reduce((a,p)=>a+p.v,0)/pts.length;
  let ssRes=0, ssTot=0;
  pts.forEach(p=>{
    const x=(new Date(p.date).getTime()-x0)/86400000;
    const yhat = reg.intercept + reg.slope*x;
    ssRes += (p.v-yhat)**2; ssTot += (p.v-my)**2;
  });
  return ssTot===0 ? 0 : Math.max(0, 1 - ssRes/ssTot);
}
function anSpark(pts, w, h, color, opts){
  opts = opts||{};
  if(!pts || pts.length<2) return '<div class="small" style="color:var(--dim)">not enough points to chart</div>';
  const vs = pts.map(p=>p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if(hi===lo){ hi+=1; lo-=1; }
  const pad = (hi-lo)*0.12; lo-=pad; hi+=pad;
  const px = i => (i/(pts.length-1))*(w-8)+4;
  const py = v => h-6 - ((v-lo)/(hi-lo))*(h-12);
  const path = pts.map((p,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(p.v).toFixed(1)).join(' ');
  let extra = '';
  if(opts.band){ // reference band [lo,hi] in value space
    const y1=py(opts.band[1]), y2=py(opts.band[0]);
    extra += '<rect x="0" y="'+y1.toFixed(1)+'" width="'+w+'" height="'+(y2-y1).toFixed(1)+'" fill="'+(opts.bandColor||'rgba(70,205,186,.08)')+'"/>';
  }
  const last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">'+extra+
    '<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+px(pts.length-1).toFixed(1)+'" cy="'+py(last.v).toFixed(1)+'" r="3" fill="'+color+'"/></svg>';
}
function anBarRow(label, pct, valTxt, color){
  const p = Math.max(0, Math.min(100, pct));
  return '<div class="an-brow"><div class="an-brow-top"><span>'+esc(label)+'</span><span class="mono">'+valTxt+'</span></div>'+
    '<div class="an-bar"><div style="width:'+p.toFixed(1)+'%;background:'+color+'"></div></div></div>';
}
function anEmpty(msg){
  return '<div class="card"><p class="small" style="color:var(--dim)">'+msg+'</p></div>';
}

/* ---------------- FATIGUE MODEL ----------------
   Strain = hard sets weighted by effort tags (the honest proxy that works
   across lifts of very different absolute load). Deload sets count half.
   Fatigue ratio = last-7-days strain vs the trailing 28-day weekly average. */
function anStrainBetween(a, b){
  let s = 0;
  S.logs.filter(l=>l.date>=a && l.date<=b).forEach(l=>{
    const mult = l.deload ? 0.5 : 1;
    l.entries.forEach(e=>e.sets.forEach(st=>{ s += anEffMult(st.e)*mult; }));
  });
  return s;
}
function anStrainByWeek(n){
  return anLastWeeks(n, true).map(ws=>({date:ws, v:anStrainBetween(ws, mesoAddDays(ws,6))}));
}
function fatigueIndex(){
  const acute = anStrainBetween(mesoAddDays(todayKey(),-6), todayKey());
  const chronic = anStrainBetween(mesoAddDays(todayKey(),-33), mesoAddDays(todayKey(),-6)) / 4; // prior 28d, weekly
  if(chronic < 4) return {ok:false, reason:'Needs about a month of logged training to establish your baseline.'};
  let ratio = acute/chronic;
  // readiness modifier: a run of low-readiness days makes the same load cost more
  const last7 = S.readiness.filter(r=>r.date>=mesoAddDays(todayKey(),-6));
  const lows = last7.filter(r=>r.tier==='low').length;
  if(lows>=2) ratio += 0.12;
  const status = ratio<0.75 ? 'fresh' : ratio<=1.25 ? 'productive' : ratio<=1.5 ? 'high' : 'overreached';
  return {ok:true, acute:Math.round(acute), chronic:Math.round(chronic*10)/10, ratio:Math.round(ratio*100)/100, status, lowDays:lows};
}
const FATIGUE_COLORS = {fresh:'var(--cyan)', productive:'var(--good)', high:'var(--amber)', overreached:'var(--red)'};
const FATIGUE_LABELS = {
  fresh:'Fresh — load is well below your recent norm. Fine after a deload; if unintentional, you have room to push.',
  productive:'Productive — training load sits in the sweet spot relative to what your body is adapted to.',
  high:'High — meaningfully above your recent norm. Sustainable briefly, but watch sleep and readiness.',
  overreached:'Overreached — well above your adapted load. If this holds another week, a deload is the smart move.'};
function fatigueSuggestsDeload(){
  const fi = fatigueIndex();
  if(!fi.ok || (fi.status!=='overreached' && !(fi.status==='high' && fi.lowDays>=2))) return null;
  if(deloadActive()) return null;
  const nd = (typeof mesoNextDeload==='function') ? mesoNextDeload() : null;
  if(nd && typeof mesoWeeksUntil==='function'){ const w = mesoWeeksUntil(nd); if(w!=null && w<=1) return null; } // one is already imminent
  const dis = S.fatigueDismissed;
  if(dis && dis > mesoAddDays(todayKey(),-10)) return null;
  return fi;
}
function fatigueDismiss(){ S.fatigueDismissed = todayKey(); save(false); renderLive(); try{ renderAnFatigue(); }catch(e){} }

   newest first, with the size of the jump. Written by checkPRs() at save time. */
let anPRPick = 'all';
function prHistorySorted(){
  return (S.prHistory||[]).slice().sort((a,b)=> b.date.localeCompare(a.date) || (b.e1rm-a.e1rm));
}
function anPRRow(p){

    '<div class="small mono" style="margin-top:3px;color:var(--muted)">'+esc(reps)+

}
function renderAnPRs(){
  const el = document.getElementById('an_strength'); if(!el) return;
  prBackfillOnce();
  const all = prHistorySorted();

    return;
  }
  const lifts = [...new Set(all.map(p=>p.exercise))].sort();
  if(anPRPick!=='all' && !lifts.includes(anPRPick)) anPRPick = 'all';

  let h = '<div class="card"><div class="k">PR history</div>'+

      ' across '+lifts.length+' lift'+(lifts.length===1?'':'s')+'. Most recent '+

      '; biggest single jump +'+(Math.round((biggest.gain||0)*10)/10)+' lb on '+esc(biggest.exercise)+'.</p>'+
    '<div class="field" style="max-width:280px"><label>Lift</label><select onchange="anPRPick=this.value;renderAnPRs()">'+
      '<option value="all"'+(anPRPick==='all'?' selected':'')+'>All lifts</option>'+
