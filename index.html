/* ================= GIST SYNC ================= */
const GIST_FILE = 'ironhub_data.json';
function syncReady(){ return !!(S.settings.ghToken && S.settings.gistId); }
function ghHeaders(){ return {'Authorization':'Bearer '+S.settings.ghToken, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}; }
let _lastPushExportedAt = 0;   // exportedAt stamp of the snapshot this device last uploaded
function syncPayload(){
  const d = JSON.parse(JSON.stringify(S));
  delete d.settings.ghToken; delete d.settings.gistId; delete d.settings.apiKey; // secrets never leave the device
  // WHOOP is cached locally so it survives an offline launch, but the Action owns that file
  // and this app is not a writer of it. Pushing our copy back would duplicate it in the sync
  // payload and let a stale local read outlive the fresh remote one.
  delete d.whoop;
  _lastPushExportedAt = Date.now();
  return JSON.stringify({app:'ironhub', v:1, exportedAt:_lastPushExportedAt, data:d});
}
function setSyncMsg(t, err){ const el = $('#syncMsg'); if(el){ el.textContent = t; el.className = err ? 'err' : 'small ok'; } }
function markSynced(){
  S.meta = S.meta || {changedAt:0,lastSync:0};
  S.meta.lastSync = Date.now();
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  const el = $('#hdrSync');
  if(el) el.textContent = '\u25cf synced '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
async function connectSync(){
  const tok = $('#ghToken').value.trim();
  if(!tok){ setSyncMsg('Paste a token first.', true); return; }
  S.settings.ghToken = tok; save(false);
  setSyncMsg('Connecting to GitHub\u2026');
  try{
    const res = await fetch('https://api.github.com/gists?per_page=100',{headers:ghHeaders()});
    if(!res.ok) throw new Error('GitHub error '+res.status+(res.status===401?' \u2014 token invalid or missing the gist scope':''));
    const gists = await res.json();
    const found = gists.find(g=>g.files && g.files[GIST_FILE]);
    if(found){
      S.settings.gistId = found.id; save(false);
      await syncPull(true);
      setSyncMsg('\u2713 Connected \u2014 found your existing sync gist and pulled its data.');
    } else {
      const c = await fetch('https://api.github.com/gists',{method:'POST',headers:ghHeaders(),
        body:JSON.stringify({description:'Iron Hub training data (auto-sync)', public:false, files:{[GIST_FILE]:{content:syncPayload()}}})});
      if(!c.ok) throw new Error('Could not create gist ('+c.status+')');
      const g = await c.json();
      S.settings.gistId = g.id; save(false);
      setSyncMsg('\u2713 Private sync gist created \u2014 this device pushed the first copy.');
    }
    markSynced(); renderSettings();
  }catch(e){ setSyncMsg(e.message, true); }
}
async function syncPush(manual){
  if(!syncReady()){ if(manual) setSyncMsg('Not connected \u2014 paste your token and hit Connect first.', true); return; }
  try{
    const res = await fetch('https://api.github.com/gists/'+S.settings.gistId,{method:'PATCH',headers:ghHeaders(),
      body:JSON.stringify({files:{[GIST_FILE]:{content:syncPayload()}}})});
    if(!res.ok) throw new Error('Push failed ('+res.status+')');
    // Adopt our own upload's exportedAt as the local freshness watermark. A payload always
    // stamps exportedAt AFTER the changedAt it carries, so without this the pull gate
    // (exportedAt > changedAt) reads our own push as "newer than us" and bgSyncTick
    // re-applies it a minute later — reverting anything written with save(false) since.
    // Math.max, not assignment: an edit made during the await must stay the newer side.
    S.meta = S.meta || {changedAt:0,lastSync:0,pushedAt:0};
    S.meta.changedAt = Math.max(S.meta.changedAt||0, _lastPushExportedAt);
    // Confirms everything up through this push is now on the gist. Boot checks this watermark
    // to catch up a push that never fired (see BOOT below) — without it, finishing a workout
    // and backgrounding the tab before the 2.5s debounce in schedulePush() completes silently
    // strands that session in localStorage forever, invisible to every other device.
    // Uses the same _lastPushExportedAt as changedAt above (not the older changedAt this
    // snapshot carried) so the two stay equal in the common case with nothing concurrently
    // edited during the await — if they diverge, that gap IS a genuine edit made while this
    // push was in flight, which really is still unpushed and must stay flagged as such.
    S.meta.pushedAt = Math.max(S.meta.pushedAt||0, _lastPushExportedAt);
    markSynced();
    if(manual) setSyncMsg('\u2713 Pushed to cloud at '+new Date().toLocaleTimeString());
  }catch(e){ if(manual) setSyncMsg(e.message, true); }
}
/* WHOOP lives in a SECOND file in the same gist, written by a scheduled GitHub Action.
   It has to arrive that way: WHOOP's API sends no CORS headers on either its OAuth token
   endpoint or its data endpoints, so a browser cannot read either response, and the token
   exchange needs a client_secret that could never live in a public repo's HTML. The Action
   holds the secret, does the fetching, and PATCHes only this file -- the app only ever writes
   ironhub_data.json, so the two writers never collide.
   Reading it costs nothing extra: it is already in the gist response the app fetches anyway. */
const WHOOP_FILE = 'whoop_data.json';
async function fetchGistData(){
  const res = await fetch('https://api.github.com/gists/'+S.settings.gistId,{headers:ghHeaders()});
  if(!res.ok) throw new Error('Pull failed ('+res.status+')');
  const g = await res.json();
  const f = g.files && g.files[GIST_FILE];
  if(!f) throw new Error('Sync file missing from gist.');
  let content = f.content;
  if(f.truncated) content = await (await fetch(f.raw_url)).text();
  const p = JSON.parse(content);
  if(p.app !== 'ironhub') throw new Error('Gist content not recognized as Iron Hub data.');
  // Best effort, always. A missing or malformed WHOOP file must never break a data sync --
  // it is a nice-to-have on top, and everything that reads it already falls back.
  try{
    const wf = g.files && g.files[WHOOP_FILE];
    if(wf && wf.content) applyWhoop(JSON.parse(wf.content));
  }catch(e){ /* absent, truncated or malformed -- the self-reported path still works */ }
  return p;
}
/* Validate before storing. This is third-party data arriving through a file anyone with the
   gist URL could in principle write to, so it gets the same treatment as model output: take
   the shapes we understand, ignore everything else, clamp what we take. */
function applyWhoop(raw){
  if(!raw || typeof raw !== 'object') return false;
  const out = {fetchedAt: typeof raw.fetchedAt === 'string' ? raw.fetchedAt : new Date().toISOString()};
  const num = function(v, lo, hi){
    const n = +v;
    return isFinite(n) ? Math.max(lo, Math.min(hi, n)) : null;
  };
  const dateOk = function(d){ return typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d); };
  if(raw.recovery && dateOk(raw.recovery.date)){
    const score = num(raw.recovery.score, 0, 100);
    if(score !== null){
      out.recovery = {date:raw.recovery.date, score:Math.round(score),
                      hrv: num(raw.recovery.hrv, 0, 400), rhr: num(raw.recovery.rhr, 20, 200)};
    }
  }
  if(raw.sleep && dateOk(raw.sleep.date)){
    out.sleep = {date:raw.sleep.date, hours: num(raw.sleep.hours, 0, 24),
                 performance: num(raw.sleep.performance, 0, 100)};
  }
  if(raw.strain && dateOk(raw.strain.date)){
    out.strain = {date:raw.strain.date, score: num(raw.strain.score, 0, 21)};
  }
  if(!out.recovery && !out.sleep && !out.strain) return false;
  S.whoop = out;
  // save(false): this came FROM the cloud, so it is not a local change and must not bump
  // changedAt -- doing so would make autoPullOnLoad() skip its pull and push stale local
  // state over the phone's newer data. Same reasoning as invRaise()/invArchive().
  save(false);
  return true;
}
/* Is the WHOOP data recent enough to act on? Deliberately strict: a recovery score from
   three days ago is worse than no score, because it looks current. */
function whoopFresh(){
  const w = S.whoop && S.whoop.recovery;
  return !!(w && w.date === todayKey() && typeof w.score === 'number');
}
async function syncPull(force){
  if(!syncReady()){ setSyncMsg('Not connected \u2014 paste your token and hit Connect first.', true); return; }
  try{
    const p = await fetchGistData();
    if(!force && S.meta && S.meta.changedAt > p.exportedAt){
      if(!confirm('This device has NEWER local changes than the cloud copy. Pull anyway and overwrite them?')) return;
    }
    applyPulled(p.data, p.exportedAt);
    markSynced();
    setSyncMsg('\u2713 Pulled cloud data at '+new Date().toLocaleTimeString());
    setAccent(); renderHeader(); renderToday(); renderSettings();
  }catch(e){ setSyncMsg(e.message, true); }
}
function applyPulled(d, exportedAt){
  const keep = {apiKey:S.settings.apiKey, ghToken:S.settings.ghToken, gistId:S.settings.gistId, autoSync:S.settings.autoSync};
  // A daily gate (agents.lastRun) is far more fragile to a wholesale overwrite than a weekly
  // one (invest.lastAuto): if the incoming snapshot predates today's local run \u2014 entirely
  // possible, since a pull can race a push that hasn't landed on the gist yet \u2014 blindly
  // taking it erases "already ran today" and the very next boot (PWA foreground reload) fires
  // agents all over again. Snapshot the local scheduler state before the swap and merge the
  // newer side back in, rather than re-running after the fact (which would just re-trigger).
  const localAgents = S.agents ? JSON.parse(JSON.stringify(S.agents)) : null;
  const localLastAuto = (S.invest && S.invest.lastAuto) ? JSON.parse(JSON.stringify(S.invest.lastAuto)) : null;
  S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), d);
  S.settings = Object.assign({}, DEFAULT_STATE.settings, d.settings||{}, keep);
  S.meta = S.meta || {changedAt:0,lastSync:0};
  S.meta.changedAt = d && d.meta ? (d.meta.changedAt||Date.now()) : Date.now();
  // Watermark against the snapshot we just consumed, not the writer's own changedAt.
  // The writer stamps exportedAt after its changedAt, so taking changedAt alone leaves
  // the pull gate (exportedAt > changedAt) permanently true against an UNCHANGED gist:
  // bgSyncTick then re-applies the identical snapshot every 60s, and each replay wipes
  // whatever was written with save(false) in between. That is what made a freshly raised
  // investigation flag vanish about a minute after it appeared. A genuinely newer push
  // from another device carries a larger exportedAt, so real updates still land.
  if(exportedAt) S.meta.changedAt = Math.max(S.meta.changedAt, exportedAt);
  // We just consumed this exact snapshot, so treat it as pushed too — otherwise the boot
  // catch-up push (see BOOT) fires needlessly on every pull, re-uploading what we only just downloaded.
  S.meta.pushedAt = S.meta.changedAt;
  if(localAgents){
    const a = agState();
    if((localAgents.lastRun||'') > (a.lastRun||'')) a.lastRun = localAgents.lastRun;
    if((localAgents.lastRunAt||'') > (a.lastRunAt||'')) a.lastRunAt = localAgents.lastRunAt;
    // union proposals/log by id so neither side's history is lost, newest first, de-duped
    const byId = (arr) => { const m={}; arr.forEach(x=>{ if(x && x.id) m[x.id]=x; }); return m; };
    const pMerged = Object.assign(byId(localAgents.proposals||[]), byId(a.proposals||[]));
    a.proposals = Object.values(pMerged).sort((x,y)=>(y.created||'').localeCompare(x.created||''));
    const lMerged = Object.assign(byId(localAgents.log||[]), byId(a.log||[]));
    a.log = Object.values(lMerged).sort((x,y)=>(y.at||'').localeCompare(x.at||'')).slice(0,120);
    // per-agent status: keep whichever side observed the more recent cycle
    Object.keys(localAgents.status||{}).forEach(k=>{
      const loc = localAgents.status[k];
      if(!a.status[k] || (loc.at||'') > (a.status[k].at||'')) a.status[k] = loc;
    });
  }
  if(localLastAuto){
    const iv = invState();
    Object.keys(localLastAuto).forEach(k=>{
      if((localLastAuto[k]||'') > (iv.lastAuto[k]||'')) iv.lastAuto[k] = localLastAuto[k];
    });
  }
  save(false);
  // A pull replaces S wholesale \u2014 S.invest included. Any banner already painted from the
  // pre-pull state is now advertising flags that no longer exist in state, and it would sit
  // there stale until some unrelated navigation click happened to call invUpdateBadge().
  // Repaint here so a state swap can never leave a ghost banner on screen.
  try{ invUpdateBadge(); }catch(e){}
}
let _pushTimer = null;
function schedulePush(){
  if(!syncReady() || S.settings.autoSync === false) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(()=>syncPush(false), 2500);
}
// A backgrounded/closed tab can lose the 2.5s debounce above entirely — iOS suspends or
// kills the page before the timer fires, which is exactly what happens when a workout is
// finished and the phone gets locked right after. Nothing previously retried that push (see
// the BOOT catch-up below for the other half of this fix). Flushing on hide gives the fetch a
// chance to land while the tab is still alive in the background, instead of a timer that may
// never get to run.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden' && _pushTimer){
    clearTimeout(_pushTimer); _pushTimer=null;
    syncPush(false);
  }
});
// Push any local edit that hasn't been confirmed on the gist yet, before this device does
// anything that could discard it. Two ways that matters:
//  - A debounced push (schedulePush(), 2.5s after save()) can be lost entirely if the tab was
//    backgrounded or killed before the timer fired — finishing a workout, then locking the
//    phone, is exactly that. Nothing else retries it, so call this at BOOT.
//  - Every pull (applyPulled() replaces S wholesale) too: a snapshot's exportedAt is stamped
//    at PUSH time, not edit time, so a stale-but-just-pushed snapshot from another device can
//    carry a fresher timestamp than this device's own older, unpushed, and more complete
//    local edit — a Push Now from a device that never had today's session, done after today's
//    session was logged elsewhere, outraces and silently overwrites it. Pushing local first
//    means that edit is safely on the gist before any incoming pull gets a chance to clobber
//    it. If this throws (e.g. offline), the caller's pull is skipped this tick rather than
//    risking a pull over data that was never confirmed safe.
async function pushUnconfirmedChanges(){
  if(syncReady() && S.settings.autoSync !== false && S.meta && (S.meta.changedAt||0) > (S.meta.pushedAt||0)){
    await syncPush(false);
  }
}
async function autoPullOnLoad(){
  if(!syncReady() || S.settings.autoSync === false) return;
  try{
    await pushUnconfirmedChanges();
    const p = await fetchGistData();
    if(p.exportedAt > (S.meta ? S.meta.changedAt : 0)){
      applyPulled(p.data, p.exportedAt);
      // BOOT ordering: invAutoRun() runs at line ~6678, this pull lands after it. Everything
      // that run produced against the pre-pull state \u2014 raised flags AND the lastAuto cooldown
      // stamp \u2014 was just discarded. Without re-running here the stamp never survives a load,
      // so the weekly lift check fires again on every single launch and re-raises the same
      // flags forever. Re-run against the real post-pull state; invDaysSince() will correctly
      // no-op if the pulled copy already has a recent stamp.
      try{ invAutoRun(); }catch(e){ console.warn('invAutoRun (post-pull) failed', e); }
      try{ if(MODE==='review' && activeMainTab==='ops') renderOps(); }catch(e){}
      setAccent(); renderHeader(); renderToday();
    }
    markSynced();
  }catch(e){ const el=$('#hdrSync'); if(el){ el.textContent='\u25cb sync offline'; } }
}
function disconnectSync(){
  if(!confirm('Disconnect cloud sync on this device? (The gist itself is not deleted \u2014 other devices keep working.)')) return;
  S.settings.ghToken=''; S.settings.gistId=''; save(false); renderSettings();
}

/* ================= BULK TAB ================= */

/* ---- Intake buckets ----
   Logging intake is a tap on a range, not four typed digits. Every range boundary and every
   verdict is derived from S.fuel.calTarget / proTarget, so moving the target in the Fuel tab
   moves the whole ladder with it. That was a real bug before: the per-day check-mark tested a
   hardcoded `cals>=3000 && protein>=130` and silently ignored the configured target, so the
   Bulk tab could call a day "below target" that the Fuel tab considered a hit.

   Calories carry four tiers (way under / under / on target / over) — overshooting a lean bulk
   is a genuine signal, not just an absence of a problem. Protein carries three: it has a floor,
   not a ceiling, so at-or-above target collapses into one good bucket. */
const NUT_TIER = {
  way:    {label:'way under', col:'var(--bad)'},
  slight: {label:'under',     col:'var(--warn)'},
  on:     {label:'on target', col:'var(--good)'},
  over:   {label:'over',      col:'var(--violet)'}
};
function calTarget(){ return (S.fuel && +S.fuel.calTarget) || 3000; }
function proTarget(){ return (S.fuel && +S.fuel.proTarget) || 150; }
/* Classify any intake value, not just a bucket midpoint — the history badges run arbitrary
   already-logged numbers through the same two functions the ladder colours itself with, so a
   pill and the row it produces can never disagree about what tier a day was. */
function nutTierCal(v, t){
  t = t || calTarget(); v = +v || 0;
  if(v < t-400) return 'way';
  if(v < t)     return 'slight';
  if(v < t+400) return 'on';
  return 'over';
}
function nutTierPro(v, t){
  t = t || proTarget(); v = +v || 0;
  if(v < t-40) return 'way';
  if(v < t-10) return 'slight';
  return 'on';
}
/* The tap ladder: an open bucket at each end, fixed-width buckets in between, aligned so the
   target itself is a bucket boundary. Stored value is the midpoint — a representative number
   that keeps get_nutrition averages, the weekly rollup and ECHO working unchanged. */
function nutBuckets(kind){
  const isCal = kind === 'cal';
  const t    = isCal ? calTarget() : proTarget();
  const step = isCal ? 200 : 10;
  const offs = isCal ? [-600,-400,-200,0,200] : [-50,-40,-30,-20,-10,0];
  const tier = isCal ? nutTierCal : nutTierPro;
  const lowEdge = t + offs[0];
  const hiEdge  = t + offs[offs.length-1] + step;
  const out = [{lo:null, hi:lowEdge, mid:lowEdge-step/2, label:'<'+lowEdge}];
  offs.forEach(o=>{ const lo = t+o; out.push({lo:lo, hi:lo+step, mid:lo+step/2, label:lo+'–'+(lo+step)}); });
  out.push({lo:hiEdge, hi:null, mid:hiEdge+step/2, label:hiEdge+'+'});
  out.forEach(b=>{ b.tier = tier(b.mid, t); });
  return out;
}
/* Module-scoped, not on the DOM node: rerenderActive() regenerates the whole active tab every
   30s and after every sync pull, so a half-made selection parked on the markup would vanish on
   a timer with nothing to blame it on. */
let nutPick = {cal:null, pro:null};
let nutExact = false;
function pickNut(btn, kind, mid){
  nutPick[kind] = mid;
  btn.parentElement.querySelectorAll('.nut-pill').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}
function toggleNutExact(){ nutExact = !nutExact; renderBulk(); }
function nutLadderHTML(kind, label){
  const sel = nutPick[kind];
  return '<div class="nut-grp"><span class="nut-gl">'+label+'</span><div class="nut-pills">'+
    nutBuckets(kind).map(b=>'<button class="nut-pill t-'+b.tier+(sel===b.mid?' sel':'')+'" '+
      'onclick="pickNut(this,\''+kind+'\','+b.mid+')">'+b.label+
      '<span class="nt">'+NUT_TIER[b.tier].label+'</span></button>').join('')+'</div></div>';
}
function nutBadge(tier){
  const t = NUT_TIER[tier];
  return '<span class="nut-badge" style="color:'+t.col+';border:1px solid '+t.col+'">'+
    (tier==='on' ? '✓' : t.label)+'</span>';
}
/* Last 7 days against target. The per-day rows answer "did I hit it today"; this answers the
   question that actually drives the scale, which is what the week averaged. */
function nutWeekCard(){
  const ct = calTarget(), pt = proTarget();
  const cutKey = dateKeyOf(new Date(Date.now()-6*86400000));
  const days = S.nutrition.filter(n=>n.date >= cutKey);
  if(!days.length) return '';
  const avgC = Math.round(days.reduce((s,n)=>s+(+n.cals||0),0)/days.length);
  const avgP = Math.round(days.reduce((s,n)=>s+(+n.protein||0),0)/days.length);
  const tc = nutTierCal(avgC, ct), tp = nutTierPro(avgP, pt);
  const hits = days.filter(n=>['on','over'].indexOf(nutTierCal(n.cals, ct))>=0 && nutTierPro(n.protein, pt)==='on').length;
  const cls = t => t==='on' ? 'good' : t==='slight' ? 'warn' : t==='way' ? 'bad' : '';
  let note = tc==='way'   ? 'Averaging <b>'+(ct-avgC)+' cal/day under</b> target — that is the surplus itself missing, not a rounding error. The scale will not move on this.'
           : tc==='slight'? 'Averaging '+(ct-avgC)+' cal/day under target. Small daily, but that is '+((ct-avgC)*7).toLocaleString()+' cal over the week.'
           : tc==='over'  ? 'Averaging '+(avgC-ct)+' cal/day over target — fine short-term, but watch the lb/wk rate above for fat gain.'
           : 'Calories are landing where they should.';
  note += ' ' + (tp==='way'   ? 'Protein is <b>'+(pt-avgP)+'g/day under</b> target — that is the part deciding how much of the gain is muscle.'
               : tp==='slight'? 'Protein is '+(pt-avgP)+'g/day under target.'
               : 'Protein is where it needs to be.');
  return '<h2>Intake — Last 7 Days</h2><div class="stats">'+
    '<div class="stat"><div class="v '+cls(tc)+'">'+avgC.toLocaleString()+'</div><div class="l">avg cal / day</div></div>'+
    '<div class="stat"><div class="v '+cls(tp)+'">'+avgP+'g</div><div class="l">avg protein / day</div></div>'+
    '<div class="stat"><div class="v">'+hits+'/'+days.length+'</div><div class="l">days on target</div></div>'+
    '<div class="stat"><div class="v">'+days.length+'/7</div><div class="l">days logged</div></div></div>'+
    '<div class="card"><p class="small">'+note+'</p></div>';
}

    '<div><label>Date</label><input type="date" id="nDate" value="'+todayKey()+'"></div>'+
    '<div style="flex:none;align-self:flex-end"><button class="btn sm ghost" onclick="toggleNutExact()">'+
      (nutExact?'Use ranges':'Enter exact')+'</button></div></div>';
  if(nutExact){
    html += '<div class="row" style="margin-top:10px">'+
      '<div><label>Calories</label><input inputmode="numeric" id="nCals" placeholder="'+ct+'"></div>'+
      '<div><label>Protein (g)</label><input inputmode="numeric" id="nProt" placeholder="'+pt+'"></div></div>';
  } else {
    html += nutLadderHTML('cal','Calories — target '+ct.toLocaleString())+
            nutLadderHTML('pro','Protein (g) — target '+pt);
  }
  html += '<div style="margin-top:11px"><button class="btn sm" onclick="addNutrition()">Log Intake</button> '+
    '<span class="small err" id="nMsg"></span></div></div>';
  html += nutWeekCard();
  html += bwProjectionCardHTML();
  const nut = [...S.nutrition].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
  if(nut.length){
    html += '<div class="card">'+nut.map(n=>'<div class="h-ex"><b>'+fmtDate(n.date)+'</b> — '+
      (n.est?'~':'')+n.cals+' cal'+nutBadge(nutTierCal(n.cals, ct))+' · '+
      (n.est?'~':'')+n.protein+'g protein'+nutBadge(nutTierPro(n.protein, pt))+'</div>').join('')+

  }

function addWeight(){
  const d=$('#wDate').value, v=parseFloat($('#wLbs').value);
  if(!d||!v) return;
  S.weights = S.weights.filter(w=>w.date!==d);
  S.weights.push({date:d, lbs:v}); save(); renderBulk();
}
function addNutrition(){
  const d = $('#nDate').value;
  const c = nutExact ? parseInt($('#nCals').value) : nutPick.cal;
  const p = nutExact ? parseInt($('#nProt').value) : nutPick.pro;
  const msg = $('#nMsg');
  if(!d || !c){
    if(msg) msg.textContent = nutExact ? 'Enter calories.' : 'Tap a calorie range.';
    return;
  }
  S.nutrition = S.nutrition.filter(n=>n.date!==d);
  const rec = {date:d, cals:c, protein:p||0};
  // Flags the stored number as a range midpoint rather than a measured total. Absent on every
  // row logged before the ladder existed, which is correct — those were typed exactly.
  if(!nutExact) rec.est = true;
  S.nutrition.push(rec);
  nutPick = {cal:null, pro:null};
  save(); renderBulk();
}



/* ================= WEAK-GROUP REINFORCEMENT (mini-audit) ================= */
function lastCompletedWeekRange(){
  // The training week that just ended, i.e. the one before the current weekStart.
  const curStart = weekStartKey();
  const winLen = scheduleMode()==='cycle' ? cyclePattern().length : 7;
  const end = new Date(curStart+'T00:00:00'); end.setDate(end.getDate()-1);
  const start = new Date(end); start.setDate(start.getDate()-(winLen-1));
  return {start:dateKeyOf(start), end:dateKeyOf(end), curStart};
}
function weeklyVolumeByGroup(startKey, endKey){
  const vol = {}; MUSCLE_GROUPS.forEach(g=>vol[g]=0);
  S.logs.filter(l=>l.date>=startKey && l.date<=endKey && !l.deload).forEach(l=>l.entries.forEach(e=>{
    const m = musclesFor(e.exercise); const n = e.sets.length;
    m.p.forEach(g=>{ if(vol[g]!=null) vol[g]+=n; });
    m.s.forEach(g=>{ if(vol[g]!=null) vol[g]+=n*0.5; });
  }));
  return vol;
}
/* An exercise is "main/compound" and therefore NOT swap-eligible if it's a PR lift
   or matches a primary compound pattern. Only accessories get swap proposals. */
function isSwapEligible(name){
  if(PR_LIFTS[name]) return false;
  const n = name.toLowerCase();
  // primary compounds — protected from swaps
  if(/barbell (bench|back squat|squat|row|overhead press|press)/.test(n)) return false;
  if(/^(bench press|back squat|deadlift|overhead press|dips?|leg press|romanian deadlift|rdl)$/.test(n)) return false;
  if(/leg press|hip thrust/.test(n)) return false; // big lower-body drivers
  return true;
}
/* Find accessory exercises whose e1RM hasn't improved in 4+ weeks of logged history. */
function staleExercises(){
  const STALE_WEEKS = 4;
  const out = [];
  const allNames = [...new Set(Object.values(S.split).flatMap(d=>(d.exercises||[]).map(exName)))];
  allNames.forEach(name=>{
    if(!isSwapEligible(name)) return;
    if(isBodyweight(name)) return; // rep-based, e1RM not meaningful
    const series = e1rmSeries(name); // [{date, v}] oldest->newest
    if(series.length < 3) return; // need a few sessions to judge
    const firstMs = new Date(series[0].date).getTime();
    const lastMs  = new Date(series[series.length-1].date).getTime();
    const spanWeeks = (lastMs - firstMs)/(7*86400000);
    if(spanWeeks < STALE_WEEKS) return; // not enough time elapsed to call it stale
    const cutMs = lastMs - STALE_WEEKS*7*86400000;
    const recent = series.filter(p=>new Date(p.date).getTime() >= cutMs);
    const older  = series.filter(p=>new Date(p.date).getTime() <  cutMs);
    if(!older.length || !recent.length) return;
    const bestRecent = Math.max(...recent.map(p=>p.v));
    const bestOlder  = Math.max(...older.map(p=>p.v));
    if(bestRecent <= bestOlder * 1.01){ // no meaningful (>1%) improvement
      let day = null;
      for(const dk in S.split){ if(dayExNames(dk).includes(name)){ day = dk; break; } }
      out.push({name, day, weeks:Math.round(spanWeeks), bestRecent:Math.round(bestRecent), bestOlder:Math.round(bestOlder)});
    }
  });
  return out.sort((a,b)=>b.weeks-a.weeks).slice(0,3);
}

    h += '<div style="margin-top:8px"><button class="btn ghost sm" onclick="dismissAllProposals()">Dismiss all</button></div></div>';
    return h;

}
async function maybeRunAudit(){
  const wk = weekStartKey();
  S.audit = S.audit || {weekStart:'', proposals:null, status:''};
  if(S.audit.weekStart === wk) return;          // already handled this week
  if(!S.settings.apiKey && !window._inClaude) return; // needs AI
  const {start, end} = lastCompletedWeekRange();
  const prevLogs = S.logs.filter(l=>l.date>=start && l.date<=end);
  const vol = weeklyVolumeByGroup(start, end);
  const weak = MUSCLE_GROUPS.filter(g=>g!=='Abs' && vol[g] < 10).sort((a,b)=>vol[a]-vol[b]);
  const stale = staleExercises();
  // nothing to do if no recent training AND nothing stale
  if(prevLogs.length < 2 && !stale.length){ S.audit = {weekStart:wk, proposals:[], status:'done'}; save(false); return; }
  const needVolume = prevLogs.length >= 2 && weak.length > 0;
  if(!needVolume && !stale.length){ S.audit = {weekStart:wk, proposals:[], status:'done'}; save(false); return; }
  try{
    const splitTxt = Object.keys(S.split).map(dk=>dk+' ('+S.split[dk].name+'): '+dayExNames(dk).join(', ')).join('\n');
    const volTxt = MUSCLE_GROUPS.map(g=>g+': '+Math.round(vol[g]*10)/10).join(', ');
    const staleTxt = stale.length ? stale.map(s=>s.name+' (on '+(s.day||'?')+', flat ~'+s.weeks+' wks at e1RM '+s.bestRecent+')').join('; ') : '(none)';
    const sys = 'You are a hypertrophy coach reviewing an 18-year-old lifter\u2019s 6-day split. Two jobs:\n'+
      '1) VOLUME: sets-per-muscle-per-week target ~10-20. For under-trained groups, propose adding one set to an existing exercise (type "add_set") or one new accessory (type "add_exercise").\n'+
      '2) STALENESS: for each STALE accessory listed, propose ONE swap (type "swap") to a different exercise hitting the SAME muscle/head from a new angle (e.g. cable lateral raise -> dumbbell lateral raise; pec deck -> cable fly). The swap should be a real, common gym exercise.\n'+
      'NEVER touch main barbell lifts or big compounds (bench, squat, rows, presses, leg press, hip thrust). Keep it minimal: at most 2 volume proposals and one swap per stale item (max 4 total). '+
      'For swaps, include "fromExercise" (the stale one) and "exercise" (the replacement). '+
      'Respond ONLY with valid JSON, no markdown: {"proposals":[{"type":"add_set|add_exercise|swap","group":"Side Delts","day":"D4","exercise":"...","fromExercise":"...","sets":1,"inc":5,"action":"short imperative","reason":"one short sentence"}]}';
    const prompt = 'WEEKLY VOLUME (sets, secondary=half): '+volTxt+'\n\nUNDER-TRAINED: '+(weak.length?weak.join(', '):'(none)')+
      '\n\nSTALE ACCESSORIES (no e1RM progress 4+ wks \u2014 propose a swap for each): '+staleTxt+
      '\n\nCURRENT SPLIT:\n'+splitTxt;
    const reply = await callClaude([{role:'user', content:prompt}], sys, 4000);
    const parsed = parseLooseJSON(reply);
    const props = (parsed.proposals||[]).slice(0,4).map(pr=>{
      const base = {
        type:pr.type||'add_set', group:pr.group||'', day:pr.day, exercise:pr.exercise,
        fromExercise:pr.fromExercise||null,
        sets:+pr.sets||1, inc:pr.inc!=null?+pr.inc:null,
        action:pr.action||'', reason:pr.reason||''
      };
      if(pr.type!=='swap'){
        base.lastSets = Math.round((vol[(MUSCLE_GROUPS.find(g=>g.toLowerCase()===String(pr.group).toLowerCase()))||pr.group]||0)*10)/10;
      }
      return base;
    }).filter(pr=>{
      // guard: never allow a swap or add that targets a protected compound
      if(pr.type==='swap' && pr.fromExercise && !isSwapEligible(pr.fromExercise)) return false;
      return true;
    });
    S.audit = {weekStart:wk, proposals:props, status: props.length?'':'done'};
    save(false);
  }catch(e){
    S.audit = {weekStart:wk, proposals:[], status:'done'}; save(false);
  }
}
function acceptProposal(i){
  const pr = S.audit.proposals[i]; if(!pr) return;
  if(pr.type==='swap' && pr.fromExercise && pr.exercise){
    // Replace the stale exercise in whichever day holds it, preserving its increment + form-focus flag.
    let done = false;
    for(const dk in S.split){
      const list = S.split[dk].exercises || [];
      for(let j=0;j<list.length;j++){
        if(exName(list[j])===pr.fromExercise){
          const prev = list[j];
          const carryInc = (typeof prev==='object' && prev.inc!=null) ? prev.inc : (pr.inc!=null?pr.inc:incFor(pr.exercise));
          const carryFF  = (typeof prev==='object' && prev.formFocus) ? true : false;
          list[j] = {name:pr.exercise, inc:carryInc, formFocus:carryFF};
          done = true; break;
        }
      }
      if(done) break;
    }
    // logged history stays under the old name — e1RM history for the prior exercise is preserved as its own series.
  } else {
    const dk = pr.day && S.split[pr.day] ? pr.day : Object.keys(S.split)[0];
    if(pr.exercise && !dayExNames(dk).includes(pr.exercise)){
      S.split[dk].exercises.push({name:pr.exercise, inc: pr.inc!=null?pr.inc:incFor(pr.exercise)});
    }
  }
  S.audit.proposals.splice(i,1);
  if(!S.audit.proposals.length) S.audit.status='done';
  save(); renderToday(); setAccent(); renderHeader();
}
function dismissProposal(i){
  S.audit.proposals.splice(i,1);
  if(!S.audit.proposals.length) S.audit.status='done';
  save(false); renderToday();
}
function dismissAllProposals(){ S.audit.proposals=[]; S.audit.status='done'; save(false); renderToday(); }

/* ============================================================
   WORKOUT FUEL TIMING
   Computed locally rather than via the API: the timing windows are settled sports-nutrition
   practice, so hard-coding them means instant results, no cost, and it works offline mid-gym.
   Every food is tagged so the user's exclusion list can filter it out reliably \u2014 matching on
   tags AND name, erring toward over-filtering, since suggesting a food he won't eat is worse
   than showing one option fewer.
   ============================================================ */
const FUEL_WINDOWS = [
  {key:'pre_main', off:-165, span:'2\u20133 h before', title:'Main pre-workout meal',
   why:'The real fuel. Carbs top off muscle glycogen and protein gets amino acids circulating. Keep fat and fiber moderate here \u2014 both slow stomach emptying, and food still sitting in your gut when you start lifting is a common cause of mid- and post-session nausea.'},
  {key:'pre_top', off:-75, span:'60\u201390 min before', title:'Light top-up',

/* Split the exclusion text into tokens and drop any food whose name or tags contain one.
   Deliberately greedy: a false filter costs one option, a false pass costs a wasted meal. */
function fuelExclusionTokens(){
  const raw = ((S.fuel&&S.fuel.dislikes)||'')+', '+((S.fuel&&S.fuel.limits)||'');
  return raw.split(/[,;\n]+/).map(s=>s.trim().toLowerCase()).filter(s=>s.length>2);
}
function fuelFoodAllowed(food, tokens){
  const hay = (food.n+' '+food.t.join(' ')).toLowerCase();
  return !tokens.some(tok=>hay.indexOf(tok)>=0);
}
function fuelClockFrom(hhmm, offsetMin){
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm||'');
  if(!m) return null;
  let mins = (+m[1])*60 + (+m[2]) + offsetMin;
  mins = ((mins % 1440) + 1440) % 1440;
  let h = Math.floor(mins/60), mm = mins%60;
  const ap = h>=12 ? 'PM' : 'AM';
  let h12 = h%12; if(h12===0) h12 = 12;
  return h12+':'+String(mm).padStart(2,'0')+' '+ap;
}

    'If nausea keeps happening even when you\u2019ve eaten and hydrated properly, or comes with dizziness, vomiting, or a bad headache, get it checked by a doctor rather than tuning your meals around it.</p></div>';
  if(filtered>0){
    h += '<p class="small" style="color:var(--dim)">'+filtered+' option'+(filtered!==1?'s':'')+' hidden by your exclusion list. Matching is deliberately broad \u2014 edit the list above if something useful got caught.</p>';

async function genAllMeals(){

  if(btn){ btn.textContent='Generating\u2026'; btn.disabled=true; }

    const prompt = 'For each of these meal slots: '+MEAL_SLOTS.join(', ')+', give 9 distinct food options. '+
      'Within each slot, vary the calorie level so there is a genuine spread from a hearty high-calorie choice down to a lighter one \u2014 e.g. a snack slot might range from a big peanut-butter-and-honey sandwich down to a small handful of chips. '+
      'Respond with ONLY valid JSON, no markdown, no commentary:\n'+
      '{"slots":[{"slot":"Breakfast","options":[{"name":"short food name","cal":650,"protein":40,"how":"one-line prep, under 16 words"}]}]}';
    const reply = await callClaude([{role:'user', content:prompt}], fuelSystem(), 10000);
    const parsed = parseLooseJSON(reply);
    const slots = parsed.slots || parsed.meals || [];
    if(!slots.length) throw new Error('No slots returned');
    S.fuel.meals = slots.map(sl=>({
      slot: sl.slot,
      options: (sl.options||[]).map(o=>({name:o.name, cal:+o.cal||0, protein:+o.protein||0, how:o.how||''}))
                .filter(o=>o.name)
                .sort((a,b)=>b.cal-a.cal)
    }));
    save(); renderFuel();
  }catch(e){
    if(btn){ btn.textContent='Generate Options'; btn.disabled=false; }
    const why = !S.settings.apiKey && !window._inClaude ? ' Add your API key in Settings first.' : ' The list came back garbled \u2014 just tap Generate again.';
    alert('Could not generate options.'+why);
  }
}
async function refreshMeal(i){
  fuelInit();
  const f = S.fuel; if(!f.meals || !f.meals[i]) return;
  const slot = f.meals[i].slot;

    const prompt = 'Give 9 distinct '+slot+' food options with a genuine spread from high-calorie down to lighter. '+
      'Make them different from these previous ones where possible: '+((f.meals[i].options||[]).map(o=>o.name).join(', ')||'(none)')+'. '+
      'Respond with ONLY valid JSON, no markdown: {"slot":"'+slot+'","options":[{"name":"...","cal":0,"protein":0,"how":"one-line prep under 16 words"}]}';
    const reply = await callClaude([{role:'user', content:prompt}], fuelSystem(), 6000);
    const m = parseLooseJSON(reply);
    const opts = (m.options||[]).map(o=>({name:o.name, cal:+o.cal||0, protein:+o.protein||0, how:o.how||''}))
                  .filter(o=>o.name).sort((a,b)=>b.cal-a.cal);
    if(!opts.length) throw new Error('No options returned');
    f.meals[i] = {slot:m.slot||slot, options:opts};
    save(); renderFuel();
  }catch(e){
    alert('That refresh failed: '+e.message+'\n\nTap refresh again \u2014 if it keeps failing, check your API key in Settings.');
  }

    const isToday = i===todayPos;
    let opts = '<option value="REST"'+(day==='REST'?' selected':'')+'>Rest</option>';
    Object.keys(S.split).forEach(k=>{ opts += '<option value="'+k+'"'+(day===k?' selected':'')+'>'+k+' \u2014 '+esc(S.split[k].name)+'</option>'; });

      '<div style="flex:0 0 80px" class="small"><b>Day '+(i+1)+'</b>'+(isToday?' <span style="color:var(--amber)">\u2190 today</span>':'')+'</div>'+
      '<div style="flex:0 0 auto"><select onchange="cycleSetDay('+i+',this.value)">'+opts+'</select></div>'+
      '<div style="margin-left:auto;display:flex;gap:4px">'+
      (i>0?'<button class="btn ghost sm" title="Move earlier" onclick="cycleMoveDay('+i+',-1)">\u2191</button>':'')+
      (i<pat.length-1?'<button class="btn ghost sm" title="Move later" onclick="cycleMoveDay('+i+',1)">\u2193</button>':'')+

  });

function cycleSetAnchor(v){

}
function cycleSetDay(i,v){

}
function cycleMoveDay(i,dir){
  scheduleInit();

  const j = i+dir; if(j<0||j>=pat.length) return;
  const tmp = pat[i]; pat[i]=pat[j]; pat[j]=tmp;
  save(); renderSettings(); renderToday(); setAccent(); renderHeader();
}
function cycleAddDay(){
  scheduleInit(); S.cycleSchedule.pattern.push('REST'); save(); renderSettings();
}
function cycleRemoveDay(i){

  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{

      if(!p.logs || !p.split) throw new Error('Not an Iron Hub backup');
      if(!confirm('Replace ALL current data with this backup ('+p.logs.length+' sessions)?')) return;
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), p);
      save(); location.reload();

<script>

function buildOneLiveExercise(nm, homeEquipList){
  const tier = currentReadinessTier();
  if(deloadActive()){
    const dex = deloadExercise(nm);
    dex._decision = {code:'deload', moved:false, reason:'Deload week — loaded ~60% for 2 light sets. This session is excluded from progression and trend charts.'};
    return dex;
  }
  const rec = recommend(nm, tier);
  let firstW = (rec.sets && rec.sets[0] && rec.sets[0].w!=='') ? +rec.sets[0].w : '';
  const {lo,hi} = exRepMode(nm);
  let decision; try{ decision = classifyDecision(nm, tier); }catch(e){ decision = null; }
  // investigation target override (reset & rebuild)
  const _ov = (typeof invOverrideFor==='function') ? invOverrideFor(nm) : null;
  if(_ov){
    firstW = _ov.w;
    rec.target = _ov.w+' lb \u00d7 '+lo+'\u2013'+hi+' (rebuild)';
    rec.detail = _ov.note+'. Keep every rep clean \u2014 climbing back fast is the point.';
    decision = {code:'inv-override', moved:true, reason:'Investigation fix active: targets reset to '+_ov.w+' lb through '+fmtDate(_ov.until)+' to rebuild momentum.'};
  }
  let planned = (rec.sets||[]).length||3;
  if(liveTrimVol){ planned = Math.max(2, planned-1); rec.detail = (rec.detail||'')+' Volume trimmed for low readiness \u2014 quality over quantity today.'; }
  let backoffW = backoffWeightFor(nm, +firstW||0);
  // HOME mode: the normal progression engine above still computes a suggested weight
  // (and backoff) \u2014 it just gets snapped to what's actually on hand (dumbbells/
  // kettlebells come in fixed increments, not 5-lb plate math) instead of the
  // exercise's usual increment.
  if(homeEquipList && homeEquipList.length){
    if(firstW!=='' && firstW!=null) firstW = roundToEquipList(+firstW, homeEquipList);
    if(backoffW) backoffW = roundToEquipList(backoffW, homeEquipList);
  }
  return {
    name:nm, repMode:isStrMode(nm)?'str':'hyp', formFocus:isFormFocus(nm),
    targetW:firstW, lo:lo, hi:hi,
    backoffW: backoffW,
    recTarget:rec.target, recDetail:rec.detail,
    planned:planned,
    sets:[], done:false, _decision:decision,
    advW:firstW, advLo:lo, advHi:hi, advTag:'', advCls:'', advMsg:rec.detail,
    _swapped:false,
    _homeEquipList: (homeEquipList && homeEquipList.length) ? homeEquipList : null
  };
}
function buildLiveExercises(dk){
  clearExpiredCoachDayPlan();

/* intra-session autoregulation: tune the NEXT set from the last one */
function intraAdvice(ex){
  const sets = ex.sets;
  if(!sets.length) return {w:ex.targetW, lo:ex.lo, hi:ex.hi, tag:'', cls:'', msg:ex.recDetail};
  const last = sets[sets.length-1];
  const r=+last.r||0, e=last.e, w=+last.w||0;
  const lo=ex.lo, hi=ex.hi, inc=incForExercise(ex.name);
  if(e==='fail' || (r>0 && r<lo)){
    let dw=Math.max(w-inc,inc);
    if(ex._homeEquipList) dw = roundToEquipList(dw, ex._homeEquipList);
    return {w:dw, lo:lo, hi:hi, tag:'Back off', cls:'back', msg:'That set fell short — drop to '+dw+' lb and keep the reps clean.'};
  }
  // Top set is done \u2014 drop to the backoff load for the remaining sets. Deliberately placed
  // AFTER the fail branch: if the top set actually fell short, that safety response wins and
  // we never suggest a weight higher than the autoregulated one.
  if(ex.backoffW && ex.backoffW < w){
    const bw = ex.backoffW;
    const grindNote = e==='grind' ? ' That one was a grind, so the lighter sets should feel right.' : '';
    return {w:bw, lo:lo, hi:hi, tag:'Backoff', cls:'hold',
      msg:'Top set logged at '+w+' lb. Backoff sets run '+bw+' lb \u2014 same rep target, more speed on the bar.'+grindNote};
  }
  if(r>=hi && (e==='easy'||!e)){
    return {w:w, lo:lo, hi:hi, tag:'Strong', cls:'up', msg:'Top of the range — hold '+w+'. Keep this up and you earn a jump next session.'};
  }
  if(e==='grind'){
    return {w:w, lo:lo, hi:hi, tag:'Hold', cls:'hold', msg:'That was a grind — stay at '+w+', match the reps, stop one short of failure.'};
  }
  return {w:w, lo:lo, hi:hi, tag:'On target', cls:'hold', msg:'Solid — repeat '+w+' lb and chase one more rep than last set.'};
}

/* Smart rest: exercise type + rep mode + how the last set actually went. */
function smartRestSecs(ex){
  if(ex._deload || deloadActive()) return {secs:75, why:'Deload \u2014 keep it moving'};
  const comp = (typeof mesoIsCompound==='function') ? mesoIsCompound(ex.name) : true;
  let secs = comp ? (ex.repMode==='str' ? 195 : 150) : 90;
  let why = comp ? (ex.repMode==='str' ? 'Heavy compound' : 'Compound') : 'Isolation';
  const last = ex.sets[ex.sets.length-1];
  if(last){
    const lastB = effBucket(last);
    if(lastB==='grind' || lastB==='fail'){ secs += 30; why += ' \u00b7 hard set'; }
    else if(lastB==='easy' && !comp){ secs -= 15; why += ' \u00b7 easy set'; }
    const best = bestE1RM(ex.name);
    if(comp && best>0 && (+last.w||0) >= best*0.9){ secs += 30; why += ' \u00b7 near-max load'; }
  }
  return {secs:Math.max(45, secs), why};
}

       ['easy','solid','grind','fail'].map(e=>'<button class="'+(liveDockEff===e?'sel e-'+e:'')+'" onclick="pickEff(\''+e+'\')">'+e+'</button>').join('')+
       '</div>';
  h += effLeverHTML();
  h += painHTML(ex, i);
  const sr = smartRestSecs(ex);
  h += '<div class="lv3-btns">'+
       '<button class="btn primary lv3-log" onclick="logLiveSet('+i+')">Log set</button>'+
       '<button class="btn cyan lv3-done" onclick="finishExercise('+i+')">Done \u2713</button>'+
       '</div>';
  h += '<div class="lv3-restnote">Rest after log: ~'+Math.round(sr.secs/60*10)/10+' min \u00b7 '+sr.why+'</div>';
  h += '</div><div id="restSlot"></div></div>';
  return h;
}

  const s=live.exercises[i].sets[j];
  const on = (effBucket(s)===e);

  s.ef = on ? undefined : EFF_ANCHOR[e];

function deleteLiveSet(i,j){

function logLiveSet(i){
  const ex = live.exercises[i];
  const w = parseFloat(document.getElementById('dockW').value);
  const r = parseInt(document.getElementById('dockR').value);
  if(!(w>0) || !(r>0)){ alert('Enter weight and reps for this set.'); return; }
  // Both are stored: s.e keeps every existing reader working untouched, s.ef carries the
  // precision. effBucket() prefers s.ef and falls back to s.e, so the two can never disagree.
  ex.sets.push({w:w, r:r, e:liveDockEff||undefined,
                ef:(liveDockLever===null?undefined:liveDockLever)});
  liveDockEff = ''; liveDockLever = null;
  saveLiveDraft();
  if(ex._1rm && ex._1rmRamp){
    const step = ex._1rmRamp[ex.sets.length-1];
    startRest(step ? rampRestSecs(step) : 180, i);
  } else {
    startRest(smartRestSecs(ex).secs, i);
  }
  renderLive();
  const el = document.getElementById('liveex-'+i); if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function finishExercise(i){
  live.exercises[i].done = true;
  liveEditSet = null;
  // advance to next undone exercise
  const next = live.exercises.findIndex((e,idx)=>idx>i && !e.done);
  liveActiveIdx = next>=0 ? next : live.exercises.findIndex(e=>!e.done);
  if(liveActiveIdx<0) liveActiveIdx = i;
  liveDockEff=''; liveDockLever=null; stopRest(); saveLiveDraft(); renderLive();
}

/* ---- end session: consolidate -> log -> PRs -> summary ---- */
function endLiveSession(){
  const entries = live.exercises.filter(e=>e.sets.length).map(e=>({exercise:e.name, sets:e.sets.map(s=>({w:s.w,r:s.r,e:s.e}))}));
  if(!entries.length){ live=null; clearLiveDraft(); renderLive(); return; }
  const before = snapshotPRs();
  const prsBefore = {};
  entries.forEach(en=>{ prsBefore[en.exercise]=actualPR(en.exercise); });
  // capture engine decisions + deload flag for the system logger
  const decisions = {};
  live.exercises.forEach(e=>{ if(e._decision) decisions[e.name]=e._decision; });
  const isDeload = deloadActive() || live.exercises.some(e=>e._deload);
  // Stamp the day's name at save time. Strength-block day keys (S1/S2/S3) stop resolving
  // once the block ends, and permanent days get renamed — either way the log should keep
  // the label it was actually trained under.
  const logRec = {id:Date.now(), date:todayKey(), day:live.day, dayName:dayName(live.day), entries, decisions};
  if(isDeload) logRec.deload = true;
  if(live.home) logRec.home = true;
  // Stamped either way, not just when true. The Readiness tab compares trimmed vs
  // full-plan sessions, and "field missing" has to stay distinguishable from
  // "answered no" — every log written before this existed is genuinely unknown.
  logRec.trimmed = !!live.trimmed;
  S.logs.push(logRec);
  save();
  // compute summary
  const totalSets = entries.reduce((a,e)=>a+e.sets.length,0);
  const totalVol = entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const newPRs = [];
  entries.forEach(en=>{
    const prevPR = prsBefore[en.exercise];
    const heaviest = en.sets.reduce((m,s)=>(+s.w>(m?+m.w:0)?s:m), null);
    if(heaviest && (!prevPR || +heaviest.w>prevPR.w)) newPRs.push(en.exercise+' · '+heaviest.w+' lb × '+heaviest.r);
  });
  const note = sessionNote(entries, live.day);
  showSummary({exercises:entries.length, sets:totalSets, vol:totalVol, prs:newPRs, note});
  checkPRs(before);  // fires the e1RM-based PR overlay if applicable (after summary close it remains)
  live=null; clearLiveDraft(); stopRest();
  // resolving a flag here without refreshing the banner leaves stale WATCH/ALERT text on screen
  // until the next unrelated tab click quietly swaps it out \u2014 refresh both together, always.
  try{ invCheckResolutions(); invUpdateBadge(); }catch(e){}
}
function sessionNote(entries, dk){
  // compare to previous same-day session
  const prior = S.logs.filter(l=>l.day===dk && l.date!==todayKey()).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!prior) return 'First '+dk+' session on record — this is your baseline. Every one from here builds on it.';
  const volOf = l=>l.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const todayVol = entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0);
  const pv = volOf(prior);
  if(pv<=0) return 'Solid work logged. Keep the effort tags honest and the targets sharpen.';
  const delta = Math.round((todayVol-pv)/pv*100);
  if(delta>=3) return 'Total tonnage up '+delta+'% vs your last '+dk+'. That\u2019s real progressive overload — exactly the goal.';
  if(delta<=-8) return 'Tonnage down '+Math.abs(delta)+'% vs last '+dk+'. Could be a lighter day or fewer sets — no problem if it was deliberate, worth a look if not.';
  return 'Right on pace with your last '+dk+' (tonnage '+(delta>=0?'+':'')+delta+'%). Consistent is what compounds.';
}

/* ===================== REST TIMER ===================== */
const RT_C = 2*Math.PI*70;
/* Wall-clock rest timer: stores endTime so background pauses don't lose time.
   On visibilitychange (returning to app), paintRest() recalculates from real clock. */
let rest = {running:false, endTime:0, total:0, exIdx:-1, timer:null};
function restSecsRemaining(){ return Math.max(0, Math.round((rest.endTime - Date.now()) / 1000)); }
function startRest(seconds, exIdx){
  stopRest();
  rest = {running:true, endTime:Date.now()+seconds*1000, total:seconds, exIdx:exIdx, timer:setInterval(restTick,500)};
  mountRestTimer();
}
function stopRest(){ if(rest.timer) clearInterval(rest.timer); rest.running=false; rest.timer=null; const slot=document.getElementById('restSlot'); if(slot) slot.innerHTML=''; }
function restTick(){ paintRest(); if(restSecsRemaining()<=0){ clearInterval(rest.timer); rest.timer=null; } }
function adjustRest(d){ rest.endTime = Math.max(Date.now(), rest.endTime + d*1000); rest.total = Math.max(rest.total, restSecsRemaining()); paintRest(); }
function skipRest(){ stopRest(); }
document.addEventListener('visibilitychange', function(){ if(!document.hidden && rest.running) paintRest(); });
function mountRestTimer(){
  const slot = document.getElementById('restSlot');
  if(!slot){ return; }
  slot.innerHTML =
    '<div class="resttimer"><div class="rt-arcwrap"><svg width="158" height="158" viewBox="0 0 158 158">'+
    '<circle class="rt-bg" cx="79" cy="79" r="70"></circle>'+
    '<circle class="rt-fg" id="rtArc" cx="79" cy="79" r="70" stroke-dasharray="'+RT_C.toFixed(1)+'" stroke-dashoffset="0"></circle>'+
    '</svg><div class="rt-center"><div class="rt-time" id="rtTime">0:00</div><div class="rt-label" id="rtLabel">Rest</div></div></div>'+
    '<div class="rt-btns"><button onclick="adjustRest(-15)">−15s</button><button onclick="adjustRest(15)">+15s</button><button onclick="skipRest()">Skip</button></div></div>';
  paintRest();
}
function paintRest(){
  const arc=document.getElementById('rtArc'), t=document.getElementById('rtTime'), l=document.getElementById('rtLabel');
  if(!arc||!t) return;
  const secs = restSecsRemaining();
  const frac = rest.total>0 ? Math.max(0,secs/rest.total) : 0;
  arc.style.strokeDashoffset = (RT_C*(1-frac)).toFixed(1);
  t.textContent = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  if(secs<=0){ arc.style.stroke='var(--cyan)'; t.style.color='var(--cyan)'; if(l) l.textContent='Ready — go'; }
  else { arc.style.stroke='var(--amber)'; t.style.color='var(--text)'; if(l) l.textContent='Rest'; }
}

/* ===================== BODY HEATMAP ===================== */
const BM_GROUPS = ['chest','traps','frontDelts','sideDelts','rearDelts','biceps','triceps','forearms','abs','obliques','lats','lowerBack','glutes','quads','hamstrings','calves'];
const BM_LABELS = {chest:'Chest',traps:'Trapezius',frontDelts:'Front delts',sideDelts:'Side delts',rearDelts:'Rear delts',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',abs:'Abs',obliques:'Obliques',lats:'Lats',lowerBack:'Lower back',glutes:'Glutes',quads:'Quads',hamstrings:'Hamstrings',calves:'Calves'};
/* map fine heatmap groups -> V1 broad groups */
const BM_TO_BROAD = {chest:'Chest',traps:'Back',frontDelts:'Shoulders',sideDelts:'Shoulders',rearDelts:'Shoulders',biceps:'Biceps',triceps:'Triceps',forearms:'Biceps',abs:'Abs',obliques:'Abs',lats:'Back',lowerBack:'Back',glutes:'Glutes',quads:'Quads',hamstrings:'Hamstrings',calves:'Quads'};
const BM_C = {green:'#3a9e6e',yellow:'#c9952a',red:'#c04040',off:'#39424e'};
const BM_OP = {green:.92,yellow:.86,red:.86,off:.34};
let bmState = {}; // container -> {mode, selected}

function bmTrainedDays(broad){
  // most recent date a broad group was trained, days ago (Infinity if never)
  let best=Infinity;
  S.logs.forEach(l=>{ const hit=l.entries.some(e=>{const m=musclesFor(e.exercise); return m.p.includes(broad)||m.s.includes(broad);});
    if(hit){ const d=daysBetween(l.date, todayKey()); if(d>=0 && d<best) best=d; } });
  return best;
}
function bmWeeklyVol(broad){
  const wk = weekStartKey();
  let v=0;
  S.logs.filter(l=>l.date>=wk).forEach(l=>l.entries.forEach(e=>{const m=musclesFor(e.exercise); const n=e.sets.length;
    if(m.p.includes(broad)) v+=n; if(m.s.includes(broad)) v+=n*0.5;}));
  return v;
}
function bmProgress(broad){
  // green if any exercise hitting this group improved e1RM in last ~4wks, yellow if flat, red if declining, off if no data
  // walk every exercise actually logged (not just the hardcoded EX_MUSCLES keys) so keyword-fallback
  // exercises (e.g. anything matched via musclesFor's regex fallback) aren't silently excluded
  const seen = new Set();
  S.logs.forEach(l=>l.entries.forEach(e=>seen.add(e.exercise)));
  Object.keys(S.split).forEach(dk=>(S.split[dk].exercises||[]).forEach(x=>seen.add(exName(x))));
  let any=false, improved=false, declined=false;
  seen.forEach(ex=>{
    const m=musclesFor(ex); if(!m.p.includes(broad) && !m.s.includes(broad)) return;
    const pts=e1rmSeries(ex); if(pts.length<2) return; any=true;
    const recent=pts.slice(-4); const a=recent[0].v, b=recent[recent.length-1].v;
    if(b>a*1.01) improved=true; else if(b<a*0.99) declined=true;
  });
  if(!any) return 'off';
  if(improved) return 'green'; if(declined) return 'red'; return 'yellow';
}
function bmStatusFor(mode, key){
  const broad = BM_TO_BROAD[key];
  if(!broad) return 'off';
  if(mode==='today'){
    const dk=currentDayKey(); if(dk==='REST') return 'off';
    let st='off';
    dayExNames(dk).forEach(nm=>{const m=musclesFor(nm); if(m.p.includes(broad)) st='green'; else if(m.s.includes(broad)&&st==='off') st='yellow';});
    return st;
  }
  if(mode==='weekly'){
    const v=bmWeeklyVol(broad); if(v<=0) return 'off'; if(v<6) return 'red'; if(v<10) return 'yellow'; return 'green';
  }
  if(mode==='recovery'){
    const d=bmTrainedDays(broad); if(d===Infinity) return 'off'; if(d<2) return 'red'; if(d<4) return 'yellow'; return 'green';
  }
  if(mode==='progress'){ return bmProgress(broad); }
  return 'off';
}
function bmStatus(container, key){ return bmStatusFor(bmState[container].mode, key); }

/* THE single source of truth for everything the muscle map shows, in either
   renderer. Pure -- takes a mode, reads S, returns plain data. No DOM, no
   canvas, no container. The 3D viewer and the 2D SVG both consume this, so
   the two can never drift apart, and the numbers behind the colouring stay
   testable in jsdom where WebGL does not exist. */
function bmViewerData(mode){
  return BM_GROUPS.map(function(key){
    const broad = BM_TO_BROAD[key];
    return {
      key: key,
      label: BM_LABELS[key],
      broad: broad,
      status: bmStatusFor(mode, key),
      volume: bmWeeklyVol(broad),        // weekly sets: primary 1.0, secondary 0.5
      daysSince: bmTrainedDays(broad),   // Infinity when never trained
      exercises: bmExercisesFor(key)
    };
  });
}
function bmExercisesFor(key){
  const broad = BM_TO_BROAD[key];
  if(!broad) return [];
  // exercises in the user's own split that hit this group (primary first), then fall back to library
  const inSplit=[];
  for(const dk in S.split) for(const x of (S.split[dk].exercises||[])){
    const nm=exName(x); const m=musclesFor(nm);
    if(m.p.includes(broad)) inSplit.push({nm, pri:true}); else if(m.s.includes(broad)) inSplit.push({nm, pri:false});
  }
  const seen=new Set(); const uniq=[];
  inSplit.sort((a,b)=>(b.pri-a.pri)).forEach(o=>{ if(!seen.has(o.nm)){seen.add(o.nm); uniq.push(o.nm);} });
  return uniq.slice(0,4);
}
/* Only the Progress card gets the 3D viewer. The LIVE idle screen keeps the
   flat SVG on purpose: it is what he sees on the way into a session, and it
   must paint without waiting on a CDN fetch or a GPU context. */

}

  }

  h += '<div class="bm-legend"><span><span class="bm-sw" style="background:#3a9e6e"></span>Progressing</span><span><span class="bm-sw" style="background:#c9952a"></span>Maintaining</span><span><span class="bm-sw" style="background:#c04040"></span>Neglected</span><span><span class="bm-sw" style="background:#39424e"></span>Not trained</span></div>';
  return h;
}
function initBodyMap(container){
  if(bmUses3D(container)){ bm3dInit(container); return; }   // falls back to bmRender on its own
  bmRender(container);
}
function bmSetMode(container, m){
  bmState[container].mode=m;
  document.querySelectorAll('#bmmodes-'+container+' button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  if(bmState[container].three) bm3dApply(container); else bmRender(container);

/* ===================== 3D MUSCLE VIEWER =====================
   Progress tab only. The LIVE idle screen deliberately keeps the flat SVG:
   it is the front door on a training day and must not wait on a CDN or a
   GPU context before it paints.

   three.js is pinned and pulled at runtime the same way the fonts are -- no
   build step, no bundler. It is imported lazily on first view of this card,
   so app boot never pays for it, and the browser HTTP-caches it afterwards.

   Every failure path lands on the 2D renderer: no WebGL, no network, a CDN
   outage, a captive-portal gym wifi. The tab degrades, it never breaks.

   Colour and grouping come from bmViewerData() -- the same call the SVG
   makes -- so the two renderers cannot disagree about what a muscle's
   status is. Colours below match BM_C exactly, so the 2D and 3D pictures
   read as the same picture, just from a different angle. */
const BM3D_SRC = 'https://unpkg.com/three@0.160.1/build/three.module.min.js';
let bm3dMod = null, bm3dLoading = null;
const bm3d = {};   // container -> live scene handle

function bm3dLoad(){
  if(bm3dMod) return Promise.resolve(bm3dMod);
  if(!bm3dLoading){
    bm3dLoading = import(BM3D_SRC).then(function(m){ bm3dMod = m; return m; });
    bm3dLoading.catch(function(){ bm3dLoading = null; });   // let a later visit retry
  }
  return bm3dLoading;
}
function bm3dSupported(){
  try{
    if(typeof document==='undefined') return false;
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  }catch(e){ return false; }
}

/* Stylised anatomy. Ellipsoid "plates" sit proud of a neutral mannequin -- the
   same idea as the SVG's coloured shapes over a grey body, which is why the
   two read as the same picture. [key, x, y, z, sx, sy, sz, paired] */
const BM3D_PLATES = [
  ['chest',       8,  52,  8.5, 7.5,  7,   3.0, 1],
  ['abs',         0,  33,  7.6, 6.0,  8,   2.6, 0],
  ['obliques',   10,  32,  5.5, 3.0,  7,   2.6, 1],
  ['frontDelts', 18,  56,  3.2, 4.8,  4.6, 4.4, 1],
  ['sideDelts',  21.5,55,  0.0, 3.8,  5.0, 5.0, 1],
  ['rearDelts',  18,  56, -3.2, 4.8,  4.6, 4.4, 1],
  ['traps',       0,  59, -4.5, 8.5,  4.5, 3.0, 0],
  ['lats',       11,  46, -8.0, 5.0, 10,   3.0, 1],
  ['lowerBack',   0,  33, -7.6, 7.0,  6,   2.6, 0],
  ['biceps',     22,  48,  3.6, 3.6,  7,   2.6, 1],
  ['triceps',    22,  48, -3.6, 3.6,  7,   2.6, 1],
  ['forearms',   24.5,26,  3.2, 3.2,  7,   2.4, 1],
  ['glutes',      7,  16, -7.5, 6.0,  5,   3.0, 1],
  ['quads',       8.5,-6,  5.5, 5.0, 10,   2.8, 1],
  ['hamstrings',  8.5,-6, -5.5, 5.0, 10,   2.8, 1],
  ['calves',      8.5,-33,-4.5, 4.0,  8,   2.6, 1]
];
/* [kind, x, y, z, a, b, c, paired] -- sphere scales, or capsule radius/length */
const BM3D_BODY = [
  ['sphere',   0,  72, 0,   7.5,  9,  8.5, 0],  // head -- sat low; a gap here reads as a bobblehead
  ['capsule',  0,  63, 0,   5.0,  5,  0,   0],  // neck
  ['sphere',   0,  49, 0,  16,   13.5,9.5, 0],  // chest cage
  ['sphere',   0,  31, 0,  12.5, 10,  8.5, 0],  // waist
  ['sphere',   0,  16, 0,  14,    9.5,9,   0],  // pelvis
  ['capsule', 22,  47, 0,   4.6, 16,  0,   1],  // upper arm -- clear of the ribcage
  ['capsule', 24.5,26, 1,   4.0, 15,  0,   1],  // forearm
  ['sphere',  26,  14, 1,   3.4,  4.6,2.4, 1],  // hand
  ['capsule',  8.5,-6, 0,   6.6, 20,  0,   1],  // thigh
  ['capsule',  8.5,-33,0,   5.0, 20,  0,   1],  // shin
  ['sphere',   8.5,-48,4,   5,    3,  9,   1]   // foot
];

/* Hardcoded, matching BM_C and bmRender's skin tone exactly -- there is only
   one theme now, so there is nothing to read from CSS custom properties. */
function bm3dColors(){
  return { green:'#3a9e6e', yellow:'#c9952a', red:'#c04040', off:'#39424e', skin:'#2a3140' };
}

function bm3dInit(container){
  const cv = document.getElementById('bm3dcv-'+container);
  if(!cv) return;
  if(!bm3dSupported()){ bm3dFallback(container, 'no-webgl'); return; }
  bm3dLoad().then(function(THREE){
    if(!document.getElementById('bm3dcv-'+container)) return;   // card went away mid-load
    bm3dBuild(THREE, container);
  }).catch(function(){
    bm3dFallback(container, 'load-failed');
  });
}

function bm3dBuild(THREE, container){
  const cv = document.getElementById('bm3dcv-'+container);
  const wrap = document.getElementById('bm3dwrap-'+container);
  if(!cv || !wrap) return;
  bm3dDispose(container);

  const C = bm3dColors();
  const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
  renderer.setClearAlpha(0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));   // phones lie about DPR; 2 is plenty

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 1, 600);
  camera.position.set(0, 14, 205);
  camera.lookAt(0, 14, 0);

  scene.add(new THREE.HemisphereLight(0xdfeaf7, 0x121a26, 1.15));
  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(40, 70, 90); scene.add(key);
  const rim = new THREE.DirectionalLight(0x8fb6ff, 0.55);
  rim.position.set(-60, 20, -70); scene.add(rim);

  const root = new THREE.Group();
  scene.add(root);

  const sphere = new THREE.SphereGeometry(1, 22, 16);
  const skinMat = new THREE.MeshStandardMaterial({color:new THREE.Color(C.skin), roughness:.94, metalness:.02});
  const geoms = [sphere], mats = [skinMat];

  BM3D_BODY.forEach(function(p){
    const sides = p[7] ? [-1, 1] : [0];
    sides.forEach(function(s){
      let mesh;
      if(p[0]==='capsule'){
        const g = new THREE.CapsuleGeometry(p[4], p[5], 4, 14);
        geoms.push(g);
        mesh = new THREE.Mesh(g, skinMat);
      } else {
        mesh = new THREE.Mesh(sphere, skinMat);
        mesh.scale.set(p[4], p[5], p[6]);
      }
      mesh.position.set(s===0 ? p[1] : s*p[1], p[2], p[3]);
      root.add(mesh);
    });
  });

  // one material per muscle group, shared by its left/right meshes, so recolouring
  // and selection dimming are a handful of colour writes rather than a rebuild
  const groupMats = {}, picks = [];
  BM3D_PLATES.forEach(function(p){
    const m = new THREE.MeshStandardMaterial({color:0x888888, roughness:.62, metalness:.05,
                                              emissive:new THREE.Color(0x000000), emissiveIntensity:.35});
    groupMats[p[0]] = m; mats.push(m);
    const sides = p[7] ? [-1, 1] : [0];
    sides.forEach(function(s){
      const mesh = new THREE.Mesh(sphere, m);
      mesh.scale.set(p[4], p[5], p[6]);
      mesh.position.set(s===0 ? p[1] : s*p[1], p[2], p[3]);
      mesh.userData.bmKey = p[0];
      root.add(mesh); picks.push(mesh);
    });
  });

  const h = {THREE:THREE, renderer:renderer, scene:scene, camera:camera, root:root,
             groupMats:groupMats, picks:picks, geoms:geoms, mats:mats,
             yaw:-0.42, pitch:0.06, spin:0.0042, spun:0, visible:false, raf:null,
             dragging:false, moved:0, lastX:0, lastY:0, disposed:false};
  bm3d[container] = h;

  function resize(){
    const w = wrap.clientWidth || 320, hh = wrap.clientHeight || 300;
    renderer.setSize(w, hh, false);
    camera.aspect = w / hh; camera.updateProjectionMatrix();
  }
  function draw(){
    root.rotation.y = h.yaw; root.rotation.x = h.pitch;
    renderer.render(scene, camera);
  }
  function tick(){
    if(!h.dragging && h.spin){
      h.yaw += h.spin;
      // An invitation, not an animation. It drifts for a few seconds so the card
      // reads as rotatable, then holds still -- this is a data view, and a chart
      // you have to chase with your eyes is a worse chart.
      if(++h.spun > 420) h.spin = 0;
    }
    draw();
    h.raf = (h.visible && h.spin && !h.disposed) ? requestAnimationFrame(tick) : null;
  }
  h.resize = resize; h.draw = draw; h.tick = tick;

  cv.addEventListener('pointerdown', function(e){
    h.dragging = true; h.moved = 0; h.lastX = e.clientX; h.lastY = e.clientY;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  });
  cv.addEventListener('pointermove', function(e){
    if(!h.dragging) return;
    const dx = e.clientX - h.lastX, dy = e.clientY - h.lastY;
    h.moved += Math.abs(dx) + Math.abs(dy);
    h.yaw += dx * 0.011;
    h.pitch = Math.max(-0.5, Math.min(0.5, h.pitch + dy * 0.006));
    h.lastX = e.clientX; h.lastY = e.clientY;
    // once he takes hold of it, stop the idle spin -- it should not fight him
    h.spin = 0;
    if(!h.raf) draw();
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    cv.addEventListener(ev, function(e){
      if(!h.dragging) return;
      h.dragging = false;
      if(h.moved < 8) bm3dPick(container, e);   // a tap, not a drag
    });
  });

  resize();
  window.addEventListener('resize', function(){ if(!h.disposed){ resize(); draw(); } });
  if('IntersectionObserver' in window){
    h.io = new IntersectionObserver(function(en){
      h.visible = en[0].isIntersecting;
      if(h.visible && !h.raf && h.spin && !h.disposed) h.raf = requestAnimationFrame(tick);
    }, {threshold:.05});
    h.io.observe(cv);
  } else { h.visible = true; h.raf = requestAnimationFrame(tick); }

  wrap.classList.add('ready');
  bm3dApply(container);
}

/* Recolour from bmViewerData() -- the same call the SVG renderer makes. */
function bm3dApply(container){
  const h = bm3d[container]; if(!h || h.disposed) return;
  const C = bm3dColors();
  const sel = bmState[container] && bmState[container].selected;
  const data = bmViewerData(bmState[container].mode);
  data.forEach(function(row){
    const m = h.groupMats[row.key]; if(!m) return;
    const dim = sel && sel !== row.key;
    m.color.set(C[row.status] || C.off);
    if(dim) m.color.multiplyScalar(0.34);
    m.emissive.set(C[row.status] || C.off);
    m.emissiveIntensity = dim ? 0.04 : (row.status==='off' ? 0.05 : 0.28);
  });
  h.draw();
}

function bm3dPick(container, e){
  const h = bm3d[container]; if(!h || h.disposed) return;
  const cv = h.renderer.domElement, r = cv.getBoundingClientRect();
  const pt = new h.THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  const ray = new h.THREE.Raycaster();
  ray.setFromCamera(pt, h.camera);
  const hit = ray.intersectObjects(h.picks, false)[0];
  if(hit && hit.object.userData.bmKey) bmClickMuscle(container, hit.object.userData.bmKey);
  else bmCloseCard(container);
}

function bm3dDispose(container){
  const h = bm3d[container]; if(!h) return;
  h.disposed = true;
  if(h.raf) cancelAnimationFrame(h.raf);
  if(h.io) h.io.disconnect();
  // WebGL contexts are a capped resource (~16 per page); leaking one per repaint
  // would eventually blank the card with no error worth reading
  try{ h.geoms.forEach(function(g){ g.dispose(); }); }catch(e){}
  try{ h.mats.forEach(function(m){ m.dispose(); }); }catch(e){}
  try{ h.renderer.dispose(); }catch(e){}
  delete bm3d[container];
}

/* Swap the viewer out for the flat bodies and carry on as if nothing happened. */
function bm3dFallback(container, why){
  const wrap = document.getElementById('bm3dwrap-'+container);
  if(!wrap) return;
  bm3dDispose(container);
  const holder = document.createElement('div');
  holder.innerHTML = bmBodies2DHTML(container);
  wrap.parentNode.replaceChild(holder.firstElementChild, wrap);
  if(bmState[container]) bmState[container].three = false;
  bmRender(container);
  const tip = document.getElementById('bmtip-'+container);
  if(tip && why==='load-failed') tip.textContent = 'Offline -- showing the flat map. Tap a muscle for top exercises.';
}

/* ===================== MARKDOWN RENDERER ===================== */
function renderMarkdown(raw){
  let s = esc(raw);
  s = s.replace(/^## (.+)$/gm, '<span style="display:block;margin:10px 0 3px;font-weight:600;font-size:13.5px;color:var(--amber)">$1</span>');
  s = s.replace(/^### (.+)$/gm, '<span style="display:block;margin:8px 0 2px;font-weight:600;color:var(--text)">$1</span>');
  s = s.replace(/^# (.+)$/gm, '<span style="display:block;margin:10px 0 4px;font-weight:700;font-size:14px;color:var(--amber)">$1</span>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/^[-\u2022*] (.+)$/gm, '<div style="padding:2px 0 2px 14px;position:relative"><span style="position:absolute;left:4px;color:var(--amber)">\u00b7</span>$1</div>');
  s = s.replace(/\n\n+/g, '<div style="height:7px"></div>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

function exLibInfo(name){
  if(EX_LIBRARY[name]) return EX_LIBRARY[name];
  const n=name.toLowerCase();
  // keyword fallback so every exercise gets something useful
  if(/squat/.test(n)) return EX_LIBRARY['Barbell Back Squat'];
  if(/bench/.test(n)) return EX_LIBRARY['Barbell Bench Press'];
  if(/incline.*press|incline.*db/.test(n)) return EX_LIBRARY['Incline Dumbbell Press'];
  if(/pulldown|pull-?up|pullup/.test(n)) return EX_LIBRARY['Lat Pulldown'];
  if(/preacher|curl/.test(n)) return EX_LIBRARY['Preacher Curl Machine'];
  if(/lateral|side raise|lat raise/.test(n)) return EX_LIBRARY['Cable Lateral Raise'];
  if(/leg press/.test(n)) return EX_LIBRARY['Leg Press'];
  if(/leg curl|hamstring/.test(n)) return EX_LIBRARY['Machine Leg Curl'];
  if(/hip thrust|glute/.test(n)) return EX_LIBRARY['Hip Thrust Machine'];
  if(/jm press|pushdown|tricep|skull|extension.*tri/.test(n)) return EX_LIBRARY['JM Press'];
  if(/leg raise|crunch|ab |core/.test(n)) return EX_LIBRARY['Hanging Leg Raise'];
  const m=musclesFor(name);
  return {cues:['Controlled tempo — own the eccentric (lowering)','Full range of motion through the working muscle','Stop 1\u20132 reps short of failure on most sets','Match or beat last session\u2019s reps before adding weight'],
    mistakes:['Using momentum instead of the target muscle','Cutting the range of motion short','Adding weight before owning the current load'],
    setup:'Primary: '+((m.p||[]).join(', ')||'\u2014')+(m.s&&m.s.length?'. Secondary: '+m.s.join(', '):'')+'.'};
}
/* ---- gear: wrist wraps / belt / knee sleeves ----
   Derived from the exercise name rather than stored on EX_LIBRARY entries, because
   exLibInfo() falls back to a *similar* lift for unknown names — a Goblet Squat must
   not inherit "belt: yes" just because it borrows Back Squat's cues. */
const GEAR_ITEMS=[['wraps','Wrist Wraps'],['belt','Belt'],['sleeves','Knee Sleeves']];
function gearFor(name){
  const n=' '+(name||'').toLowerCase()+' ';
  const t=re=>re.test(n);
  const squat    = t(/squat/) && !t(/sissy|wall sit/);
  // unilateral / light squat patterns still load the knee, but they're not a braced axial lift
  const squatHeavy = squat && !t(/split|bulgarian|goblet|body ?weight|air squat/);
  const hinge    = t(/deadlift|romanian|\brdl\b|stiff.?leg|good ?morning|rack pull/);
  // seated/machine pressing doesn't load the spine, so it doesn't earn a belt
  const ohpStand = t(/overhead press|military|push press|\bohp\b|standing.*press/) && !t(/seated|machine/);
  const bentRow  = t(/barbell row|pendlay|bent.?over|t.?bar row|meadows/);
  const legMach  = t(/leg press|hack|belt squat/);
  // anything that puts a load directly over the wrist joint
  const pressing = t(/press|\bdips?\b|skull|\bjm\b|push.?up/) && !t(/leg press/);
  const frontRack= t(/front squat|zercher|clean|overhead squat/);
  return {
    wraps:   !!(pressing || frontRack),
    belt:    !!(squatHeavy || hinge || ohpStand || bentRow || legMach),
    sleeves: !!(squat || legMach || t(/lunge|split squat|bulgarian|step.?up/))
  };
}

function setDeltaChip(name, setIdx, w, r){
  const ls=lastSessionFor(name); if(!ls||!ls.sets[setIdx]) return '';
  const pw=+ls.sets[setIdx].w||0, pr=+ls.sets[setIdx].r||0;
  const dw=w-pw, dr=r-pr;
  if(dw===0 && dr===0) return '<span class="delta same">=</span>';
  let parts=[];
  if(dw!==0) parts.push((dw>0?'+':'')+dw+'lb');
  if(dr!==0) parts.push((dr>0?'+':'')+dr+'r');
  const better = dw>0 || (dw===0&&dr>0);
  return '<span class="delta '+(better?'up':(dw<0&&dr<=0?'down':'same'))+'">'+parts.join(' ')+'</span>';
}

/* ---- bodyweight projection: the lift-prediction model, pointed at the scale ----
   Same core as the Predictions tab (anFanProject) — least-squares centre line, spread taken
   from the real scatter around it, widening with sqrt(time). What differs is only what the
   three lines MEAN: for a lift they are percentiles of an outcome you don't control, here
   they read as paces, because intake is the dial. The centre is his actual measured lb/week;
   the outer two are the leaner and heavier edges of how much his own weeks have varied.
   Fed the weekly-averaged series for the reason bodyweightSeriesSmoothed() already documents:
   daily scale noise is big enough to make a raw-point regression read flat or negative on a
   bulk that is genuinely working. */
const BW_PACE_LABEL = {10:'Leaner pace', 50:'Your pace', 90:'Heavier pace'};
const BW_RANGES = [{days:56,label:'8 weeks'},{days:84,label:'12 weeks'},{days:182,label:'6 months'}];
let bwProjRange = 84;
function bwProjChangeRange(v){ bwProjRange = +v||84; renderBulkV2(); }
function bwProjectFor(horizonDays){
  const raw = bodyweightSeries();
  return anFanProject(bodyweightSeriesSmoothed(), horizonDays, {
    minPts:4, minSpan:21,
    // three branching lines start from where he actually is today, not from a week average
    anchorV: raw.length ? raw[raw.length-1].v : null,
    whyPoints:'Needs at least 4 weeks with a weigh-in to project a bulk pace — keep logging the scale.',
    whySpan:'Needs about 3 weeks of weigh-ins before a pace means anything.'
  });
}
function bwProjectionCardHTML(){
  const res = bwProjectFor(bwProjRange);
  let h = '<div class="card"><div class="k" style="color:var(--cyan)">Bulk projection</div>'+
    '<p class="small">Where the scale lands if the next stretch looks like the last one. Same projection model as the lift Predictions tab — the centre line is your real measured lb/week, and the fan is how much your own weeks have actually bounced around it.</p>';
  if(!res.ok) return h+'<p class="small" style="color:var(--dim);margin-top:8px">'+esc(res.why)+'</p></div>';
  h += '<div style="display:flex;gap:8px;margin:10px 0">'+
    '<select onchange="bwProjChangeRange(this.value)" style="flex:none;width:auto">'+
    BW_RANGES.map(r=>'<option value="'+r.days+'"'+(r.days===bwProjRange?' selected':'')+'>'+r.label+'</option>').join('')+
    '</select></div>';
  h += anFanChartSVG(res, 640, 240, {bandFill:'rgba(70,205,186,.08)'});
  h += '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">';
  h += '<div style="display:flex;align-items:center;gap:6px">'+
    '<span style="width:9px;height:2px;background:var(--muted);display:inline-block"></span>'+
    '<span class="small">Weekly average</span></div>';
  AN_ENS_PCTS.forEach(pc=>{
    const arr = res.series[pc.p], last = arr[arr.length-1];
    const rate = (last.v - res.cur)/(bwProjRange/7);
    h += '<div style="display:flex;align-items:center;gap:6px">'+
      '<span style="width:9px;height:9px;border-radius:50%;background:'+pc.col+';display:inline-block"></span>'+

      '<span style="color:var(--dim)">('+(rate>=0?'+':'')+rate.toFixed(2)+' lb/wk)</span></span></div>';
  });
  h += '</div>';
  const pw = res.perWeek;
  // sd of 0 means the weekly averages sit exactly on the trend line. The three paces then
  // coincide, which is the honest reading of noiseless data — but say so, or three identical

  if(res.sd === 0) h += '<p class="small" style="margin-top:10px;color:var(--dim)">Your weigh-ins show no week-to-week variance at all against the trend, so all three paces land on the same single line. That will fan out as soon as the scale wobbles like a real one.</p>';
  h += '<p class="small" style="margin-top:10px;color:var(--dim)">Measured pace '+(pw>=0?'+':'')+pw.toFixed(2)+

    // bulkBand() rather than a second copy of the thresholds: this branch used to call
    // anything from +0.15 up "in the 0.5-1 pocket", exactly the bug reported on the Bulk tab.
    ({losing: 'That is negative — you are losing weight on a bulk.',
      flat:   'That is below the lean-bulk floor — the surplus is not landing.',
      under:  'That is under the 0.5–1 lb/week lean-bulk pocket, so gains are being left on the table.',
      pocket: 'That sits in the 0.5–1 lb/week lean-bulk pocket.',
      hot:    'That is above ~1 lb/week, so some of the projected gain is fat.'}[bulkBand(pw)])+
    ' The fan widens with distance because a bulk is not a straight line either.</p>';
