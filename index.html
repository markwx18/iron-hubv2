/* ===================== 5. DELOAD DETECTION ===================== */
function deloadCheck(){
  const reasons=[]; let score=0;
  const mains=['Barbell Bench Press','Barbell Back Squat'];
  // 1) main lift e1RM flat/declining over last 4 sessions
  mains.forEach(ex=>{
    const pts=e1rmSeries(ex); if(pts.length>=4){
      const recent=pts.slice(-4); const first=recent[0].v, last=recent[recent.length-1].v;
      if(last < first*0.985){ reasons.push(ex.replace('Barbell ','')+' e1RM has slipped over the last 4 sessions'); score+=2; }
      else if(last < first*1.005){ reasons.push(ex.replace('Barbell ','')+' has stalled (no e1RM gain in 4 sessions)'); score+=1; }
    }
  });
  // 2) recent grind/fail density across last ~10 logged sessions
  const recentLogs=[...S.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  let grind=0, total=0;
  recentLogs.forEach(l=>l.entries.forEach(e=>e.sets.forEach(s=>{ total++; const b=effBucket(s); if(b==='grind'||b==='fail') grind++; })));
  if(total>=10){ const pct=grind/total; if(pct>=0.4){ reasons.push(Math.round(pct*100)+'% of recent sets tagged grind/fail \u2014 effort is creeping up'); score+=2; } else if(pct>=0.25){ reasons.push('A quarter of recent sets are grinders'); score+=1; } }
  // 3) consecutive training weeks (sessions logged) without a light week
  const weeks=new Set(S.logs.map(l=>weekKeyOf(l.date)));
  if(weeks.size>=6){ reasons.push(weeks.size+' weeks of accumulated training on record'); score+=1; }
  let severity = score>=4 ? 'recommend' : score>=2 ? 'watch' : 'clear';
  return {severity, score, reasons};
}
function deloadCardHTML(){
  if(deloadActive()){
    return '<div class="card" style="border-left:3px solid var(--violet)"><div class="chart-h" style="margin-bottom:4px">Fatigue check <span class="pill" style="border-color:var(--violet);color:var(--violet)">Deloading</span></div>'+

  }

  }
  const col = d.severity==='recommend' ? 'var(--red)' : 'var(--amber)';

    : 'Not urgent, but the signals are building. Make sure you\u2019re hitting 3000+ cal and 8h sleep this week. If the grinders keep stacking up, deload next week.';
  return '<div class="card" style="border-left:3px solid '+col+'"><div class="chart-h" style="margin-bottom:6px">Fatigue check <span class="pill" style="border-color:'+col+';color:'+col+'">'+head+'</span></div>'+

}

/* ===================== 7. 1RM TEST PROTOCOL ===================== */
function oneRMRamp(target){
  target=Math.round(target);
  const round5=w=>Math.round(w/5)*5;
  const steps=[
    {pct:0,   reps:'8\u201310', rest:'\u2014',    label:'Empty bar', note:'Grease the groove'},
    {pct:.40, reps:5,          rest:'60s',  label:'Warm-up'},
    {pct:.60, reps:3,          rest:'90s',  label:'Warm-up'},
    {pct:.75, reps:2,          rest:'2 min', label:'Warm-up'},
    {pct:.85, reps:1,          rest:'2\u20133 min', label:'Primer'},
    {pct:.93, reps:1,          rest:'3\u20134 min', label:'Last primer', note:'Should move fast'},
    {pct:1.00,reps:1,          rest:'3\u20135 min', label:'1RM ATTEMPT', attempt:true},
    {pct:1.03,reps:1,          rest:'3\u20135 min', label:'If it flew \u2014 small jump', attempt:true}
  ];
  return steps.map(s=>({...s, w: s.pct===0 ? 'Bar' : round5(target*s.pct)}));
}

  let h='<p class="small">A structured warm-up ramp to a true 1-rep max. Test a main lift every 8\u201312 weeks \u2014 not more. Make sure you\u2019re fresh (ideally after a rest day) and have a spotter for bench.</p>';

/* ===================== 7b. SESSION WARM-UP =====================
   Generated off today's actual prescribed top sets, not a fixed checklist — a ramp to
   225 and a ramp to 95 are different warm-ups. Guide only: none of these sets are
   loggable, because warm-up volume must never reach progression or e1RM. */
const WARM_RAMP = [
  {pct:0,   reps:'8–10', rest:'—',      label:'Empty bar', note:'Groove the pattern, no load'},
  {pct:.40, reps:5,           rest:'45s',    label:'Ramp'},
  {pct:.55, reps:4,           rest:'60s',    label:'Ramp'},
  {pct:.70, reps:3,           rest:'75s',    label:'Ramp'},
  {pct:.85, reps:1,           rest:'2 min',  label:'Primer', note:'Should move fast — if it grinds, your top set is too heavy today'}
];
const WARM_FEEDER = [
  {pct:.50, reps:5, rest:'45s', label:'Feeder'},
  {pct:.75, reps:3, rest:'60s', label:'Feeder', note:'You’re already warm — two sets is enough'}
];
/* General prep, keyed to the day's heaviest pattern. Deliberately short: the specific
   ramp does most of the work, and a warm-up nobody finishes is worth nothing. */
const WARM_PREP = {
  squat:['5 min bike or incline walk — legs warm, light sweat','Leg swings ×10 each leg, front-to-back then side-to-side','Bodyweight squats ×10, sink into the bottom and hold the last one 10s','Ankle rocks at the wall ×10 per side — this is what stops heels lifting under load'],
  hinge:['5 min bike or brisk walk','Cat-cow ×10 — find neutral before you load it','Dowel hip hinge ×10, three points of contact on the back','Glute bridges ×15, 2s squeeze at the top'],
  push:['5 min row or bike — blood into the shoulders','Band pull-aparts ×20','Band or broomstick shoulder dislocates ×10','Push-ups ×10, slow, full lockout'],
  pull:['5 min row or bike','Band pull-aparts ×20','Dead hang 20–30s','Scapular pull-ups ×8']
};
function warmIsBarbell(nm){
  const n = ' '+String(nm).toLowerCase()+' ';
  if(/machine|cable|dumbbell|\bdb\b|kettlebell|smith|pec deck|hammer strength|assisted/.test(n)) return false;
  return /barbell|bench press|squat|deadlift|overhead press|military|\bohp\b|rack pull|good ?morning|romanian|\brdl\b|jm press|pendlay/.test(n);
}
/* Build the plan from live.exercises when a session is running (their targets are already
   autoregulated for today's readiness), otherwise from the day's prescriptions. */
function warmupSourceFor(dk){
  if(live && live.day===dk) return live.exercises.map(e=>({name:e.name, w:+e.targetW||0, heavy:e.repMode==='str'}));
  return dayExNames(dk).map(nm=>{
    let w = 0;
    // An active investigation/agent override REPLACES the progression engine's suggestion,
    // so the ramp has to be built off the override too. buildOneLiveExercise() and
    // exBlockHTML() both apply it; this path called recommend() raw, so on an overridden
    // lift the warm-up ramped toward a top weight the session was never going to use.
    const _ov = (typeof invOverrideFor==='function') ? invOverrideFor(nm) : null;
    if(_ov) w = +_ov.w||0;
    else try{ const rec = recommend(nm, currentReadinessTier()); w = +(rec.sets&&rec.sets[0]&&rec.sets[0].w)||0; }catch(e){ w = 0; }
    return {name:nm, w, heavy:isStrMode(nm)};
  });
}
function warmupPlanFor(dk){
  const src = warmupSourceFor(dk);
  if(!src.length) return null;
  const round5 = w => Math.round(w/5)*5;
  // heaviest pattern of the day drives general prep; fall back to the first lift
  const heavies = src.filter(s=>s.heavy);
  const lead = heavies[0] || src[0];
  const pattern = mesoPattern(lead.name) || 'push';
  const ramps = [];
  const rampFor = (s, steps) => ({
    name: s.name, top: s.w,
    steps: steps.filter(st=>st.pct>0 || warmIsBarbell(s.name)).map(st=>({
      label: st.label, note: st.note, pct: st.pct, reps: st.reps, rest: st.rest,
      w: st.pct===0 ? 'Bar' : Math.max(5, round5(s.w*st.pct))
    })).concat([{label:'Working set', pct:1, reps:'target', rest:'full', w:s.w, work:true}])
  });
  // full ramp for the day's first heavy lift, feeders for the rest — you only warm the
  // body up once, and re-ramping the second compound just burns the session
  src.forEach(s=>{
    if(!s.w || !s.heavy) return;
    ramps.push(rampFor(s, ramps.length===0 ? WARM_RAMP : WARM_FEEDER));
  });
  if(!ramps.length && src[0] && src[0].w) ramps.push(rampFor(src[0], WARM_RAMP));
  const accs = src.filter(s=>!s.heavy).map(s=>s.name);
  // A lift with no history has no target to ramp to. That's a reason to show the prep
  // work WITHOUT a ramp, not a reason to hide the warm-up — first sessions on a new lift
  // are exactly when the general prep matters most.
  const unknown = src.filter(s=>!s.w).map(s=>s.name);
  return {
    dk, pattern, prep: WARM_PREP[pattern] || WARM_PREP.push, ramps, unknown,
    accessories: accs, gear: gearFor(lead.name), lead: lead.name
  };
}

          (st.note?'<div class="rm-note">'+esc(st.note)+'</div>':'')+'</div>'+

function calcPlates(total){
  const out = document.getElementById('pcOut'); if(!out) return;
  total = Math.round(+total||0);
  const BAR = 45;
  if(total < BAR){ out.innerHTML='<span style="color:var(--red)">Below bar weight (45 lb)</span>'; return; }
  if(total === BAR){ out.innerHTML='Empty bar · 45 lb'; return; }
  let per = (total - BAR) / 2;
  const plates = [45,35,25,10,5,2.5];
  const used = []; let rem = per;
  plates.forEach(p=>{ while(rem >= p-0.001){ used.push(p); rem -= p; } });
  if(rem > 0.1){ out.innerHTML='<span style="color:var(--amber)">Cannot make '+total+' lb exactly with standard plates ('+rem.toFixed(1)+' lb short)</span>'; return; }
  // group plates
  const counts = {}; used.forEach(p=>counts[p]=(counts[p]||0)+1);
  const summary = plates.filter(p=>counts[p]).map(p=>counts[p]+'\u00d7'+p).join(' + ');
  out.innerHTML='<div style="color:var(--amber);font-size:15px;margin-bottom:4px">'+summary+' <span style="font-size:11px;color:var(--dim)">per side</span></div>'+
    '<div style="color:var(--muted)">Total: <b style="color:var(--text)">'+total+' lb</b> · '+used.length+' plate'+(used.length!==1?'s':'')+' per side</div>';
}

/* ===================== 8. SLEEP / PERFORMANCE ===================== */
const SLEEP_SCORE={'<6':1,'6-7':2,'7-8':3,'8+':4};
function quickLogSleep(bucket){
  const k=todayKey();
  let rd=S.readiness.find(r=>r.date===k);
  if(rd){ rd.sleep=bucket; } else { S.readiness.push({date:k, sleep:bucket, sore:'', energy:'', tier:'ok'}); }
  save(); renderSleep();
}
function sleepPerfData(){
  // pair each day's sleep bucket with that day's best e1RM across logged lifts
  const out=[];
  S.readiness.forEach(r=>{
    if(!r.sleep || !SLEEP_SCORE[r.sleep]) return;
    const log=S.logs.find(l=>l.date===r.date); if(!log) return;
    let best=0;
    log.entries.forEach(e=>e.sets.forEach(s=>{ const v=epley(+s.w||0,+s.r||0); if(v>best) best=v; }));
    if(best>0) out.push({date:r.date, sleep:SLEEP_SCORE[r.sleep], bucket:r.sleep, perf:Math.round(best)});
  });
  return out;
}
function renderSleep(){
  const el=document.getElementById('sleep'); if(!el) return;
  const today=S.readiness.find(r=>r.date===todayKey());
  let h='<p class="small">Log how you slept and the app tracks whether your strength actually tracks with sleep. Sleep is logged automatically when you do a pre-session check-in too.</p>';
  h+='<div class="card"><div class="chart-h" style="margin-bottom:8px">Last night\u2019s sleep'+(today&&today.sleep?' <span class="pill" style="border-color:var(--cyan-dim);color:var(--cyan)">logged: '+esc(today.sleep)+'h</span>':'')+'</div>'+
     '<div class="sleep-btns">'+['<6','6-7','7-8','8+'].map(b=>'<button class="'+(today&&today.sleep===b?'sel':'')+'" onclick="quickLogSleep(\''+b+'\')">'+b+'h</button>').join('')+'</div></div>';
  const data=sleepPerfData();
  if(data.length<3){
    h+='<div class="card"><p class="small">Not enough overlapping data yet \u2014 keep logging sleep and training for about a week and a correlation view will appear here. ('+data.length+'/3 days so far.)</p></div>';
  } else {
    const good=data.filter(d=>d.sleep>=3), poor=data.filter(d=>d.sleep<=2);
    const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b.perf,0)/arr.length):0;
    const gAvg=avg(good), pAvg=avg(poor);
    h+='<div class="card"><div class="chart-h" style="margin-bottom:10px">Sleep vs strength output</div>';
    if(good.length && poor.length){
      const diff=gAvg-pAvg; const pct=pAvg?Math.round(diff/pAvg*100):0;
      h+='<div class="stats" style="margin-bottom:10px">'+
        '<div class="stat"><div class="v good">'+gAvg+'</div><div class="l">Avg e1RM \u00b7 7h+ sleep</div><div class="s">'+good.length+' days</div></div>'+
        '<div class="stat"><div class="v '+(pAvg<gAvg?'bad':'')+'">'+pAvg+'</div><div class="l">Avg e1RM \u00b7 under 7h</div><div class="s">'+poor.length+' days</div></div>'+
        '</div>';
      h+='<p class="small" style="color:var(--text)">'+(diff>0
        ? 'On nights you slept 7h+, your best lifts averaged <b style="color:var(--cyan)">'+pct+'% higher</b>. The pattern is real \u2014 protect your sleep like it\u2019s part of the program, because it is.'
        : 'Interestingly, no clear strength penalty from shorter sleep in your data so far. Keep logging \u2014 small samples can hide the effect, and sleep still drives recovery and growth beyond just today\u2019s numbers.')+'</p>';
    } else {
      h+='<p class="small">You\u2019ve been consistent on one side of the sleep range \u2014 once you have a mix of good and short nights logged, the comparison will populate.</p>';
    }
    // simple trend of perf points
    h+='<div style="margin-top:10px">'+lineChart(data.map(d=>({date:d.date,v:d.perf})),'#B79BFF')+'</div></div>';
  }
  el.innerHTML=h;
}

/* ===================== 1RM LIVE MODE ===================== */
function rampRestSecs(step){
  const r = step.rest||'';
  if(!r||r==='—') return 60;
  if(/^60/.test(r)) return 60;
  if(/^90/.test(r)) return 90;
  if(/2 min$/.test(r)) return 120;
  if(/2/.test(r)&&/3/.test(r)) return 150;
  if(/3/.test(r)&&/4/.test(r)) return 210;
  if(/3/.test(r)&&/5/.test(r)) return 240;
  return 120;
}
function activate1RM(i){
  if(event) event.stopPropagation();
  const ex = live.exercises[i];
  const e1 = Math.round(bestE1RM(ex.name)||0);
  const pr = (typeof actualPR==='function') ? actualPR(ex.name) : null;
  const suggested = e1 || (pr?pr.w:0) || ex.targetW || 135;
  const inp = prompt('1RM target weight (lb) — adjust if needed:', suggested);
  if(inp===null) return; // cancelled
  const target = parseInt(inp)||suggested;
  ex._1rm = true;
  ex._1rmTarget = target;
  ex._1rmRamp = oneRMRamp(target);
  ex.sets = [];
  liveDockEff = ''; liveDockLever = null;
  saveLiveDraft();
  renderLive();
  document.getElementById('liveex-'+i).scrollIntoView({behavior:'smooth',block:'center'});
}
function cancel1RM(i){
  if(event) event.stopPropagation();
  live.exercises[i]._1rm = false;
  live.exercises[i]._1rmRamp = null;
  live.exercises[i].sets = [];
  saveLiveDraft();
  renderLive();
}
function liveExHTML_1rm(ex, i, active){
  const ramp = ex._1rmRamp || oneRMRamp(ex._1rmTarget||ex.targetW||135);
  const curStep = ex.sets.length;
  const allDone = ex.done || curStep >= ramp.length;

  let h = '<div class="liveex '+(active?'active':'')+' '+(allDone?'done':'')+'" id="liveex-'+i+'">';
  // header
  h += '<div class="liveex-head" onclick="focusLiveEx('+i+')">';
  h += '<div class="liveex-name">'+esc(ex.name)+
    '<button class="ex-info-btn" onclick="event.stopPropagation();showExInfo(\''+esc(ex.name).replace(/'/g,"\\'")+'\')">&#9432;</button></div>';
  h += '<div class="liveex-chips">';
  h += '<span class="pill" style="border-color:var(--violet-dim);color:var(--violet)">1RM TEST</span>';
  if(!allDone) h += '<span class="pill" style="border-color:var(--amber);color:var(--amber)">Step '+(curStep+1)+'/'+ramp.length+'</span>';
  if(allDone)  h += '<span class="pill" style="border-color:var(--cyan-dim);color:var(--cyan)">\u2713 Done</span>';
  h += '<button class="ex-info-btn" onclick="cancel1RM('+i+')" style="color:var(--muted);font-size:11px;margin-left:4px">\u00d7 cancel</button>';
  h += '</div></div>';

  // ramp step list
  h += '<div class="liveex-sets">';
  ramp.forEach((step, si)=>{
    const logged = ex.sets[si];
    const isPast = si < curStep;
    const isCur  = si === curStep && !allDone;
    h += '<div class="lset '+(isPast?'logged':'')+'" style="'+(isCur?'background:rgba(246,134,47,0.05)':'')+'">'+
      '<span class="lsn" style="min-width:18px">'+(isPast?'\u2713':isCur?'\u25b8':'\u25cb')+'</span>'+
      '<span class="lval" style="color:var('+(isPast?'--cyan':isCur?'--text':'--dim')+')">'+(step.w==='Bar'?'Bar':step.w+' lb')+
        '<span class="x" style="margin:0 3px">\u00d7</span>'+(isPast&&logged?logged.r:step.reps)+'</span>'+
      '<span style="font-family:var(--mono);font-size:10px;color:var('+(step.attempt?'--amber':'--muted')+');margin-left:8px">'+esc(step.label)+(step.pct>0?' \u00b7 '+Math.round(step.pct*100)+'%':'')+'</span>'+
      (step.rest&&step.rest!=='\u2014'?'<span style="font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto">'+esc(step.rest)+'</span>':'')+
      '</div>';
  });
  h += '</div>';

  // dock — active step
  if(active && !allDone && curStep < ramp.length){
    const step = ramp[curStep];
    const isAttempt = !!step.attempt;
    h += '<div class="livedock">';
    h += '<div class="dock-presc" style="color:var('+(isAttempt?'--amber':'--muted')+');font-weight:'+(isAttempt?700:400)+'">';
    h += esc(step.label)+(step.pct>0?' \u00b7 '+Math.round(step.pct*100)+'%':'')+(step.note?' \u2014 <em style="color:var(--dim)">'+esc(step.note)+'</em>':'');
    h += '</div>';
    if(step.w!=='Bar' && isPlateLift(ex.name)){
      const pc = plateCalc(+step.w); if(pc) h += '<div class="dock-presc" style="color:var(--muted)">Per side: '+esc(pc.txt)+'</div>';
    }
    h += '<div class="dockrow">'+
      '<div class="field"><label>Weight (lb)</label><input id="dockW" inputmode="decimal" value="'+(step.w==='Bar'?45:step.w)+'"></div>'+
      '<div class="field"><label>Reps</label><input id="dockR" inputmode="numeric" placeholder="'+(typeof step.reps==='number'?step.reps:step.reps)+'"></div>'+
      '</div>';
    if(isAttempt){
      h += '<div class="efftog">'+
        ['easy','solid','grind','fail'].map(e=>'<button class="'+(liveDockEff===e?'sel e-'+e:'')+'" onclick="pickEff(\''+e+'\')">'+e+'</button>').join('')+
        '</div>';
    }
    h += '<div class="dockbtns">'+
      '<button class="btn primary" onclick="logLiveSet('+i+')">'+(isAttempt?'Log attempt':'Log set')+'</button>'+
      (curStep>=ramp.length-1?'<button class="btn" onclick="finishExercise('+i+')">Done with this lift</button>':'')+
      '</div>';
    h += '</div>';
    h += '<div id="restSlot"></div>';
  } else if(allDone && active){
    h += '<div class="livedock"><div class="dock-presc" style="color:var(--cyan)">All ramp steps logged. Move on when ready.</div>'+
      '<div class="dockbtns"><button class="btn" onclick="finishExercise('+i+')">Mark done</button></div></div>';
  }

  h += '</div>';
  return h;
}

/* ===================== ENGINE DECISION CLASSIFIER ===================== */
/* Mirrors recommend()'s decision tree, returns a structured, concise decision
   for the internal system logger. One entry per exercise per session. */
function classifyDecision(ex, ready){
  const nm = exName(ex);
  const hist = historyFor(nm);
  const ff = isFormFocus(nm);
  const rm = exRepMode(nm);
  const lo = ff ? FORM_LO : rm.lo, hi = ff ? FORM_HI : rm.hi;
  if(!hist.length) return {code:'first', from:null, to:null, moved:false,
    reason:'First time logging this lift \u2014 no target set yet. Pick a weight for '+lo+'\u2013'+(lo+2)+' clean reps.'};
  const last = hist[0];
  const topW = Math.max(...last.sets.map(s=>+s.w||0));
  const topSets = last.sets.filter(s=>(+s.w||0)===topW);
  const minReps = Math.min(...topSets.map(s=>+s.r||0));
  const maxReps = Math.max(...topSets.map(s=>+s.r||0));
  const str = !ff && isStrMode(nm);
  const ceilReps = str ? maxReps : minReps;
  let inc = incForExercise(nm);
  const effs = topSets.map(effBucket).filter(Boolean);
  const hadFail = effs.includes('fail');
  const hadGrind = effs.includes('grind') || hadFail;
  const _mean = effMean(topSets);   // see the note in recommend()
  const allEasy = (_mean !== null && effs.length===topSets.length)
                  ? _mean >= 85
                  : (effs.length===topSets.length && effs.length>0 && effs.every(e=>e==='easy'));

  if(isBodyweight(nm)) return {code:'bw', from:null, to:null, moved:false,
    reason:'Bodyweight movement \u2014 progression tracked by reps and control, not load.'};

  if(ff){
    const streak = consecutiveEasyStreak(hist);
    if(hadFail){ const dw=Math.max(topW-inc,inc); return {code:'form-back', from:topW, to:dw, moved:true,
      reason:'Form Focus: a set broke down last time \u2014 stepped back '+topW+'\u2192'+dw+' lb to rebuild clean reps.'}; }
    if(streak>=FORM_STREAK_NEEDED){ const nw=topW+inc; return {code:'form-increase', from:topW, to:nw, moved:true,
      reason:'Form Focus: '+streak+' straight sessions tagged easy across all sets \u2014 control earned the bump '+topW+'\u2192'+nw+' lb.'}; }
    if(minReps<lo) return {code:'form-build', from:topW, to:topW, moved:false,
      reason:'Form Focus: last dipped below '+lo+' reps \u2014 held at '+topW+' lb to rebuild control before loading.'};
    return {code:'form-hold', from:topW, to:topW, moved:false,
      reason:'Form Focus: held at '+topW+' lb \u2014 '+streak+'/'+FORM_STREAK_NEEDED+' easy sessions logged toward the next bump.'};
  }

  let stall=false;
  if(hist.length>=3){
    const w2=Math.max(...hist[1].sets.map(s=>+s.w||0)), w3=Math.max(...hist[2].sets.map(s=>+s.w||0));
    if(w2===topW && w3===topW){
      const ts2=hist[1].sets.filter(s=>+s.w===w2);
      const ceil2 = str ? Math.max(...ts2.map(s=>+s.r||0)) : Math.min(...ts2.map(s=>+s.r||0));
      if(ceilReps<=ceil2) stall=true;
    }
  }
  if(ceilReps>=hi){
    if(isMaxed(nm)){
      // Earned a jump, but there's no heavier setting to jump to. Keep the load and let the
      // rep ceiling drift up rather than telling him to add weight that doesn't exist.
      return {code:'maxed-ceiling', from:topW, to:topW, moved:false,
        reason:'Hit the '+hi+'-rep ceiling at '+topW+' lb, but this machine is MAXED \u2014 no heavier setting. Add a rep beyond '+hi+', add a set, or slow the eccentric instead of adding load.'};
    }
    if(ready==='low') return {code:'defer', from:topW, to:topW, moved:false,
      reason:'Earned the jump (hit '+hi+' reps), but readiness was low \u2014 deferred, repeated '+topW+' lb to take the jump fresh.'};
    if(allEasy){ const nw=topW+inc*2; return {code:'double', from:topW, to:nw, moved:true,
      reason:'Hit the '+hi+'-rep ceiling AND all sets tagged easy \u2014 double jump '+topW+'\u2192'+nw+' lb.'}; }
    const nw=topW+inc; return {code:'increase', from:topW, to:nw, moved:true,
      reason:'Hit the '+hi+'-rep ceiling ('+(str?'top set':'every top set')+') \u2014 weight up '+topW+'\u2192'+nw+' lb, reps reset to '+lo+'.'+(hadGrind?' (last was a grind \u2014 expect heavy.)':'')};
  }
  if(stall && isMaxed(nm)) return {code:'maxed-hold', from:topW, to:topW, moved:false,
    reason:'Holding at '+topW+' lb \u2014 this machine is MAXED, so a flat weight here is the ceiling, not a stall. Chase reps or an extra set.'};
  if(stall) return {code:'stall', from:topW, to:topW, moved:false,
    reason:'3 sessions at '+topW+' lb with no rep progress \u2014 held to break the stall (tighten rest or drop 10% to rebuild).'};
  if(minReps>=lo){
    let r='In range but not at ceiling \u2014 held at '+topW+' lb, '+(str?'push top set to '+hi+' reps':'add a rep to your weakest set')+' before load moves.';
    if(allEasy) r='In range and all tagged easy \u2014 held at '+topW+' lb but leaving reps in the tank; take sets 1\u20132 shy of failure.';
    else if(hadFail) r='In range with a failed set \u2014 held at '+topW+' lb to win back the reps cleanly.';
    return {code:'hold', from:topW, to:topW, moved:false, reason:r};
  }
  if(hadFail){ const dw=Math.max(topW-inc,inc); return {code:'deload-back', from:topW, to:dw, moved:true,
    reason:'Below range with failure tags \u2014 stepped back '+topW+'\u2192'+dw+' lb to own the range, then climb.'}; }
  return {code:'build', from:topW, to:topW, moved:false,
    reason:'Below range \u2014 held at '+topW+' lb to climb back to '+lo+' reps per set before adding load.'};
}

/* Retro decision for logs saved without a stored decision (old/manual/screenshot).
   Compares each exercise's top weight to the previous non-deload session. */
function retroDecision(log, exercise){
  const priors = [...S.logs].filter(l=>l.date<log.date && !l.deload && l.entries.some(e=>e.exercise===exercise))
    .sort((a,b)=>b.date.localeCompare(a.date));
  const cur = log.entries.find(e=>e.exercise===exercise);
  if(!cur) return null;
  const curTop = Math.max(...cur.sets.map(s=>+s.w||0));
  if(!priors.length) return {moved:false, reason:'First recorded session for this lift.'};
  const prev = priors[0].entries.find(e=>e.exercise===exercise);
  const prevTop = Math.max(...prev.sets.map(s=>+s.w||0));
  if(curTop>prevTop) return {moved:true, reason:'Weight moved up '+prevTop+'\u2192'+curTop+' lb vs previous session.'};
  if(curTop<prevTop) return {moved:true, reason:'Weight stepped down '+prevTop+'\u2192'+curTop+' lb vs previous session.'};
  return {moved:false, reason:'Held at '+curTop+' lb (same as previous session).'};
}

  const mw = (typeof mesoCurrentWeek==='function') ? mesoCurrentWeek() : null;
  return !!(mw && mw.type==='deload' && !mw.deloadEnded);
}
function startDeloadWeek(untilOverride, startOverride){

/* build deload version of an exercise: 60% of last real working weight, 2 sets */

/* ===================== IDEAL PROJECTION + DUAL LINE CHART ===================== */
function idealRateWeekly(ex){
  const nm = exName(ex);
  // compounds progress faster in absolute terms; use % of starting e1RM per week
  if(isPlateLift(nm) || isStrMode(nm) || /squat|bench|deadlift|press|row/i.test(nm)) return 0.0125;
  return 0.0075;
}
function idealSeries(ex, actualPts){
  if(!actualPts || actualPts.length<1) return [];
  const start = actualPts[0].v;
  const t0 = new Date(actualPts[0].date).getTime();
  const rate = idealRateWeekly(ex); // fraction of start per week (linear)
  return actualPts.map(p=>{
    const wks = (new Date(p.date).getTime()-t0)/(7*86400000);
    return {date:p.date, v: Math.round((start + start*rate*wks)*10)/10};
  });
}
function dualLineChart(actual, ideal){
  const W=700, H=200, P=36;
  if(!actual.length) return '<p class="small">No data yet.</p>';
  if(actual.length===1){
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto"><circle cx="'+(W/2)+'" cy="'+(H/2)+'" r="4" fill="var(--amber)"/><text x="'+(W/2)+'" y="'+(H/2-12)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+actual[0].v+' lb e1RM \u2014 log another session to see the trend</text></svg>';
  }
  const all = actual.concat(ideal);
  const t0=new Date(actual[0].date).getTime(), t1=new Date(actual[actual.length-1].date).getTime()||t0+1;
  const vmin=Math.min(...all.map(p=>p.v)), vmax=Math.max(...all.map(p=>p.v));
  const pad=(vmax-vmin)*0.15||5;
  const x=t=>P+((t-t0)/(t1-t0||1))*(W-2*P);
  const y=v=>H-P-((v-(vmin-pad))/((vmax+pad)-(vmin-pad)))*(H-2*P);
  const pathOf=pts=>{ let d=''; pts.forEach((p,i)=>{ d+=(i?'L':'M')+x(new Date(p.date).getTime()).toFixed(1)+' '+y(p.v).toFixed(1)+' '; }); return d; };
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  [vmin,(vmin+vmax)/2,vmax].forEach(v=>{
    svg+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/>'+
         '<text x="'+(P-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--dim)">'+Math.round(v)+'</text>';
  });
  // ideal (behind, lower opacity, dashed)
  if(ideal.length>=2){
    svg+='<path d="'+pathOf(ideal)+'" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-dasharray="5 5" opacity="0.4" stroke-linejoin="round"/>';
  }
  // actual (front, solid)
  svg+='<path d="'+pathOf(actual)+'" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round"/>';
  actual.forEach(p=>{ svg+='<circle cx="'+x(new Date(p.date).getTime())+'" cy="'+y(p.v)+'" r="3.5" fill="var(--amber)"/>'; });
  svg+='<text x="'+P+'" y="'+(H-8)+'" font-size="10" fill="var(--dim)">'+fmtDate(actual[0].date)+'</text>';
  svg+='<text x="'+(W-P)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="var(--dim)">'+fmtDate(actual[actual.length-1].date)+'</text>';
  svg+='</svg>';
  return svg;
}

/* ============================================================
   REPLACEMENT TIER LIST — S..F ranking of swap candidates

   There is no exercise catalogue in this app. Every name is free text Mark typed at some
   point, so "similar exercise" has to be DERIVED rather than looked up. Three signals,
   ordered by how much they can be trusted:

     1. Muscle overlap  — musclesFor() already resolves any name to primary/secondary groups
        (explicit map first, keyword inference after), so this is the only signal that
        exists for every name, including one typed once and never repeated. It carries the
        most weight for exactly that reason.
     2. Movement pattern — vertical vs horizontal push/pull, hinge, squat, and the isolation
        patterns, read off the name. Same muscles trained a DIFFERENT way is a worse
        replacement than the same muscles trained the same way, and muscle overlap alone
        cannot tell those apart (a fly and a bench press are both "chest").
     3. Equipment class  — barbell / dumbbell / cable / machine / bodyweight, also from the
        name. This is the "can I actually do this instead, right now, in this gym" signal.

   Reading equipment and pattern out of the name is not a new trick here: gearFor() and
   mesoPattern() already do it, and his naming is consistent enough to support it.

   This is deliberately a heuristic and NOT an agent call. The list opens mid-set with a bar
   racked, so it has to be instant and work with no network; the agents run once nightly and
   an on-demand call would put a spinner between him and a swap. It also has to rank the same
   way every time, or the tiers never become something he can trust at a glance.
   ============================================================ */
const SWAP_TIERS = [
  {key:'S', min:82, col:'var(--cyan)',   blurb:'near-identical'},
  {key:'A', min:70, col:'var(--amber)',  blurb:'strong swap'},
  {key:'B', min:57, col:'var(--violet)', blurb:'solid, trains it a bit differently'},
  {key:'C', min:44, col:'var(--muted)',  blurb:'partial overlap'},
  {key:'D', min:30, col:'var(--dim)',    blurb:'weak — only if nothing better is free'},
  {key:'F', min:0,  col:'var(--dim)',    blurb:'not a replacement'}
];
const SWAP_SHOW_FLOOR = 44;   // C
const SWAP_THIN_FLOOR = 30;   // D, only when the field above is thin
/* Free-weight vs pin-loaded neighbours: not the same, but close enough to part-credit. */
const SWAP_EQUIP_KIN = {machine:['cable'], cable:['machine'], barbell:['dumbbell'], dumbbell:['barbell','kettlebell'], kettlebell:['dumbbell']};
function swapEquip(nm){
  const n = ' '+String(nm).toLowerCase()+' ';
  // machine first: "Plate-Loaded Lat Pulldown" is a machine, not a cable stack
  if(/plate.?loaded|machine|pec deck|smith|hack squat|\bsled\b|leg press|selector/.test(n)) return 'machine';
  if(/cable|pulldown|pushdown|\brope\b/.test(n)) return 'cable';
  if(/barbell|\bez bar\b|\bez\b|trap bar/.test(n)) return 'barbell';
  if(/dumbbell|\bdb\b/.test(n)) return 'dumbbell';
  if(/kettlebell|\bkb\b/.test(n)) return 'kettlebell';
  if(/\bdips?\b|pull-?ups?|chin-?ups?|push.?up|hanging|body ?weight/.test(n)) return 'bodyweight';
  return null;
}
/* Finer than mesoPattern(), which only needs squat/hinge/pull/push to keep a rotation from
   stacking heavy days. Swapping needs the isolation patterns too, and needs vertical and
   horizontal split apart — bench and overhead press share "push" but do not replace each
   other. */
function swapPattern(nm){
  const n = ' '+String(nm).toLowerCase()+' ';
  if(/leg curl|lying leg curl/.test(n)) return 'knee-flex';       // before the generic curl test
  if(/leg extension/.test(n)) return 'knee-ext';                  // before mesoPattern calls it a squat
  if(/wrist curl/.test(n)) return 'wrist';
  if(/curl/.test(n)) return 'elbow-flex';
  if(/pushdown|skull|\bjm\b|tricep|overhead extension|kickback/.test(n)) return 'elbow-ext';
  if(/lateral raise|side raise|\blat raise\b/.test(n)) return 'lat-raise';
  if(/rear delt|reverse fly|face pull|prone reverse/.test(n)) return 'rear-delt';
  if(/\bfly\b|\bflye\b|pec deck/.test(n)) return 'chest-fly';
  if(/crunch|leg raise|abdominal|sit.?up|plank|ab wheel/.test(n)) return 'trunk-flex';
  if(/calve|calf/.test(n)) return 'calf';
  if(/abductor|adductor/.test(n)) return 'hip-abd';
  if(/pulldown|pull-?ups?|chin-?ups?|pullover/.test(n)) return 'vert-pull';
  if(/\brows?\b|shrug/.test(n)) return 'horiz-pull';
  if(/overhead press|shoulder press|military|\bohp\b|push press|arnold/.test(n)) return 'vert-push';
  if(/bench|chest press|incline|decline|floor press|\bdips?\b|push.?up|landmine/.test(n)) return 'horiz-push';
  return mesoPattern(nm);   // squat / hinge, or null
}
/* 0..100, or null when there is nothing to compare on. */
function swapScore(from, to){
  const A = musclesFor(from), B = musclesFor(to);
  const ap = A.p||[], as = A.s||[], bp = B.p||[], bs = B.s||[];
  if(!ap.length || !bp.length) return null;
  // Primary agreement as a fraction of the union, so a one-group lift matching a one-group
  // lift scores as fully as a two-group lift matching both — not half as well.
  const shared = ap.filter(g=>bp.includes(g)).length;
  const union = new Set(ap.concat(bp)).size;
  let score = 58 * (shared/union);
  // a primary that only turns up as the other's secondary is real, but thinner
  score += 9 * ap.filter(g=>bs.includes(g)).length;
  score += 9 * bp.filter(g=>as.includes(g)).length;
  score += 4 * as.filter(g=>bs.includes(g)).length;
  score = Math.min(score, 62);
  const pa = swapPattern(from), pb = swapPattern(to);
  if(pa && pb) score += (pa===pb) ? 20 : -4;
  const ea = swapEquip(from), eb = swapEquip(to);
  if(ea && eb){
    if(ea===eb) score += 12;
    else if((SWAP_EQUIP_KIN[ea]||[]).includes(eb)) score += 6;
  }
  // already proven: he has logged it, so there's a real working weight to start from
  const logged = historyFor(to).length;
  if(logged >= 3) score += 8; else if(logged >= 1) score += 5;
  return Math.max(0, Math.min(100, Math.round(score)));
}
function swapTierFor(score){
  return (SWAP_TIERS.find(t=>score>=t.min) || SWAP_TIERS[SWAP_TIERS.length-1]).key;
}
/* His names are free text typed over months, so the pool holds genuine near-duplicates
   ("Hanging Leg Raise" / "Hanging Leg Raises"). Collapse them or the top tier spends two
   slots saying the same thing. */
function swapDedupeKey(nm){ return invNormName(nm).replace(/s\b/g,''); }
function swapCandidates(from, opts){
  opts = opts || {};
  const skip = new Set([from].concat(opts.exclude||[]).map(invNormName));
  const best = {};
  allKnownExerciseNames().forEach(nm=>{
    if(skip.has(invNormName(nm))) return;
    const score = swapScore(from, nm);
    if(score == null) return;
    const logged = historyFor(nm).length;
    const k = swapDedupeKey(nm);
    // keep the spelling he actually trains under, then the better-scoring one
    if(!best[k] || logged > best[k].logged || (logged === best[k].logged && score > best[k].score)){
      best[k] = {name:nm, score, logged, tier:swapTierFor(score)};
    }
  });
  const rows = Object.keys(best).map(k=>best[k])
    .sort((a,b)=> b.score-a.score || b.logged-a.logged || a.name.localeCompare(b.name));
  // Never pad the list to look full. Show what is genuinely good; only reach down into D
  // when there is barely anything above it, and never show F at all — a list that is always
  // the same length teaches him nothing about which lifts have real alternatives.
  let out = rows.filter(r=>r.score >= SWAP_SHOW_FLOOR);
  // Thin field: reach down one tier, but keep it short. Handing back seven D-tier rows would
  // be the padding this is meant to avoid, just spelled differently.
  if(out.length < 3) out = rows.filter(r=>r.score >= SWAP_THIN_FLOOR).slice(0,5);
  return out.slice(0, opts.limit || 12);
}
/* Rendered rows are indexed into this so a name with quotes or an apostrophe can never

/* ============================================================
   INVESTIGATION SYSTEM — diagnose, recommend, apply, resolve
   Categories: bulk | lift | split  ·  Severity: yellow < orange < red
   ============================================================ */
function invState(){
  if(!S.invest) S.invest = {flags:[], history:[], lastAuto:{}, overrides:{}};
  if(!S.invest.overrides) S.invest.overrides = {};
  if(!S.invest.history) S.invest.history = [];
  if(!S.invest.lastAuto) S.invest.lastAuto = {};
  return S.invest;
}
function invUid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const INV_SEV_RANK = {yellow:1, orange:2, red:3};
const INV_SEV_COLOR = {yellow:'#dfae36', orange:'var(--amber)', red:'var(--red)'};
const INV_SEV_LABEL = {yellow:'ADVISORY', orange:'WATCH', red:'WARNING'}; // display text only \u2014 internal severity keys (yellow/orange/red) stay as-is everywhere else
const INV_CAT_LABEL = {bulk:'BULK', lift:'STRENGTH', split:'SPLIT'};

/* -------------------- INVESTIGATORS (pure analysis) -------------------- */
/* Each returns {severity:null|'yellow'|'orange'|'red', key, title, findings:[], fix:{label, desc, type, payload}} */

function investigateBulk(){
  const sm = bodyweightSeriesSmoothed();
  const f = S.fuel||{};
  const cal = f.calTarget||3000, pro = f.proTarget||150;
  const findings = [];
  if(sm.length < 3){
    return {severity:null, key:'bulk', title:'Bulk check', findings:['Fewer than 3 weeks of bodyweight data \u2014 not enough to judge a trend yet. Keep weighing in most mornings.'], fix:null};
  }
  // Shared with renderBulk() and the projection card so all three quote the same number.
  const br = bulkRate(4);
  const rate = br ? br.rate : 0;
  const cur = br ? br.cur : sm[sm.length-1].v;
  const nWeeks = br ? br.weeks : sm.slice(-4).length;
  findings.push('Trailing rate: '+(rate>=0?'+':'')+rate.toFixed(2)+' lb/week (weekly-averaged, last '+nWeeks+' weeks). Current: '+cur.toFixed(1)+' lb.');
  const proFloor = Math.round(cur*0.95); // ~1g/lb guideline
  let severity=null, title='Bulk on track', fix=null;
  if(rate < -0.15){
    severity='red'; title='Losing weight mid-bulk';
    findings.push('You\u2019re in a deficit or at maintenance despite bulking intent \u2014 muscle gain is severely limited without a surplus.');
    fix={label:'Raise calorie target +300', desc:'Bump daily target '+cal+' \u2192 '+(cal+300)+' cal. Re-check in two weeks \u2014 the goal is +0.5\u20131 lb/week.', type:'cal', payload:{delta:300}};
  } else if(rate < 0.25){
    severity='orange'; title='Bulk rate too slow';
    findings.push('Under the 0.5\u20131 lb/week lean-bulk pocket \u2014 progress is being left on the table.');
    fix={label:'Raise calorie target +250', desc:'Bump daily target '+cal+' \u2192 '+(cal+250)+' cal to get into the 0.5\u20131 lb/week band.', type:'cal', payload:{delta:250}};
  } else if(rate > 1.5){
    severity='orange'; title='Bulk rate too fast';
    findings.push('Above ~1.5 lb/week \u2014 at this pace a meaningful share of the gain is fat, not muscle.');
    fix={label:'Trim calorie target \u2212200', desc:'Drop daily target '+cal+' \u2192 '+(cal-200)+' cal to settle back toward 1 lb/week.', type:'cal', payload:{delta:-200}};
  } else if(rate > 1.0){
    severity='yellow'; title='Bulk slightly hot';
    findings.push('Slightly above the 1 lb/week upper bound \u2014 fine short-term, worth watching.');
    fix=null;
  }
  // proFloor is a rule of thumb (~1g/lb), not a precise number, and it drifts by a gram
  // every time bodyweight ticks up. Comparing the target to it exactly produced findings
  // like "raise protein 150 \u2192 151g" \u2014 a prescription with no nutritional meaning that also
  // burned the one fix slot on the flag. Only speak up on a materially low target, and
  // recommend a round number rather than the raw floor.
  const PRO_SLACK = 10;
  if(pro < proFloor - PRO_SLACK){
    const proGoal = Math.ceil(proFloor/5)*5;
    findings.push('Protein target '+pro+'g is well under the ~1g/lb guideline ('+proFloor+'g at your weight).');
    if(!fix && severity===null){ severity='yellow'; title='Protein target low'; }
    if(!fix) fix={label:'Raise protein to '+proGoal+'g', desc:'Set protein target '+pro+' \u2192 '+proGoal+'g/day.', type:'pro', payload:{to:proGoal}};
  }
  return {severity, key:'bulk', title, findings, fix};
}

/* Heaviest weight actually loaded in the most recent non-deload session of this lift.
   Reset targets MUST be built from this, never from e1RM. e1RM is an Epley-estimated
   one-rep max, so any fraction of it lands well above a real working set \u2014 a 225x10
   working set estimates to ~300 e1RM, and 90% of that is 270, a weight never actually
   lifted. deloadExercise() already anchors to real working weight; the investigation
   resets were the odd one out. */
function invLastWorkingWeight(nm){
  const hist = historyFor(nm); // newest first, deloads already excluded
  if(!hist.length) return 0;
  return Math.max(0, ...hist[0].sets.map(s=>+s.w||0));
}

function investigateLift(nm){
  const pts = e1rmSeries(nm, {excludeHome:true});
  const findings = [];
  if(pts.length < 4){
    return {severity:null, key:'lift:'+nm, title:nm, findings:['Only '+pts.length+' logged session'+(pts.length===1?'':'s')+' \u2014 not enough history to judge a trend.'], fix:null};
  }
  const recent = pts.slice(-6);
  const reg = linreg(recent);
  const slope = reg ? reg.slope*7 : 0;
  const cur = recent[recent.length-1].v;
  const spanWks = (new Date(recent[recent.length-1].date)-new Date(recent[0].date))/(7*86400000);
  findings.push('e1RM trend over last '+recent.length+' sessions ('+Math.round(spanWks*10)/10+' wks): '+(slope>=0?'+':'')+slope.toFixed(1)+' lb/wk. Current e1RM: '+Math.round(cur)+' lb.');
  // grind/fail density over last 6 sessions of this lift
  const hist = historyFor(nm).slice(0,6);
  let tagged=0, hard=0;
  hist.forEach(h=>h.sets.forEach(s=>{ const b=effBucket(s); if(b){tagged++; if(b==='grind'||b==='fail')hard++;} }));
  const hardPct = tagged? Math.round(100*hard/tagged) : null;
  if(hardPct!=null) findings.push('Effort mix (last '+hist.length+' sessions): '+hardPct+'% of tagged sets were grind/fail.');
  // stall length: sessions at same top weight without ceiling
  const declinePct = recent.length>=2 ? (cur - Math.max(...recent.map(p=>p.v)))/Math.max(...recent.map(p=>p.v)) : 0;

  let severity=null, title=nm+' on track', fix=null;
  const bestRecent = Math.max(...recent.map(p=>p.v));
  if(slope < -1.0 && cur < bestRecent*0.96){
    severity='red'; title=nm+' declining';
    findings.push('Clear downward trend \u2014 you\u2019re losing ground on this lift, not just plateauing.');
    const baseW = invLastWorkingWeight(nm);
    const resetW = baseW ? Math.max(Math.round((baseW*0.9)/5)*5, 5) : 0;
    fix = resetW ? {label:'Reset & rebuild at ~90%', desc:'Set next targets to ~'+resetW+' lb \u2014 about 90% of your last working weight ('+baseW+' lb) \u2014 for 2 weeks and climb back with clean reps. Momentum beats grinding a declining max. (Auto-expires after 14 days.)', type:'liftReset', payload:{name:nm, w:resetW, days:14}} : null;
  } else if(slope < -0.3){
    severity='orange'; title=nm+' trending down';
    findings.push('Mild decline over recent sessions \u2014 could be fatigue, sleep, or accumulated grinding.');
    if(hardPct!=null && hardPct>=40){
      fix={label:'Start deload week', desc:'High grind density plus a downward trend is the classic overreach signature. A deload week ('+'~60% loads) usually restores the trend within 1\u20132 weeks after.', type:'deload', payload:{}};
    } else {
      const baseW = invLastWorkingWeight(nm);
      const resetW = baseW ? Math.max(Math.round((baseW*0.92)/5)*5, 5) : 0;
      fix = resetW ? {label:'Light reset at ~92%', desc:'Take next sessions at ~'+resetW+' lb \u2014 about 92% of your last working weight ('+baseW+' lb) \u2014 and rebuild rep quality. (Auto-expires after 10 days.)', type:'liftReset', payload:{name:nm, w:resetW, days:10}} : null;
    }
  } else if(Math.abs(slope) <= 0.3 && spanWks >= 3){
    if(isMaxed(nm)){
      // No heavier setting exists on this machine, so a flat LOAD trend isn't a stall \u2014 it's
      // the equipment ceiling. e1RM is load-derived, so it will read flat by definition here.
      findings.push('Flat, but this lift is marked MAXED \u2014 there\u2019s no heavier setting on the machine, so load can\u2019t climb. Progress here shows up as more reps or sets at the same weight, not a higher e1RM. Not flagged.');
      return {severity:null, key:'lift:'+nm, title:nm+' flat (at machine ceiling)', findings, fix:null};
    }
    const _mw = (typeof mesoCurrentWeek==='function') ? mesoCurrentWeek() : null;
    if(_mw && _mw.type==='hyp'){
      // flat e1RM during a hypertrophy block is the expected outcome, not a problem
      findings.push('Flat, but you\u2019re in a hypertrophy block (week '+_mw.blockWeek+' of '+_mw.blockLen+') \u2014 holding e1RM while adding volume is expected here. Not flagged.');
      return {severity:null, key:'lift:'+nm, title:nm+' flat (expected in hypertrophy block)', findings, fix:null};
    }
    severity='yellow'; title=nm+' flat';
    findings.push('No meaningful movement in either direction for '+Math.round(spanWks)+'+ weeks.');
    if(hardPct!=null && hardPct>=50){
      fix={label:'Start deload week', desc:'Flat trend with heavy grinding \u2014 recovery is likely the limiter. Deload, then push again.', type:'deload', payload:{}};
    } else {
      findings.push('Effort tags don\u2019t show excessive grinding \u2014 this may just need more food, sleep, or patience. No forced fix recommended; the progression engine will hold weight until reps climb.');
    }
  }
  return {severity, key:'lift:'+nm, title, findings, fix};
}

function investigateSplit(){
  const {start, end} = lastCompletedWeekRange();
  const vol = weeklyVolumeByGroup(start, end);
  const trained = S.logs.some(l=>l.date>=start && l.date<=end);
  const findings = [];
  if(!trained){
    return {severity:null, key:'split', title:'Split check', findings:['No sessions logged in the last completed week \u2014 nothing to review yet.'], fix:null};
  }
  const gaps = MUSCLE_GROUPS.filter(g=>g!=='Abs').map(g=>({g, v:vol[g]})).filter(x=>x.v<10).sort((a,b)=>a.v-b.v);
  const stale = staleExercises();
  let severity=null, title='Split balanced', fix=null;
  if(gaps.length){
    const worst = gaps[0];
    severity = worst.v < 6 ? 'orange' : 'yellow';
    title = gaps.length===1 ? (worst.g+' volume light') : (gaps.length+' muscle groups under target');
    gaps.forEach(x=>findings.push(x.g+': '+(Math.round(x.v*10)/10)+' sets last week (guide: 10\u201320).'));
    const sug = invSuggestAccessory(worst.g);
    if(sug) fix={label:'Add '+sug+' to your split', desc:'Adds '+sug+' to your lightest applicable day to close the '+worst.g+' gap. Permanent split change \u2014 remove it any time in Settings.', type:'addEx', payload:{name:sug, group:worst.g}};
  }
  if(stale.length){
    stale.slice(0,3).forEach(s=>findings.push(s.name+': flat ~'+s.weeks+' wks (best e1RM '+s.bestRecent+' lb, was '+s.bestOlder+').'));
    if(!severity) { severity='yellow'; title = stale.length===1 ? (stale[0].name+' gone stale') : (stale.length+' lifts gone stale'); }
    else severity = INV_SEV_RANK[severity]>=2 ? severity : 'yellow';
    if(!fix){
      const s0 = stale[0];
      const alt = invSuggestSwap(s0.name);
      if(alt) fix={label:'Swap '+s0.name+' \u2192 '+alt, desc:'Same muscle group, fresh stimulus. Permanent split change \u2014 the old exercise\u2019s history stays saved if you ever bring it back.', type:'swapEx', payload:{from:s0.name, to:alt}};
    }
  }
  if(!findings.length) findings.push('All muscle groups hit 10+ sets last week and nothing is stale. Keep rolling.');
  return {severity, key:'split', title, findings, fix};
}

/* accessory suggestion pools per muscle group (names chosen to resolve in EX_MUSCLES/musclesFor) */
const INV_ACC_POOL = {
  Chest:['Cable Fly','Pec Fly Machine','Incline Dumbbell Press','Machine Chest Press'],
  Back:['Lat Pulldown','Seated Cable Row','Chest Supported Row','Straight Arm Pulldown'],
  Shoulders:['Cable Lateral Raise','Dumbbell Lateral Raise','Rear Delt Machine','Seated Overhead Press Machine'],
  Biceps:['Incline Dumbbell Curl','Preacher Curl Machine','Hammer Curl','Cable Curl'],
  Triceps:['JM Press','Cable Pushdown','Overhead Cable Extension','Seated DB Overhead Extension'],
  Quads:['Leg Extension','Leg Press','Hack Squat','Bulgarian Split Squat'],
  Hamstrings:['Seated Leg Curl','Lying Leg Curl','Romanian Deadlift','Reverse Leg Curl'],
  Glutes:['Hip Thrust Machine','Bulgarian Split Squat','Cable Kickback','Romanian Deadlift'],
  Abs:['Cable Crunch','Hanging Leg Raise','Abdominal Machine']
};
function invAllSplitNames(){ return new Set(Object.values(S.split).flatMap(d=>(d.exercises||[]).map(exName))); }
function invSuggestAccessory(group){
  const inSplit = invAllSplitNames();
  const pool = INV_ACC_POOL[group]||[];
  return pool.find(n=>!inSplit.has(n)) || null;
}
function invSuggestSwap(fromName){
  const m = musclesFor(fromName);
  const g = (m.p && m.p[0]) || null; if(!g) return null;
  const inSplit = invAllSplitNames();
  const pool = INV_ACC_POOL[g]||[];
  return pool.find(n=>!inSplit.has(n) && n!==fromName) || null;
}

/* -------------------- FLAG LIFECYCLE -------------------- */
function invActiveFlags(){ return invState().flags.filter(f=>f.status==='active'||f.status==='applied'); }
function invFindFlag(key){ return invActiveFlags().find(f=>f.key===key); }
function invRaise(result, source){
  if(!result || !result.severity) return null;
  const st = invState();
  const existing = invFindFlag(result.key);
  if(existing){
    // update severity/findings in place; don't duplicate
    existing.severity = result.severity; existing.title = result.title;
    existing.findings = result.findings; if(existing.status!=='applied') existing.fix = result.fix;
    existing.updated = todayKey(); save(false); return existing;
  }
  const flag = {id:invUid(), cat:result.key.startsWith('lift:')?'lift':(result.key==='bulk'?'bulk':'split'),
    key:result.key, severity:result.severity, title:result.title, findings:result.findings,
    fix:result.fix, status:'active', source:source||'auto', created:todayKey(), updated:todayKey()};
  st.flags.push(flag); save(false);
  return flag;
}
function invArchive(flag, outcome){
  flag.status = outcome; flag.closed = todayKey();
  const st = invState();
  st.flags = st.flags.filter(f=>f.id!==flag.id);
  st.history.unshift(flag);
  if(st.history.length>25) st.history.length = 25;
  save(false);
}
function invDismiss(id){
  const f = invActiveFlags().find(x=>x.id===id); if(!f) return;
  // Touch+push, same reason as invDeleteHistory: invArchive() only save(false)s, so the gist
  // would keep serving the dismissed flag and the next pull would resurrect it.
  invArchive(f,'dismissed'); save(); renderInvestigation(); invUpdateBadge();
}
function invDeleteHistory(id){
  const st = invState();
  st.history = st.history.filter(f=>f.id!==id);
  // Must touch+push: save(false) would leave the gist holding the pre-delete
  // history, and the next visibilitychange pull (bgSyncTick) silently restores
  // the "cleared" rows since it compares only exportedAt vs. changedAt.
  save(); renderInvestigation();
}
function invApplyFix(id){
  const f = invActiveFlags().find(x=>x.id===id); if(!f || !f.fix) return;
  const fx = f.fix;
  if(fx.type==='cal'){
    S.fuel = S.fuel||{}; S.fuel.calTarget = (S.fuel.calTarget||3000) + fx.payload.delta;
  } else if(fx.type==='pro'){
    S.fuel = S.fuel||{}; S.fuel.proTarget = fx.payload.to;
  } else if(fx.type==='liftReset'){
    invState().overrides[fx.payload.name] = {w:fx.payload.w, until:dateKeyOf(new Date(Date.now()+fx.payload.days*86400000)), note:'Investigation reset \u2014 rebuild with clean reps, expires '+fx.payload.days+'d'};
  } else if(fx.type==='deload'){
    startDeloadWeek();
  } else if(fx.type==='addEx'){
    const dk = invLightestDayFor(fx.payload.group);
    if(dk){ S.split[dk].exercises.push({name:fx.payload.name, inc:incFor(fx.payload.name)}); }
  } else if(fx.type==='swapEx'){
    for(const dk in S.split){
      const arr = S.split[dk].exercises;
      const i = arr.findIndex(x=>exName(x)===fx.payload.from);
      if(i>=0){ arr[i] = {name:fx.payload.to, inc:incFor(fx.payload.to)}; break; }
    }
  }
  f.status='applied'; f.appliedAt=todayKey(); save();
  renderInvestigation(); invUpdateBadge();
}
function invLightestDayFor(group){
  // pick the training day whose exercises touch this group least (or any non-rest day as fallback)
  let best=null, bestScore=Infinity;
  Object.keys(S.split).forEach(dk=>{
    const names=(S.split[dk].exercises||[]).map(exName); if(!names.length) return;
    let score=0; names.forEach(n=>{ const m=musclesFor(n); if(m.p.includes(group))score+=2; if(m.s.includes(group))score+=1; });
    // prefer days already touching the group lightly (fits the day theme) over days not touching at all
    const adj = score===0 ? 100+names.length : score*10+names.length;
    if(adj<bestScore){ bestScore=adj; best=dk; }
  });
  return best;
}
function invClearExpiredOverrides(){
  const ov = invState().overrides; const t = todayKey();
  Object.keys(ov).forEach(k=>{ if(ov[k].until < t) delete ov[k]; });
}
/* Overrides are stored under an exercise NAME, and not every writer of that name is
   trustworthy: agApplyFix() takes it straight from model output. A near miss — "bench
   press", a stray double space, different capitalisation — writes a key that this lookup
   would never match again, so the override sits in state looking applied while LIVE
   quietly ignores it, with no error raised anywhere. Compare on a normalised form so a
   cosmetic naming difference can't silently break the match. */
function invNormName(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function invOverrideFor(nm){
  invClearExpiredOverrides();
  const ov = invState().overrides;
  let o = ov[nm];                          // exact key wins, and costs nothing
  if(!o){
    const want = invNormName(nm);
    if(want){
      const k = Object.keys(ov).find(x=>invNormName(x)===want);
      if(k) o = ov[k];
    }
  }
  return (o && o.until >= todayKey()) ? o : null;
}

/* -------------------- RESOLUTION -------------------- */
function invCheckResolutions(){
  const flags = [...invActiveFlags()];
  flags.forEach(f=>{
    try{
      let resolved=false, note='';
      if(f.cat==='lift'){
        const nm = f.key.slice(5);
        const pts = e1rmSeries(nm);
        // only count sessions logged strictly AFTER the flag was raised — otherwise ordinary
        // non-monotonic noise already sitting in old history can "resolve" a flag on the very
        // next app open with zero new training in between.
        const newPts = pts.filter(p=>p.date>f.created);
        if(newPts.length>=2){
          const idx = pts.findIndex(p=>p.date===newPts[0].date);
          const baseline = idx>0 ? pts[idx-1].v : -Infinity;
          const a = newPts[newPts.length-2].v, b = newPts[newPts.length-1].v;
          if(b>a && a>baseline){ resolved=true; note='2 consecutive e1RM improvements since flagged'; }
        }
      } else if(f.cat==='bulk'){
        const sm = bodyweightSeriesSmoothed();
        const newestWeight = S.weights.length ? [...S.weights].sort((a,b)=>b.date.localeCompare(a.date))[0].date : null;
        if(sm.length>=3 && newestWeight && newestWeight>f.created){
          const reg = linreg(sm.slice(-3));
          const rate = reg? reg.slope*7 : 0;
          if(rate>=0.4 && rate<=1.2){ resolved=true; note='rate back in the 0.4\u20131.2 lb/wk band'; }
        }
      } else if(f.cat==='split'){
        const {start,end} = lastCompletedWeekRange();
        const vol = weeklyVolumeByGroup(start,end);
        const gaps = MUSCLE_GROUPS.filter(g=>g!=='Abs').filter(g=>vol[g]<10);
        const stale = staleExercises();
        const trained = S.logs.some(l=>l.date>=start&&l.date<=end);
        const hasNewSession = S.logs.some(l=>l.date>f.created);
        if(hasNewSession && trained && !gaps.length && !stale.length){ resolved=true; note='volume gaps closed and nothing stale'; }
      }
      if(resolved){ f.resolveNote=note; invArchive(f,'resolved'); }
    }catch(e){ console.warn('invCheckResolutions: skipped one flag due to error', f.key, e); }
  });
  invUpdateBadge();
}

/* -------------------- AUTO-RUN SCHEDULER -------------------- */
function invDaysSince(key){
  const la = invState().lastAuto[key];
  if(!la) return Infinity;
  return (new Date(todayKey()) - new Date(la))/86400000;
}
function invRecentlyDismissed(key, days){
  const st = invState();
  const cutoff = new Date(todayKey()); cutoff.setDate(cutoff.getDate()-days);
  return (st.history||[]).some(f=>f.key===key && f.status==='dismissed' && f.closed && new Date(f.closed) > cutoff);
}
function invAutoRun(){
  const st = invState();
  invClearExpiredOverrides();
  invCheckResolutions();
  let raised=false;
  if(invDaysSince('split')>=7){
    // the split check reads the last completed week - if that week was intentionally
    // low-volume by plan (strength/deload/rest), reduced volume is the plan, not a problem
    const _lw = (typeof mesoWeekAt==='function') ? mesoWeekAt(lastCompletedWeekRange().start) : null;
    const _planned = _lw && (_lw.type==='str' || _lw.type==='deload' || _lw.type==='rest');
    const r = investigateSplit();
    if(r.severity && !_planned && !invRecentlyDismissed(r.key,14)){ invRaise(r,'auto'); raised=true; }
    st.lastAuto.split = todayKey();
  }
  if(invDaysSince('lift')>=7){
    const names = [...invAllSplitNames()];
    const results = names.map(n=>investigateLift(n)).filter(r=>r.severity && !invRecentlyDismissed(r.key,14));
    results.sort((a,b)=>INV_SEV_RANK[b.severity]-INV_SEV_RANK[a.severity]);
    results.slice(0,3).forEach(r=>{ invRaise(r,'auto'); raised=true; }); // cap at 3 to avoid spam
    st.lastAuto.lift = todayKey();
  }
  if(invDaysSince('bulk')>=14){
    const r = investigateBulk(); if(r.severity && !invRecentlyDismissed(r.key,14)){ invRaise(r,'auto'); raised=true; }
    st.lastAuto.bulk = todayKey();
  }
  save(false);
  invUpdateBadge();
  return raised;
}

/* -------------------- BANNER + BADGE -------------------- */
function invBannerHTML(){
  const flags = invActiveFlags().filter(f=>f.status==='active');
  if(!flags.length) return '';
  const worst = flags.reduce((a,f)=>INV_SEV_RANK[f.severity]>INV_SEV_RANK[a.severity]?f:a, flags[0]);
  if(worst.severity==='yellow') return ''; // yellow lives in the tab only
  const col = INV_SEV_COLOR[worst.severity];
  // Tag reflects ONLY the flag whose title is shown \u2014 never merge other flags' categories in here,
  // that produced misleading combos like "STRENGTH \u00b7 BULK \u2014 Chest Fly Machine trending down" where
  // the BULK tag belonged to a *different* flag entirely. If others share this severity, say so plainly.
  const tiedOthers = flags.filter(f=>f.severity===worst.severity && f.id!==worst.id).length;
  const tag = INV_CAT_LABEL[worst.cat] + (tiedOthers ? ' +'+tiedOthers+' more' : '');
  return '<div class="inv-banner" style="border-color:'+col+'" onclick="setMode(\'review\');showReviewTab(\'invest\')">'+
    '<span class="inv-banner-tag" style="background:'+col+'">'+INV_SEV_LABEL[worst.severity]+'</span>'+
    '<span class="inv-banner-txt">'+esc(tag)+' \u2014 '+esc(worst.title)+'. Tap to review.</span>'+
    '<span style="margin-left:auto;color:'+col+';font-family:var(--mono)">\u2192</span></div>';
}
function invUpdateBadge(){
  const flags = invActiveFlags().filter(f=>f.status==='active');
  const worst = flags.length ? flags.reduce((a,f)=>INV_SEV_RANK[f.severity]>INV_SEV_RANK[a.severity]?f:a, flags[0]) : null;
  const dot = worst ? INV_SEV_COLOR[worst.severity] : null;
  ['snInvBadge','niInvBadge'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.style.background = dot||'transparent'; el.style.opacity = dot?1:0; }
  });
  const banner = document.getElementById('globalInvBanner');
  if(banner) banner.innerHTML = invBannerHTML();
}

function invRunManual(kind, liftName){
  let r;
  if(kind==='bulk') r = investigateBulk();
  else if(kind==='split') r = investigateSplit();
  else if(kind==='lift'){ if(!liftName) return; r = investigateLift(liftName); }
  else return;
  if(r.severity){
    const f = invRaise(r,'manual');
    _invManualResult = {clear:false, flagId:f.id};
  } else {
    _invManualResult = {clear:true, title:r.title, findings:r.findings, when:todayKey()};
    // manual all-clear also logged to history (lightweight)
    const st = invState();
    st.history.unshift({id:invUid(), cat:kind==='lift'?'lift':kind, key:r.key, severity:null, title:r.title,
      findings:r.findings, status:'clear', source:'manual', created:todayKey(), closed:todayKey()});
    if(st.history.length>25) st.history.length=25;
    save(false);
  }
  invCheckResolutions();
  // A hand-run investigation is a user action, so it has to reach the gist. invRaise() only
  // save(false)s (deliberately — an auto-run at boot must not bump changedAt and cause
  // autoPullOnLoad to skip its pull), which left a manually raised flag local-only.
  save();
  renderInvestigation(); invUpdateBadge();
}
